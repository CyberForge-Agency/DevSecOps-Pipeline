name: "CyberForge DevSecOps Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

# Least privilege (OpenSSF Scorecard Token-Permissions): the orchestrator's
# top-level token is read-only. Each phase that calls a reusable workflow grants
# EXACTLY the write scopes that the called workflow's jobs use — the caller caps
# the callee, so a missing scope here would starve the called workflow.
permissions:
  contents: read
  actions: read
  pull-requests: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: pipeline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Phase 0: Self-Test (quality gate; always runs first)
  # ============================================
  # The pipeline's own gate: opa test + T-71 action-pin audit + pytest
  # tests/compliance + T-81 bats. Every later phase chains off this via `needs`,
  # so a broken validator/policy or a re-introduced unpinned action fails the run
  # before anything builds, signs or deploys — nothing can depend-around it.
  self-test:
    name: "Phase 0: Self-Test"
    # self-test.yml only reads the repo (opa test + pin-audit + pytest + bats).
    permissions:
      contents: read
    uses: ./.github/workflows/self-test.yml

  # ============================================
  # Phase 1: Security Gate (always runs)
  # ============================================
  security-gate:
    name: "Phase 1: Security Gate"
    needs: [self-test]
    # security-gate.yml: TruffleHog/Checkov/MegaLinter/PII (read repo) + commit-signing
    # github-script calls pulls.listCommits (read). No write scopes used.
    permissions:
      contents: read
      pull-requests: read   # commit-signing job: github.rest.pulls.listCommits
    uses: ./.github/workflows/security-gate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      is_pull_request: ${{ format('{0}', github.event_name == 'pull_request') }}
      pr_base_sha: ${{ github.event.pull_request.base.sha || '' }}
      pr_number: ${{ github.event.pull_request.number || 0 }}

  # ============================================
  # Phase 2: Build & Scan (always runs)
  # ============================================
  build-and-scan:
    name: "Phase 2: Build & Scan"
    needs: [security-gate]
    # build-and-scan.yml: codeql job uploads SARIF (security-events: write);
    # docker-build job uses azure/login OIDC to push to ACR (id-token: write).
    permissions:
      contents: read
      actions: read
      security-events: write   # codeql job: github/codeql-action/upload-sarif
      id-token: write          # docker-build job: azure/login OIDC (ACR push)
    uses: ./.github/workflows/build-and-scan.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      push_image: ${{ format('{0}', github.event_name != 'pull_request') }}

  # ============================================
  # Phase 3: Sign & Attest (main branch only)
  # ============================================
  sign-and-attest:
    name: "Phase 3: Sign & Attest"
    if: github.event_name != 'pull_request'
    needs: [build-and-scan]
    # sign-and-attest.yml: cosign keyless + azure/login (id-token), push sig/attestation
    # to registry (packages), actions/attest-build-provenance (attestations).
    permissions:
      contents: read
      id-token: write        # azure/login OIDC + cosign keyless sign/attest/verify
      packages: write        # push image signature + SBOM attestation + provenance to registry
      attestations: write    # actions/attest-build-provenance
    uses: ./.github/workflows/sign-and-attest.yml
    with:
      image_uri: ${{ needs.build-and-scan.outputs.image_uri }}
      image_digest: ${{ needs.build-and-scan.outputs.image_digest }}

  # ============================================
  # Phase 4: Deploy to Staging (main branch only)
  # ============================================
  deploy:
    name: "Phase 4: Deploy"
    if: github.event_name != 'pull_request'
    needs: [sign-and-attest, build-and-scan]
    # deploy.yml: azure/login OIDC + cosign keyless verify (id-token). No writes.
    permissions:
      contents: read
      id-token: write        # azure/login OIDC + cosign keyless verify before deploy
    uses: ./.github/workflows/deploy.yml
    with:
      image_uri: ${{ needs.build-and-scan.outputs.image_uri }}
      image_digest: ${{ needs.build-and-scan.outputs.image_digest }}
      environment: ${{ inputs.deploy_environment || 'staging' }}
      # Forward build-and-scan's MEASURED gate inputs so the OPA deployment gate
      # admits on real scan/coverage numbers (T-03/T-63). deploy.yml re-measures
      # from artifacts as a fail-closed fallback when these are empty.
      critical_cves: ${{ needs.build-and-scan.outputs.critical_cves }}
      coverage_pct: ${{ needs.build-and-scan.outputs.coverage_pct }}

  # ============================================
  # Phase 5: DAST (main branch only, after deploy)
  # ============================================
  dast:
    name: "Phase 5: DAST"
    if: github.event_name != 'pull_request'
    needs: [deploy]
    # dast.yml: creates a security-incident issue via github-script on HIGH/CRITICAL findings.
    permissions:
      contents: read
      issues: write          # zap-scan job: github.rest.issues.create (incident issue)
    uses: ./.github/workflows/dast.yml
    with:
      target_url: ${{ needs.deploy.outputs.app_url }}

  # ============================================
  # Phase 6: Evidence Pack (always runs)
  # ============================================
  evidence-pack:
    name: "Phase 6: Evidence Pack"
    if: always()
    needs: [security-gate, build-and-scan, sign-and-attest, deploy, dast]
    # evidence-pack.yml: cosign keyless sign-blob (compliance status, toolchain
    # inventory, source-control drift, compliance gate, PDF sealing) + azure/login
    # OIDC for WORM blob upload (id-token). Reads live GitHub config via GH_TOKEN
    # (read-only GETs). No write scopes.
    permissions:
      contents: read
      id-token: write        # cosign keyless sign-blob + azure/login OIDC (WORM evidence upload)
    uses: ./.github/workflows/evidence-pack.yml
    with:
      image_uri: ${{ needs.build-and-scan.outputs.image_uri || 'N/A' }}
      image_digest: ${{ needs.build-and-scan.outputs.image_digest || 'N/A' }}
      app_url: ${{ needs.deploy.outputs.app_url || 'N/A' }}
      environment: ${{ inputs.deploy_environment || 'staging' }}
      gate_results: >-
        {"security_gate":"${{ needs.security-gate.result }}","build_scan":"${{ needs.build-and-scan.result }}","sign_attest":"${{ needs.sign-and-attest.result || 'skipped' }}","deploy":"${{ needs.deploy.result || 'skipped' }}","dast":"${{ needs.dast.result || 'skipped' }}"}
