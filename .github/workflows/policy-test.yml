# Policy self-test — `opa test` + `opa fmt` for the Rego admission policies (T-64)
#
# Why this exists
#   The three OPA policies (deployment-gate, evidence-completeness, retention-policy)
#   are the admission-control layer that deploy.yml (T-60/T-62) and evidence-pack.yml
#   (T-61/T-11) enforce on. A policy edit that breaks a rule would otherwise ship
#   green because no workflow ran `opa test`. This is the cheapest self-defence for
#   the layer everything else depends on. The master spec requires `opa test` green
#   on push AND pull_request.
#
# Disjointness note: this is a NEW standalone workflow (same pattern as
#   scorecard.yml). It does not edit any existing workflow. It self-triggers on
#   push and pull_request so the policy tests gate both events independently and
#   can be registered as a required status check in branch-protection.json (T-67).
#
# fmt note (honest): `opa fmt` is canonically TAB-indented; the committed policies
#   use 2-space indentation, so `opa fmt -l` currently lists them. The policies are
#   not editable from this change set, so the fmt step is ADVISORY (warn, never
#   blocks) until they are reformatted to tabs. `opa test` is the BLOCKING gate —
#   a broken rule turns this red. Flip the fmt step to blocking once the policies
#   are `opa fmt`-clean (see follow-up).

name: "Policy Test (OPA)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: the policy self-test only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: policy-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  opa-test:
    name: "opa test + opa fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.17.1

      # BLOCKING: a broken rule (e.g. flipping `>=` to `>`) turns this red.
      - name: opa test policies/
        run: opa test policies/ -v

      # ADVISORY (see fmt note in the header): surfaces formatting drift without
      # blocking, because the committed policies are 2-space-indented and not
      # editable from this change set. The `|| true` keeps it non-blocking; the
      # listing is still printed and summarized for visibility.
      - name: opa fmt -l policies/ (advisory)
        run: |
          set -uo pipefail
          UNFORMATTED="$(opa fmt -l policies/ || true)"
          {
            echo "## OPA Policy Self-Test (T-64)"
            echo ""
            if [ -n "${UNFORMATTED}" ]; then
              echo ":warning: The following Rego files are not \`opa fmt\`-clean (tabs):"
              echo ""
              echo '```'
              echo "${UNFORMATTED}"
              echo '```'
              echo ""
              echo "_Advisory only — reformat to tabs to make this a blocking gate._"
            else
              echo ":white_check_mark: All Rego policies are \`opa fmt\`-clean."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${UNFORMATTED}" ]; then
            echo "::warning::opa fmt: unformatted Rego (advisory): ${UNFORMATTED}"
          fi
