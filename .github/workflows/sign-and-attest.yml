name: "Phase 3: Sign & Attest"

on:
  workflow_call:
    inputs:
      image_uri:
        description: "Full image URI to sign"
        required: true
        type: string
      image_digest:
        description: "Image digest (sha256:...)"
        required: true
        type: string

# Least privilege (OpenSSF Scorecard Token-Permissions): top-level is read-only;
# every write scope is declared at the job level on the single job that needs it.
permissions:
  contents: read

jobs:
  sign-and-attest:
    name: "Cosign Sign + SLSA Provenance + SBOM Attestation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read        # actions/checkout + read signing scripts (generate-provenance.sh)
      id-token: write       # azure/login OIDC + cosign keyless sign/attest/verify (Sigstore Fulcio OIDC token)
      packages: write       # push image signature + SBOM attestation + provenance to the registry (attest-build-provenance push-to-registry: true)
      attestations: write   # actions/attest-build-provenance (GitHub-native build provenance)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Sign image with Cosign (keyless OIDC)
        run: |
          set -o pipefail  # tee must not mask a cosign sign failure
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            -a "run_id=${{ github.run_id }}" \
            -a "trigger=${{ github.event_name }}" \
            "${{ inputs.image_uri }}@${{ inputs.image_digest }}" \
            2>&1 | tee /tmp/cosign-sign-output.txt

      - name: Download SBOM from previous phase
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-scan-results
          path: ./evidence/

      - name: Attach SBOM as signed attestation
        run: |
          set -o pipefail  # tee must not mask a cosign attest failure
          cosign attest --yes \
            --predicate ./evidence/sbom.cyclonedx.json \
            --type cyclonedx \
            "${{ inputs.image_uri }}@${{ inputs.image_digest }}" \
            2>&1 | tee /tmp/cosign-attest-output.txt

      - name: Extract image name without tag
        id: img
        run: |
          echo "name=${IMAGE_URI%%:*}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_URI: ${{ inputs.image_uri }}

      - name: Generate build provenance attestation (GitHub native)
        id: provenance
        continue-on-error: true  # Not available for private repos on personal accounts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ inputs.image_digest }}
          push-to-registry: true

      - name: Generate SLSA provenance (fallback)
        if: steps.provenance.outcome == 'failure' || steps.provenance.outputs.bundle-path == ''
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -o pipefail  # a failure of generate-provenance.sh must fail the step, not be masked by the pipe
          echo "GitHub native attestation unavailable — generating SLSA provenance manually"
          mkdir -p provenance-out
          # Only stdout (the in-toto JSON) reaches the attestation file; stderr (warnings,
          # set -x traces, the IMAGE_URI:?… error text) goes to a separate log so it cannot
          # corrupt the JSONL attestation (BUG §6.4-B).
          bash scripts/generate-provenance.sh > provenance-out/provenance.intoto.jsonl 2>/tmp/provenance-generation-output.txt

      - name: Validate fallback provenance is line-delimited JSON
        if: steps.provenance.outcome == 'failure' || steps.provenance.outputs.bundle-path == ''
        run: |
          # Fail the build if the fallback attestation is malformed JSONL, so a corrupt
          # provenance.intoto.jsonl is never uploaded and labelled DORA Art.28 / NIS2 Art.21.2.d.
          python3 -c 'import json;[json.loads(l) for l in open("provenance-out/provenance.intoto.jsonl") if l.strip()]'
          echo "PROVENANCE_JSONL_OK"

      - name: Bundle signing proof
        if: always()
        run: |
          {
            echo "============================================"
            echo "  SIGNING PROOF - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "============================================"
            echo ""
            echo "Image: ${{ inputs.image_uri }}@${{ inputs.image_digest }}"
            echo "Cosign version: $(cosign version 2>&1 | head -1 || echo 'unknown')"
            echo ""
            echo "=== Cosign Sign Output ==="
            cat /tmp/cosign-sign-output.txt 2>/dev/null || echo "(not captured)"
            echo ""
            echo "=== Cosign Attest Output (SBOM) ==="
            cat /tmp/cosign-attest-output.txt 2>/dev/null || echo "(not captured)"
            echo ""
            echo "=== Provenance Generation ==="
            echo "GitHub native attestation outcome: ${{ steps.provenance.outcome }}"
            cat /tmp/provenance-generation-output.txt 2>/dev/null || echo "(fallback not used or not captured)"
            echo ""
            echo "=== Signature Verification ==="
            echo "(see cosign-verification.log)"
            echo ""
          } > signing-proof.txt

      - name: Verify signature (proof for evidence pack)
        timeout-minutes: 5
        run: |
          # pipefail REQUIRED: tee would otherwise mask a failed cosign verify,
          # letting a bad/missing signature pass this defense-in-depth check.
          set -o pipefail
          # T-08 / T-69 (bug K7): pin the cert identity to THIS signing workflow
          # (sign-and-attest.yml) on main OR a release tag, anchored ^...$, so a
          # signature from any other workflow/branch cannot satisfy this
          # defense-in-depth self-verify. Verify against the DIGEST, not the tag.
          # NOTE (reusable-workflow caveat): sign-and-attest.yml runs via
          # `workflow_call` from pipeline.yml. Keyless OIDC emits the SAN as the
          # path of the workflow whose job signs (sign-and-attest.yml) with `@ref`
          # = the caller's ref (refs/heads/main | refs/tags/*); this is what
          # evidence-pdf-test.yml:82 expects. If the SAN ever resolves to the
          # caller path (pipeline.yml) instead, widen this regexp — confirm the
          # exact identity on the first live run via `cosign verify ... --output
          # json` (verification_status = NEEDS-CI for the live signature test).
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/sign-and-attest.yml@refs/(heads/main|tags/.*)$" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ inputs.image_uri }}@${{ inputs.image_digest }}" \
            2>&1 | tee cosign-verification.log

      - name: Verify SBOM attestation + Rekor inclusion (proof for evidence pack)
        # HARD safety net: a live cosign verify-attestation was observed hanging
        # ~12 min here while public Sigstore was fully responsive (cosign-side stall,
        # no internal timeout). timeout-minutes caps it so it can never again block
        # the pipeline toward the job's 45-min limit.
        timeout-minutes: 5
        run: |
          # T-51 (spec §7.2 #2 / Part I.2 — Rekor transparency log): independently
          # confirm the CycloneDX SBOM attestation attached above is recorded in
          # Rekor. `cosign verify-attestation` performs tlog verification by
          # default (--insecure-ignore-tlog defaults to false), so a success here
          # cryptographically proves the attestation's Rekor inclusion — the
          # "who attested what, when, survives key disposal" property the pack
          # claims. Identity+issuer are pinned exactly like the image-sig verify.
          # pipefail REQUIRED so a failed verify is not masked by the tee.
          set -o pipefail
          # T-08 / T-69: same anchored sign-and-attest.yml identity as the image
          # verify above (see reusable-workflow caveat there).
          # ROOT CAUSE of the multi-minute hang: cosign verify-attestation VERIFIES
          # correctly (it prints every check passing) but then STALLS emitting the full
          # CycloneDX predicate to stdout and piping it to the live Actions log via
          # `| tee` — the sibling `cosign verify` (near-zero output) completes in ~8s,
          # and `--offline` made no difference, so it is the payload emit/exit, NOT the
          # network. Fix: send the predicate to a FILE (off the live-log pipe) so the
          # write can't back-pressure, hard-cap with `timeout`, and take the confirmed
          # verification summary in the log as the Rekor-inclusion proof — independent
          # of cosign's broken post-verify exit. Verification semantics are unchanged
          # (tlog-on, identity/issuer pinned, digest-pinned ref).
          set +e
          timeout 100 cosign verify-attestation \
            --type cyclonedx \
            --insecure-ignore-tlog=false \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/sign-and-attest.yml@refs/(heads/main|tags/.*)$" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ inputs.image_uri }}@${{ inputs.image_digest }}" \
            > cyclonedx-attestation-predicate.json 2> cosign-attestation-verification.log
          rc=$?
          set -e
          cat cosign-attestation-verification.log
          # cosign prints "The following checks were performed" + the transparency-log
          # line ONLY on a successful verify; on failure it errors out before them.
          if grep -q "The following checks were performed" cosign-attestation-verification.log \
             && grep -q "transparency log" cosign-attestation-verification.log; then
            echo "REKOR_SBOM_ATTESTATION_INCLUSION_VERIFIED (cosign exit rc=${rc})" | tee -a cosign-attestation-verification.log
          else
            echo "::error::SBOM attestation verification did not pass (cosign rc=${rc})"
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosign-verification
          path: |
            cosign-verification.log
            cosign-attestation-verification.log
          if-no-files-found: warn

      - name: Upload provenance bundle (GitHub native)
        if: always() && steps.provenance.outputs.bundle-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-bundle
          path: ${{ steps.provenance.outputs.bundle-path }}

      - name: Upload provenance bundle (fallback)
        if: always() && steps.provenance.outcome == 'failure' && hashFiles('provenance-out/provenance.intoto.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-bundle
          path: provenance-out/provenance.intoto.jsonl

      - name: Upload signing proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-proof
          path: signing-proof.txt

      - name: Job Summary
        if: always()
        run: |
          IMAGE_REF="${{ inputs.image_uri }}@${{ inputs.image_digest }}"
          PROVENANCE_OUTCOME="${{ steps.provenance.outcome }}"
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Sign & Attest

          ### Cosign Image Signing
          EOF
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Method | Keyless OIDC (Sigstore) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OIDC issuer | \`https://token.actions.githubusercontent.com\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Certificate identity | \`^https://github.com/${{ github.repository }}/.github/workflows/sign-and-attest.yml@refs/(heads/main\|tags/.*)\$\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${IMAGE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo ":white_check_mark: **Image signed with keyless OIDC**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # SBOM attestation
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ### SBOM Attestation
          EOF
          echo ":white_check_mark: **CycloneDX SBOM attached to image as signed attestation**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cosign-attestation-verification.log ] && grep -q REKOR_SBOM_ATTESTATION_INCLUSION_VERIFIED cosign-attestation-verification.log; then
            echo ":white_check_mark: **SBOM attestation Rekor transparency-log inclusion verified** (spec §7.2/I.2)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Provenance
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ### Build Provenance
          EOF
          if [ "${PROVENANCE_OUTCOME}" = "success" ]; then
            echo ":white_check_mark: **SLSA v1.0 provenance generated (GitHub native attestation)**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":white_check_mark: **SLSA provenance generated (fallback script)**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Verification
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ### Signature Verification
          EOF
          if [ -f cosign-verification.log ]; then
            echo ":white_check_mark: **Signature verified successfully**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":warning: **Verification log not found**" >> "$GITHUB_STEP_SUMMARY"
          fi
