<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline DevSecOps — magazyn objaśniający</title>
<style>
  :root{
    --ink:#1a1f2b;
    --ink-soft:#373e4e;
    --ink-faint:#595f6d;
    --paper:#faf8f5;
    --paper-2:#f3efe8;
    --paper-card:#fffdfa;
    --rule:#e4ddd1;
    --rule-soft:#ece6db;
    --accent:#b5462e;       /* dekoracyjny (linie, kropki, SVG) — zmienia się per rozdział w JS */
    --accent-ink:#9e3a23;   /* czytelny wariant TEKSTOWY akcentu (WCAG AA) — zmienia się per rozdział w JS */
    --accent-soft:#f6e7e1;
    --shadow: 0 1px 2px rgba(26,31,43,.04), 0 8px 30px rgba(26,31,43,.06);
    --serif: Georgia, "Times New Roman", ui-serif, serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --maxw: 1180px;
    --col: 68ch;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans);
    font-size:18px; line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent-soft); color:var(--ink)}
  a{color:inherit}

  /* ---------- progress + top bar ---------- */
  #progress{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #d8a24b));
    z-index:200; transition:width .12s linear, background .5s ease;
  }
  #topbar{
    position:fixed; top:0; left:0; right:0; height:54px; z-index:150;
    display:flex; align-items:center; gap:18px;
    padding:0 clamp(16px,4vw,40px);
    background:color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid transparent; transition:border-color .3s, background .3s;
  }
  #topbar.solid{border-bottom-color:var(--rule)}
  #topbar .brand{
    font-family:var(--serif); font-weight:700; letter-spacing:-.01em; font-size:16px;
    white-space:nowrap;
  }
  #topbar .brand .dot{color:var(--accent-ink); transition:color .5s}
  #topbar .crumb{
    font-size:12.5px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  #topbar .crumb b{color:var(--accent-ink); font-weight:700; transition:color .5s}
  #topbar .navlink{
    font-size:13px; color:var(--ink-soft); text-decoration:none; padding:6px 12px;
    border:1px solid var(--rule); border-radius:999px; white-space:nowrap;
    transition:.2s; background:var(--paper-card);
  }
  #topbar .navlink:hover{border-color:var(--accent-ink); color:var(--accent-ink)}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,40px)}

  /* ---------- COVER ---------- */
  .cover{
    position:relative; min-height:100vh; display:flex; flex-direction:column;
    padding-top:54px; overflow:hidden;
  }
  .cover .cover-bg{position:absolute; inset:0; z-index:0; opacity:.9}
  .cover-inner{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:center; padding:5vh 0 3vh}
  .kicker{
    font-size:13.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent-ink);
    font-weight:700; margin-bottom:22px;
  }
  .kicker .sep{color:var(--ink-faint); margin:0 10px; font-weight:400}
  h1.title{
    font-family:var(--serif); font-weight:700;
    font-size:clamp(46px, 9vw, 118px); line-height:.94; letter-spacing:-.035em;
    margin:0 0 6px; color:var(--ink);
  }
  h1.title em{font-style:italic; color:var(--accent)}
  .subtitle{
    font-size:clamp(18px,2.4vw,25px); line-height:1.5; color:var(--ink-soft);
    max-width:62ch; margin:26px 0 0; font-weight:400;
  }
  .cover-meta{
    display:flex; flex-wrap:wrap; gap:26px 40px; margin-top:42px;
    border-top:1px solid var(--rule); padding-top:26px; max-width:760px;
  }
  .cover-meta .m{min-width:120px}
  .cover-meta .m .n{font-family:var(--serif); font-size:34px; line-height:1; color:var(--ink); font-weight:700}
  .cover-meta .m .l{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:7px}
  .cover-svg-wrap{position:relative; z-index:2; margin:8px 0 0}
  .cover-svg-wrap svg{width:100%; height:auto; display:block}

  /* spis tresci */
  .toc{
    position:relative; z-index:2; background:var(--paper-card);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
    margin-top:auto;
  }
  .toc-inner{display:grid; grid-template-columns:repeat(4,1fr); gap:0}
  .toc-h{
    grid-column:1/-1; font-size:12px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--ink-faint); padding:20px 0 4px; font-weight:700;
  }
  .toc-item{
    display:flex; gap:14px; align-items:flex-start; padding:18px 20px 18px 0;
    border-top:1px solid var(--rule-soft); text-decoration:none; cursor:pointer;
    transition:.2s; position:relative;
  }
  .toc-item:hover{background:var(--paper-2)}
  .toc-item .tnum{
    font-family:var(--serif); font-size:15px; font-weight:700; line-height:1.2;
    width:30px; flex:none; padding-top:2px;
  }
  .toc-item .ttxt{font-size:15.5px; line-height:1.35; color:var(--ink); font-weight:600}
  .toc-item .tdash{height:3px; width:22px; border-radius:2px; margin-top:8px; flex:none}

  /* ---------- CHAPTER ---------- */
  .chapter{position:relative; padding:0; scroll-margin-top:54px}
  .chapter-open{
    position:relative; padding:clamp(70px,11vh,150px) 0 clamp(40px,6vh,80px);
    border-top:1px solid var(--rule);
    overflow:hidden;
  }
  .chapter-open .bignum{
    font-family:var(--serif); font-weight:700; line-height:.8;
    font-size:clamp(120px,26vw,330px); letter-spacing:-.04em;
    color:var(--accent); opacity:.13;
    position:absolute; top:-.04em; right:-.02em; z-index:0; pointer-events:none;
  }
  .chapter-open .open-grid{
    position:relative; z-index:2;
    display:grid; grid-template-columns:1.15fr .85fr; gap:clamp(30px,5vw,70px); align-items:center;
  }
  .chapter-open .ch-kick{
    font-size:13.5px; letter-spacing:.24em; text-transform:uppercase; font-weight:700;
    color:var(--accent-ink); display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .chapter-open .ch-kick .line{height:1px; width:48px; background:var(--accent); opacity:.5}
  .chapter-open h2{
    font-family:var(--serif); font-weight:700; font-size:clamp(34px,5.2vw,62px);
    line-height:1.02; letter-spacing:-.025em; margin:0 0 4px; color:var(--ink);
  }
  .chapter-intro{
    font-size:clamp(18px,2vw,22px); line-height:1.62; color:var(--ink-soft);
    max-width:60ch; margin:22px 0 0;
  }
  .chapter-intro .dropcap{
    float:left; font-family:var(--serif); font-weight:700; color:var(--accent);
    font-size:4.6em; line-height:.74; padding:6px 14px 0 0; margin-top:4px;
  }
  .open-art{position:relative}
  .open-art svg{width:100%; height:auto; display:block; filter:drop-shadow(0 12px 30px rgba(26,31,43,.08))}

  /* ---------- LESSONS ---------- */
  .lessons{padding:10px 0 clamp(50px,8vh,90px)}

  .lesson{position:relative; padding:clamp(42px,6vh,72px) 0; border-top:1px solid var(--rule)}
  .lesson:first-child{border-top:none}
  .lesson .lnum{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.12em; color:var(--accent-ink);
    text-transform:uppercase; font-weight:700; margin-bottom:12px; display:block;
  }
  .lesson h3{
    font-family:var(--serif); font-weight:700; letter-spacing:-.015em;
    font-size:clamp(25px,3.2vw,35px); line-height:1.14; margin:0 0 18px; color:var(--ink);
  }
  .lesson p.plain{font-size:18.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 14px; max-width:var(--col)}
  .lesson p.plain.lead{font-size:20px; line-height:1.7; color:var(--ink)}

  /* layout A: two columns with marginalia */
  .lesson.cols .lcontent{display:block}
  .marginalia{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(20px,2.4vw,34px);margin-top:36px;padding-top:28px;border-top:1px solid var(--rule);position:relative}
  .note{position:relative; padding-left:18px; border-left:3px solid var(--accent)}
  .note{border-left:3px solid var(--accent);padding-left:16px}
.note .nh{font-size:12.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-ink); font-weight:700; margin-bottom:7px}
  .note .nb{font-size:16px;line-height:1.7;color:var(--ink-soft)}
  .note.analogy{border-left-style:dashed}

  /* layout B: feature full width with diagram */
  .lesson.feature{
    background:var(--paper-card); border:1px solid var(--rule);
    border-radius:18px; padding:clamp(28px,4vw,52px); box-shadow:var(--shadow);
    margin-top:clamp(34px,5vh,58px);
  }
  .lesson.feature::before{
    content:"Lekcja w centrum uwagi"; position:absolute; top:-10px; left:clamp(28px,4vw,52px);
    background:var(--accent); color:#fff; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    font-weight:700; padding:4px 12px; border-radius:999px;
  }
  .lesson.feature .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(26px,4vw,50px); align-items:center}
  .lesson.feature .fart svg{width:100%; height:auto; display:block}
  .lesson.feature .fnotes{display:flex; flex-wrap:wrap; gap:12px; margin-top:20px}
  .chip{
    font-size:14px; padding:10px 15px; border-radius:10px; background:var(--accent-soft);
    color:var(--ink); line-height:1.5; border:1px solid color-mix(in srgb,var(--accent) 24%, transparent);
  }
  .chip b{color:var(--accent-ink)}

  /* layout C: pull quote */
  .lesson.quote{text-align:left}
  .pullquote{position:relative;max-width:34ch;margin:0}
  .pullquote .qmark{font-family:var(--serif);font-size:88px;line-height:.5;color:var(--accent);opacity:.3;display:block;height:38px;margin-bottom:2px}
  .pullquote blockquote{margin:6px 0 0;font-family:var(--serif);font-weight:700;letter-spacing:-.018em;font-size:clamp(26px,3.4vw,38px);line-height:1.24;color:var(--ink);max-width:30ch}
  .lesson.quote .qmeta{margin-top:28px; display:flex; flex-direction:column; gap:16px; max-width:var(--col)}
  .lesson.quote .qcite{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); font-weight:700}
  .lesson.quote .qbody{font-size:17.5px; line-height:1.7; color:var(--ink-soft)}

  /* refs */
  .refs{margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .refs .rlabel{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-right:2px}
  .refs code{
    font-family:var(--mono); font-size:13px; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--rule);
    padding:4px 9px; border-radius:6px; white-space:nowrap;
  }

  /* ---------- CODE SECTION (per-lesson) ---------- */
  .codeblock{
    margin-top:clamp(26px,3.5vh,40px);
    padding-top:clamp(22px,3vh,32px);
    border-top:1px solid var(--rule);
    max-width:none;
  }
  .lesson.feature .codeblock{max-width:none}
  .lesson.quote .codeblock{max-width:none}
  /* caption: ikona pliku + sciezka:linia */
  .codecap{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.02em;
    color:var(--ink-faint); margin-bottom:12px;
  }
  .codecap .fileico{flex:none; width:15px; height:18px; opacity:.85; color:var(--accent-ink)}
  .codecap .cpath{color:var(--ink-soft); word-break:break-all; font-weight:600}
  .codecap .cline{color:var(--accent-ink); font-weight:700}
  .codecap .clang{
    margin-left:auto; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent-ink); background:var(--accent-soft);
    border:1px solid color-mix(in srgb,var(--accent) 24%, transparent);
    padding:2px 9px; border-radius:999px; font-weight:700; white-space:nowrap;
  }
  /* panel: ciemny "terminalowy", ale elegancki */
  .codepanel{
    position:relative; border-radius:14px; overflow:hidden;
    background:#1c2030; border:1px solid #2c3346;
    box-shadow:0 1px 2px rgba(26,31,43,.10), 0 14px 40px rgba(26,31,43,.18);
  }
  .codepanel::before{ /* pasek "okna" terminalu */
    content:""; display:block; height:34px;
    background:linear-gradient(#222840,#1c2233);
    border-bottom:1px solid #2c3346;
  }
  .codepanel .dots{
    position:absolute; top:12px; left:14px; display:flex; gap:7px; z-index:2;
  }
  .codepanel .dots i{width:10px; height:10px; border-radius:50%; display:block}
  .codepanel .dots i:nth-child(1){background:#e06c5b}
  .codepanel .dots i:nth-child(2){background:#e0b34b}
  .codepanel .dots i:nth-child(3){background:#6fbf7a}
  .codepanel pre{
    margin:0; padding:18px 20px 20px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    font-family:var(--mono); font-size:13.5px; line-height:1.65;
    tab-size:2; -moz-tab-size:2;
  }
  .codepanel pre code{
    display:block; color:#dfe4f0; font-family:inherit;
    white-space:pre; counter-reset:cline;
  }
  /* numerowanie linii od codeStart (wstrzykiwane przez --code-start) */
  .codepanel pre code .cl{
    display:block; counter-increment:cline; position:relative;
    padding-left:3.4em; min-height:1.65em; white-space:pre-wrap; word-break:break-word;
  }
  .codepanel pre code .cl::before{
    content:counter(cline);
    position:absolute; left:0; width:2.6em; text-align:right;
    color:#5b647e; font-size:.92em; user-select:none; -webkit-user-select:none;
  }
  /* proza pod kodem: Jak to dziala / Dlaczego */
  .codeprose{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:clamp(20px,2.6vw,34px); margin-top:24px }
  .lesson.feature .codeprose{grid-template-columns:1fr 1fr}
  .codenote .cnh{
    font-family:var(--sans); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:700; margin:0 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .codenote .cnh .cnico{font-size:15px; line-height:1}
  .codenote p{
    margin:0; font-size:16px; line-height:1.72; color:var(--ink-soft); max-width:62ch;
  }
  .codenote + .codenote{padding-top:0}
  /* notka "Pojeciowe" gdy brak kodu */
  .conceptnote{
    margin-top:clamp(24px,3vh,36px); padding:18px 20px;
    background:var(--paper-2); border:1px solid var(--rule); border-left:3px solid var(--accent);
    border-radius:10px; max-width:var(--col);
  }
  .conceptnote .cnh{
    font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:700; margin:0 0 7px;
  }
  .conceptnote p{margin:0; font-size:16px; line-height:1.7; color:var(--ink-soft)}

  /* ---------- GLOSSARY ---------- */
  .glossary{background:var(--paper-2); border-top:1px solid var(--rule); padding:clamp(60px,10vh,120px) 0}
  .gloss-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:34px}
  .gloss-head h2{font-family:var(--serif); font-weight:700; font-size:clamp(32px,5vw,58px); letter-spacing:-.025em; margin:0; line-height:1}
  .gloss-head p{margin:8px 0 0; color:var(--ink-faint); font-size:15px}
  .gsearch{position:relative; min-width:280px; flex:1; max-width:420px}
  .gsearch input{
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
    padding:13px 16px 13px 42px; border:1px solid var(--rule); border-radius:12px;
    background:var(--paper-card); outline:none; transition:.2s;
  }
  .gsearch input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
  .gsearch svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; opacity:.5}
  .gloss-letter{margin-top:30px}
  .gloss-letter .gl{
    font-family:var(--serif); font-size:30px; font-weight:700; color:var(--accent-ink);
    border-bottom:2px solid var(--rule); padding-bottom:6px; margin-bottom:14px;
  }
  .gloss-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 clamp(30px,5vw,64px)}
  .gentry{padding:18px 0; border-top:1px solid var(--rule-soft)}
  .gentry dt{font-family:var(--sans); font-weight:700; font-size:16.5px; color:var(--ink); margin-bottom:5px}
  .gentry dt .gt-mark{background:var(--accent-soft); border-radius:3px; padding:0 2px}
  .gentry dd{margin:0; font-size:15.5px; line-height:1.62; color:var(--ink-soft)}
  .gloss-empty{padding:40px 0; color:var(--ink-faint); font-size:16px; text-align:center; grid-column:1/-1}

  /* footer */
  footer{padding:50px 0 70px; border-top:1px solid var(--rule); text-align:center; color:var(--ink-faint); font-size:13px}
  footer .fbig{font-family:var(--serif); font-size:22px; color:var(--ink); margin-bottom:8px; letter-spacing:-.01em}

  /* reveal */
  .reveal{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* ---------- responsive ---------- */
  @media (max-width: 980px){
    .chapter-open .open-grid{grid-template-columns:1fr; gap:34px}
    .lesson.feature .fgrid{grid-template-columns:1fr; gap:30px}
    .toc-inner{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width: 760px){
    body{font-size:17px}
    .lesson.cols .lcontent{grid-template-columns:1fr; gap:26px}
    .marginalia{border-top:1px solid var(--rule-soft); padding-top:22px}
    .gloss-grid{grid-template-columns:1fr}
    .lesson.feature .codeprose{grid-template-columns:1fr}
    .codepanel pre{font-size:12.5px}
    .cover-meta .m{min-width:42%}
    #topbar .crumb{display:none}
    .toc-inner{grid-template-columns:1fr}
    h1.title{font-size:clamp(40px,13vw,70px)}
    /* długie ścieżki w repo nie mogą wychodzić poza ekran */
    .refs code{white-space:normal; word-break:break-all; line-height:1.45}
  }
  @media (max-width: 460px){
    .cover-meta .m{min-width:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important}
    html{scroll-behavior:auto}
    .reveal{opacity:1; transform:none}
  }
</style>
</head>
<body>
<div id="progress"></div>
<header id="topbar">
  <span class="brand">CyberForge<span class="dot">.</span></span>
  <span class="crumb" id="crumb">Magazyn objaśniający · Pipeline DevSecOps</span>
  <a class="navlink" href="#cover">Okładka</a>
  <a class="navlink" href="#glossary">Słowniczek</a>
</header>

<main id="app"><!-- render --></main>

<script>
const DATA = {"areas": [{"area": "1 · Wielki obraz — o co tu w ogóle chodzi", "intro": "Zanim wejdziemy w szczegóły, ustawmy fundamenty. W tym rozdziale tłumaczę od zera, czym jest oprogramowanie i jego \"wdrożenie\", co to za taśma produkcyjna dla kodu (CI/CD), jak dokłada się do niej bezpieczeństwo (DevSecOps), a na końcu — co konkretnie robi pipeline CyberForge i po co regulowanej firmie (bank, fintech) \"paczka dowodowa\" (Evidence Pack). Wszystkie pojęcia tłumaczę w miejscu, w którym się pojawiają.", "blocks": [{"id": "software-deploy", "title": "Oprogramowanie i \"wdrożenie\" (deploy)", "plain": "Oprogramowanie (ang. software) to po prostu zestaw instrukcji — kod — który mówi komputerowi, co ma robić. Aplikacja to konkretny program, z którego korzysta użytkownik (np. aplikacja banku w telefonie). Sam kod, dopóki leży na laptopie programisty, nikomu nie służy. \"Wdrożenie\" (ang. deploy, deployment) to moment, w którym gotową aplikację umieszczamy na serwerze podłączonym do internetu, żeby prawdziwi ludzie mogli z niej korzystać.", "analogy": "Kod na laptopie programisty jest jak przepis na ciasto zapisany w zeszycie. Wdrożenie (deploy) to upieczenie ciasta i wystawienie go na ladę w cukierni — dopiero wtedy klient może je kupić i zjeść.", "why": "Każda zmiana w aplikacji — nowa funkcja, poprawka błędu — musi w końcu trafić do użytkowników, czyli zostać wdrożona. Jeśli ten krok robi się ręcznie i w pośpiechu, łatwo o pomyłkę: można wdrożyć zepsutą wersję, zapomnieć o teście albo przepuścić lukę bezpieczeństwa. Dlatego cały ten projekt jest o tym, żeby wdrażanie było bezpieczne i powtarzalne.", "inRepo": "W tym repo aplikacja demonstracyjna to mały serwis w Node.js + TypeScript (Express) — katalog Pipeline/app/, a jej \"przepis na zapakowanie\" to Pipeline/app/Dockerfile. Wdrożeniem na chmurę Microsoft Azure zajmuje się osobny etap pipeline'u: Pipeline/.github/workflows/deploy.yml.", "refs": ["Pipeline/README.md", "Pipeline/app/Dockerfile", "Pipeline/.github/workflows/deploy.yml"], "codeExcerpt": "# Stage 3: Runtime\n# Chainguard's hardened Node image (Wolfi-based, minimal, nonroot uid 65532) is\n# patched far faster than gcr.io distroless. We moved off\n# gcr.io/distroless/nodejs20-debian12:nonroot because its Debian 12 libssl3 was\n# stuck at 3.0.18 with 4 unpatched HIGH/CRITICAL OpenSSL CVEs (CVE-2026-31789,\n# -28387, -28388, -28389) and no rebuilt base available upstream. Chainguard's\n# node image ships fixed OpenSSL and scans 0 HIGH/CRITICAL.\n# Pinned by digest for reproducibility; bump via the same trivy-verified flow.\nFROM cgr.dev/chainguard/node:latest@sha256:045335a479d6c59bab89e3caaaf9ed2aed5528d92e2431a3e2afcbf258dba9a6\nWORKDIR /app\nCOPY --from=deps /deps/node_modules ./node_modules\nCOPY --from=builder /build/dist ./dist\nCOPY --from=builder /build/package.json ./\n\nENV NODE_ENV=production\nENV PORT=3000\nEXPOSE 3000\n\n# Chainguard runs as nonroot uid 65532 by default; set explicitly for clarity.\nUSER 65532\n\n# The Chainguard node image's ENTRYPOINT is already /usr/bin/node, so CMD\n# supplies only the script path (passed as node's argument).\nCMD [\"dist/index.js\"]", "codePath": "Pipeline/app/Dockerfile", "codeLang": "dockerfile", "codeStart": 40, "howItWorks": "To jest ostatni etap Dockerfile — \"przepisu na zapakowanie\" aplikacji w obraz (paczkę), która potem rusza na serwer. FROM wskazuje gotowy obraz bazowy z Node.js, przypięty na sztywno po jego odcisku (sha256:...), więc zawsze pobiera dokładnie tę samą wersję. Linie COPY --from przenoszą do finalnej paczki tylko to, co potrzebne do działania: zależności (node_modules) i zbudowany kod (dist). ENV ustawia tryb produkcyjny i port 3000, EXPOSE deklaruje ten port, USER 65532 każe aplikacji działać jako zwykły użytkownik (nie administrator), a CMD podaje plik startowy, który komputer ma uruchomić.", "whyItWorks": "Sam kod na laptopie nikomu nie służy — musi zostać zapakowany w samowystarczalną paczkę (obraz), którą da się wdrożyć. Dlatego Dockerfile zamraża całe środowisko: konkretny, przypięty po digescie obraz bazowy daje powtarzalność (zawsze ten sam wynik), a wybór odchudzonego, łatanego obrazu Chainguard i uruchamianie jako nie-root zmniejszają powierzchnię ataku. To jest dokładnie ten moment, w którym \"przepis\" zamienia się w gotowe \"ciasto na ladzie\" — artefakt, który dopiero workflow deploy.yml wystawia użytkownikom na Azure."}, {"id": "cicd", "title": "CI/CD — ciągła integracja i ciągłe dostarczanie", "plain": "CI to skrót od Continuous Integration (ciągła integracja): za każdym razem, gdy programista dorzuca kawałek kodu, system automatycznie go sprawdza — czy się kompiluje, czy przechodzą testy, czy pasuje do reszty. CD to Continuous Delivery / Deployment (ciągłe dostarczanie / wdrażanie): jeśli kod przeszedł wszystkie sprawdzenia, system automatycznie przygotowuje go do wydania, a często też sam wdraża na serwer. Razem (CI/CD) tworzą zautomatyzowaną drogę od \"napisałem kod\" do \"działa u użytkownika\".", "analogy": "To jak automatyczna linia kontroli jakości w fabryce. Zamiast jednego człowieka, który raz na miesiąc ręcznie sprawdza cały magazyn, każdy produkt jedzie taśmą przez kolejne stacje kontroli natychmiast po wyprodukowaniu — i tylko sprawdzone egzemplarze trafiają do sklepu.", "why": "Bez CI/CD błędy wykrywa się późno (często dopiero u użytkownika), a wdrożenia są stresujące i rzadkie. Z CI/CD każda zmiana jest sprawdzana od razu, więc problemy łapie się wcześnie i tanio, a wydawać można często i pewnie. Dla regulowanej firmy dochodzi jeszcze jedna korzyść: skoro wszystko robi maszyna według spisanych reguł, to każdy krok zostawia ślad, który można później pokazać audytorowi.", "inRepo": "Ten projekt używa GitHub Actions jako silnika CI/CD — to mechanizm GitHuba, który uruchamia zdefiniowane kroki automatycznie po zmianie kodu. Cała taśma jest opisana w plikach w Pipeline/.github/workflows/, a głównym \"dyrygentem\" spinającym etapy jest Pipeline/.github/workflows/pipeline.yml.", "refs": ["Pipeline/README.md", "Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "on:\n  pull_request:\n    branches: [main]\n  push:\n    branches: [main]\n  workflow_dispatch:\n    inputs:\n      deploy_environment:\n        description: \"Target environment\"\n        required: true\n        type: choice\n        options:\n          - staging\n          - production", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 3, "howItWorks": "Sekcja on: mówi GitHub Actions, KIEDY automatycznie ruszyć cała taśmę. pull_request: branches: [main] uruchamia sprawdzenia za każdym razem, gdy ktoś proponuje zmianę do gałęzi main (to jest \"CI\" — ciągła integracja: kod jest weryfikowany, zanim ktokolwiek go scali). push: branches: [main] odpala taśmę po faktycznym wejściu zmiany na main (to prowadzi do \"CD\" — budowy, podpisu i wdrożenia). workflow_dispatch dokłada ręczny przycisk z wyborem środowiska (staging/production), gdy człowiek chce uruchomić wdrożenie świadomie.", "whyItWorks": "Istotą CI/CD jest to, że uruchomienie jest AUTOMATYCZNE i przywiązane do zdarzeń w kodzie, a nie zależne od tego, czy ktoś pamiętał kliknąć. Rozdzielenie pull_request (sprawdź propozycję) od push (zbuduj/wdróż to, co już weszło) realizuje dwie różne role: integrację i dostarczanie. workflow_dispatch z listą opcji dodaje kontrolowaną furtkę ręczną — bez przypadkowego wdrożenia na produkcję, bo środowisko trzeba świadomie wybrać."}, {"id": "pipeline", "title": "Pipeline — taśma produkcyjna dla kodu", "plain": "Pipeline (dosłownie \"rurociąg\", potocznie \"taśma\") to konkretny ciąg automatycznych kroków, przez które przechodzi kod od momentu zapisania do momentu wdrożenia. Każdy krok ma swoje zadanie (np. \"przetestuj\", \"zbuduj\", \"wdróż\") i wykonuje się w ustalonej kolejności. Jeśli któryś krok się nie powiedzie, taśma się zatrzymuje — kod nie jedzie dalej.", "analogy": "Wyobraź sobie taśmę na lotnisku, którą jedzie Twój bagaż: prześwietlenie, ważenie, naklejka, sortowanie. Jeśli prześwietlenie wykryje coś niedozwolonego, walizka nie pojedzie dalej do samolotu. Pipeline działa tak samo z kodem — \"bramki\" (ang. gates) mogą zatrzymać niebezpieczną zmianę.", "why": "Taśma sprawia, że proces jest powtarzalny i niezależny od tego, kto akurat wdraża. Nie ma \"a zapomniałem uruchomić testy\" — taśma zawsze robi to samo, w tej samej kolejności. Kluczowe są tu właśnie bramki, które mogą zablokować zły kod; bez nich automatyzacja tylko szybciej dostarczałaby błędy.", "inRepo": "Pipeline CyberForge składa się z sześciu modułowych etapów (workflowów), spiętych od początku do końca bramkami: Security Gate, Build & Scan, Sign & Attest, Deploy, DAST oraz Evidence Pack (opisane w Pipeline/README.md, sekcja \"Pipeline phases\"). Każdy etap to osobny plik w Pipeline/.github/workflows/, a pipeline.yml uruchamia je po kolei.", "refs": ["Pipeline/README.md", "Pipeline/.github/workflows/pipeline.yml", "Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "  self-test:\n    name: \"Phase 0: Self-Test\"\n    uses: ./.github/workflows/self-test.yml\n\n  # ============================================\n  # Phase 1: Security Gate (always runs)\n  # ============================================\n  security-gate:\n    name: \"Phase 1: Security Gate\"\n    needs: [self-test]\n    uses: ./.github/workflows/security-gate.yml\n    with:\n      ref: ${{ github.event.pull_request.head.sha || github.sha }}\n      is_pull_request: ${{ format('{0}', github.event_name == 'pull_request') }}\n      pr_base_sha: ${{ github.event.pull_request.base.sha || '' }}\n      pr_number: ${{ github.event.pull_request.number || 0 }}\n\n  # ============================================\n  # Phase 2: Build & Scan (always runs)\n  # ============================================\n  build-and-scan:\n    name: \"Phase 2: Build & Scan\"\n    needs: [security-gate]\n    uses: ./.github/workflows/build-and-scan.yml", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 41, "howItWorks": "Każdy blok (self-test, security-gate, build-and-scan...) to jeden etap taśmy — osobny \"job\", który przez uses: wywołuje własny plik workflow. Sercem kolejności jest słowo needs:. security-gate ma needs: [self-test], a build-and-scan ma needs: [security-gate] — to znaczy \"nie startuj, dopóki poprzedni etap nie skończy się sukcesem\". Tak powstaje łańcuch: Phase 0 → Phase 1 → Phase 2 → ... Jeśli wcześniejszy etap padnie, kolejne w ogóle się nie uruchomią. with: przekazuje dalej dane (np. który commit sprawdzać), żeby etapy mówiły o tej samej zmianie.", "whyItWorks": "needs: to mechanizm \"bramki\": wymusza ustaloną kolejność i zatrzymuje taśmę przy pierwszym niepowodzeniu — dokładnie jak prześwietlenie bagażu, które blokuje walizkę przed wejściem do samolotu. Dzięki temu proces jest powtarzalny i niezależny od człowieka: nie da się \"zapomnieć\" o skanie bezpieczeństwa ani wepchnąć budowy przed kontrolą, bo build-and-scan fizycznie czeka na zielony security-gate. Rozbicie na osobne, wywoływane pliki (uses:) daje modułowość — każdy etap można czytać, testować i poprawiać osobno."}, {"id": "devsecops", "title": "DevSecOps — bezpieczeństwo wbudowane w taśmę", "plain": "DevSecOps to złączenie trzech słów: Development (tworzenie oprogramowania), Security (bezpieczeństwo) i Operations (utrzymanie / eksploatacja). Chodzi o to, by bezpieczeństwo nie było osobnym etapem na końcu (\"teraz niech ktoś sprawdzi, czy to bezpieczne\"), tylko żeby było wpięte w każdy krok taśmy — automatycznie, przy każdej zmianie kodu.", "analogy": "Dawniej bezpieczeństwo było jak strażnik, który sprawdza budynek dopiero wieczorem, gdy wszyscy już wyszli — za późno, by cokolwiek poprawić bez burzenia ścian. DevSecOps to kontrola jakości i bezpieczeństwa wbudowana w każdy etap budowy: sprawdzamy fundamenty, gdy je wylewamy, a nie po oddaniu budynku.", "why": "Im później wykryje się lukę bezpieczeństwa, tym drożej i trudniej ją naprawić — a w aplikacji bankowej taka luka może oznaczać wyciek danych klientów albo kary regulatora. Wpięcie bezpieczeństwa w taśmę oznacza, że niebezpieczny kod jest blokowany automatycznie, zanim w ogóle dojedzie do produkcji.", "inRepo": "W tym pipelinie bezpieczeństwo jest rozsiane po wszystkich etapach: skanowanie sekretów i konfiguracji w Security Gate, skanowanie zależności i kodu w Build & Scan, kryptograficzne podpisywanie w Sign & Attest, a sprawdzenie podpisu jeszcze raz tuż przed wdrożeniem (Deploy). Posumowanie tej postawy znajdziesz w Pipeline/README.md (sekcja \"Security & supply-chain posture\").", "refs": ["Pipeline/README.md", "Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/.github/workflows/sign-and-attest.yml"], "codeExcerpt": "      - name: Run Trivy filesystem scan\n        run: |\n          # pipefail is REQUIRED: without it the pipe's exit status is tee's\n          # (always 0), so Trivy's --exit-code 1 on HIGH/CRITICAL findings would\n          # be swallowed and the gate would silently pass. GitHub's default\n          # shell (bash -e) does NOT enable pipefail.\n          set -o pipefail\n          trivy fs app/ \\\n            --format json \\\n            --output trivy-sca-results.json \\\n            --severity CRITICAL,HIGH \\\n            --exit-code 1 \\\n            --ignorefile app/.trivyignore \\\n            2>&1 | tee /tmp/trivy-sca-console.txt", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 81, "howItWorks": "To krok bezpieczeństwa wpięty WEWNĄTRZ etapu budowania (Build & Scan), a nie doklejony na końcu. trivy fs app/ skanuje pliki aplikacji pod kątem znanych podatności; --severity CRITICAL,HIGH ogranicza uwagę do groźnych dziur, a --exit-code 1 sprawia, że ich znalezienie zwraca błąd (czerwone = blokuje). set -o pipefail jest kluczowe: bez niego, gdy wynik idzie przez | tee do pliku, kod błędu Trivy zostałby zgubiony (liczyłby się tylko sukces tee) i bramka fałszywie by zazieleniała. pipefail wymusza, by błąd skanera przeżył przez cały potok.", "whyItWorks": "To jest DevSecOps w praktyce: bezpieczeństwo nie jest osobnym etapem \"na potem\", tylko warunkiem przejścia samego budowania — niebezpieczny kod jest blokowany automatycznie, przy każdej zmianie. Komentarz w kodzie tłumaczy też najgroźniejszą pułapkę pipeline'ów: ciche przepuszczanie (fail-open). Świadome ustawienie pipefail to wybór projektowy \"fail-closed\" — lepiej zatrzymać taśmę niż przepuścić podatność, bo późniejsze wykrycie luki w aplikacji bankowej kosztuje nieporównanie więcej."}, {"id": "shift-left", "title": "\"Shift-left\" — sprawdzaj jak najwcześniej", "plain": "\"Shift-left\" (dosłownie \"przesuń w lewo\") to zasada mówiąca: przesuwaj sprawdzanie bezpieczeństwa i jakości jak najwcześniej w procesie — na lewo na osi czasu, czyli bliżej momentu pisania kodu. Zamiast szukać błędów na końcu, łapiemy je zaraz po napisaniu.", "analogy": "To jak korekta tekstu: taniej i łatwiej poprawić literówkę w trakcie pisania niż po wydrukowaniu tysiąca egzemplarzy książki. \"Przesuwając w lewo\", sprawdzasz akapit od razu, a nie czekasz do druku.", "why": "Błąd znaleziony przez programistę w minutę po napisaniu kosztuje grosze; ten sam błąd znaleziony przez klienta na produkcji może kosztować incydent, przestój i utratę zaufania. Shift-left to ekonomiczny powód, dla którego bramki bezpieczeństwa stoją na początku taśmy, a nie tylko na końcu.", "inRepo": "Najwcześniejsza bramka, Security Gate, działa jeszcze zanim kod zostanie zbudowany: skanuje sekrety (TruffleHog), konfigurację infrastruktury (Checkov), styl kodu (MegaLinter), dane osobowe (PII) i sprawdza podpisy commitów. To dosłowne \"przesunięcie w lewo\" — Pipeline/.github/workflows/security-gate.yml.", "refs": ["Pipeline/README.md", "Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "  secret-detection:\n    name: \"Secret Detection (TruffleHog)\"\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - name: Checkout\n        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n        with:\n          ref: ${{ inputs.ref || github.ref }}\n          fetch-depth: 0\n          persist-credentials: false\n\n      - name: TruffleHog Scan\n        id: trufflehog\n        uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39 # v3.82.13\n        with:\n          extra_args: --only-verified --results=verified\n          base: ${{ inputs.is_pull_request == 'true' && inputs.pr_base_sha || '' }}\n          head: ${{ inputs.ref || 'HEAD' }}", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 32, "howItWorks": "To pierwszy job najwcześniejszej bramki (Security Gate), uruchamianej zaraz po pobraniu kodu, JESZCZE PRZED jego zbudowaniem. Krok Checkout pobiera repozytorium z fetch-depth: 0, czyli z PEŁNĄ historią zmian — to ważne, bo skan sekretów musi zajrzeć też w przeszłe commity. Następnie TruffleHog z --only-verified --results=verified szuka prawdziwych, działających sekretów (haseł, kluczy, tokenów). Na pull requeście porównuje tylko zakres base→head (nowe zmiany), poza tym potrafi przejrzeć całość. Wersje akcji są przypięte po pełnym SHA.", "whyItWorks": "To dosłowne \"shift-left\": sprawdzenie odbywa się na samym początku, bliżej momentu pisania kodu, zanim cokolwiek zostanie zbudowane czy wdrożone — najtaniej i najwcześniej. fetch-depth: 0 ma głęboki sens bezpieczeństwa: sekret wrzucony i \"usunięty\" wciąż tkwi w historii Git, więc skan tylko bieżącego stanu by go przegapił. Tryb --only-verified ogranicza fałszywe alarmy, dzięki czemu bramka pozostaje wiarygodna i nikt nie zaczyna jej ignorować."}, {"id": "co-robi-pipeline", "title": "Co konkretnie robi pipeline CyberForge", "plain": "Pipeline CyberForge bierze małą aplikację webową (Node.js) i prowadzi ją przez sześć etapów aż do bezpiecznego wdrożenia na chmurę Microsoft Azure. Po drodze sprawdza bezpieczeństwo na wiele sposobów, podpisuje to, co zbudował, kryptograficznie, weryfikuje ten podpis tuż przed wdrożeniem, a na końcu testuje już działającą aplikację z zewnątrz. Co ważne, przy każdym wydaniu automatycznie zbiera dowody na to, że wszystko zostało zrobione poprawnie.", "analogy": "To jak w pełni nadzorowana linia produkcyjna leku: każda partia jest testowana, plombowana, opisana składem i ma metryczkę z całej drogi produkcji — żeby później dało się udowodnić inspektorowi, że lek powstał zgodnie z procedurami.", "why": "Sam fakt, że coś działa, to za mało dla banku czy fintechu. Trzeba też móc udowodnić, jak to zbudowano i że nikt po drodze nie podmienił składników. Ten pipeline jest \"referencyjną implementacją\" — wzorcowym przykładem — bezpiecznego dostarczania oprogramowania i kontroli łańcucha dostaw, zbudowanym tak, by spełniać oczekiwania regulacji DORA, NIS2, ISO 27001 i SOC 2.", "inRepo": "Sześć etapów (Security Gate → Build & Scan → Sign & Attest → Deploy → DAST → Evidence Pack) jest opisanych w Pipeline/README.md i zaimplementowanych w plikach w Pipeline/.github/workflows/. Uczciwa uwaga zgodnie z zasadą projektu \"claims == reality\": pipeline osiąga poziom SLSA Build L2 (ang. Supply-chain Levels for Software Artifacts — poziomy zaufania do łańcucha budowy oprogramowania), a nie wyższy L3; to świadomy, udokumentowany stan, nie pomyłka.", "refs": ["Pipeline/README.md", "Pipeline/.github/workflows/dast.yml", "Pipeline/.github/workflows/evidence-pack.yml"], "codeExcerpt": "## Pipeline phases\n\nThe pipeline runs as six modular, reusable workflows, gated end to end:\n\n1. **Security Gate** — secret scanning (TruffleHog), IaC scanning (Checkov),\n   linting (MegaLinter), PII scanning, and PR commit-signature verification.\n2. **Build & Scan** — dependency scanning (Trivy SCA), SAST (CodeQL),\n   unit tests with an 80% coverage gate, container build, image scanning, and\n   CycloneDX SBOM generation.\n3. **Sign & Attest** — keyless image signing (Cosign / Sigstore), SBOM\n   attestation, and SLSA build provenance.\n4. **Deploy** — Azure OIDC authentication (no static cloud secrets), a blocking\n   `cosign verify` admission gate, Terraform plan/apply, and a smoke test.\n5. **DAST** — OWASP ZAP scan against the deployed app, with incident creation\n   on high-severity findings.\n6. **Evidence Pack** — collects all phase artifacts, sanitizes logs, computes an\n   RFC-6962 Merkle root over every artifact, keyless Cosign `sign-blob`s the\n   root (fail-closed in CI) and RFC-3161-timestamps it (a standard TSA, not a\n   qualified eIDAS QTS — see upgrade path below), and produces a **PDF/A-3 audit\n   report** archived to immutable storage.", "codePath": "Pipeline/README.md", "codeLang": "text", "codeStart": 16, "howItWorks": "Ten fragment README to mapa całej taśmy: sześć ponumerowanych etapów, każdy z konkretnym zadaniem i nazwanym narzędziem. (1) Security Gate sprawdza sekrety, konfigurację, jakość, dane osobowe i podpisy. (2) Build & Scan buduje aplikację oraz skanuje zależności, kod i obraz, wymuszając 80% pokrycia testami. (3) Sign & Attest podpisuje obraz bez stałego klucza i dokleja dowody pochodzenia. (4) Deploy logował się do Azure bez stałych sekretów i PRZED wdrożeniem ponownie weryfikuje podpis. (5) DAST atakuje już działającą aplikację. (6) Evidence Pack zbiera wszystkie dowody, liczy korzeń Merkle, podpisuje go i archiwizuje raport PDF.", "whyItWorks": "README celowo opisuje to, co faktycznie robi kod (zasada \"claims == reality\") — w tym uczciwie zaznacza granice (zwykły TSA, NIE kwalifikowany eIDAS QTS; \"fail-closed in CI\"). Sześć modułowych, wielokrotnego użytku workflowów to dobry wzorzec: każdy etap można czytać i testować osobno, a spięcie \"gated end to end\" gwarantuje, że nie da się ominąć kontroli. Dla banku/fintechu liczy się nie tylko to, że aplikacja działa, ale że całą drogę od kodu do serwera da się udowodnić — i ten spis jest właśnie taką \"metryczką produkcji leku\"."}, {"id": "evidence-pack", "title": "Evidence Pack — paczka dowodowa", "plain": "Evidence Pack (paczka dowodowa) to automatycznie składany zestaw dowodów na to, że każdy etap pipeline'u faktycznie się odbył i zakończył poprawnie. Zawiera m.in. wyniki skanów, listę składników aplikacji (SBOM), podpisy kryptograficzne i raport. Kluczowe: paczka jest GENEROWANA PRZEZ TAŚMĘ w momencie produkcji, a nie pisana ręcznie tydzień przed kontrolą.", "analogy": "To jak teczka dokumentów samochodu: dowód rejestracyjny, książka serwisowa z pieczątkami, wynik ostatniego przeglądu. Gdy policjant Cię zatrzyma, nie tłumaczysz \"przecież dbam o auto\" — pokazujesz dokumenty z datami i pieczątkami. Evidence Pack to taka teczka dla wydania oprogramowania.", "why": "Najważniejsza zasada projektu mówi wprost: zaufanie audytora bierze się z dowodów wytwarzanych w sposób ciągły i automatyczny oraz podpisywanych kryptograficznie w chwili powstania — nie z PDF-a napisanego tydzień przed inspekcją (evidence-pack-specification.md, sekcja 1). Cała sensowność tej paczki opiera się na tym, że nie da się jej dorobić po fakcie.", "inRepo": "Etap Evidence Pack zbiera artefakty wszystkich faz, oczyszcza logi z wrażliwych danych, liczy tzw. korzeń Merkle (RFC-6962) po wszystkich plikach i pakuje to w raport PDF/A-3 archiwizowany do niezmiennego magazynu. Logika sklejania paczki jest w Pipeline/scripts/seal-evidence.sh, a sam etap w Pipeline/.github/workflows/evidence-pack.yml. Spis tego, co paczka MUSI zawierać, jest w evidence-pack-specification.md.", "refs": ["evidence-pack-specification.md", "Pipeline/.github/workflows/evidence-pack.yml", "Pipeline/scripts/seal-evidence.sh", "Pipeline/README.md"], "codeExcerpt": "  # 3a: sign the immutable Merkle root (commits to every artifact hash).\n  MERKLE_BUNDLE=\"${EVIDENCE_DIR}/merkle-root.cosign.bundle\"\n  if [ -f \"${EVIDENCE_DIR}/merkle-root.txt\" ] \\\n        && cosign_sign_retry \"${EVIDENCE_DIR}/merkle-root.txt\" \"${MERKLE_BUNDLE}\"; then\n    set_sig cosign \"merkle_bundle=$(basename \"${MERKLE_BUNDLE}\")\" \"merkle_status=signed\"\n    log \"cosign: signed merkle-root.txt -> $(basename \"${MERKLE_BUNDLE}\")\"\n  else\n    COSIGN_OK=0\n    set_sig cosign \"merkle_status=failed\"\n    warn \"cosign sign-blob over merkle-root.txt failed after retries\"\n  fi\n\n  # 3b: sign a tiny file holding the PDF sha256 (so the hash is anchored too).\n  if [ -n \"${PDF_SHA256}\" ]; then\n    PDF_HASH_FILE=\"${EVIDENCE_DIR}/pdf.sha256\"\n    printf '%s  %s\\n' \"${PDF_SHA256}\" \"$(basename \"${PDF_PATH}\")\" > \"${PDF_HASH_FILE}\"\n    PDF_BUNDLE=\"${EVIDENCE_DIR}/pdf-sha256.cosign.bundle\"\n    if cosign_sign_retry \"${PDF_HASH_FILE}\" \"${PDF_BUNDLE}\"; then\n      set_sig cosign \"pdf_bundle=$(basename \"${PDF_BUNDLE}\")\" \"pdf_status=signed\"", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 387, "howItWorks": "To rdzeń \"plombowania\" paczki dowodowej. Korzeń Merkle (merkle-root.txt) to jeden krótki odcisk policzony ze wszystkich plików-dowodów — zmiana jakiegokolwiek z nich zmieniłaby ten korzeń. Krok 3a podpisuje ten korzeń kryptograficznie przez cosign (funkcja cosign_sign_retry ponawia próby, bo pierwsze keyless podpisanie bywa chwilowo niedostępne) i zapisuje wynik jako merkle-root.cosign.bundle, ustawiając status signed. Krok 3b robi to samo dla odcisku (sha256) gotowego raportu PDF. Jeśli podpis się nie uda, kod ustawia COSIGN_OK=0 i status failed — nie udaje sukcesu.", "whyItWorks": "Najważniejsza zasada paczki: ma być GENEROWANA przez taśmę i podpisana W CHWILI powstania, a nie dorobiona przed audytem. Podpisanie właśnie korzenia Merkle, a nie każdego pliku osobno, jest sprytne: jeden podpis kryptograficznie \"zamyka\" całą zawartość paczki, więc każda późniejsza podmiana choćby jednego dowodu unieważnia podpis. Jawne rozróżnienie signed vs failed (bez cichego \"udało się\") realizuje regułę \"claims == reality\" — w prawdziwym CI brak podpisu jest twardym błędem, więc paczki nie da się zaplombować bez realnego dowodu."}, {"id": "golden-thread", "title": "\"Golden thread\" — złota nić łącząca obietnicę z dowodem", "plain": "\"Golden thread\" (złota nić) to pomysł, by każdą kontrolę bezpieczeństwa dało się prześledzić od początku do końca jako jeden łańcuch: co obiecujemy → jaki podpisany dowód to potwierdza → na którym etapie taśmy powstał → który przepis prawa tego wymaga → co dokładnie sprawdzi audytor, by uznać to za zaliczone.", "analogy": "To jak śledzenie przesyłki kurierskiej: jeden numer prowadzi Cię przez całą drogę paczki — nadanie, sortownię, kuriera, dostawę. Tu jeden \"numer\" prowadzi od obietnicy bezpieczeństwa aż po podpis audytora.", "why": "Audytorzy nie pytają \"czy jesteście bezpieczni?\", tylko \"udowodnijcie, dla TEJ konkretnej kontroli, czym i jak\". Złota nić sprawia, że na każde takie pytanie istnieje gotowa, spójna odpowiedź — bez szukania po mailach i ludziach.", "inRepo": "Łańcuch jest zdefiniowany w evidence-pack-specification.md (sekcja 1, \"the golden thread\"): CONTROL → EVIDENCE → PIPELINE STAGE/SOURCE → REGULATORY CLAUSE → ACCEPTANCE CRITERION. To samo odzwierciedla macierz zgodności Pipeline/docs/compliance-matrix.md, która mapuje framework → kontrola → dowód.", "refs": ["evidence-pack-specification.md", "Pipeline/docs/compliance-matrix.md"], "codeExcerpt": "## 1. Executive map — the \"golden thread\"\n\nThe entire pack exists to make one chain auditable, end to end, for every control:\n\n```\nCONTROL  ->  EVIDENCE  ->  PIPELINE STAGE / SOURCE  ->  REGULATORY CLAUSE  ->  ACCEPTANCE CRITERION\n(what we     (the signed   (where it was produced,     (DORA / NIS2-KSC /      (what an auditor checks\n promise)     artifact)     automatically)              GDPR / CRA / ISO)       to mark it PASS)\n```", "codePath": "evidence-pack-specification.md", "codeLang": "text", "codeStart": 18, "howItWorks": "To definicja \"złotej nici\" wprost w specyfikacji. Czyta się ją od lewej do prawej jako jeden łańcuch dla KAŻDEJ kontroli bezpieczeństwa: CONTROL (co obiecujemy) → EVIDENCE (podpisany artefakt, który to potwierdza) → PIPELINE STAGE / SOURCE (na którym etapie taśmy i automatycznie to powstało) → REGULATORY CLAUSE (który przepis DORA/NIS2/GDPR/ISO tego wymaga) → ACCEPTANCE CRITERION (co dokładnie audytor sprawdzi, by uznać kontrolę za zaliczoną). Druga linia w nawiasach tłumaczy znaczenie każdego ogniwa po ludzku.", "whyItWorks": "Audytor nie pyta \"czy jesteście bezpieczni?\", tylko \"udowodnijcie, dla TEJ konkretnej kontroli, czym i jak\". Spisanie tego jako jawnego, stałego łańcucha sprawia, że na każde takie pytanie istnieje gotowa, spójna odpowiedź — bez szukania po mailach i ludziach. Co ważne, ogniwo \"produced automatically\" wymusza, że dowód powstaje sam w trakcie taśmy, a nie jest dorabiany; a dopięcie do konkretnej klauzuli prawnej i kryterium akceptacji zamyka lukę między \"mamy jakiś plik\" a \"to faktycznie spełnia wymóg X\"."}, {"id": "po-co-regulacje", "title": "Po co regulowanej firmie ta paczka — DORA, NIS2 i audytor", "plain": "Banki, fintechy i inne firmy z sektora finansowego w Polsce działają pod nadzorem regulacji unijnych i krajowych. Najważniejsze tutaj to DORA (rozporządzenie UE o cyfrowej odporności operacyjnej sektora finansowego) i NIS2 (dyrektywa UE o cyberbezpieczeństwie, w Polsce wdrażana przez ustawę KSC). Te przepisy wymagają, by firma nie tylko była bezpieczna, ale potrafiła to UDOWODNIĆ przed audytorem lub regulatorem (np. KNF, UODO).", "analogy": "To jak kontrola sanepidu w restauracji. Nie wystarczy, że kucharz mówi \"u nas jest czysto\". Inspektor chce zobaczyć dziennik temperatur lodówki, certyfikaty dostawców i daty mycia. Evidence Pack to dla aplikacji właśnie taki komplet dokumentów dla \"sanepidu\" od cyberbezpieczeństwa.", "why": "Gdy audytor pyta \"udowodnijcie, że budujecie i wdrażacie oprogramowanie bezpiecznie\", paczka dowodowa jest gotową, podpisaną odpowiedzią — zamiast tygodni zbierania dowodów ręcznie. Brak takich dowodów to ryzyko kar, utraty licencji albo zerwanych kontraktów z większymi partnerami.", "inRepo": "Pipeline jest świadomie zbudowany pod DORA (EU 2022/2554), NIS2 (EU 2022/2555), ISO/IEC 27001:2022, SOC 2 oraz GDPR/RODO — lista w Pipeline/README.md, a szczegółowe mapowanie przepis→kontrola→dowód w Pipeline/docs/compliance-matrix.md. Uczciwa granica: README jasno mówi, że to są kontrole TECHNICZNE — pełna zgodność wymaga też kontroli organizacyjnych (zarządzanie ryzykiem, procedury zgłaszania incydentów, testy BC/DR), a certyfikacja ISO/SOC 2 wymaga zewnętrznego audytu; repo przygotowuje dowody, ale samo się nie certyfikuje.", "refs": ["Pipeline/README.md", "Pipeline/docs/compliance-matrix.md", "evidence-pack-specification.md"], "codeExcerpt": "## Scope and boundaries\n\nThis pipeline provides **technical** secure-SDLC and supply-chain controls and\ngenerates audit evidence for them. It is a strong foundation for DORA / NIS2 /\nISO 27001 / SOC 2 readiness — but a full compliance program also requires\norganizational controls outside CI/CD: governance and risk management, incident\nreporting procedures, BC/DR drills, IAM governance, supplier-risk management,\ninternal audit, and management review. ISO 27001 and SOC 2 additionally require\nexternal certification/attestation; this repository prepares evidence and\ncontrols but does not self-certify. See\n[`docs/compliance/scope-and-limitations.md`](docs/compliance/scope-and-limitations.md)\nfor the detailed scope statement.", "codePath": "Pipeline/README.md", "codeLang": "text", "codeStart": 76, "howItWorks": "Ta sekcja README precyzyjnie wyznacza, co pipeline robi DLA regulacji, a czego NIE. Pierwsze zdanie: dostarcza kontrole TECHNICZNE (bezpieczne wytwarzanie i łańcuch dostaw) oraz generuje do nich dowody audytowe — to właśnie ta \"teczka dokumentów\" dla cyber-sanepidu. Drugie: to mocny fundament gotowości pod DORA, NIS2, ISO 27001 i SOC 2, ALE pełna zgodność wymaga też kontroli ORGANIZACYJNYCH spoza CI/CD (zarządzanie ryzykiem, procedury zgłaszania incydentów, testy BC/DR, nadzór nad dostawcami, audyt wewnętrzny). Na końcu jasno: ISO/SOC 2 wymagają zewnętrznej certyfikacji — repo przygotowuje dowody, ale samo się nie certyfikuje.", "whyItWorks": "Banki i fintechy w UE/Polsce muszą umieć UDOWODNIĆ bezpieczeństwo przed audytorem czy regulatorem (KNF, UODO) — sama deklaracja nie wystarczy, tak jak nie wystarczy \"u nas jest czysto\" dla sanepidu. Jednocześnie ta sekcja jest przykładem uczciwości \"claims == reality\": wprost nazywa granicę między kontrolami technicznymi a organizacyjnymi i nie udaje, że pipeline \"załatwia DORA\". To buduje wiarygodność u audytora — bo nadmierne obietnice zgodności są w audycie gorsze niż uczciwie wyznaczony zakres."}, {"id": "uczciwy-stan", "title": "Uczciwy stan — co już działa, a co świeci na czerwono", "plain": "Zasada tego projektu brzmi: \"claims == reality\" (deklaracje równają się rzeczywistości). Oznacza to, że nie udajemy lepszego stanu niż faktyczny. Niektóre rzeczy są w pełni wdrożone, inne celowo \"świecą na czerwono\", dopóki nie ma na nie prawdziwego dowodu.", "analogy": "To jak uczciwy przegląd techniczny auta: mechanik nie przybija pieczątki na hamulce, których nie sprawdził. Jeśli czegoś nie zweryfikowano, w protokole jest to wypisane jako \"do zrobienia\", a nie zamalowane.", "why": "W audycie wykryta nieprawda jest gorsza niż uczciwie przyznana luka — podważa zaufanie do CAŁEJ paczki. Dlatego pipeline woli pokazać czerwoną bramkę niż udać zielono. To buduje wiarygodność u audytora.", "inRepo": "Stan zgodny z rzeczywistością: podpis keyless Cosign (Sigstore/Fulcio/Rekor) i wpis do publicznego rejestru przejrzystości działają w realnym przebiegu CI i są tam fail-closed (brak podpisu = twardy błąd taśmy); w próbce offline są uczciwie oznaczone jako \"pending\". Znaczniki czasu to standardowy RFC-3161 z publicznego serwera (freetsa.org) — to NIE jest jeszcze kwalifikowana usługa eIDAS QTS (ścieżka upgrade'u: KIR Szafir / Certum / EuroCert / CenCert jest udokumentowana osobno). Niektóre bramki, jak test odtworzenia z kopii (restore-test) czy test penetracyjny (pentest), uczciwie świecą na czerwono, dopóki nie ma realnego dowodu. Źródła: Pipeline/README.md (sekcja \"Tamper-evident evidence\") i Pipeline/scripts/seal-evidence.sh.", "refs": ["Pipeline/README.md", "Pipeline/scripts/seal-evidence.sh", "evidence-pack-specification.md"], "codeExcerpt": "- **Tamper-evident evidence** — per-artifact SHA-256 + RFC-6962 Merkle root, a\n  keyless Cosign `sign-blob` over the root, and RFC-3161 timestamps. The Merkle\n  root is signed on every production run: a missing or empty\n  `merkle-root.cosign.bundle` is a hard CI failure, so the pack cannot be sealed\n  without it. The RFC-3161 stamp uses a standard public TSA (freetsa.org),\n  **not** a qualified eIDAS Qualified Timestamp Service (QTS); a pluggable QTS\n  upgrade path (KIR Szafir / Certum / EuroCert / CenCert) is documented\n  separately. On local/degrade runs the Cosign and TSA steps soft-degrade on\n  signing-infra/TSA flakiness; PDF/A-3 archival anchors the pack regardless.", "codePath": "Pipeline/README.md", "codeLang": "text", "codeStart": 47, "howItWorks": "Ten akapit opisuje stan zgodny z rzeczywistością. Integralność stoi na warstwach: per-artifact SHA-256 (odcisk każdego pliku) + RFC-6962 Merkle root (jeden odcisk wszystkiego), nad którym wykonywany jest keyless Cosign sign-blob (podpis bez stałego klucza), plus znacznik czasu RFC-3161. Kluczowe zdanie o fail-closed: w każdym przebiegu produkcyjnym brak lub pusty merkle-root.cosign.bundle to TWARDY błąd CI — paczki nie da się zaplombować bez podpisu. Akapit uczciwie dodaje, że znacznik czasu pochodzi ze zwykłego, publicznego TSA (freetsa.org), a NIE z kwalifikowanej usługi eIDAS QTS, i wskazuje udokumentowaną ścieżkę upgrade'u (KIR Szafir / Certum / EuroCert / CenCert).", "whyItWorks": "To esencja zasady \"claims == reality\": w realnym CI podpis jest wymuszony (fail-closed), ale README nie udaje więcej niż jest — wprost odróżnia zwykły TSA od kwalifikowanego eIDAS QTS i nazywa lokalne przebiegi jako \"soft-degrade\". W audycie wykryta nieprawda podważa zaufanie do CAŁEJ paczki, więc lepiej pokazać czerwoną/oznaczoną lukę niż zamalować ją na zielono. Rozróżnienie \"signed vs pending\", twardy błąd przy braku podpisu oraz jawna ścieżka upgrade'u do QTS to właśnie ten \"uczciwy protokół przeglądu\", który buduje wiarygodność u regulatora."}]}, {"area": "2 · Skanery bezpieczeństwa — jak pipeline szuka dziur", "intro": "Zanim kod CyberForge trafi gdziekolwiek dalej, przechodzi przez zestaw automatycznych \"kontroli na lotnisku\". Każdy skaner sprawdza coś innego — jeden czyta kod, drugi sprawdza składniki (biblioteki), inny szuka haseł, jeszcze inny atakuje gotową aplikację z zewnątrz. Tutaj wyjaśniamy każdy z nich prostym językiem: co robi, jakie narzędzie robi to w tym repo i co dokładnie potrafi złapać.", "blocks": [{"id": "podstawy-cve-severity-sarif", "title": "Najpierw słowniczek: CVE, severity i SARIF", "plain": "Zanim poznasz skanery, trzy pojęcia. CVE (Common Vulnerabilities and Exposures — \"wspólny katalog znanych podatności\") to publiczny, ponumerowany spis odkrytych dziur w oprogramowaniu, np. CVE-2024-12345. Severity (powaga) to ocena, jak groźna jest dziura: CRITICAL (krytyczna), HIGH (wysoka), MEDIUM (średnia), LOW (niska). SARIF (Static Analysis Results Interchange Format) to wspólny, ustandaryzowany format pliku z wynikami — dzięki niemu różne skanery mówią \"tym samym językiem\" i GitHub potrafi je wszystkie wyświetlić w jednym miejscu.", "analogy": "CVE jest jak numer katalogowy wadliwej partii produktu na liście ostrzeżeń konsumenckich. Severity to kolor na tej liście: czerwony = natychmiast wyrzuć, żółty = uważaj. SARIF to jak ustandaryzowany formularz zgłoszenia usterki — niezależnie kto go wypełnia (mechanik, elektryk), pola są te same.", "why": "Bez wspólnej skali (severity) i wspólnego formatu (SARIF) nie dałoby się automatycznie decydować, co blokuje wydanie, a co tylko zapisać na potem. Pipeline blokuje na CRITICAL i HIGH, a resztę raportuje.", "inRepo": "Próg wagi widać wprost w komendach Trivy: `--severity CRITICAL,HIGH` (Pipeline/.github/workflows/build-and-scan.yml:91 i :734). CodeQL zapisuje wyniki jako SARIF i jest osobno sprawdzany pod kątem zgodności z formatem (build-and-scan.yml:240-246).", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/scripts/validators/sarif_conformance.py"], "codeExcerpt": "      - name: Run Trivy filesystem scan\n        run: |\n          # pipefail is REQUIRED: without it the pipe's exit status is tee's\n          # (always 0), so Trivy's --exit-code 1 on HIGH/CRITICAL findings would\n          # be swallowed and the gate would silently pass. GitHub's default\n          # shell (bash -e) does NOT enable pipefail.\n          set -o pipefail\n          trivy fs app/ \\\n            --format json \\\n            --output trivy-sca-results.json \\\n            --severity CRITICAL,HIGH \\\n            --exit-code 1 \\\n            --ignorefile app/.trivyignore \\\n            2>&1 | tee /tmp/trivy-sca-console.txt", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 81, "howItWorks": "To wywołanie skanera Trivy pokazuje wszystkie trzy pojęcia ze słowniczka w praktyce. Flaga `--severity CRITICAL,HIGH` to właśnie próg severity (powagi): Trivy bierze pod uwagę tylko podatności oznaczone jako krytyczne lub wysokie, a pomija medium/low. Każda taka podatność ma w bazie swój identyfikator CVE (np. CVE-2024-12345) — to po nim Trivy rozpoznaje, że dana wersja biblioteki ma znaną dziurę. Wynik zapisywany jest do pliku JSON (`--output`), a `--exit-code 1` sprawia, że znalezienie czegokolwiek na progu kończy krok błędem. Format SARIF (drugie pojęcie ze słowniczka) pojawia się w sąsiednim jobie CodeQL — tam, gdzie wyniki SAST są zapisywane jako standardowy plik .sarif i osobno walidowane.", "whyItWorks": "Ustalenie jasnego progu severity (CRITICAL,HIGH) jest decyzją biznesową: nie da się naprawić wszystkich znanych CVE naraz, więc bramka egzekwuje tylko te, które realnie zagrażają. Wiązanie podatności z numerami CVE daje wspólny, publiczny słownik — każdy (audytor, deweloper, klient) mówi tym samym językiem o tej samej dziurze. A standardowy format SARIF dla wyników statycznej analizy pozwala różnym narzędziom (skaner, GitHub Code Scanning, własne walidatory) czytać te same wyniki bez tłumaczenia — dlatego severity i SARIF to fundament, na którym stoją wszystkie kolejne bramki."}, {"id": "fail-closed", "title": "Zasada bramki: \"fail-closed\" (czerwone = blokuje)", "plain": "Wszystkie bramki w tym pipeline działają w trybie fail-closed — czyli \"domyślnie zamknięte\". Jeśli skaner znajdzie problem ALBO jeśli sam skaner się wysypie i nie da się odczytać wyniku, bramka świeci na czerwono i blokuje dalszy ruch. Nigdy nie przepuszcza \"na wszelki wypadek\". To przeciwieństwo fail-open, gdzie błąd narzędzia po cichu by przepuścił kod.", "analogy": "Jak bramka w metrze, która przy awarii zasilania się ZAMYKA, a nie otwiera na oścież. Lepiej, żeby nikt nie przeszedł, niż żeby wszyscy przeszli za darmo.", "why": "Najgroźniejsze luki w pipeline'ach to te, które po cichu przepuszczają. Np. gdy wynik skanera idzie przez `tee` do pliku, kod wyjścia gubi się i bramka fałszywie zielenieje — dlatego w repo wszędzie jest `set -o pipefail`, żeby błąd skanera nie został połknięty.", "inRepo": "Komentarze w kodzie tłumaczą to wprost: `set -o pipefail` przy Trivy (build-and-scan.yml:87, :730), przy Checkov (security-gate.yml:118) i przy skanie PII (security-gate.yml:354). Skan obrazu Trivy domyślnie ustawia critical_cves=1, jeśli nie da się odczytać wyniku — żeby brama deploy odmówiła (build-and-scan.yml:759-787).", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "          # Default to fail-closed counts: if the scan JSON is missing/unparseable\n          # we surface critical_cves=1 so the downstream OPA deployment gate denies\n          # rather than admitting on a silent 0 (T-03). parse_ok flips to True only\n          # on a successful parse of real results.\n          severity_counts = {\"CRITICAL\": 0, \"HIGH\": 0, \"MEDIUM\": 0, \"LOW\": 0}\n          parse_ok = False\n          try:\n              with open(\"trivy-image-results.json\") as f:\n                  data = json.load(f)\n              total_vulns = 0\n              for r in data.get(\"Results\", []):\n                  for v in r.get(\"Vulnerabilities\", []):\n                      sev = v.get(\"Severity\", \"\").upper()\n                      total_vulns += 1\n                      if sev in severity_counts:\n                          severity_counts[sev] += 1\n              metadata[\"total_findings\"] = total_vulns\n              metadata[\"severity_breakdown\"] = severity_counts\n              parse_ok = True\n          except Exception as e:\n              metadata[\"parse_error\"] = str(e)", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "python", "codeStart": 759, "howItWorks": "Ten fragment to wzorcowy przykład fail-closed. Skrypt próbuje wczytać i policzyć podatności z wyniku skanu Trivy. Kluczowa jest flaga `parse_ok = False` ustawiona ZANIM zacznie się parsowanie — staje się ona `True` dopiero, gdy plik realnie się otworzył, sparsował jako JSON i przeliczył. Jeśli plik nie istnieje, jest pusty albo uszkodzony, blok `except` to przechwytuje i `parse_ok` zostaje `False`. Tuż za tym fragmentem liczba krytycznych CVE przekazywana do bramki wdrożeniowej OPA jest ustawiana na 1, gdy `parse_ok` jest fałszem — czyli brak czytelnego wyniku traktowany jest jak znalezienie krytycznej dziury.", "whyItWorks": "Najgroźniejszy scenariusz w bezpieczeństwie to nie 'skaner znalazł dziurę' (wtedy wiemy, co robić), lecz 'skaner się wysypał, a my nie zauważyliśmy i wdrożyliśmy'. Domyślne `critical_cves=1` przy nieczytelnym wyniku gwarantuje, że awaria narzędzia NIGDY nie przepuści wdrożenia na fałszywym zerze. To realizacja zasady 'domyślnie zamknięte': cisza/błąd = blokada, nie = zielone. Bez tego cała wiarygodność pipeline byłaby pozorna, bo wystarczyłby jeden zepsuty plik, by ominąć wszystkie kontrole."}, {"id": "sast-codeql", "title": "SAST — czytanie kodu w poszukiwaniu błędów (CodeQL)", "plain": "SAST (Static Application Security Testing — \"statyczne testowanie bezpieczeństwa aplikacji\") to analiza, która czyta sam kod źródłowy, nie uruchamiając go. Szuka wzorców niebezpiecznego pisania: np. dane od użytkownika trafiające prosto do zapytania do bazy (podatność na wstrzyknięcie), albo wyświetlanie niezabezpieczonego tekstu na stronie. W tym repo robi to CodeQL od GitHuba, w trybie security-extended (rozszerzony zestaw reguł bezpieczeństwa) dla JavaScript/TypeScript.", "analogy": "Jak korektor czytający tekst książki przed drukiem — nie testuje, czy książka się \"sprzedaje\", tylko wyłapuje błędy gramatyczne i logiczne w samym napisanym tekście.", "why": "Wiele dziur da się wykryć zanim aplikacja w ogóle ruszy — taniej i wcześniej naprawić błąd na etapie kodu niż po włamaniu. CodeQL łapie klasyczne błędy programistyczne (SQL injection, XSS, niebezpieczne deserializacje).", "inRepo": "Job `codeql` w build-and-scan.yml:194-209 inicjuje CodeQL z `queries: security-extended`. Bramka jest fail-closed: blokuje, gdy znalezisko ma poziom error LUB security-severity (wynik podobny do CVSS 0-10) >= 7.0 (build-and-scan.yml:263-379). Wyjątki muszą być wpisane z uzasadnieniem i datą wygaśnięcia w app/.codeqlignore.", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/app/.codeqlignore"], "codeExcerpt": "      - name: Initialize CodeQL\n        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1\n        with:\n          languages: javascript-typescript\n          queries: security-extended\n\n      - name: Setup Node.js\n        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: app/package-lock.json\n\n      - name: Install dependencies (for CodeQL build context)\n        run: cd app && npm ci\n\n      - name: Build app (for CodeQL)\n        run: cd app && npm run build\n\n      - name: Perform CodeQL Analysis\n        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1\n        with:\n          category: /language:javascript-typescript\n          output: codeql-results\n          upload: false", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 205, "howItWorks": "To jest job SAST oparty na CodeQL. Krok `Initialize CodeQL` mówi, jaki język analizować (`javascript-typescript`) i jaki zestaw zapytań uruchomić: `queries: security-extended` to rozszerzony pakiet reguł bezpieczeństwa (więcej wzorców niż domyślny). Potem aplikacja jest budowana (`npm run build`) — CodeQL potrzebuje skompilowanego kodu jako kontekstu, żeby śledzić przepływ danych. Krok `Perform CodeQL Analysis` faktycznie czyta kod i szuka niebezpiecznych wzorców, zapisując wynik do `codeql-results`. Ważne: `upload: false` — wynik nie jest tylko wysyłany do UI GitHuba, lecz zostaje lokalnie, by osobna bramka (kroki dalej) mogła go twardo wyegzekwować.", "whyItWorks": "SAST czyta kod bez uruchamiania go, więc wyłapuje błędy zanim aplikacja w ogóle ruszy — najtaniej naprawić dziurę na etapie pisania. Wybór `security-extended` zamiast minimalnego zestawu to świadoma decyzja: lepiej więcej sygnałów do przejrzenia niż przeoczona podatność. `upload: false` w połączeniu z lokalną bramką to klucz — sam upload do GitHuba jest 'dla UI', bywa best-effort i nie blokuje; prawdziwe egzekwowanie musi opierać się na pliku, który kontrolujemy, żeby zielony status nie zależał od tego, czy zewnętrzny serwis przyjął wynik."}, {"id": "sca-trivy", "title": "SCA — sprawdzanie składników/bibliotek (Trivy)", "plain": "SCA (Software Composition Analysis — \"analiza składu oprogramowania\") nie patrzy na Twój własny kod, tylko na gotowe biblioteki, których używasz (cudze fragmenty doklejone do projektu). Sprawdza ich wersje względem publicznego katalogu CVE i krzyczy, jeśli któraś ma znaną dziurę. Robi to Trivy, skanując folder aplikacji.", "analogy": "Jak sprawdzanie składu na opakowaniu jedzenia względem listy wycofanych partii: sam przepis może być dobry, ale jeśli użyłeś mąki z wycofanej, skażonej partii — całe danie jest niebezpieczne.", "why": "Dziś 80-90% kodu w typowej aplikacji to cudze biblioteki. Najczęstszy sposób włamania to nie błąd Twojego kodu, lecz nieaktualna biblioteka ze znaną, łataną już luką. SCA wyłapuje to automatycznie.", "inRepo": "Job `dependency-scan` w build-and-scan.yml:53-94 uruchamia `trivy fs app/` z progiem CRITICAL,HIGH i `--exit-code 1` (czyli czerwone = blokuje). Wyjątki idą przez app/.trivyignore, ale każdy wpis musi mieć linię VEX z uzasadnieniem i datą wygaśnięcia — pilnuje tego osobny linter przed skanem (build-and-scan.yml:71-79).", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/app/.trivyignore", "Pipeline/scripts/lint-trivyignore.py"], "codeExcerpt": "      - name: Validate .trivyignore policy\n        run: |\n          # Pre-scan gate (T-02): every active suppression in app/.trivyignore\n          # MUST carry a '# VEX: <status> - <reason> expires=YYYY-MM-DD' line and\n          # be unexpired. This keeps the strong Trivy fs+image gates honest — a\n          # silently-added or stale suppression fails the job here, BEFORE the\n          # scan can be weakened. The linter exits 1 on any unjustified/expired\n          # entry, 2 if the file is missing.\n          python3 scripts/lint-trivyignore.py app/.trivyignore\n\n      - name: Run Trivy filesystem scan\n        run: |\n          # pipefail is REQUIRED: without it the pipe's exit status is tee's\n          # (always 0), so Trivy's --exit-code 1 on HIGH/CRITICAL findings would\n          # be swallowed and the gate would silently pass. GitHub's default\n          # shell (bash -e) does NOT enable pipefail.\n          set -o pipefail\n          trivy fs app/ \\\n            --format json \\\n            --output trivy-sca-results.json \\\n            --severity CRITICAL,HIGH \\\n            --exit-code 1 \\\n            --ignorefile app/.trivyignore", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 71, "howItWorks": "To job SCA — analiza składu oprogramowania. `trivy fs app/` przeszukuje katalog aplikacji (m.in. package-lock.json) i porównuje wersje użytych bibliotek z bazą CVE; `--severity CRITICAL,HIGH` i `--exit-code 1` powodują blokadę, gdy któraś biblioteka ma znaną krytyczną/wysoką dziurę. Najważniejsze jest jednak to, co dzieje się PRZED skanem: krok `Validate .trivyignore policy` uruchamia własny linter, który sprawdza plik wyjątków `app/.trivyignore`. Każdy wpis (wyciszona CVE) musi mieć w komentarzu linię VEX z uzasadnieniem i datą wygaśnięcia (`expires=YYYY-MM-DD`). Wpis bez uzasadnienia lub przeterminowany kończy job błędem, zanim Trivy w ogóle ruszy.", "whyItWorks": "Większość kodu w nowoczesnej aplikacji to cudze biblioteki — to tam najczęściej kryją się znane podatności, dlatego SCA jest nieodzowne obok analizy własnego kodu. Ale każdy mechanizm wyjątków da się nadużyć: ktoś mógłby po cichu dopisać CVE do `.trivyignore` i 'zazielenić' bramkę. Walidator VEX uruchamiany PRZED skanem zamyka tę furtkę — wyciszenie jest świadomą, datowaną i uzasadnioną decyzją, która sama wygasa. To czyni bramkę 'uczciwą': nie da się jej osłabić bez śladu, a stare wyjątki nie zostają w nieskończoność."}, {"id": "skan-sekretow", "title": "Skan sekretów — szukanie haseł i kluczy w kodzie (TruffleHog)", "plain": "Skan sekretów przeszukuje kod i historię zmian w poszukiwaniu rzeczy, które nigdy nie powinny tam trafić: haseł, kluczy API, tokenów dostępu, kluczy prywatnych. W tym repo robi to TruffleHog, w trybie --only-verified — czyli zgłasza tylko sekrety, które potwierdzi jako prawdziwe i działające, żeby nie zasypywać fałszywymi alarmami.", "analogy": "Jak ochroniarz, który sprawdza, czy ktoś przypadkiem nie zostawił klucza do sejfu przyklejonego taśmą pod biurkiem — i dodatkowo próbuje tym kluczem otworzyć sejf, żeby się upewnić, że jest prawdziwy, zanim podniesie alarm.", "why": "Sekret wrzucony do repozytorium jest jak klucz zostawiony w drzwiach na zawsze — nawet po usunięciu zostaje w historii Git. Wyciek jednego klucza API może oznaczać przejęcie całej infrastruktury. Dlatego skan patrzy też w głąb historii (fetch-depth: 0).", "inRepo": "Job `secret-detection` w security-gate.yml:32-50 używa TruffleHog z `--only-verified --results=verified`. Przy pull requeście porównuje tylko zmiany od bazowego commita (base/head), a poza tym skanuje całe repo z pełną historią.", "refs": ["Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "  secret-detection:\n    name: \"Secret Detection (TruffleHog)\"\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - name: Checkout\n        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n        with:\n          ref: ${{ inputs.ref || github.ref }}\n          fetch-depth: 0\n          persist-credentials: false\n\n      - name: TruffleHog Scan\n        id: trufflehog\n        uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39 # v3.82.13\n        with:\n          extra_args: --only-verified --results=verified\n          base: ${{ inputs.is_pull_request == 'true' && inputs.pr_base_sha || '' }}\n          head: ${{ inputs.ref || 'HEAD' }}", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 38, "howItWorks": "To job skanowania sekretów. Najpierw krok `Checkout` z `fetch-depth: 0` pobiera CAŁĄ historię repozytorium (nie tylko ostatni commit) — to ważne, bo sekret mógł zostać dodany dawno i później 'usunięty', ale wciąż siedzi w historii Gita. Potem TruffleHog skanuje kod i historię. Flaga `--only-verified --results=verified` sprawia, że narzędzie zgłasza tylko sekrety, które aktywnie zweryfikowało jako prawdziwe i działające (np. spróbowało użyć klucza). Pola `base`/`head` przy pull requeście zawężają skan do różnicy między bazowym a bieżącym commitem, a poza PR-em skanowane jest całe repo.", "whyItWorks": "Hasła i klucze API w kodzie to jeden z najczęstszych i najgroźniejszych wycieków — raz wypchnięty sekret trzeba uznać za skompromitowany. Skanowanie pełnej historii (`fetch-depth: 0`) jest konieczne, bo usunięcie sekretu z bieżącego pliku nie usuwa go z poprzednich commitów. Tryb `--only-verified` to świadomy kompromis: redukuje fałszywe alarmy (losowy ciąg wyglądający jak klucz), żeby zespół nie 'oślepł' na ostrzeżenia i traktował każde trafienie poważnie. Zawężanie do różnicy przy PR-ach przyspiesza informację zwrotną dla autora konkretnej zmiany."}, {"id": "skan-pii", "title": "Skan PII — szukanie danych osobowych (PESEL, telefon, e-mail)", "plain": "Osobno od sekretów pipeline szuka PII (Personally Identifiable Information — \"dane osobowe identyfikujące osobę\") zaszytych na sztywno w kodzie. To własny skaner napisany w tym projekcie: szuka wzorców polskiego numeru PESEL, polskich numerów telefonu (+48) oraz adresów e-mail. PESEL i telefon blokują pipeline, e-mail jest tylko ostrzeżeniem.", "analogy": "Jak sprawdzenie, czy w publikowanym dokumencie ktoś nie zapomniał zaczernić czyjegoś numeru dowodu czy telefonu, zanim trafi do druku.", "why": "W Polsce/UE wpisanie prawdziwego PESEL-u czy danych klienta na stałe do kodu to naruszenie RODO i realne ryzyko prawne. Lepiej złapać to maszynowo przed scaleniem niż tłumaczyć się przed regulatorem później.", "inRepo": "Job `pii-scanner` w security-gate.yml:339-412. Wzorzec PESEL i +48 wykryte -> `exit 1` (blokada). Skaner jest fail-closed nie tylko na trafienie: jeśli samo `grep` zwróci błąd (rc>=2), też blokuje (security-gate.yml:367-387).", "refs": ["Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "            # Fail-closed: capture grep rc explicitly. rc==0 -> match,\n            # rc==1 -> no match (continue), rc>=2 -> scanner error -> fail.\n            set +e\n            grep -rn --include=\"*.ts\" --include=\"*.js\" --include=\"*.json\" \\\n              -E '\\b[0-9]{2}([02468]1|[13579][012])(0[1-9]|[12][0-9]|3[01])[0-9]{5}\\b' \\\n              app/src/ app/tests/\n            rc=$?\n            set -e\n            if [ \"$rc\" -eq 0 ]; then\n              echo \"::error::Potential PESEL numbers found in source code\"\n              FOUND=1\n            elif [ \"$rc\" -ge 2 ]; then\n              echo \"::error::PII grep failed (PESEL scan, exit $rc)\"\n              exit 1\n            fi", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "bash", "codeStart": 361, "howItWorks": "To własny skaner PII napisany w samym pipeline. Wyrażenie regularne (`-E '\\b[0-9]{2}...'`) opisuje wzorzec polskiego numeru PESEL — 11 cyfr z poprawnymi zakresami miesiąca i dnia. `grep -rn` przeszukuje rekurencyjnie pliki .ts/.js/.json w katalogach aplikacji. Sercem fail-closed jest jawne przechwycenie kodu wyjścia grepa do zmiennej `rc`: `rc==0` oznacza znaleziono PESEL (ustaw `FOUND=1`), `rc==1` to brak trafień (idziemy dalej), a `rc>=2` to BŁĄD samego grepa (np. zły katalog) — i wtedy następuje natychmiastowe `exit 1`. Otoczenie `set +e` / `set -e` jest po to, by skrypt nie przerwał się sam na rc==1 (brak trafień), które bash domyślnie traktuje jak błąd.", "whyItWorks": "Twarde zaszycie danych osobowych (PESEL, telefon) w kodzie to ryzyko prawne (RODO) i nigdy nie powinno trafić do repozytorium — własny skaner pozwala wyłapać specyficznie polskie wzorce, których ogólne narzędzia nie znają. Kluczowa jest tu obsługa `rc>=2`: rozróżnienie 'nic nie znaleziono' od 'skaner się zepsuł' to esencja fail-closed. Gdyby błąd grepa potraktować jak 'brak trafień', awaria narzędzia po cichu przepuściłaby PII. Dlatego błąd skanera blokuje tak samo jak realne znalezisko — bo niewiedza nie może być traktowana jak bezpieczeństwo."}, {"id": "iac-checkov", "title": "IaC scan — sprawdzanie konfiguracji chmury (Checkov)", "plain": "IaC (Infrastructure as Code — \"infrastruktura jako kod\") to opisanie serwerów, sieci i magazynów danych w plikach tekstowych (tu: Terraform), zamiast klikania w panelu chmury. Skan IaC, czyli tutaj Checkov, czyta te pliki i sprawdza, czy konfiguracja jest bezpieczna: czy magazyn nie jest publiczny, czy szyfrowanie jest włączone, czy nie zostawiono otwartych portów.", "analogy": "Jak inspektor budowlany czytający projekt domu PRZED budową: sprawdza, czy zaplanowano zamki w drzwiach i czujniki dymu, zanim mury staną. Taniej poprawić rysunek niż przebudowywać gotowy dom.", "why": "Najczęstsze wycieki danych w chmurze to nie genialne włamania, tylko źle skonfigurowany magazyn ustawiony jako publiczny. Złapanie tego na poziomie pliku konfiguracyjnego zapobiega katastrofie, zanim infrastruktura w ogóle powstanie.", "inRepo": "Job `iac-security` w security-gate.yml:89-129 uruchamia `checkov -d infra/` dla Terraform i emituje SARIF. Lista pominiętych reguł (CHECKOV_SKIP_CHECKS) musi się zgadzać z rejestrem wyjątków docs/compliance/checkov-exceptions.md — pilnuje tego walidator przed skanem, więc nie da się po cichu wyciszyć kontroli (security-gate.yml:100-109).", "refs": ["Pipeline/.github/workflows/security-gate.yml", "Pipeline/docs/compliance/checkov-exceptions.md", "Pipeline/infra/main.tf"], "codeExcerpt": "      - name: Validate Checkov skip justifications\n        # Fail-closed gate (T-04 / T-76): every id in CHECKOV_SKIP_CHECKS below MUST\n        # have an in-date, fully-justified row in docs/compliance/checkov-exceptions.md.\n        # A skip with no justification, an expired waiver, or drift between the workflow\n        # list and the register fails here BEFORE Ch
