lsa-l3-gap.md). Keyless cosign + Rekor działają w realnym przebiegu CI; w próbce offline są 'honest-pending', bo nie ma dostępu do sieci. Merkle root (RFC-6962) nad wszystkimi artefaktami jest podpisywany sign-blob i to fail-closed (brak podpisu = twardy błąd CI). Zob. README.md:32-33,43-51; scripts/seal-evidence.sh.", "refs": ["Pipeline/README.md", "Pipeline/scripts/seal-evidence.sh", "Pipeline/docs/slsa-l3-gap.md"], "codeExcerpt": "  # 3a: sign the immutable Merkle root (commits to every artifact hash).\n  MERKLE_BUNDLE=\"${EVIDENCE_DIR}/merkle-root.cosign.bundle\"\n  if [ -f \"${EVIDENCE_DIR}/merkle-root.txt\" ] \\\n        && cosign_sign_retry \"${EVIDENCE_DIR}/merkle-root.txt\" \"${MERKLE_BUNDLE}\"; then\n    set_sig cosign \"merkle_bundle=$(basename \"${MERKLE_BUNDLE}\")\" \"merkle_status=signed\"\n    log \"cosign: signed merkle-root.txt -> $(basename \"${MERKLE_BUNDLE}\")\"\n  else\n    COSIGN_OK=0\n    set_sig cosign \"merkle_status=failed\"\n    warn \"cosign sign-blob over merkle-root.txt failed after retries\"\n  fi", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 387, "howItWorks": "To krok 3a pieczętowania dowodów. merkle-root.txt zawiera korzeń drzewa Merkle (RFC-6962) liczony nad hashami WSZYSTKICH artefaktów. cosign_sign_retry wykonuje 'cosign sign-blob --yes --bundle' nad tym korzeniem — to podpis keyless: tożsamość bierze się z OIDC (Fulcio), a fakt podpisania trafia do publicznego, niezmiennego dziennika Rekor. Wynik (bundle) zapisuje się do merkle-root.cosign.bundle, a status 'signed' do manifestu. Później (linia 448) brak/pusty bundle w trybie CI jest TWARDYM błędem (fail-closed).", "whyItWorks": "Podpisanie samego korzenia Merkle wystarczy, by kryptograficznie zabezpieczyć cały pakiet — korzeń commituje do treści każdego artefaktu, więc jedna sygnatura chroni wszystko (oszczędność i spójność). Keyless cosign + Rekor eliminują problem przechowywania klucza prywatnego i dają publiczny, audytowalny ślad 'kto i kiedy podpisał'. Fail-closed na brak bundle to lekcja z realnego buga §6.2-A, gdzie cosign cicho się degradował, a seal i tak kończył 0 — teraz centralny podpis jest obowiązkowy. To odpowiada poziomowi SLSA Build L2 (cel L3 jeszcze nieosiągnięty)."}, {"id": "cac-overview", "title": "Compliance-as-code: dziesięć kontroli A.1–A.10, które sprawdza maszyna", "plain": "Compliance-as-code znaczy: zamiast audytora ręcznie odhaczającego listę, kod automatycznie sprawdza, czy dokumenty zgodności istnieją, są kompletne i świeże. CyberForge ma dziesięć takich kontroli organizacyjnych A.1–A.10. Każda jest 'BLOCKING' (blokuje pakiet, jeśli nie przejdzie) albo 'EVIDENCE-ONLY' (tylko notuje stan). Agregator zbiera wszystkie werdykty do jednego podpisanego pliku-nagłówka.", "analogy": "To jak automatyczna kontrola na lotnisku, która sama sprawdza, czy masz wszystkie wymagane dokumenty w teczce — paszport ważny, wiza obecna, bilet aktualny — zamiast urzędnika wertującego je ręcznie.", "why": "Maszyna nie zapomni i nie da się przekupić 'ładnym PDF-em' — sprawdza schemat, daty i kompletność za każdym razem tak samo. To pozwala mówić 'zielono' tylko wtedy, gdy NAPRAWDĘ jest zielono (zasada projektu: claims == reality).", "inRepo": "Werdykty A.1–A.10 są zdefiniowane w scripts/aggregate-compliance.py (linie ~159-238) i zapisane do Pipeline/docs/governance/compliance-status.json. Aktualnie: 7× PASS, 1× FAIL (A.10), 1× INDETERMINATE (A.9, kontrola deploy-time), 1× evidence-only. overall_status = FAIL właśnie z powodu A.10.", "refs": ["Pipeline/scripts/aggregate-compliance.py", "Pipeline/docs/governance/compliance-status.json"], "codeExcerpt": "def _compute_overall(\n    rows: list[Row], missing_required: list[str], matrix_blocking: int,\n) -> str:\n    \"\"\"Overall verdict by BLOCKING tier only (EVIDENCE-ONLY never trips the gate).\n\n    FAIL          -> any required verdict missing, any BLOCKING row FAIL, or the\n                     content matrix reports blocking_failures > 0.\n    INDETERMINATE -> no outright FAIL, but a BLOCKING row could not be measured.\n    PASS          -> otherwise.\n    \"\"\"\n    if missing_required:\n        return FAIL\n    if matrix_blocking > 0:\n        return FAIL\n    blocking_fail = any(r.tier == BLOCKING and r.status == FAIL for r in rows)\n    if blocking_fail:\n        return FAIL\n    blocking_indet = any(r.tier == BLOCKING and r.status == INDETERMINATE for r in rows)\n    if blocking_indet:\n        return INDETERMINATE\n    return PASS", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 683, "howItWorks": "To serce compliance-as-code: agregator zbiera werdykty wszystkich kontroli (A.1-A.10 + Part C/D) i wylicza jeden status nadrzędny. Funkcja _compute_overall patrzy WYŁĄCZNIE na tier BLOCKING: jeśli brakuje wymaganego werdyktu (missing_required) albo content-matrix zgłasza blockery → FAIL; jeśli którykolwiek wiersz BLOCKING ma status FAIL → FAIL; jeśli BLOCKING jest tylko 'nie do zmierzenia' → INDETERMINATE; w przeciwnym razie PASS. Werdykty EVIDENCE-ONLY nigdy nie ruszają bramki. Wynik trafia do podpisanego compliance-status.json.", "whyItWorks": "Zamiast audytora ręcznie odhaczającego listę, maszyna deterministycznie liczy PASS/FAIL z faktycznych artefaktów — i to fail-closed: brakujący werdykt to FAIL ('nie zdasz kontroli, której nigdy nie zmierzyłeś'), a nie cichy pas. Oddzielenie tier BLOCKING od EVIDENCE-ONLY jest kluczowe: blokuje pakiet tylko to, co naprawdę musi blokować, a reszta jest notowana bez fałszywych alarmów. Dlatego jeden FAIL w A.10 potrafi ustawić overall_status = FAIL całego pakietu."}, {"id": "cac-a1-a4", "title": "A.1–A.4: rejestr dostawców, umowy DPA, RoPA i rejestr incydentów", "plain": "A.1 Rejestr Informacji (DORA art. 28(3)) — spis wszystkich dostawców usług IT z ich numerami LEI. A.2 Świeżość umów DPA (RODO art. 28) — czy umowy powierzenia danych z dostawcami nie są przeterminowane (limit 92 dni od aktualizacji). A.3 Kompletność RoPA/DPIA (RODO art. 30/35) — czy rejestr czynności przetwarzania jest pełny. A.4 Rejestr incydentów IT (DORA art. 17 / NIS2 23) — czy każdy incydent ma klasyfikację i cztery pola 'zegarów raportowania'.", "analogy": "To cztery segregatory, które audytor otwiera najpierw: lista podwykonawców (A.1), podpisane umowy z nimi (A.2), spis 'jakie dane przetwarzamy' (A.3) i dziennik awarii z datami zgłoszeń (A.4).", "why": "To 'część, którą audytorzy sprawdzają jako pierwszą, a firmy najczęściej ją pomijają' — bo skupiają się na technologii, a zapominają o papierach zarządczych.", "inRepo": "Wszystkie cztery PASS (BLOCKING). A.1: 10 dostawców, 2/2 z poprawnym formatem LEI; LEI własnej firmy jest PENDING (CyberForge nie ma jeszcze wydanego LEI) — to uczciwie EVIDENCE-ONLY, nie blokuje. A.3: 3 czynności przetwarzania, DPIA 'not-required'. Źródła: roi-validation.json, dpa-compliance-check.json, ropa-completeness.json, incident-readiness.json. Zob. compliance-status.json oraz scripts/check-dpa.sh.", "refs": ["Pipeline/docs/governance/compliance-status.json", "Pipeline/scripts/check-dpa.sh", "Pipeline/docs/governance/ropa.yaml"], "codeExcerpt": "    Control(\n        id=\"A.1\", task=\"T-20\", label=\"Register of Information (DORA Art.28(3))\",\n        out_name=\"roi-validation.json\",\n        argv_template=[\n            \"{py}\", \"{validators}/validate-roi.py\",\n            \"{governance}/register-of-information.yaml\", \"{schemas}/roi.schema.json\",\n            \"--out\", \"{out}\",\n        ],\n        remediation=\"Fix RoI schema/LEI violations in docs/governance/register-of-information.yaml.\",\n    ),\n    Control(\n        id=\"A.2\", task=\"T-21\", label=\"Processor DPA freshness (RODO Art.28)\",\n        out_name=\"dpa-compliance-check.json\",\n        argv_template=[\"{bash}\", \"{scripts}/check-dpa.sh\"],\n        remediation=\"Re-review docs/governance/vendor-risk-register.md; update 'Last Reviewed:' (<=92d cadence).\",\n    ),\n    Control(\n        id=\"A.3\", task=\"T-22\", label=\"RoPA / DPIA completeness (RODO Art.30/35)\",\n        out_name=\"ropa-completeness.json\",\n        argv_template=[\n            \"{py}\", \"{validators}/validate-ropa.py\",\n            \"{governance}/ropa.yaml\", \"{schemas}/ropa.schema.json\", \"--out\", \"{out}\",\n        ],\n        remediation=\"Complete the per-activity RoPA in docs/governance/ropa.yaml; record DPIA determination.\",\n    ),", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 158, "howItWorks": "To deklaratywne definicje pierwszych kontroli. A.1 (Rejestr Informacji, DORA 28(3)) uruchamia validate-roi.py nad register-of-information.yaml i schematem roi.schema.json. A.2 (świeżość DPA, RODO 28) deleguje do check-dpa.sh, który czyta rejestr dostawców i sprawdza datę 'Last Reviewed:' (<=92 dni). A.3 (kompletność RoPA/DPIA, RODO 30/35) waliduje ropa.yaml względem schematu. Każdy Control ma id, task, label z artykułem, plik wynikowy (out_name) i podpowiedź naprawczą (remediation), którą agregator pokaże przy FAIL.", "whyItWorks": "Trzymanie kontroli jako danych (lista obiektów Control), a nie rozsianego kodu, sprawia, że każda kontrola ma jawny artykuł prawny, swój walidator i gotową poradę naprawczą — to czyni compliance-as-code czytelnym i rozszerzalnym. Każda kontrola czyta PRAWDZIWY plik governance (np. ropa.yaml, register-of-information.yaml), więc werdykt odzwierciedla faktyczny stan, a nie hardkod. W realnym przebiegu A.1-A.4 wychodzą PASS, bo te dokumenty są kompletne i świeże (DPA odświeżone 1 dzień temu, 3 czynności RoPA, DPIA 'not-required')."}, {"id": "cac-a5-a6-a7", "title": "A.5–A.7: retencja, zarząd i klauzule dostawców", "plain": "A.5 Retencja — czy konfiguracja przechowywania dowodów to co najmniej wymagane minimum (1825 dni = 5 lat). A.6 Zarządzanie (DORA art. 5) — czy zarząd zatwierdził środki bezpieczeństwa i odbył szkolenie, i czy te zapisy są świeże. A.7 Klauzule dostawców + przetestowane plany wyjścia (DORA 28-30) — czy krytyczni dostawcy mają w umowach prawa audytu i udokumentowany plan 'jak się od nich odpiąć'.", "analogy": "A.5 to jak wymóg trzymania paragonów przez 5 lat na wypadek kontroli skarbowej. A.7 to jak posiadanie planu awaryjnego, gdy dostawca prądu zbankrutuje — i przećwiczenie, że da się przełączyć na innego.", "why": "Polskie prawo wymaga konkretnych minimów retencji: AML 5 lat, księgi rachunkowe 5 lat, sprawozdania finansowe — bezterminowo, a ZUS/płace nawet 10-50 lat. Pipeline dowodzi tylko 'konfiguracja >= próg', NIE że próg jest prawnie poprawny — to musi potwierdzić prawnik.", "inRepo": "A.6 i A.7 są PASS (BLOCKING) w compliance-status.json. A.5 retencja jest enforce'owana w czasie deploy/plan przeciw planowi Terraform (1825 dni: infra/main.tf:42, policies/retention-policy.rego minimum_retention_days := 1825, egzekwowane przez scripts/tfplan-to-retention-input.py) — dlatego nie pojawia się jako osobny wiersz w agregacji evidence-pack. Tabela minimów: Pipeline/docs/poland-appendix.md sekcja 6.4.", "refs": ["Pipeline/docs/poland-appendix.md", "Pipeline/infra/main.tf", "Pipeline/policies/retention-policy.rego", "Pipeline/docs/governance/compliance-status.json"], "codeExcerpt": "minimum_retention_days := 1825 # 5 years (DORA)\n\n# Compliant when no deny fires: retention meets the DORA floor, WORM is enabled,\n# and no lifecycle delete would purge evidence before the immutability period\n# expires. An ABSENT lifecycle delete is fine — deletion is then governed solely\n# by the WORM / legal-hold window (the recommended posture; the storage module\n# leaves lifecycle delete off by default, T-105/T-52).\ncompliant if {\n\tcount(deny) == 0\n}", "codePath": "Pipeline/policies/retention-policy.rego", "codeLang": "text", "codeStart": 5, "howItWorks": "To reguła OPA/Rego dla A.5 (retencja). Stała minimum_retention_days := 1825 to twardy próg 5 lat (DORA). Wynik 'compliant' jest prawdą tylko, gdy NIE odpali żadne 'deny' — a deny odpala m.in. gdy retention_days < 1825 albo gdy WORM nie jest włączony. Reguła jest sprawdzana w czasie deploy/plan: scripts/tfplan-to-retention-input.py zamienia plan Terraform (infra/main.tf:42, 1825 dni) na input dla tej polityki, więc bramka egzekwuje minimum przeciw faktycznej konfiguracji infrastruktury.", "whyItWorks": "A.5 jest egzekwowana w czasie deploy, a nie w agregacji evidence-pack — dlatego nie pojawia się jako osobny wiersz w compliance-status.json (sąsiednie A.6 i A.7 są tam PASS jako BLOCKING). Sprawdzanie progu retencji przeciw realnemu planowi Terraform (a nie przeciw deklaracji w dokumencie) zapewnia, że dowody NAPRAWDĘ przetrwają wymagane 5 lat — to spełnia DORA art. 11-12 i RODO art. 5.1.e. Brak auto-delete jest dozwolony, bo wtedy o usunięciu decyduje okno WORM/legal-hold, co jest bezpieczniejsze niż reguła czyszcząca."}, {"id": "cac-a8-a9-a10", "title": "A.8–A.10: przeglądy dostępu, kryptografia i test odtworzenia (FAIL!)", "plain": "A.8 Przeglądy dostępu (NIS2 21(2)(i)/ISO 8.2) — czy regularnie sprawdzasz, kto ma dostęp do czego. A.9 Kryptografia vs IaC (NIS2 21(2)(h)/RODO 32) — czy infrastruktura faktycznie szyfruje dane. A.10 Test odtworzenia (DORA art. 11-12) — czy NAPRAWDĘ przeprowadzono próbę odzyskania danych z backupu (nie tylko 'mamy backup', ale 'sprawdziliśmy, że odtworzenie działa').", "analogy": "A.10 to różnica między 'mam gaśnicę na ścianie' a 'sprawdziłem, że gaśnica naprawdę gasi' — audytorzy DORA chcą dowodu, że odzyskiwanie DZIAŁA, z dotrzymanymi czasami RTO/RPO.", "why": "Backup bez testu odtworzenia to jeden z głównych powodów odrzucenia pakietu dowodowego — bo backup, którego nigdy nie przywrócono, może być uszkodzony i nikt o tym nie wie aż do katastrofy.", "inRepo": "UCZCIWY STAN: A.10 to FAIL (BLOCKING) i tak ma być — 'no restore drill logged (bcdr-plan.md: Not yet conducted)'. To właśnie A.10 ustawia overall_status = FAIL w całym pakiecie. A.8 PASS (7 przeglądów w cyklu). A.9 INDETERMINATE — to kontrola deploy-time (potrzebuje planu Terraform, nie działa w kontekście próbki). Osobno test penetracyjny (C.9) też uczciwie FAIL — status 'not-conducted'. Zob. compliance-status.json A.10, docs/governance/pentest-report.yaml, scripts/validators/check-restore-test.py.", "refs": ["Pipeline/docs/governance/compliance-status.json", "Pipeline/scripts/validators/check-restore-test.py", "Pipeline/docs/governance/pentest-report.yaml", "Pipeline/scripts/aggregate-compliance.py"], "codeExcerpt": "    if not qualifying:\n        if not tests:\n            why = \"no restore drill logged (bcdr-plan.md S.6.1: 'Not yet conducted')\"\n        else:\n            why = \"no successful, in-window, RTO-met restore: \" + \"; \".join(rejections)\n        return lc.envelope(\n            lc.Status.FAIL,\n            lc.Tier.BLOCKING,\n            measured={\n                \"last_successful_test_date\": None,\n                \"successful_in_window\": 0,\n                \"total_logged\": len(tests),\n                \"rejections\": rejections,\n            },\n            threshold=threshold,\n            detail=f\"FAIL: {why}\",\n            validator=VALIDATOR_NAME,\n        )", "codePath": "Pipeline/scripts/validators/check-restore-test.py", "codeLang": "python", "codeStart": 244, "howItWorks": "To walidator A.10 (test odtworzenia, DORA art. 11-12). Sprawdza log restore-test-log.yaml i przepuszcza tylko wpisy, które są (a) outcome=success, (b) w oknie czasowym (<=365 dni) i (c) z rto_actual<=rto_target. Jeśli lista 'qualifying' jest pusta, zwraca envelope o statusie FAIL i tier BLOCKING — gdy log jest pusty, komunikat brzmi wprost 'no restore drill logged (bcdr-plan.md S.6.1: Not yet conducted)'. Pole measured.last_successful_test_date=None pokazuje, że NIC nie zdano. Ten FAIL trafia do compliance-status.json jako A.10 i ustawia overall_status = FAIL.", "whyItWorks": "DORA wymaga dowodu, że odtworzenie z backupu NAPRAWDĘ działa, a nie tylko że backup istnieje — 'backupy bez testu odtworzenia' to nazwany trigger odrzucenia audytu (spec §8 #3). Nie ma tu skrótu file-presence ani auto-PASS z harmonogramu: dopóki realnej próby nie zalogowano, kontrola UCZCIWIE świeci na czerwono z konkretnym powodem. To celowy honest-FAIL — tak samo jak C.9 (test penetracyjny) z pentest-report.yaml status:not-conducted. A.8 (przeglądy dostępu) jest PASS, a A.9 (krypto vs IaC) INDETERMINATE, bo to kontrola deploy-time wymagająca planu Terraform."}, {"id": "polska", "title": "Akcent Polska: KNF, UODO, język i rezydencja danych", "plain": "Jeśli sprzedajesz polskim firmom, regulacje UE mają polskie 'nakładki'. Najpierw trzeba ustalić REŻIM: czy jesteś podmiotem finansowym pod DORA (nadzór KNF) czy podmiotem pod NIS2/KSC — bo jeden może wyłączać drugi. Dowody dla KNF/UODO/polskiego audytora muszą być po polsku (lub z tłumaczeniem przysięgłym). Dane powinny mieć udokumentowaną lokalizację (rezydencję) i podstawę legalnego transferu.", "analogy": "To jak budowa domu według unijnych norm, ale z polskimi przepisami budowlanymi na wierzchu i dokumentacją po polsku dla polskiego inspektora nadzoru.", "why": "Można mieć technicznie świetny pipeline i polec na audycie, bo dowody są po angielsku, region chmury nie jest udokumentowany, albo nie ustalono, czy w ogóle podlega się DORA. Te decyzje są PRAWNE — pipeline ich nie podejmie.", "inRepo": "Załącznik Polska oznacza takie pozycje jako '⚠️ confirm' (do potwierdzenia przez prawnika przed podpisem): wybór reżimu (sekcja 6.1), Rekomendacja D i komunikat chmurowy KNF (6.2), RoPA/DPIA i zegar 72h do UODO (6.3), język/rezydencja/retencja (6.4). Przykładowy region to 'polandcentral' (SETUP.md). Zob. Pipeline/docs/poland-appendix.md (cały) i checklistę 'confirm-before-signoff' na końcu.", "refs": ["Pipeline/docs/poland-appendix.md", "Pipeline/docs/poland-residency-summary.pl.md"], "codeExcerpt": "- **DORA-covered financial entity?** → **KNF** is competent authority. Polish\n  operational act: **Dz.U. 2025 poz. 1069** (in force **7 Aug 2025**). DORA is\n  *lex specialis* — such entities are **carved out of much of the KSC Act**.\n  Report via **KNF System Sprawozdawczości DORA** (`crp.knf.gov.pl`); **LEI\n  mandatory**. ⚠️ confirm entity is in DORA scope (Art. 2) and the reporting\n  channel is live for the entity type.\n- **NIS2 entity?** → Polish **KSC amendment, Dz.U. 2026 poz. 252, in force\n  3 April 2026.** Classify **podmiot kluczowy vs ważny**; **register in the\n  *wykaz* by ~3 Oct 2026** (System S46 / `wykaz-ksc.gov.pl`); full technical\n  compliance ~3 Apr 2027; penalties enforceable ~Apr 2028. Report incidents to\n  the competent **CSIRT** (NASK default; GOV/MON for state/defence; sectoral\n  CSIRT under KNF for finance once live). ⚠️ confirm classification\n  (kluczowy/ważny) and the applicable transition deadlines for the entity.\n- **Both can apply to one group** — apply the higher obligation and **document\n  the boundary** explicitly (do not let one regime's carve-out hide the other's\n  duties). ⚠️ confirm boundary memo authored.", "codePath": "Pipeline/docs/poland-appendix.md", "codeLang": "text", "codeStart": 29, "howItWorks": "Załącznik Polska §6.1 prowadzi przez ustalenie REŻIMU. Jeśli jesteś podmiotem finansowym pod DORA → organem nadzoru jest KNF (akt operacyjny Dz.U. 2025 poz. 1069), DORA działa jako lex specialis i wyłącza cię z dużej części ustawy KSC; raportujesz przez System Sprawozdawczości DORA, LEI jest obowiązkowy. Jeśli pod NIS2 → polska nowela KSC (Dz.U. 2026 poz. 252), trzeba sklasyfikować się jako podmiot kluczowy/ważny, zarejestrować w wykazie i zgłaszać incydenty do właściwego CSIRT. Każdy punkt ma znacznik '⚠️ confirm' — to legalna determinacja, której pipeline nie zrobi sam.", "whyItWorks": "Sprzedając polskim firmom, najpierw trzeba ustalić reżim, bo jeden (DORA) potrafi wyłączyć drugi (KSC) — pomyłka tutaj wywraca cały plan dowodowy. Znaczniki '⚠️ confirm' uczciwie oddzielają to, co pipeline może udowodnić (konfiguracja spełnia próg), od decyzji prawnej, którą musi podjąć prawnik przed podpisem. Konkretne sygnatury Dz.U., daty wejścia w życie i okna przejściowe (rejestracja do ~3 paź 2026, pełna zgodność ~3 kwi 2027) chronią też przed triggerem odrzucenia 'użycie złego terminu' — karaniem za obowiązek, którego okno jeszcze się nie zamknęło."}, {"id": "uczciwosc", "title": "Najważniejsza zasada: dowody mówią prawdę (claims == reality)", "plain": "Pipeline jest celowo zbudowany tak, żeby NIE udawać zgodności. Tam gdzie czegoś nie ma — kontrola świeci na czerwono i mówi dlaczego. Tam gdzie pipeline dostarcza tylko techniczny kawałek — mapowanie jasno pisze 'reszta to zadanie organizacyjne (Phase F)'. Tam gdzie coś jest dopiero planowane — pisze 'TARGET-STATE', a nie 'zrobione'.", "analogy": "To jak uczciwy mechanik, który mówi 'wymieniłem klocki, ale tarcze trzeba będzie za miesiąc' — zamiast wziąć pieniądze i odhaczyć cały przegląd jako zrobiony.", "why": "Audytorzy odrzucają pakiety, w których 'wszystko jest na zielono' bez dowodów — bo to wygląda na ściemę. Paradoksalnie, uczciwe FAIL-e (A.10 restore-test, C.9 pentest) i jawne luki (SLSA L2 zamiast L3, RFC-3161 zamiast QTS) czynią CAŁY pakiet bardziej wiarygodnym.", "inRepo": "Sam matrix mówi to wprost: 'Not a claim of full DORA/NIS2/ISO/SOC2/GDPR compliance by itself' i podaje zalecany język ('compliance-enabling pipeline... readiness') oraz czego unikać ('this pipeline alone makes you DORA compliant'). Zob. Pipeline/docs/compliance-matrix.md sekcje 1.2, 9, 11; evidence-pack-specification.md sekcja 8 (rejection triggers).", "refs": ["Pipeline/docs/compliance-matrix.md", "evidence-pack-specification.md"], "codeExcerpt": "**Top reasons an Evidence Pack gets rejected:**\n\n1. **Evidence assembled for the audit**, not produced by the pipeline (no signatures, no timestamps, suspiciously uniform dates).\n2. **ISO 27001 certificate offered as proof of NIS2/DORA compliance.** It's *supporting* evidence only — it does **not** attest Art 20/Art 5 management approval, the fixed 24h/72h/1-month reporting clocks, registration duties, or the CIR-2024/2690 incident thresholds. State this explicitly and bridge the delta.\n3. **Backups without a restore test.** Auditors want proof recovery *works*, with RTO/RPO met.\n4. **Policies in \"audit-only\" mode forever** — guardrails that warn but never block. Show enforcement (blocked deploys).\n5. **Unbounded risk acceptances** — no approver, no expiry.\n6. **Register of Information incomplete / stale / missing LEIs** (DORA); supplier list with no contractual evidence.\n7. **Incident classification that doesn't map to the legal thresholds**, so the clock can't be proven met.", "codePath": "evidence-pack-specification.md", "codeLang": "text", "codeStart": 271, "howItWorks": "To sekcja §8 specyfikacji: jawna lista 'za co audytor odrzuca pakiet'. Pkt 1: dowody złożone POD audyt, nie wyprodukowane przez pipeline (brak podpisów/znaczników, podejrzanie jednakowe daty). Pkt 3: backupy bez testu odtworzenia. Pkt 4: polityki na zawsze w trybie 'tylko ostrzegaj' zamiast blokować. Pkt 5: nieograniczone akceptacje ryzyka bez zatwierdzającego i terminu. Każdy z tych anty-wzorców ma w pipeline odpowiednik egzekwowany kodem (podpisy keyless, A.10 restore-test FAIL, bramki fail-closed, agregator BLOCKING).", "whyItWorks": "Najważniejsza zasada to claims == reality: pipeline jest celowo zbudowany, by NIE udawać zgodności. Ta lista jest 'specyfikacją odwrotną' — opisuje dokładnie to, czego pipeline unika: dlatego podpisuje korzeń Merkle (anty-pkt 1), uczciwie FAIL-uje A.10 bez restore testu (anty-pkt 3), używa bramek fail-closed zamiast warn-only (anty-pkt 4) i klasyfikuje incydenty pod progi prawne (anty-pkt 7). Sama matryca dodaje wprost, że to 'nie jest deklaracja pełnej zgodności DORA/NIS2/ISO/SOC2/RODO', co domyka uczciwy język ofertowy."}]}, {"area": "7 · Mapa plików — co jest czym w repozytorium", "intro": "Repozytorium (czyli folder z całym projektem) wygląda na początku jak labirynt. Ale każdy katalog ma jedno zadanie. W tym rozdziale przejdziemy przez nie po kolei jak po pokojach w domu: gdzie mieszka \"przepis\" na taśmę produkcyjną, gdzie skrypty, które generują i pieczętują dowody, gdzie reguły, gdzie dokumenty zarządcze, a gdzie gotowa próbka do pokazania klientowi. Wszystko opiszemy tak, jak NAPRAWDĘ wygląda w tym repo (to zasada projektu: \"claims == reality\" — twierdzenia muszą zgadzać się z rzeczywistością).", "blocks": [{"id": "7-0-orientacja", "title": "Skąd patrzymy: korzeń repo i folder Pipeline/", "plain": "Cały projekt to jeden folder (repozytorium). W jego środku jest podfolder Pipeline/ — to tam mieszka cała taśma produkcyjna DevSecOps. Wewnątrz Pipeline/ znajdują się wszystkie katalogi, które opiszemy: app, infra, scripts, policies, schemas, docs i inne. README.md w Pipeline/ to taka tabliczka informacyjna przy wejściu — w jednym miejscu streszcza, co gdzie leży.", "analogy": "To jak wejście do biurowca. Recepcja (README) mówi: 'magazyn na -1, produkcja na parterze, dokumenty w archiwum na 3. piętrze'. Najpierw czytasz tabliczkę, dopiero potem chodzisz po piętrach.", "why": "Zanim zaczniesz cokolwiek otwierać, warto wiedzieć, że istnieje jedna mapa-streszczenie. README.md w Pipeline/ ma gotową tabelkę 'Repository layout' (linie 57-66), która dokładnie odpowiada temu, co tu opisujemy.", "inRepo": "Pipeline/README.md zawiera sekcję 'Repository layout' (Pipeline/README.md:57) z tabelką: app/, .github/workflows/, infra/, policies/, scripts/, docs/. SETUP.md obok to instrukcja rozruchu (połączenie z GitHubem i Azure).", "refs": ["Pipeline/README.md", "Pipeline/SETUP.md"], "codeExcerpt": "## Repository layout\n\n| Path | Contents |\n|---|---|\n| `app/` | Node.js + TypeScript + Express demo application and `Dockerfile` |\n| `.github/workflows/` | The six reusable pipeline workflows + orchestrator |\n| `infra/` | Terraform for Azure (ACR, Container Apps, Key Vault, WORM storage, monitoring) |\n| `policies/` | OPA/Rego compliance policies |\n| `scripts/` | Evidence-pack generation, manifest/Merkle, OSCAL, and PDF tooling |\n| `docs/` | Compliance matrix, governance/ISMS documentation, and runbooks |", "codePath": "Pipeline/README.md", "codeLang": "text", "codeStart": 57, "howItWorks": "To zwykla tabelka w Markdown (format prostego tekstu z nagłówkami i tabelami). Lewa kolumna to ścieżka katalogu, prawa to jednozdaniowy opis, co tam leży. Sekcja zaczyna się nagłówkiem '## Repository layout' w linii 57. Każdy wiersz '| ... | ... |' to jeden katalog: app/ (aplikacja demo), .github/workflows/ (przepisy CI), infra/ (Terraform/Azure), policies/ (reguły OPA), scripts/ (skrypty dowodowe), docs/ (dokumenty zgodności i zarządcze).", "whyItWorks": "Jedno miejsce-mapa eliminuje zgadywanie. Zamiast przeszukiwać cały projekt, czytelnik dostaje gotowy spis treści, który 1:1 odpowiada realnym folderom. To realizuje zasadę 'najpierw tabliczka, potem piętra' — obniża próg wejścia i sprawia, że struktura jest samodokumentująca, a opis w przewodniku da się skonfrontować z faktycznym układem repo."}, {"id": "7-1-workflows", "title": ".github/workflows/ — przepisy taśmy CI (pliki YAML)", "plain": "To katalog z 'przepisami' dla GitHub Actions — automatu, który uruchamia się sam przy każdej zmianie kodu. Każdy plik .yml opisuje krok po kroku, co ma się zadziać: co zeskanować, co zbudować, co podpisać. YAML to prosty format tekstowy, w którym wcięcia (spacje) oznaczają zagnieżdżenie — czyta się go jak listę zadań z podpunktami, bez nawiasów i średników.", "analogy": "YAML to jak przepis kulinarny zapisany punktami: 'składniki:', a pod spodem wcięte 'mąka, jajka, mleko'. Wcięcie mówi, że coś należy do czegoś wyżej. GitHub Actions to kuchnia, która wykonuje ten przepis automatycznie, gdy tylko dostarczysz nowe składniki (nowy kod).", "why": "Bez tych plików nic nie dzieje się automatycznie — to one sprawiają, że bezpieczeństwo i dowody powstają same przy każdym wydaniu, a nie 'kiedyś, ręcznie, jak ktoś pamięta'. To serce całego pomysłu na powtarzalność.", "inRepo": "Najważniejsze: pipeline.yml — dyrygent, który spina wszystkie fazy i decyduje, kiedy się uruchamiają (Pipeline/.github/workflows/pipeline.yml); build-and-scan.yml — budowa obrazu, skanowanie zależności, testy z bramką 80% pokrycia; sign-and-attest.yml — podpisywanie obrazu (Cosign) i dołączanie dowodów pochodzenia; evidence-pack.yml — najobszerniejszy plik (ok. 99 KB), który składa całą paczkę dowodową. Plik pipeline.yml deklaruje na górze m.in. wyzwalacze (on: pull_request / push do main) i uprawnienia (permissions:).", "refs": ["Pipeline/.github/workflows/pipeline.yml", "Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/.github/workflows/sign-and-attest.yml", "Pipeline/.github/workflows/evidence-pack.yml", "Pipeline/.github/workflows/deploy.yml", "Pipeline/.github/workflows/dast.yml", "Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "on:\n  pull_request:\n    branches: [main]\n  push:\n    branches: [main]\n  workflow_dispatch:\n    inputs:\n      deploy_environment:\n        description: \"Target environment\"\n        required: true\n        type: choice\n        options:\n          - staging\n          - production\n\npermissions:\n  contents: read\n  actions: read\n  pull-requests: read\n  security-events: write\n  id-token: write\n  packages: write\n  attestations: write\n  issues: write", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 3, "howItWorks": "Blok 'on:' to wyzwalacze — mówi automatowi, KIEDY uruchomić taśmę: przy każdym pull requeście do gałęzi main, przy push do main, oraz ręcznie (workflow_dispatch) z wyborem środowiska staging/production. Wcięcia (spacje) tworzą zagnieżdżenie: 'branches: [main]' należy do 'pull_request', które należy do 'on'. Blok 'permissions:' przydziela uprawnienia minimalne: większość to 'read', a zapisy ('write') tylko tam, gdzie konieczne — 'id-token: write' włącza logowanie OIDC do chmury bez stałych haseł, 'attestations/packages: write' pozwala publikować obraz i dowody.", "whyItWorks": "Deklaratywne wyzwalacze sprawiają, że bezpieczeństwo i dowody powstają SAME przy każdej zmianie, a nie 'ręcznie, jak ktoś pamięta' — to fundament powtarzalności. Wąsko przyznane 'permissions' to zasada najmniejszych uprawnień: nawet jeśli krok zostanie przejęty, nie ma więcej praw, niż naprawdę potrzebuje. 'id-token: write' to nowoczesny, bezpieczny wzorzec — chmura ufa tożsamości przebiegu zamiast długowiecznym sekretom, których można by ukraść."}, {"id": "7-2-scripts", "title": "scripts/ — skrypty, które generują i pieczętują dowody (bash + Python)", "plain": "Tu mieszkają 'ręce robotnika' taśmy: gotowe programiki, które workflowy wywołują, żeby coś policzyć, wygenerować albo zapieczętować. Część jest w bashu (.sh) — to język poleceń terminala, taki sam, jaki wpisujesz w czarne okienko konsoli. Część jest w Pythonie (.py) — czytelny język programowania do bardziej skomplikowanej logiki, np. analizy dokumentów i liczenia podsumowań.", "analogy": "Workflow (YAML) to przepis, a skrypty to konkretne narzędzia w szufladzie: jeden miesza, drugi piecze, trzeci pakuje. Przepis tylko mówi 'teraz użyj miksera' — sam mikser to skrypt.", "why": "To w skryptach dzieje się prawdziwa praca: zbieranie artefaktów, liczenie sum kontrolnych, podpisywanie. Dzięki temu, że są osobnymi plikami, można je też uruchomić u siebie na komputerze i sprawdzić ręcznie, że robią to, co deklarują.", "inRepo": "seal-evidence.sh (Pipeline/scripts/seal-evidence.sh) — pieczętuje paczkę: normalizuje PDF, sprawdza zgodność z PDF/A-3b, robi keyless podpis Cosign nad sumami i znacznik czasu RFC-3161; jego nagłówek (linie 1-30) wprost opisuje 6 kroków i tzw. kontrakt degradacji (lokalnie brak narzędzia = 'unavailable' i idziemy dalej, w CI brak = twardy błąd). generate-compliance-matrix.sh (ok. 31 KB) buduje macierz zgodności framework→kontrola→dowód. Inne ważne: verify-evidence-pack.sh (sprawdza gotową paczkę), generate-evidence-manifest.py (lista artefaktów + sumy), build-audit-document.py (składa raport audytowy).", "refs": ["Pipeline/scripts/seal-evidence.sh", "Pipeline/scripts/generate-compliance-matrix.sh", "Pipeline/scripts/verify-evidence-pack.sh", "Pipeline/scripts/generate-evidence-manifest.py", "Pipeline/scripts/build-audit-document.py"], "codeExcerpt": "# Steps (each tolerant of a missing tool, recording outcome into the manifest's\n# signatures{} object via a python3 helper — never sed JSON):\n#   1. qpdf --linearize --deterministic-id   (normalize the PDF, if qpdf present)\n#   2. verapdf --flavour 3b --format json     (PDF/A-3b conformance gate)\n#   3. cosign sign-blob --yes --bundle        (keyless, over manifest AND pdf-sha256)\n#   4. openssl ts                             (RFC-3161 over merkle_root, manifest, pdf)\n#   5. pyhanko sign addsig                    (PAdES self-seal, honest fallback label)\n#   6. write tooling versions + signatures{} back into manifest.json\n#\n# Degradation contract:\n#   * EVIDENCE_ALLOW_DEGRADE=1 (local): any missing tool -> record \"unavailable\"\n#     provenance flag in the manifest and continue; the script always exits 0\n#     for missing-tool conditions.\n#   * EVIDENCE_ALLOW_DEGRADE unset (CI): missing render output / verapdf failure\n#     / cosign failure are HARD FAILS. A *transient* RFC-3161 TSA miss on a single", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 7, "howItWorks": "To nagłówek-komentarz skryptu w bashu, który dokładnie opisuje 6 kroków pieczętowania paczki dowodowej: (1) qpdf normalizuje PDF, (2) verapdf sprawdza zgodność z formatem archiwalnym PDF/A-3b, (3) cosign robi keyless podpis nad sumami manifestu i PDF, (4) openssl ts dokłada znacznik czasu RFC-3161, (5) pyhanko self-podpisuje PDF, (6) zapis wersji narzędzi i wyników do manifest.json. 'Kontrakt degradacji' określa dwa tryby: lokalnie (EVIDENCE_ALLOW_DEGRADE=1) brak narzędzia zapisuje flagę 'unavailable' i skrypt kończy się sukcesem; w CI (zmienna nieustawiona) brak renderu/verapdf/cosign to TWARDY błąd.", "whyItWorks": "Rozdzielenie trybu lokalnego i CI to klucz do uczciwości: programista u siebie nie ma sigstore/TSA, więc tolerancja na brak narzędzi pozwala 'przećwiczyć' przebieg bez kłamania (flaga 'unavailable' jawnie mówi, czego zabrakło). Ale w CI te same braki = twardy błąd, więc PRODUKCYJNA paczka nigdy nie zostanie zapieczętowana z brakującym podpisem. Zapis wyniku przez pythonowy helper 'never sed JSON' chroni przed cichym uszkodzeniem JSON-a. To realizacja zasady, że dowód musi być prawdziwy, a degradacja — jawna."}, {"id": "7-3-validators", "title": "scripts/validators/ — walidatory, czyli sprawdzacze treści", "plain": "To podfolder skryptów (w Pythonie), których jedyne zadanie to OCENIAĆ: czy dany dokument/dowód spełnia regułę, czy nie. Każdy walidator bierze konkretny plik (np. mapę zasobów), sprawdza zestaw warunków i wydaje werdykt PASS / FAIL / INDETERMINATE (zaliczone / oblane / niedające się zmierzyć). Kluczowa zasada: walidator może co najwyżej OBLAĆ z niepewności — nigdy nie wystawi fałszywego 'zaliczone'.", "analogy": "To jak egzaminator na prawo jazdy z listą kontrolną: 'zapięte pasy? lusterka ustawione? hamulec działa?'. Jeśli czegoś nie da się sprawdzić, egzaminator nie zalicza 'na wszelki wypadek' — wpisuje 'niesprawdzone', co liczy się jak brak, a nie jak sukces.", "why": "To dzięki nim 'zielone światło' coś znaczy. Walidatory pilnują, że dowód jest prawdziwy i kompletny, a nie tylko obecny jako pusty plik. To one realizują zasadę 'claims == reality'.", "inRepo": "check_asset_map.py (Pipeline/scripts/validators/check_asset_map.py) sprawdza mapę zasobów DORA Art.8 — jego nagłówek wymienia 5 reguł blokujących (np. każda krytyczna funkcja musi mieć ≥1 wspierający zasób, każdy zasób musi mieć właściciela i poziom krytyczności). check-restore-test.py i check_pentest.py to przykłady, gdzie werdykt może być uczciwym FAIL, dopóki nie ma realnego dowodu (test odtworzenia z kopii, pentest). libcompliance.py (ok. 23 KB) to wspólna biblioteka pomocnicza dla pozostałych walidatorów.", "refs": ["Pipeline/scripts/validators/check_asset_map.py", "Pipeline/scripts/validators/check-restore-test.py", "Pipeline/scripts/validators/check_pentest.py", "Pipeline/scripts/validators/libcompliance.py"], "codeExcerpt": "    1. Does the map validate against schemas/asset-map.schema.json?           (schema)\n    2. Does every critical_function map to >= 1 supporting asset?         (completeness)\n    3. Does every referenced supporting-asset id resolve to a real asset? (referential)\n    4. Does every asset carry a non-empty owner AND a criticality?        (completeness)\n    5. Does every HIGH-criticality function carry a non-empty rto AND rpo?(completeness)\n\nAll five are BLOCKING and false-positive-safe: a violation can only make us\nFAIL/INDETERMINATE, never wrongly PASS.", "codePath": "Pipeline/scripts/validators/check_asset_map.py", "codeLang": "python", "codeStart": 11, "howItWorks": "To fragment docstringa (opisu) walidatora w Pythonie. Wymienia 5 reguł, które check_asset_map.py sprawdza nad plikiem docs/governance/asset-map.yaml: (1) zgodność ze schematem JSON, (2) każda funkcja krytyczna ma >=1 wspierający zasób, (3) każde odwołanie do zasobu wskazuje istniejący zasób, (4) każdy zasób ma niepusty owner i poziom krytyczności, (5) każda funkcja HIGH ma RTO i RPO. Kluczowe zdanie: wszystkie reguły są BLOCKING i 'false-positive-safe' — naruszenie może dać tylko FAIL/INDETERMINATE, nigdy błędnego PASS.", "whyItWorks": "Zasada 'false-positive-safe' to serce uczciwości: walidator z niepewności może co najwyżej OBLAĆ, nigdy nie wystawi fałszywego 'zaliczone' (jak egzaminator wpisujący 'niesprawdzone' zamiast zaliczenia na wszelki wypadek). Dzięki temu zielone światło coś znaczy — oznacza realnie kompletną mapę zasobów DORA Art.8, a nie sam fakt istnienia pliku. Tryb BLOCKING znaczy, że niespełnienie reguły zatrzymuje budowę, więc niekompletny dowód nie przejdzie dalej."}, {"id": "7-4-policies", "title": "policies/ — reguły OPA/Rego (twarde bramki tak/nie)", "plain": "Tu leżą reguły zapisane w języku Rego, które uruchamia silnik OPA (Open Policy Agent — otwarty 'sędzia' do polityk). Rego to język do zapisywania reguł typu 'WOLNO wdrożyć tylko, jeśli spełnione są wszystkie warunki'. Obok każdej reguły leży plik z testami (_test.rego), który sprawdza, że sama reguła działa poprawnie.", "analogy": "To jak bramka na lotnisku: przepuszcza tylko, gdy masz bilet, dokument i nic zakazanego w bagażu. Brak jednego warunku = nie przejdziesz. Rego zapisuje dokładnie taką listę warunków, a OPA jest bramkarzem.", "why": "Polityki oddzielają REGUŁĘ od kodu programu — jasno widać, na jakich warunkach wolno wdrożyć. Łatwo to przeczytać, sprawdzić i zaufać, że bramka nie 'tylko ostrzega', lecz realnie blokuje.", "inRepo": "deployment-gate.rego (Pipeline/policies/deployment-gate.rego) mówi wprost: allow tylko gdy image_signed == true, sbom_attached == true, critical_cves == 0, tests_passed == true i coverage_pct >= 80; każdy niespełniony warunek daje czytelny komunikat 'deny' (np. 'Image must be signed with Cosign before deployment'). Obok: evidence-completeness.rego (czy paczka dowodowa jest kompletna) i retention-policy.rego (reguły przechowywania), każdy z własnym plikiem _test.rego.", "refs": ["Pipeline/policies/deployment-gate.rego", "Pipeline/policies/deployment-gate_test.rego", "Pipeline/policies/evidence-completeness.rego", "Pipeline/policies/retention-policy.rego"], "codeExcerpt": "allow if {\n\tinput.image_signed == true\n\tinput.sbom_attached == true\n\tinput.critical_cves == 0\n\tinput.tests_passed == true\n\tinput.coverage_pct >= 80\n}\n\ndeny contains msg if {\n\tinput.image_signed != true\n\tmsg := \"Image must be signed with Cosign before deployment\"\n}\n\ndeny contains msg if {\n\tinput.sbom_attached != true\n\tmsg := \"SBOM must be attached as attestation before deployment\"\n}\n\ndeny contains msg if {\n\tinput.critical_cves > 0\n\tmsg := sprintf(\"Cannot deploy with %d critical CVEs\", [input.critical_cves])\n}", "codePath": "Pipeline/policies/deployment-gate.rego", "codeLang": "text", "codeStart": 5, "howItWorks": "To reguły w języku Rego, wykonywane przez silnik OPA. Reguła 'allow if { ... }' przepuszcza wdrożenie tylko, gdy WSZYSTKIE warunki w nawiasie są prawdziwe naraz (działają jak logiczne ORAZ): obraz podpisany, SBOM dołączony, zero krytycznych podatności, testy przeszły, pokrycie >=80%. Obok każda reguła 'deny contains msg if { ... }' dokłada czytelny komunikat błędu, gdy konkretny warunek jest złamany — np. brak podpisu daje 'Image must be signed with Cosign before deployment', a CVE > 0 wstawia liczbę przez sprintf.", "whyItWorks": "Rego oddziela REGUŁĘ od kodu programu: na jednym ekranie widać dokładnie, na jakich warunkach WOLNO wdrożyć — łatwo to przeczytać i zaufać. Konstrukcja 'allow' wymaga spełnienia wszystkich warunków (brak jednego = brak zgody, jak bramka na lotnisku), a osobne reguły 'deny' z komunikatami mówią człowiekowi DLACZEGO odmówiono. To bramka, która realnie BLOKUJE, a nie tylko ostrzega — decyzja jest deterministyczna i sprawdzalna testami w deployment-gate_test.rego."}, {"id": "7-5-schemas", "title": "schemas/ — definicje kształtu danych (JSON Schema)", "plain": "Schemat to opis, jak MA wyglądać dany plik danych: jakie pola są obowiązkowe, jakiego typu (tekst, liczba), jakie wartości są dozwolone. Zapisane są w JSON Schema. JSON to popularny format danych w nawiasach klamrowych, gdzie wszystko to pary 'nazwa': wartość. JSON Schema to po prostu 'formularz wzorcowy', do którego porównuje się konkretny dokument.", "analogy": "To jak pusty urzędowy formularz z polami 'Imię', 'PESEL', 'Data' i instrukcją 'PESEL = 11 cyfr, pole obowiązkowe'. Schemat nie jest danymi — jest wzorem, do którego twoje dane muszą pasować, inaczej urzędnik odrzuca wniosek.", "why": "Schematy łapią błędy wcześnie i jednoznacznie: jeśli ktoś zapomni właściciela zasobu albo wpisze złą wartość, walidacja od razu to wytknie. To fundament, na którym walidatory budują swoje sprawdzenia treści.", "inRepo": "asset-map.schema.json (Pipeline/schemas/asset-map.schema.json) opisuje mapę zasobów DORA Art.8 — wymaga m.in. pól schema_version, maintaining_entity, critical_functions, assets, a w opisie wprost zaznacza, że nieznany właściciel/RTO ma zostać PUSTY, żeby wyszedł jako brak (FAIL), a nie był zmyślony. Inne: ropa.schema.json (rejestr czynności przetwarzania danych), incident-register.schema.json, pentest-report.schema.json. Walidatory z poprzedniego bloku porównują pliki danych właśnie do tych schematów.", "refs": ["Pipeline/schemas/asset-map.schema.json", "Pipeline/schemas/ropa.schema.json", "Pipeline/schemas/incident-register.schema.json", "Pipeline/schemas/pentest-report.schema.json"], "codeExcerpt": "  \"type\": \"object\",\n  \"additionalProperties\": false,\n  \"required\": [\n    \"schema_version\",\n    \"maintaining_entity\",\n    \"critical_functions\",\n    \"assets\"\n  ],\n  \"properties\": {\n    \"schema_version\": {\n      \"type\": \"string\",\n      \"pattern\": \"^[0-9]+\\\\.[0-9]+$\"\n    },", "codePath": "Pipeline/schemas/asset-map.schema.json", "codeLang": "json", "codeStart": 8, "howItWorks": "To rdzeń JSON Schema dla mapy zasobów. '\"type\": \"object\"' mówi, że dokument musi być obiektem (pary nazwa:wartość). '\"additionalProperties\": false' zabrania pól spoza listy — żadnych literówek ani przemyconych kluczy. '\"required\": [...]' wymienia pola OBOWIĄZKOWE: schema_version, maintaining_entity, critical_functions, assets. W '\"properties\"' każde pole dostaje typ i ograniczenie — np. schema_version musi być tekstem pasującym do wzorca regex '^[0-9]+\\.[0-9]+$', czyli liczba.liczba (jak '1.0').", "whyItWorks": "Schemat to 'formularz wzorcowy': jeśli dokument danych (asset-map.yaml) nie pasuje — brak wymaganego pola, zły typ, literówka w kluczu — walidacja od razu i jednoznacznie to wytyka, łapiąc błąd wcześnie, zanim dotrze dalej. 'additionalProperties: false' i 'required' wymuszają kompletność i czystość struktury, a 'pattern' pilnuje formatu wartości. To fundament, na którym walidatory budują głębsze sprawdzenia treści — najpierw kształt musi być poprawny, potem sens."}, {"id": "7-6-governance", "title": "docs/governance/ — dokumenty zarządcze (polityki, rejestry, RoPA, plany)", "plain": "To 'archiwum dokumentów firmy' czytane przez walidatory. Leżą tu polityki, rejestry, plany i mapy: część to czytelne dokumenty .md (Markdown — prosty tekst z nagłówkami), część to dane .yaml/.json, które maszyna analizuje. To stąd walidatory biorą treść do oceny.", "analogy": "To segregatory w sekretariacie: 'polityka bezpieczeństwa', 'rejestr ryzyk', 'plan ciągłości działania', 'kto ma dostęp do czego'. Audytor pyta 'pokażcie politykę dostępu' — i ona musi tu fizycznie być, aktualna i kompletna.", "why": "Sama taśma techniczna to za mało dla DORA/NIS2/ISO 27001 — potrzebne są realne dokumenty zarządcze. Tu mieszkają i, co ważne, nie są tylko 'na pokaz': maszyny czytają je i wystawiają werdykt, więc muszą być prawdziwe i pełne.", "inRepo": "Pipeline/docs/governance/ zawiera m.in. asset-map.yaml (mapa zasobów czytana przez check_asset_map.py), ropa.yaml (RoPA — Record of Processing Activities, rejestr czynności przetwarzania danych osobowych z RODO), risk-register.md i risk-treatment-plan.md (rejestr i plan postępowania z ryzykiem), statement-of-applicability.md (Deklaracja Stosowania z ISO 27001), oraz plany jak crisis-management-plan.md. Niektóre pliki .json (np. compliance-status.json) to gotowe werdykty z ostatniego przebiegu.", "refs": ["Pipeline/docs/governance/asset-map.yaml", "Pipeline/docs/governance/ropa.yaml", "Pipeline/docs/governance/risk-register.md", "Pipeline/docs/governance/statement-of-applicability.md", "Pipeline/docs/governance/crisis-management-plan.md"], "codeExcerpt": "# Asset / Dependency & Critical-Function Map (DORA Art.8)\n#\n# HONESTY NOTE\n# ------------\n# This file is REAL architectural data, not the record of an unconducted\n# activity. Every entry below is transcribed from the existing, approved\n# inventories -- it is therefore allowed to PASS (cf. the A.10 restore-test\n# which honestly FAILs because no drill has actually happened yet).\n#\n# Provenance (1:1 traceable):\n#   * critical_functions  <- service-inventory.md SVC-001..SVC-005 + EXT-001..004\n#   * supporting_assets   <- asset-inventory.md TA-* / service-inventory.md SVC-*\n#   * data_stores         <- asset-inventory.md IA-* (information assets)\n#   * third_parties       <- service-inventory.md EXT-* / vendor-risk-register\n#   * rto / rpo (high)    <- bcdr-plan.md S.4 \"RTO/RPO Targets\" table\n#\n# If a value is genuinely unknown it MUST be left empty (null) so the validator\n# reports a completeness FAIL -- it must never be invented to manufacture a PASS.", "codePath": "Pipeline/docs/governance/asset-map.yaml", "codeLang": "yaml", "codeStart": 1, "howItWorks": "To nagłówek dokumentu zarządczego asset-map.yaml — danych YAML czytanych przez walidator check_asset_map.py. 'HONESTY NOTE' wyjaśnia, że plik to PRAWDZIWE dane architektoniczne przepisane z istniejących, zatwierdzonych inwentaryzacji, więc legalnie może dać PASS. Sekcja 'Provenance' śledzi 1:1, skąd pochodzi każda część: funkcje krytyczne ze service-inventory.md, zasoby z asset-inventory.md, RTO/RPO z bcdr-plan.md. Ostatnie zdanie: nieznana wartość MUSI zostać pusta (null), żeby walidator zgłosił FAIL — nie wolno jej wymyślić.", "whyItWorks": "To pokazuje, że dokumenty zarządcze nie są 'na pokaz': maszyna (walidator) czyta ten plik i wystawia werdykt, więc treść musi być realna i kompletna. Wymóg 'puste = FAIL, nigdy zmyślone' to ta sama zasada uczciwości co w walidatorach — lepiej jawnie oblać z niekompletności niż sfałszować zielone. Tabela provenance daje audytorowi ścieżkę dowodową (skąd wzięto każdą daną), co odróżnia żywy rejestr od pustej atrapy i spełnia wymóg DORA Art.8 identyfikacji zasobów."}, {"id": "7-7-infra", "title": "infra/ — infrastruktura Azure jako kod (Terraform / HCL)", "plain": "Tu opisana jest cała infrastruktura w chmurze Azure — ale nie klikana ręcznie, tylko ZAPISANA jako tekst. Terraform to narzędzie, które czyta te pliki i tworzy w chmurze dokładnie to, co opisano. Pliki mają rozszerzenie .tf i są w języku HCL (HashiCorp Configuration Language) — prostym formacie blokowym 'resource ... { ... }'.", "analogy": "To jak projekt budowlany domu zamiast budowania na oko. Mówisz na papierze 'tu rejestr obrazów, tu skarbiec na sekrety, tu magazyn na dowody, tu monitoring' — a Terraform to ekipa, która buduje dokładnie według rysunku. Chcesz drugi taki sam dom? Bierzesz ten sam projekt.", "why": "Infrastruktura jako kod znaczy: powtarzalna, sprawdzalna i wersjonowana. Widać dokładnie, co stoi w chmurze, można to przejrzeć i odtworzyć — i samą infrastrukturę też skanować pod kątem bezpieczeństwa.", "inRepo": "infra/main.tf (Pipeline/infra/main.tf) spina całość: tworzy grupę zasobów i wpina moduły. Moduły w infra/modules/ to: acr (Azure Container Registry — rejestr obrazów), keyvault (skarbiec na sekrety i klucze), container-apps (gdzie działa aplikacja), storage (magazyn, w tym WORM/niemodyfikowalny na dowody) i monitoring. W main.tf widać też etykiety (tags) z listą frameworków: dora,nis2,iso27001,soc2.", "refs": ["Pipeline/infra/main.tf", "Pipeline/infra/modules/acr/main.tf", "Pipeline/infra/modules/keyvault/main.tf", "Pipeline/infra/modules/storage/main.tf", "Pipeline/infra/modules/container-apps/main.tf"], "codeExcerpt": "locals {\n  tags = {\n    project     = var.project_name\n    environment = var.environment\n    managed_by  = \"terraform\"\n    compliance  = \"dora,nis2,iso27001,soc2\"\n  }\n  resource_prefix = \"${var.project_name}-${var.environment}\"\n}\n\ndata \"azurerm_client_config\" \"current\" {}\n\nresource \"azurerm_resource_group\" \"this\" {\n  name     = \"${local.resource_prefix}-rg\"\n  location = var.location\n  tags     = local.tags\n}\n\nmodule \"acr\" {\n  source              = \"./modules/acr\"\n  resource_group_name = azurerm_resource_group.this.name\n  location            = azurerm_resource_group.this.location\n  acr_name            = replace(\"${local.resource_prefix}acr\", \"-\", \"\")\n  tags                = local.tags\n}", "codePath": "Pipeline/infra/main.tf", "codeLang": "hcl", "codeStart": 1, "howItWorks": "To Terraform w języku HCL (bloki 'nazwa { ... }'). 'locals' definiuje wspólne wartości używane w całym pliku — m.in. etykiety 'tags' z listą frameworków zgodności 'dora,nis2,iso27001,soc2' oraz prefiks nazw zasobów. 'resource \"azurerm_resource_group\" \"this\"' tworzy w Azure grupę zasobów (pojemnik na wszystko), nadając jej nazwę z prefiksu i te same tagi. 'module \"acr\"' wpina gotowy moduł z ./modules/acr (rejestr obrazów ACR), przekazując mu nazwę grupy, lokalizację i tagi — analogicznie w main.tf dołączane są moduły keyvault, storage, container-apps i monitoring.", "whyItWorks": "Infrastruktura jako kod znaczy: powtarzalna, sprawdzalna, wersjonowana — zamiast klikać w portalu Azure, opisuje się wszystko tekstem, który Terraform odtwarza dokładnie tak samo za każdym razem. Podział na moduły (acr, keyvault, storage...) daje wysoką spójność i niskie sprzężenie — każdy fragment chmury to osobny, wielokrotnego użytku klocek. Wspólne 'tags' z listą frameworków powodują, że każdy utworzony zasób jest oznaczony pod kątem zgodności, co ułatwia inwentaryzację i audyt całego środowiska."}, {"id": "7-8-app", "title": "app/ — przykładowa aplikacja testowa (Node.js + TypeScript)", "plain": "To mała, demonstracyjna aplikacja webowa, na której taśma 'ćwiczy': coś trzeba przecież zbudować, przetestować, zeskanować, zapakować w obraz i wdrożyć. Napisana jest w TypeScript (odmiana JavaScriptu z typami) na frameworku Express. Obok kodu jest Dockerfile — przepis na zbudowanie obrazu kontenera (lekkiej, przenośnej paczki z aplikacją).", "analogy": "To jak atrapa produktu na linii produkcyjnej, żeby przetestować całą fabrykę, zanim puścimy prawdziwy towar. Aplikacja jest celowo prosta — gwiazdą jest taśma wokół niej, nie sama aplikacja.", "why": "Bez czegoś do zbudowania nie dałoby się pokazać, że taśma działa od końca do końca. Aplikacja jest też celowo zabezpieczona (np. helmet, ograniczanie liczby żądań), bo skanery i tak by to sprawdziły — to dowód, że bramki bezpieczeństwa są realne.", "inRepo": "Kod w app/src/: app.ts (Pipeline/app/src/app.ts) tworzy serwer Express, podpina helmet (nagłówki bezpieczeństwa) i rate-limiter; routes/items.ts to przykładowe API; middleware/rate-limit.ts ogranicza liczbę żądań. Testy w app/tests/unit/ pilnują bramki 80% pokrycia. Dockerfile (Pipeline/app/Dockerfile) buduje minimalny obraz uruchamiany jako użytkownik bez uprawnień roota.", "refs": ["Pipeline/app/src/app.ts", "Pipeline/app/src/routes/items.ts", "Pipeline/app/src/middleware/rate-limit.ts", "Pipeline/app/tests/unit/items.test.ts", "Pipeline/app/Dockerfile"], "codeExcerpt": "const app = express();\n\napp.use(\n  helmet({\n    contentSecurityPolicy: {\n      directives: {\n        defaultSrc: [\"'self'\"],\n        styleSrc: [\"'self'\", \"'unsafe-inline'\", \"https://fonts.googleapis.com\"],\n        fontSrc: [\"'self'\", \"https://fonts.gstatic.com\"],\n        scriptSrc: [\"'self'\", \"'unsafe-inline'\"],\n        imgSrc: [\"'self'\", \"data:\"],\n      },\n    },\n  }),\n);", "codePath": "Pipeline/app/src/app.ts", "codeLang": "typescript", "codeStart": 30, "howItWorks": "To kod TypeScript tworzący aplikację demo. 'const app = express()' uruchamia framework Express (serwer webowy w Node.js). 'app.use(helmet({...}))' podpina middleware helmet, które ustawia nagłówki bezpieczeństwa HTTP. Konfigurowana tu jest polityka Content-Security-Policy (CSP): 'directives' określają, skąd przeglądarka MOŻE ładować zasoby — 'defaultSrc: [\"'self'\"]' domyślnie tylko z własnej domeny, a osobne reguły dopuszczają np. czcionki Google. Dalej w pliku (linia 147) dochodzi rate-limiter na trasy mutujące POST/DELETE.", "whyItWorks": "Aplikacja jest celowo prosta (atrapa produktu na linii produkcyjnej), ale realnie zabezpieczona — bo skanery i tak by to sprawdziły, więc helmet/CSP/rate-limit są dowodem, że bramki bezpieczeństwa działają na czymś prawdziwym. CSP ogranicza skąd ładują się skrypty/style, redukując ryzyko XSS; zasada 'self' jako domyślna to bezpieczna wartość bazowa (whitelist, nie blacklist). Dzięki temu da się pokazać taśmę od końca do końca: jest co zbudować, przetestować, zeskanować, zapakować w obraz i wdrożyć."}, {"id": "7-9-sample-pack", "title": "sample-evidence-pack/ — gotowa próbka paczki dowodowej", "plain": "To kompletna, oczyszczona próbka paczki dowodowej, którą można pokazać klientowi i którą da się samemu zweryfikować jednym poleceniem — w pełni offline (bez chmury, bez Azure, bez wdrożenia). Pokazuje KSZTAŁT i ZAWARTOŚĆ prawdziwej paczki, ale uczciwie zaznacza, czego jeszcze nie ma (jest 'demo', nie atestacja produkcyjna).", "analogy": "To jak makieta domu na stoisku dewelopera: wszystkie pokoje na miejscu, możesz wejść i obejrzeć, ale na ścianie wisi tabliczka 'wizualizacja, instalacje doprowadzane'. Pokazuje, jak będzie, bez udawania, że już tam mieszkasz.", "why": "Pozwala prospektowi samodzielnie przejść runbook integralności i zobaczyć, że dowody się 'spinają' kryptograficznie. A przy okazji jest wzorcowym przykładem uczciwości projektu: bramki świecą tak, jak NAPRAWDĘ wypadły.", "inRepo": "README.md (Pipeline/sample-evidence-pack/README.md) opisuje 8 komponentów paczki (raport PDF, manifest artefaktów, wyniki skanów, SBOM, macierz kontroli, crosswalk regulacyjny, rejestr luk, dowód integralności) i ich status. Uczciwe ograniczenia są wypisane wprost: znaczniki czasu to NIEKWALIFIKOWANY RFC-3161 (freetsa.org), poziom to SLSA Build L2 (NIE L3), a podpis keyless Cosign nad korzeniem Merkle jest PENDING do prawdziwego przebiegu CI; A.10 (test odtworzenia z kopii) świeci jako uczciwy BLOCKING FAIL. Reprodukcja: bash sample-evidence-pack/make-sample-pack.sh (oczekiwany wynik: 5 PASS / 4 SKIP / 0 FAIL).", "refs": ["Pipeline/sample-evidence-pack/README.md", "Pipeline/sample-evidence-pack/make-sample-pack.sh", "Pipeline/sample-evidence-pack/evidence/manifest.json", "Pipeline/sample-evidence-pack/evidence/merkle-root.txt", "Pipeline/sample-evidence-pack/evidence/compliance-status.json"], "codeExcerpt": "```bash\ncd Pipeline\n# Re-run the reproducer; it verifies as its last step and exits 0:\nbash sample-evidence-pack/make-sample-pack.sh\n```\n\nExpected (this offline demo): `RESULT: OK` with `5 PASS / 4 SKIP / 0 FAIL` —\nsha256 manifest, RFC-6962 Merkle root, and **both RFC-3161 timestamps verify\ncryptographically against the freetsa CA**. cosign keyless verification and PDF/A\n(veraPDF/pdfsig) **SKIP** because this box has no sigstore OIDC and no WeasyPrint.", "codePath": "Pipeline/sample-evidence-pack/README.md", "codeLang": "text", "codeStart": 14, "howItWorks": "To instrukcja samodzielnej weryfikacji próbki paczki dowodowej. Jedno polecenie 'bash sample-evidence-pack/make-sample-pack.sh' odtwarza paczkę z prawdziwych skryptów repo i jako ostatni krok ją weryfikuje, kończąc kodem 0 (sukces). Oczekiwany wynik to 'RESULT: OK' z bilansem '5 PASS / 4 SKIP / 0 FAIL': suma kontrolna manifestu i korzeń Merkle (RFC-6962) się zgadzają, a oba znaczniki czasu RFC-3161 weryfikują się kryptograficznie wobec urzędu freetsa. Cosign i PDF/A wychodzą jako SKIP, bo offline brakuje sigstore OIDC i WeasyPrint.", "whyItWorks": "Próbka pozwala prospektowi SAMODZIELNIE i w pełni offline przejść runbook integralności i zobaczyć, że dowody spinają się kryptograficznie — to silniejszy argument niż 'uwierz nam'. Co ważne, bilans świeci uczciwie: SKIP (nie fałszywy PASS) tam, gdzie czegoś naprawdę nie da się offline zrobić, a 0 FAIL bo to, co policzono, faktycznie się zgadza. To wzorcowy przykład zasady 'claims == reality' — makieta jasno oznacza, co już działa, a co jest PENDING do produkcyjnego przebiegu CI."}]}, {"area": "8 · Jak to wszystko się łączy + słowniczek", "intro": "W poprzednich rozdziałach poznaliśmy osobne klocki: skany, budowę obrazu, podpisy, dowody, bramki. Teraz złóżmy je w jedną płynną historię — od chwili, gdy programista wysyła kod, aż do momentu, w którym audytor sam, bez zaufania do nas, sprawdza, że nic nie zostało podmienione. To jest tak zwana złota nić (golden thread): jeden nieprzerwany łańcuch dowodów, w którym każdy klocek wskazuje na poprzedni.", "blocks": [{"id": "gt-0-overview", "title": "Złota nić — co właściwie próbujemy udowodnić", "plain": "Cały pipeline istnieje po to, żeby udowodnić jedno zdanie: 'oprogramowanie, które działa na produkcji, zostało zbudowane bezpiecznie i nikt go po drodze nie podmienił — a oto dowód, który możesz sprawdzić sam'. Zamiast obiecywać to słowami w PDF-ie napisanym tydzień przed kontrolą, pipeline produkuje podpisane dowody automatycznie, w momencie powstawania każdego artefaktu. Audytor nie musi nam wierzyć — może zweryfikować podpisy i sumy kontrolne własnymi rękami.", "analogy": "To jak różnica między oświadczeniem 'przysięgam, że to ja namalowałem ten obraz' a paragonem z galerii, zdjęciem z datą, świadkiem i pieczęcią notariusza złożonymi w chwili tworzenia. Pierwsze to słowo, drugie to dowód.", "why": "Specyfikacja nazywa to 'golden thread' i mówi wprost: najważniejsza zasada to, że paczka jest GENEROWANA przez pipeline, a nie ręcznie składana na audyt. Zaufanie audytora bierze się z dowodów produkowanych w sposób ciągły, automatyczny i podpisanych kryptograficznie w chwili powstania.", "inRepo": "Łańcuch opisany jest w evidence-pack-specification.md sekcja 1 ('Executive map — the golden thread'): CONTROL -> EVIDENCE -> PIPELINE STAGE -> REGULATORY CLAUSE -> ACCEPTANCE CRITERION.", "refs": ["evidence-pack-specification.md"], "codeExcerpt": "## 1. Executive map — the \"golden thread\"\n\nThe entire pack exists to make one chain auditable, end to end, for every control:\n\n```\nCONTROL  ->  EVIDENCE  ->  PIPELINE STAGE / SOURCE  ->  REGULATORY CLAUSE  ->  ACCEPTANCE CRITERION\n(what we     (the signed   (where it was produced,     (DORA / NIS2-KSC /      (what an auditor checks\n promise)     artifact)     automatically)              GDPR / CRA / ISO)       to mark it PASS)\n```", "codePath": "evidence-pack-specification.md", "codeLang": "text", "codeStart": 18, "howItWorks": "Ten fragment to definicja 'złotej nici'. Czytaj go jak strzałkę od lewej do prawej: każda KONTROLA (co obiecujemy) musi mieć przypisany DOWÓD (podpisany artefakt), ten dowód musi powstać na konkretnym ETAPIE PIPELINE (automatycznie, nie ręcznie), musi wskazywać KLAUZULĘ PRAWNĄ (DORA/NIS2/RODO/CRA), a na końcu KRYTERIUM AKCEPTACJI mówi audytorowi, kiedy postawić PASS. Spec dalej wymienia, kto konsumuje każdą część paczki (zarząd, KNF, CISO, audytor).", "whyItWorks": "Sednem jest jedno zdanie kilka linii niżej w spec: paczka musi być 'generated by the pipeline, not hand-assembled for the audit'. Łańcuch kontrola→dowód→etap→prawo→kryterium gwarantuje, że NIC nie jest twierdzeniem bez pokrycia — każda obietnica ma maszynowo wyprodukowany, podpisany ślad. Taki model przenosi zaufanie z 'uwierz nam na słowo' na 'sprawdź podpis i sumę sam', co jest dokładnie tym, czego oczekuje kontrola regulacyjna."}, {"id": "gt-1-commit", "title": "Krok 1 — programista wysyła kod (commit / push / PR)", "plain": "Wszystko zaczyna się od programisty, który zapisuje swoją zmianę w kodzie (commit) i wysyła ją do wspólnego repozytorium (push). Zwykle nie trafia ona od razu do głównej gałęzi 'main', tylko jako Pull Request (PR — prośba o włączenie zmiany), którą ktoś inny musi przejrzeć i zatwierdzić. To moment, w którym budzi się cały pipeline.", "analogy": "Jak wrzucenie listu do skrzynki na poczcie: od tej chwili rusza cała maszyneria sortowania i dostarczania, a Ty już nie dotykasz koperty samodzielnie.", "why": "PR z obowiązkowym przeglądem to pierwsza bramka jakości — żadna zmiana nie wchodzi na produkcję bez śladu 'kto, co i kiedy'. To podstawa rozdziału o kontroli źródła: każda zmiana na produkcji ma dać się prześledzić do zatwierdzonego, podpisanego commitu.", "inRepo": "Pipeline.github/workflows/pipeline.yml startuje na zdarzeniach 'pull_request' i 'push' do gałęzi main (linie 3-7). Pierwsze odpala się Phase 0: Self-Test, a dopiero potem reszta — przez mechanizm 'needs'.", "refs": ["Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "on:\n  pull_request:\n    branches: [main]\n  push:\n    branches: [main]\n  workflow_dispatch:\n    inputs:\n      deploy_environment:\n        description: \"Target environment\"\n        required: true\n        type: choice\n        options:\n          - staging\n          - production", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 3, "howItWorks": "Blok `on:` to lista zdarzeń, które budzą cały pipeline. `pull_request` na gałąź `main` odpala pipeline, gdy ktoś prosi o włączenie zmiany (PR). `push` na `main` odpala go po faktycznym wejściu zmiany. `workflow_dispatch` pozwala uruchomić ręcznie z wyborem środowiska (staging/production). To jest moment 'commit/push/PR' z lekcji — programista wysyła kod, a GitHub Actions automatycznie startuje workflow.", "whyItWorks": "Wpięcie w `pull_request` (a nie tylko `push`) jest celowe: skany i bramki muszą zadziałać ZANIM zmiana trafi do main, czyli na etapie recenzji PR — wtedy wadliwy kod da się zatrzymać przed włączeniem. `branches: [main]` zawęża wyzwalanie do gałęzi, która faktycznie idzie na produkcję, więc pipeline nie marnuje się na każdej eksperymentalnej gałęzi, a jednocześnie żadna zmiana main nie omija bramek."}, {"id": "gt-2-selftest-securitygate", "title": "Krok 2 — pipeline sprawdza najpierw SAM SIEBIE, potem bramka bezpieczeństwa", "plain": "Zanim cokolwiek się zbuduje, pipeline odpala fazę Self-Test: sprawdza, czy jego własne reguły, walidatory i przypięcia narzędzi nie są zepsute. Dopiero potem rusza Security Gate (bramka bezpieczeństwa) i skany: sekretów w kodzie, SAST (analiza samego kodu), SCA (sprawdzanie bibliotek pod kątem znanych dziur), skan infrastruktury i obrazu. Każdy z tych etapów zostawia podpisany raport.", "analogy": "Jak kucharz, który najpierw sprawdza, czy jego własna waga i termometr działają (Self-Test), a dopiero potem zaczyna kontrolować świeżość każdego składnika (skany). Zepsuty termometr wykryty na końcu unieważniłby cały obiad.", "why": "Kolejność jest celowa: każda kolejna faza zależy ('needs') od poprzedniej, więc zepsuty walidator albo odpięte (niebezpieczne) narzędzie zatrzymuje przebieg ZANIM cokolwiek się zbuduje, podpisze czy wdroży. Nic nie może 'obejść' tej bramki.", "inRepo": "pipeline.yml: Phase 0 self-test (linie 41-43) uruchamia 'opa test + audyt przypięć akcji + pytest', a Phase 1 security-gate (linie 48-56) zależy od self-test przez 'needs: [self-test]'.", "refs": ["Pipeline/.github/workflows/pipeline.yml", "Pipeline/.github/workflows/security-gate.yml", "Pipeline/.github/workflows/self-test.yml"], "codeExcerpt": "  self-test:\n    name: \"Phase 0: Self-Test\"\n    uses: ./.github/workflows/self-test.yml\n\n  # ============================================\n  # Phase 1: Security Gate (always runs)\n  # ============================================\n  security-gate:\n    name: \"Phase 1: Security Gate\"\n    needs: [self-test]\n    uses: ./.github/workflows/security-gate.yml\n    with:\n      ref: ${{ github.event.pull_request.head.sha || github.sha }}\n      is_pull_request: ${{ format('{0}', github.event_name == 'pull_request') }}", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 41, "howItWorks": "Phase 0 (`self-test`) odpala się jako pierwsza i woła osobny workflow `self-test.yml`. Ten z kolei (widać w samym pliku) uruchamia cztery bramki: `opa test policies/` (testy reguł), `check-action-pins.sh` (audyt przypięć akcji), `pytest tests/compliance` z progiem pokrycia 70% oraz suitę bats. Dopiero Phase 1 (`security-gate`) ma `needs: [self-test]` — czyli NIE wystartuje, dopóki self-test nie przejdzie. Security Gate dostaje `ref` (który commit sprawdzić) i flagę, czy to PR.", "whyItWorks": "Kolejność jest sednem: pipeline najpierw sprawdza SAM SIEBIE, bo jak komentarz w self-test.yml mówi, walidatory i polityki były wcześniej 'green-by-absence' — zepsuty walidator mógł przepuścić wszystko. `needs: [self-test]` tworzy twardą zależność: nie da się 'obejść' (depend-around) zepsutej bramki, bo każda późniejsza faza łańcuchowo z niej wynika. To gwarantuje, że jeśli reguły są zepsute albo ktoś wprowadził nieprzypiętą akcję, przebieg pada zanim cokolwiek się zbuduje, podpisze czy wdroży."}, {"id": "gt-3-build-sbom-sign-provenance", "title": "Krok 3 — budowa obrazu, a przy nim SBOM, podpis i provenance", "plain": "Gdy skany przejdą, pipeline buduje obraz aplikacji (gotową paczkę do uruchomienia). W tym samym momencie powstają trzy ważne rzeczy: SBOM (Software Bill of Materials — spis wszystkich składników oprogramowania, jak skład na opakowaniu jedzenia), provenance (metryczka pochodzenia: kto, czym, z jakich wejść zbudował ten konkretny obraz) oraz podpis cyfrowy, który przypina tożsamość budowniczego do obrazu rozpoznawanego po jego cyfrowym odcisku palca (digest).", "analogy": "To jak wyprodukowanie słoika dżemu: na etykiecie masz skład (SBOM), na wieczku numer partii i datę z linii produkcyjnej (provenance), a na zamknięciu plombę gwarancyjną producenta (podpis). Zerwana plomba = nie ufaj.", "why": "To serce odporności na ataki łańcucha dostaw. Podpis i provenance pozwalają później udowodnić, że obraz na produkcji to dokładnie ten zbudowany przez pipeline, a nie podmieniony. Uczciwie: pipeline osiąga SLSA Build Level 2 (cel L3 jeszcze nie osiągnięty) — provenance jest podpisane i wiąże artefakt po digeście z budowniczym.", "inRepo": "pipeline.yml Phase 2 build-and-scan (linie 61-67) i Phase 3 Sign & Attest (od linii 69). Podpis keyless cosign + wpis do Rekor realnie działają w przebiegu CI; w próbce offline są honest-pending. Patrz też Pipeline/scripts/generate-provenance.sh.", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/.github/workflows/sign-and-attest.yml", "Pipeline/scripts/generate-provenance.sh"], "codeExcerpt": "      - name: Sign image with Cosign (keyless OIDC)\n        run: |\n          set -o pipefail  # tee must not mask a cosign sign failure\n          cosign sign --yes \\\n            -a \"repo=${{ github.repository }}\" \\\n            -a \"workflow=${{ github.workflow }}\" \\\n            -a \"ref=${{ github.sha }}\" \\\n            -a \"run_id=${{ github.run_id }}\" \\\n            -a \"trigger=${{ github.event_name }}\" \\\n            \"${{ inputs.image_uri }}@${{ inputs.image_digest }}\" \\\n            2>&1 | tee /tmp/cosign-sign-output.txt", "codePath": "Pipeline/.github/workflows/sign-and-attest.yml", "codeLang": "yaml", "codeStart": 45, "howItWorks": "To Phase 3. Najpierw (w build-and-scan.yml) Syft generuje SBOM CycloneDX z obrazu, a `docker/build-push-action` zwraca `digest` — cyfrowy odcisk obrazu. Tutaj `cosign sign --yes` podpisuje obraz wskazany NIE przez tag, lecz przez `@${image_digest}`, czyli po niezmiennym odcisku. Flagi `-a` doklejają adnotacje (repo, workflow, commit ref, run_id, trigger) — kontekst, kto i czym to zbudował. Dalej w pliku `cosign attest` dołącza SBOM jako podpisaną atestację, a `attest-build-provenance` tworzy provenance pochodzenia.", "whyItWorks": "Podpisywanie po `digest`, a nie po tagu, jest kluczowe: tag (np. `:latest`) można przepiąć na inny obraz, ale digest to hash zawartości — podpis przypina tożsamość budowniczego do DOKŁADNIE tych bajtów. `set -o pipefail` zapewnia, że `| tee` nie zamaskuje błędu cosign (inaczej krok byłby fałszywie zielony). Adnotacje `-a` dają audytorowi łańcuch pochodzenia powiązany z konkretnym przebiegiem CI, więc SBOM, provenance i podpis razem odpowiadają na pytanie 'co dokładnie i kto zbudował', w momencie powstania artefaktu — a nie z pamięci tydzień przed kontrolą."}, {"id": "gt-4-validators-matrix", "title": "Krok 4 — generowanie dowodów zgodności i zagregowany werdykt", "plain": "Teraz pipeline tłumaczy techniczne wyniki na język audytora. Skrypty-walidatory sprawdzają poszczególne dowody (np. czy istnieje umowa powierzenia danych, czy retencja się zgadza), a osobny krok agreguje to wszystko w jedną matrycę zgodności i jeden zbiorczy werdykt: 'czy ta wersja spełnia kontrole?'. Powstaje też VEX (Vulnerability Exploitability eXchange — adnotacja, które z wykrytych dziur faktycznie dotyczą tej aplikacji, a które nie).", "analogy": "Jak przegląd techniczny auta: osobno bada się hamulce, światła i emisję spalin (walidatory), a na końcu diagnosta wbija JEDNĄ pieczątkę 'zdał/nie zdał' do dowodu rejestracyjnego (zagregowany werdykt). VEX to dopisek 'tak, ta usterka jest na liście, ale w tym modelu nie występuje'.", "why": "Bez tego kroku audytor patrzyłby na surowe raporty i nie wiedziałby, co znaczą. Matryca mapuje jeden dowód na wiele przepisów naraz (DORA, NIS2, RODO, CRA, ISO) — to 'silnik wydajności' z sekcji 5 specyfikacji. VEX zapobiega sytuacji, w której każda CVE wygląda na nieobsłużoną.", "inRepo": "Pipeline/scripts/aggregate-compliance.py (zbiorczy werdykt), generate-compliance-matrix.sh (matryca), generate-vex.py (VEX), katalog Pipeline/scripts/validators/. Specyfikacja: evidence-pack-specification.md sekcja 5.", "refs": ["Pipeline/scripts/aggregate-compliance.py", "Pipeline/scripts/generate-compliance-matrix.sh", "Pipeline/scripts/generate-vex.py", "Pipeline/scripts/validators"], "codeExcerpt": "def _compute_overall(\n    rows: list[Row], missing_required: list[str], matrix_blocking: int,\n) -> str:\n    \"\"\"Overall verdict by BLOCKING tier only (EVIDENCE-ONLY never trips the gate).\n\n    FAIL          -> any required verdict missing, any BLOCKING row FAIL, or the\n                     content matrix reports blocking_failures > 0.\n    INDETERMINATE -> no outright FAIL, but a BLOCKING row could not be measured.\n    PASS          -> otherwise.\n    \"\"\"\n    if missing_required:\n        return FAIL\n    if matrix_blocking > 0:\n        return FAIL\n    blocking_fail = any(r.tier == BLOCKING and r.status == FAIL for r in rows)\n    if blocking_fail:\n        return FAIL\n    blocking_indet = any(r.tier == BLOCKING and r.status == INDETERMINATE for r in rows)\n    if blocking_indet:\n        return INDETERMINATE\n    return PASS", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 683, "howItWorks": "To serce zbiorczego werdyktu. Funkcja bierze trzy wejścia: `rows` (werdykty pojedynczych walidatorów, każdy z tierem BLOCKING/EVIDENCE-ONLY i statusem), `missing_required` (wymagane werdykty, których w ogóle nie wyprodukowano) i `matrix_blocking` (liczbę blokujących uchybień z matrycy treści). Logika jest sekwencyjna: brak wymaganego werdyktu => FAIL; matryca zgłasza blokady => FAIL; jakikolwiek BLOCKING ze statusem FAIL => FAIL; BLOCKING, którego nie dało się zmierzyć => INDETERMINATE; w przeciwnym razie PASS. Werdykty EVIDENCE-ONLY są tu świadomie pomijane.", "whyItWorks": "Najważniejsza zasada: 'you cannot pass a control you never measured' — brakujący wymagany dowód to FAIL, a nie milczący PASS (fail-closed). Rozróżnienie tierów jest projektowo uczciwe: tylko kontrole BLOCKING wywracają bramkę, więc pomiar czysto dowodowy (EVIDENCE-ONLY) nie blokuje wdrożenia, ale i nie udaje, że jest spełniony. Osobny stan INDETERMINATE oddziela 'zmierzyliśmy i jest źle' (FAIL) od 'nie dało się zmierzyć' (np. pusty/uszkodzony artefakt) — audytor widzi prawdę, a skrypt nigdy nie wymyśla PASS-ów."}, {"id": "gt-5-merkle", "title": "Krok 5 — spięcie wszystkiego w jeden korzeń Merkle", "plain": "Wszystkie dowody trafiają do jednego katalogu, a skrypt liczy z nich drzewo Merkle: bierze cyfrowy odcisk (hash SHA-256) każdego pliku, paruje je, liczy odcisk z par, znów paruje — aż zostaje jeden hash na samej górze, zwany korzeniem Merkle (merkle_root). Ten jeden krótki ciąg znaków 'pieczętuje' zawartość całej paczki: zmiana choćby jednego bajtu w dowolnym dowodzie zmienia korzeń.", "analogy": "Jak turniej pucharowy: każdy zawodnik (plik) ma swój wynik, pary grają mecze, zwycięzcy idą wyżej, aż zostaje jeden mistrz (korzeń). Podmień wynik jednego meczu w pierwszej rundzie, a zmienia się cała drabinka i mistrz jest inny — od razu widać, że ktoś majstrował.", "why": "Dzięki temu nie trzeba podpisywać setek plików osobno — wystarczy podpisać jeden korzeń, a on matematycznie zobowiązuje się do treści każdego pojedynczego dowodu. To czyni paczkę tamper-evident (każda manipulacja jest wykrywalna).", "inRepo": "Pipeline/scripts/generate-evidence-manifest.py liczy 'merkle_root' algorytmem RFC6962-SHA256 (funkcje merkle_tree_hash / merkle_root_hex, linie 110-128); wartość zapisuje do manifest.json. seal-evidence.sh:301-304 zapisuje ją do niezmiennego pliku merkle-root.txt.", "refs": ["Pipeline/scripts/generate-evidence-manifest.py", "Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "def merkle_tree_hash(leaves_data: Sequence[bytes]) -> bytes:\n    \"\"\"Compute RFC 6962 Merkle Tree Hash (MTH) over a list of raw inputs.\n\n    Each element of ``leaves_data`` is the *raw data* for one leaf (it is leaf\n    hashed internally). Returns the 32-byte root digest.\n    \"\"\"\n    n = len(leaves_data)\n    if n == 0:\n        return hashlib.sha256(b\"\").digest()\n    if n == 1:\n        return leaf_hash(leaves_data[0])\n    k = _largest_power_of_two_less_than(n)\n    left = merkle_tree_hash(leaves_data[:k])\n    right = merkle_tree_hash(leaves_data[k:])\n    return node_hash(left, right)\n\n\ndef merkle_root_hex(leaves_data: Sequence[bytes]) -> str:\n    return merkle_tree_hash(leaves_data).hex()", "codePath": "Pipeline/scripts/generate-evidence-manifest.py", "codeLang": "python", "codeStart": 108, "howItWorks": "Funkcja rekurencyjnie liczy korzeń drzewa Merkle wg RFC 6962. Dla 0 elementów daje hash pustego ciągu, dla 1 — `leaf_hash` (liść jest hashowany wewnętrznie). Dla wielu: `k` to największa potęga dwójki mniejsza od n (punkt podziału z RFC 6962), lewa połowa i prawa połowa liczone są osobno, a ich wyniki łączy `node_hash` (czyli SHA256(0x01 ‖ lewy ‖ prawy)). Tak hashe par łączą się w górę aż do jednego korzenia. `merkle_root_hex` zwraca go jako hex; ta wartość trafia do `manifest.json`, a seal-evidence.sh zapisuje ją do niezmiennego `merkle-root.txt`.", "whyItWorks": "Drzewo Merkle daje jeden krótki ciąg, który 'pieczętuje' całą paczkę: zmiana choćby jednego bajtu dowolnego dowodu zmienia jego liść, więc zmienia węzły wyżej i finalnie korzeń. Użycie RFC 6962 (z prefiksami 0x00 dla liści, 0x01 dla węzłów) zapobiega atakom kolizji liść/węzeł i jest tym samym standardem, którego używa Certificate Transparency — dzięki temu KAŻDY może niezależnie przeliczyć korzeń tym samym algorytmem i porównać go z zapisanym. To zamienia 'folder plików' w kryptograficznie spójną, weryfikowalną całość."}, {"id": "gt-6-sign-merkle", "title": "Krok 6 — podpis korzenia (cosign keyless) i znacznik czasu (RFC-3161)", "plain": "Pipeline podpisuje plik merkle-root.txt podpisem keyless cosign — czyli bez wcześniej wygenerowanego, przechowywanego klucza prywatnego: tożsamość budowniczego potwierdza krótkotrwały certyfikat z Fulcio, a fakt podpisania trafia do publicznego, niezmienialnego rejestru Rekor. Osobno nakładany jest znacznik czasu RFC-3161 (zaufana, niezależna pieczęć 'to istniało o tej godzinie'). Ważne: ten podpis to dodatkowa warstwa — paczka zostaje zapieczętowana także przez sam korzeń Merkle i znacznik czasu.", "analogy": "Cosign keyless to jak podpisanie dokumentu w urzędzie, gdzie urzędnik na poczekaniu potwierdza Twoją tożsamość z dowodu i wpisuje fakt do publicznej księgi — nie musisz nosić własnej pieczątki, którą ktoś mógłby ukraść. Znacznik czasu to pieczęć zegara na poczcie: niezależny świadek godziny.", "why": "Podpis daje niezaprzeczalność (kto wyprodukował) i autentyczność, a Rekor sprawia, że 'kto co kiedy podpisał' przetrwa nawet usunięcie kluczy. Uczciwie: znacznik czasu to standardowy RFC-3161 od darmowego freetsa.org — NIE jest jeszcze kwalifikowanym znacznikiem eIDAS (QTS); kod jest jednak gotowy, by przełączyć się na kwalifikowanego dostawcę samą konfiguracją (zmienne QTS_PROVIDER/QTS_URL), bez zmiany kodu.", "inRepo": "seal-evidence.sh Step 3 (cosign sign-blob keyless, linie 352-436) i Step 4 (openssl ts, RFC-3161, linie 452-609). Domyślny TSA to freetsa.org oznaczony 'NON-QUALIFIED' (linie 75-101); etykieta 'qualified' domyślnie false, by paczka nigdy nie zawyżała statusu.", "refs": ["Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "  if openssl ts -query -data \"${data}\" -sha256 -cert -out \"${tsq}\" >/dev/null 2>&1; then\n    # Build the curl arg list. An optional TSA_AUTH header lets authenticated\n    # (paid) qualified-QTS endpoints work without changing this code; it is\n    # passed verbatim and only added when non-empty (freetsa needs no auth).\n    local -a curl_args=(-fsS -H \"Content-Type: application/timestamp-query\")\n    [ -n \"${TSA_AUTH}\" ] && curl_args+=(-H \"${TSA_AUTH}\")\n    curl_args+=(--data-binary \"@${tsq}\" \"${TSA_URL}\" -o \"${tsr}\")\n    if curl \"${curl_args[@]}\" 2>/dev/null; then\n      # Produced AND valid: only count a token the TSA actually granted. A 200\n      # response carrying a non-token body must NOT masquerade as a stamp.\n      if tsr_is_valid_token \"${tsr}\"; then\n        set_sig rfc3161 \"${label}_tsr=$(basename \"${tsr}\")\" \"${label}_status=stamped\"\n        log \"rfc3161: ${label} timestamped via ${TSA_URL} (token validated: granted, qualified=${TSA_QUALIFIED_LABEL})\"\n        return 0", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 479, "howItWorks": "To Step 4 — znacznik czasu RFC-3161. `openssl ts -query -data ... -sha256 -cert` tworzy zapytanie (.tsq) zawierające hash danych (np. merkle-root.txt). Potem `curl` wysyła to zapytanie POST-em na endpoint TSA
