 (`TSA_URL`, domyślnie freetsa.org) i zapisuje odpowiedź (.tsr). Kluczowe: `tsr_is_valid_token` sprawdza, czy TSA naprawdę 'GRANTED' token — dopiero wtedy `set_sig` zapisuje status `stamped`. Wcześniej (Step 3, w tym samym pliku) `cosign sign-blob --yes --bundle` podpisuje merkle-root.txt podpisem keyless, a bundle trafia z dowodem do Rekor. Etykieta `qualified` doklejana do logu pochodzi z `infer_qualified()`, które domyślnie daje 'false'.", "whyItWorks": "Dwie niezależne warstwy: cosign keyless (tożsamość budowniczego przez krótkotrwały cert Fulcio + publiczny rejestr Rekor — bez przechowywanego klucza prywatnego, który mógłby wyciec) oraz RFC-3161 (zaufana, zewnętrzna pieczęć 'to istniało o tej godzinie'). Walidacja `tsr_is_valid_token` jest uczciwym zabezpieczeniem: odpowiedź HTTP 200 z nie-tokenem (np. strona błędu) NIE może udawać znacznika — bez tego paczka zawyżałaby swój status. Domyślne `qualified=false` na freetsa.org gwarantuje, że paczka nigdy nie twierdzi, że ma kwalifikowany (eIDAS) znacznik, gdy go nie ma — uczciwość przed wygodą."}, {"id": "gt-7-worm", "title": "Krok 7 — niezmienialna paczka (WORM) i uczciwe czerwone bramki", "plain": "Gotowa, zapieczętowana paczka ląduje w magazynie typu WORM (Write Once, Read Many — zapisz raz, czytaj wiele): po zapisaniu nikt nie może jej już nadpisać ani usunąć przez ustalony czas. Nie każda bramka świeci jednak na zielono — niektóre uczciwie świecą na czerwono, dopóki nie ma realnego dowodu: np. test odtworzenia z kopii (restore-test) i test penetracyjny (pentest).", "analogy": "WORM to jak wrzucenie dokumentu do betonowego sejfu depozytowego z zamkiem czasowym: po zamknięciu nikt — nawet właściciel — nie zmieni zawartości aż do upływu terminu. Czerwone bramki to jak puste pola w karcie przeglądu: lepiej szczerze zostawić 'niezbadane' niż wstawić fałszywą pieczątkę.", "why": "Niezmienialność to dowód, że paczki nie 'poprawiono' po fakcie pod kontrolę. Uczciwe czerwone bramki to fundament zasady projektu 'claims == reality': specyfikacja wprost wymienia 'backupy bez testu odtworzenia' i 'polityki na zawsze tylko ostrzegające' jako główne powody ODRZUCENIA paczki przez audytora.", "inRepo": "seal-evidence.sh zapisuje stan przez helper 'set-worm' (manifest pole worm_state). Czerwone bramki restore-test i pentest są opisane w evidence-pack-specification.md sekcja 3 (wiersze 'Backup + successful restore-test', 'Pen test') i sekcja 8 (rejection triggers #3, #4).", "refs": ["Pipeline/scripts/seal-evidence.sh", "evidence-pack-specification.md"], "codeExcerpt": "    if cmd == \"set-worm\":\n        data[\"worm_state\"] = argv[2]\n        save(path, data)\n        return 0", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "python", "codeStart": 227, "howItWorks": "Ten helper (osadzony w seal-evidence.sh) zapisuje w manifeście pole `worm_state` — czyli odnotowuje, w jakim stanie znalazła się paczka w magazynie WORM (Write Once, Read Many). Realne, niezmienne przechowywanie egzekwuje infrastruktura: w `Pipeline/infra/modules/storage/main.tf` zasób `azurerm_storage_container_immutability_policy` ustawia okno retencji (domyślnie 1825 dni = 5 lat); po zablokowaniu (`locked = true`) nikt nie nadpisze ani nie skasuje plików przed upływem tego czasu. Manifest zapisuje stan, infra wymusza niezmienność. Co do czerwonych bramek — spec (sekcja 8) wprost wymienia rejection trigger #3: 'Backups without a restore test', a sekcja 3 wiersz 'Pen test' wymaga niezależnego testu adversarialnego.", "whyItWorks": "WORM odpowiada na pytanie z mapy: 'czy mogę ufać, że tej paczki nie podmieniono?'. Bez niezmiennego magazynu nawet idealnie podpisana paczka mogłaby zostać po cichu zastąpiona — dlatego retencja i lock są częścią dowodu integralności. Uczciwe czerwone bramki (restore-test, pentest) są równie ważne: spec traktuje 'kopie bez testu odtworzenia' i 'guardraile, które ostrzegają, ale nigdy nie blokują' jako powody ODRZUCENIA paczki. Świecenie na czerwono, dopóki nie ma realnego dowodu, jest cechą, nie wadą — to dowód, że bramki naprawdę egzekwują, a nie tylko udają zielone."}, {"id": "gt-8-auditor-verify", "title": "Krok 8 — audytor weryfikuje sam, bez zaufania do nas", "plain": "Na końcu audytor (albo my, kontrolnie) odpala jeden skrypt weryfikujący. Sprawdza on po kolei: czy sumy kontrolne plików się zgadzają, czy przeliczony na nowo korzeń Merkle pasuje do zapisanego, czy podpis cosign jest ważny i przypięty do właściwej tożsamości, czy istnieje dowód obecności w rejestrze Rekor, czy znacznik czasu RFC-3161 jest prawdziwy i czy PDF jest zgodny z normą archiwizacji. Każdy test wypisuje dokładnie jedną linię: PASS, SKIP albo FAIL.", "analogy": "Jak rzeczoznawca, który nie pyta sprzedawcy 'czy auto jest oryginalne?', tylko sam skanuje numer VIN, porównuje z dokumentami i dzwoni do bazy. Nie ufa — sprawdza. I tutaj 'sprawdza' to jeden skrypt, a nie wiara w nasze słowo.", "why": "To domyka złotą nić i realizuje tezę 'L5' ze specyfikacji: audyt staje się zapytaniem do ciągle generowanego, kryptograficznie weryfikowalnego magazynu dowodów — audytor weryfikuje podpisy i czyta matrycę, zamiast prosić nas o doszywanie dowodów. Skrypt kończy się sukcesem tylko, gdy ŻADEN test nie zwrócił FAIL.", "inRepo": "Pipeline/scripts/verify-evidence-pack.sh — 7 kontroli wymienionych w nagłówku (linie 8-17): sha256, przeliczenie korzenia Merkle (RFC-6962), cosign verify-blob z przypiętą tożsamością, dowód inkluzji Rekor, openssl ts -verify, veraPDF, kompletność pieczętowania.", "refs": ["Pipeline/scripts/verify-evidence-pack.sh"], "codeExcerpt": "    if [ -f \"${MANIFEST_PY}\" ]; then\n      if RECOMPUTED=\"$(python3 \"${MANIFEST_PY}\" \"${EVIDENCE_DIR}\" --verify 2>/dev/null)\"; then\n        RECOMPUTED=\"$(printf '%s' \"${RECOMPUTED}\" | tr -d '[:space:]')\"\n        USED_GENERATOR=1\n      else\n        # Non-zero exit = integrity failure (missing/altered artifact or root mismatch).\n        RECOMPUTED=\"\"\n      fi\n    fi\n    # Fallback to the in-script recomputation only if the generator was unusable.\n    if [ \"${USED_GENERATOR}\" -eq 0 ] && [ -z \"${RECOMPUTED}\" ]; then\n      RECOMPUTED=\"$(merkle_recompute | tr -d '[:space:]')\"\n    fi\n    if [ -n \"${RECOMPUTED}\" ] && [ \"${RECOMPUTED}\" = \"${EXPECTED}\" ]; then\n      if [ \"${USED_GENERATOR}\" -eq 1 ]; then\n        pass \"Merkle root matches manifest (RFC6962, via generate-evidence-manifest.py)\"\n      else\n        pass \"Merkle root matches manifest (RFC6962, recomputed in-runbook)\"\n      fi\n    else\n      fail \"Merkle root MISMATCH (manifest=${EXPECTED:0:16}… recomputed=${RECOMPUTED:0:16}…)\"\n    fi", "codePath": "Pipeline/scripts/verify-evidence-pack.sh", "codeLang": "bash", "codeStart": 151, "howItWorks": "To rdzeń weryfikacji audytora — kontrola #2 z siedmiu wymienionych w nagłówku skryptu. `EXPECTED` to korzeń zapisany w manifeście. Skrypt przelicza go OD NOWA: najpierw woła generator z flagą `--verify` (re-hashuje każdy zapisany artefakt i wypisuje sam korzeń; niezerowy kod = uszkodzony/brakujący plik), a gdyby generatora nie było, używa zapasowej funkcji `merkle_recompute`. Potem porównuje przeliczony korzeń z zapisanym: zgoda => `pass`, niezgoda => `fail`. Każda z 7 kontroli (sha256, Merkle, cosign verify-blob z przypiętą tożsamością, inkluzja Rekor, openssl ts -verify, veraPDF, kompletność pieczętowania) wypisuje dokładnie jedną linię PASS/SKIP/FAIL.", "whyItWorks": "To realizacja zasady 'audytor nie musi nam wierzyć'. Skrypt nie ufa zapisanej liczbie — przelicza korzeń tym samym algorytmem RFC 6962 z faktycznej zawartości plików, więc dowolna podmiana bajtu daje MISMATCH i FAIL. Polityka wyjścia (exit 0 tylko gdy NIC nie FAIL; SKIP dozwolony dla nieobecnego narzędzia/wejścia) jest uczciwa: lokalnie zapieczętowana, zdegradowana paczka, gdzie da się sprawdzić tylko sha256 i Merkle, nadal przechodzi, ale brak narzędzia nigdy nie udaje sukcesu. Jedna linia na test sprawia, że werdykt jest czytelny i niepodważalny — audytor odpala jeden skrypt i widzi prawdę własnymi oczami, bez zaufania do producenta."}]}], "glossary": [{"term": "Admission control", "def": "Kontrola wpuszczania — weryfikacja podpisu i reguł zanim cokolwiek ruszy na serwerach."}, {"term": "Agregator", "def": "Skrypt łączący wszystkie werdykty w jeden podpisany plik z ogólnym PASS/FAIL."}, {"term": "Artefakt", "def": "Plik-wynik wyprodukowany przez fazę (raport skanu, SBOM, podpis, PDF)."}, {"term": "attestation", "def": "Podpisane oświadczenie maszynowe o fakcie (np. 'ten obraz zbudowano tak a tak'), które da się zweryfikować."}, {"term": "bash", "def": "Język poleceń terminala; skrypty .sh wykonują zadania krok po kroku."}, {"term": "Bramka (gate)", "def": "Automatyczny sprawdzian na drodze kodu do wdrożenia; przepuszcza tylko gdy warunek jest spełniony."}, {"term": "CD (Continuous Delivery/Deployment)", "def": "Ciągłe dostarczanie/wdrażanie — automatyczne przygotowanie i często wdrożenie kodu, który przeszedł sprawdzenia."}, {"term": "CI (Continuous Integration)", "def": "Ciągła integracja — automatyczne sprawdzanie kodu przy każdej zmianie (kompilacja, testy)."}, {"term": "CI/CD", "def": "Continuous Integration / Continuous Delivery — automatyczna taśma produkcyjna oprogramowania: zbiera kod, testuje, buduje i przygotowuje do wdrożenia bez ręcznej dłubaniny."}, {"term": "CISA (kategorie justification)", "def": "5 oficjalnych powodów, dla których podatność nas nie dotyczy (np. feralny kod się nie wykonuje)."}, {"term": "claims == reality", "def": "Zasada projektu: deklaracje muszą odpowiadać faktom — nie udaje się lepszego stanu niż rzeczywisty."}, {"term": "Compliance-as-code", "def": "Sprawdzanie zgodności z przepisami (DORA/NIS2/RODO) automatycznym skryptem, dający zmierzoną liczbę zamiast deklaracji."}, {"term": "container image", "def": "Gotowa paczka z aplikacją i całym jej środowiskiem; skanowana przez trivy image."}, {"term": "cosign", "def": "Narzędzie do podpisywania i weryfikowania artefaktów oprogramowania (część Sigstore); tu używane w trybie keyless."}, {"term": "Cosign keyless", "def": "Podpisywanie artefaktów bez stałego klucza prywatnego; tożsamość bierze się z OIDC, fakt podpisania trafia do dziennika Rekor."}, {"term": "Cosign keyless / Rekor", "def": "Podpis kryptograficzny bez stałego klucza (Sigstore) + publiczny rejestr przejrzystości potwierdzający podpis."}, {"term": "CVE", "def": "Common Vulnerabilities and Exposures — publiczny numer katalogowy konkretnej, znanej podatności (np. CVE-2026-1234)."}, {"term": "CycloneDX / OpenVEX", "def": "Otwarte standardy formatu: CycloneDX dla SBOM, OpenVEX dla dokumentów VEX."}, {"term": "DAST", "def": "Dynamic Application Security Testing — testowanie DZIAŁAJĄCEJ aplikacji od zewnątrz, jak włamywacz próbujący klamek."}, {"term": "degrade mode", "def": "Tryb lokalny (EVIDENCE_ALLOW_DEGRADE=1), w którym brak narzędzia jest zapisywany, a nie zatrzymuje budowy."}, {"term": "Degrade na PR", "def": "Tryb, w którym bramki na pull requeście tylko ostrzegają (żółte), a na main blokują (czerwone)."}, {"term": "DevSecOps", "def": "Sposób pracy, w którym bezpieczeństwo (Sec) jest wplecione w całą taśmę tworzenia i dostarczania oprogramowania, a nie doklejone na końcu."}, {"term": "DORA", "def": "Unijne rozporządzenie o odporności cyfrowej firm finansowych; w Polsce nadzoruje KNF; retencja dowodów zwykle 5 lat."}, {"term": "DPA", "def": "Data Processing Agreement — umowa powierzenia przetwarzania danych zawierana z dostawcą (RODO art. 28)."}, {"term": "DPIA", "def": "Data Protection Impact Assessment — ocena skutków dla ochrony danych, robiona przy ryzykownym przetwarzaniu (RODO art. 35)."}, {"term": "Drzewo / korzeń Merkle", "def": "Jeden hash reprezentujący całą teczkę; zmiana dowolnego pliku zmienia korzeń."}, {"term": "eIDAS", "def": "Unijne rozporządzenie o usługach zaufania: podpisy, pieczęcie i kwalifikowane znaczniki czasu (QTS) o mocy dowodowej w sądzie."}, {"term": "eIDAS QTS", "def": "Qualified Time Stamp wg unijnego rozporządzenia eIDAS — prawnie kwalifikowany znacznik czasu od certyfikowanego dostawcy; pipeline jeszcze go nie używa, ale jest na niego gotowy."}, {"term": "evidence pack", "def": "Paczka dowodów audytowych — komplet podpisanych artefaktów dowodzących bezpieczeństwa i zgodności, generowany przez pipeline."}, {"term": "fail-closed", "def": "Zasada 'w razie wątpliwości blokuj': gdy czegoś brakuje lub coś zawiedzie w trybie CI, przebieg jest zatrzymywany, zamiast cicho przepuszczany."}, {"term": "Fulcio", "def": "Urząd Sigstore wydający krótkotrwały certyfikat powiązany z tożsamością podpisującego (potwierdzaną przez OIDC) — zamiast stałego klucza prywatnego."}, {"term": "Golden thread", "def": "Złota nić — łańcuch: obietnica kontroli → dowód → etap taśmy → przepis prawa → kryterium akceptacji audytora."}, {"term": "green-by-absence", "def": "Pozorny sukces wynikający z tego, że czegoś nie przetestowano — pułapka, którą zamyka self-test."}, {"term": "hash / SHA-256", "def": "Cyfrowy odcisk palca pliku — krótki ciąg znaków; zmiana choćby jednego bajtu daje zupełnie inny odcisk."}, {"term": "honest-pending", "def": "Uczciwe oznaczenie 'jeszcze nie wykonane' zamiast udawanego sukcesu."}, {"term": "IaC", "def": "Infrastructure as Code — opisywanie infrastruktury (serwerów, sieci) jako kodu, który da się skanować i wersjonować."}, {"term": "in-toto Statement", "def": "Standardowy format dokumentu pochodzenia/atestacji, używany dla SLSA provenance."}, {"term": "INDETERMINATE", "def": "Status 'nie dało się zmierzyć' (np. pusty plik {}); świadomie NIE jest to PASS."}, {"term": "ISO 27001", "def": "Międzynarodowa norma systemu zarządzania bezpieczeństwem informacji; dowód wspierający, ale nie zastępujący zgodności z DORA/NIS2."}, {"term": "JSON", "def": "Format danych w nawiasach klamrowych, pary 'nazwa': wartość."}, {"term": "JSON Schema", "def": "Wzór opisujący, jak ma wyglądać poprawny plik JSON (jakie pola, typy)."}, {"term": "KNF", "def": "Komisja Nadzoru Finansowego — polski regulator finansowy, właściwy dla podmiotów objętych DORA."}, {"term": "Kontener / obraz / Dockerfile", "def": "Przenośna paczka z aplikacją; Dockerfile to przepis na jej zbudowanie."}, {"term": "Koperta T-33", "def": "Wspólny format JSON każdego werdyktu: status, tier, measured, threshold, detail, tool_version, validator, checked_at."}, {"term": "LEI", "def": "Legal Entity Identifier — globalny numer identyfikujący firmę (jak NIP, ale międzynarodowy); wymagany przez DORA w rejestrze dostawców."}, {"term": "linting", "def": "Sprawdzanie jakości i spójności kodu (tu: MegaLinter)."}, {"term": "main", "def": "Główna, 'produkcyjna' gałąź kodu — to, co naprawdę idzie na serwery."}, {"term": "Matryca zgodności", "def": "Tabela wiersz=wymóg prawny -> dowód -> wynik, pogrupowana po przepisach."}, {"term": "Merkle (drzewo / korzeń)", "def": "Sposób spięcia wielu plików w jeden hash 'na szczycie': zmiana dowolnego pliku zmienia korzeń, więc każda manipulacja jest wykrywalna."}, {"term": "Merkle root", "def": "Jedna suma kontrolna wyliczona ze wszystkich plików; zmiana czegokolwiek ją zmienia."}, {"term": "NIS2", "def": "Unijna dyrektywa o cyberbezpieczeństwie kluczowych i ważnych podmiotów (Dir. EU 2022/2555); w Polsce wdrażana nowelizacją ustawy o KSC."}, {"term": "NIS2 / KSC", "def": "Dyrektywa UE 2022/2555 o cyberbezpieczeństwie; w Polsce wdrażana przez ustawę o krajowym systemie cyberbezpieczeństwa."}, {"term": "Obraz / image", "def": "Zapakowana aplikacja gotowa do uruchomienia w dowolnym środowisku (kontener)."}, {"term": "OIDC", "def": "OpenID Connect — standard logowania/potwierdzania tożsamości; tu pozwala pipeline'owi udowodnić Fulcio, kim jest, przy podpisie keyless."}, {"term": "OPA", "def": "Open Policy Agent — silnik, który automatycznie sprawdza, czy coś spełnia zdefiniowane reguły (np. czy wdrożenie wolno przepuścić)."}, {"term": "OPA (Open Policy Agent)", "def": "Otwarty silnik reguł; czyta polityki i wydaje werdykt dozwolone/odmowa."}, {"term": "OPA / Rego", "def": "Silnik reguł (Open Policy Agent) i jego język — decyduje, czy bramka przepuszcza."}, {"term": "Oprogramowanie (software)", "def": "Zestaw instrukcji (kod), który mówi komputerowi, co ma robić."}, {"term": "Phase F / Org Required", "def": "Oznaczenie w matrix: wymóg, którego pipeline nie pokrywa — musi go załatwić organizacja (governance, runbooki, procesy)."}, {"term": "PII", "def": "Dane osobowe (np. PESEL, e-mail), których nie powinno być w repozytorium."}, {"term": "Pipeline", "def": "Taśma produkcyjna dla kodu — ustalony ciąg automatycznych kroków od zapisania kodu do wdrożenia."}, {"term": "Pipeline / taśma", "def": "Zautomatyzowany ciąg kroków, przez który przechodzi kod od zmiany do wdrożenia."}, {"term": "policy-as-code", "def": "Polityki i wymagania zapisane jako kod, który automatycznie blokuje to, co ich nie spełnia — zamiast dokumentu, który tylko 'doradza'."}, {"term": "PR (Pull Request)", "def": "Prośba o włączenie zmiany do głównego kodu — wymaga przeglądu i zatwierdzenia, zostawiając ślad 'kto i co zmienił'."}, {"term": "provenance", "def": "Metryczka pochodzenia artefaktu: kto, czym, z jakich wejść i kiedy go zbudował — przypięta do jego cyfrowego odcisku (digest)."}, {"term": "Provenance (pochodzenie)", "def": "Metryczka artefaktu: kto, gdzie, z jakiego kodu i jak go zbudował."}, {"term": "Provenance / prowenancja", "def": "Udokumentowane pochodzenie obrazu: kto, gdzie i z czego go zbudował."}, {"term": "Pull request (PR)", "def": "Propozycja wmieszania swoich zmian do głównego kodu — wersja jeszcze nierobocza, przed akceptacją."}, {"term": "Python", "def": "Czytelny język programowania; tu pisane są walidatory i generatory dowodów."}, {"term": "QTS", "def": "Qualified Time Stamp — kwalifikowany znacznik czasu od zaufanego dostawcy (KIR, Certum, EuroCert, CenCert), z mocą dowodową (eIDAS art. 41)."}, {"term": "Rego", "def": "Język, w którym pisze się reguły dla OPA (policy-as-code)."}, {"term": "Rego / OPA", "def": "Język reguł (Rego) i silnik (OPA), które decydują 'wolno / nie wolno'."}, {"term": "Rekor", "def": "Publiczny, niezmienialny rejestr (dziennik przejrzystości), w którym zapisuje się fakt podpisania — 'kto co kiedy podpisał' przetrwa nawet usunięcie kluczy."}, {"term": "Repozytorium", "def": "Folder z całym projektem i historią jego zmian (śledzony przez git)."}, {"term": "Retencja", "def": "Okres obowiązkowego przechowywania dowodów; tu minimum 1825 dni (5 lat, wymóg DORA)."}, {"term": "RFC-3161", "def": "Standardowy protokół znakowania czasem — zaufany, niezależny dowód 'ten plik istniał o tej godzinie'; tu w wersji niekwalifikowanej (freetsa.org)."}, {"term": "RFC-3161 / TSA", "def": "Standardowy znacznik czasu z serwera czasu — dowód, że plik istniał w danej chwili (tu nie-kwalifikowany freetsa.org)."}, {"term": "RODO", "def": "Rozporządzenie o ochronie danych osobowych (GDPR, Reg. EU 2016/679) — zasady zgodnego z prawem przetwarzania danych ludzi."}, {"term": "RODO/GDPR", "def": "Rozporządzenie o ochronie danych osobowych; wymaga RoPA, DPIA i zgłoszenia wycieku w 72h; w Polsce egzekwuje UODO."}, {"term": "RoPA", "def": "Records of Processing Activities — rejestr czynności przetwarzania danych osobowych (RODO art. 30)."}, {"term": "RTO/RPO", "def": "Recovery Time/Point Objective — docelowy czas powrotu po awarii i maksymalna akceptowalna utrata danych."}, {"term": "SARIF", "def": "Static Analysis Results Interchange Format — wspólny format pliku, w którym narzędzia zapisują znalezione problemy, żeby dało się je czytać jednolicie."}, {"term": "SAST", "def": "Static Application Security Testing — analiza samego kodu źródłowego pod kątem błędów bezpieczeństwa, bez uruchamiania aplikacji (jak korekta tekstu przed drukiem)."}, {"term": "SBOM", "def": "Software Bill of Materials — pełen spis składników oprogramowania, jak skład na etykiecie (tu: Syft/CycloneDX)."}, {"term": "SBOM (Software Bill of Materials)", "def": "Spis składników oprogramowania — jak skład na opakowaniu jedzenia, tylko dla aplikacji."}, {"term": "SCA", "def": "Software Composition Analysis — sprawdzanie użytych bibliotek/zależności pod kątem znanych dziur i niedozwolonych licencji."}, {"term": "severity", "def": "Powaga znaleziska: CRITICAL > HIGH > MEDIUM > LOW; pipeline blokuje na CRITICAL i HIGH."}, {"term": "SHA-256 (hash / suma kontrolna)", "def": "Krótki, niepodrabialny odcisk palca pliku; zmiana 1 bajtu zmienia cały odcisk."}, {"term": "Shift-left", "def": "Zasada \"przesuń w lewo\" — sprawdzaj bezpieczeństwo i jakość jak najwcześniej w procesie."}, {"term": "Sigstore", "def": "Zestaw otwartych usług do podpisywania oprogramowania bez ręcznego zarządzania kluczami (obejmuje cosign, Fulcio, Rekor)."}, {"term": "Sigstore / Fulcio / Rekor", "def": "Ekosystem podpisów: Fulcio wydaje krótki certyfikat, Rekor to publiczny, niezmienialny rejestr podpisów."}, {"term": "SLSA", "def": "Supply-chain Levels for Software Artifacts — skala (L0-L3) mówiąca, jak mocno chroniony i weryfikowalny jest proces budowania; ten pipeline osiąga Build L2."}, {"term": "SLSA (Supply-chain Levels for Software Artifacts)", "def": "Poziomy zaufania do łańcucha budowy oprogramowania; ten pipeline osiąga Build L2 (nie L3)."}, {"term": "SLSA / Build L2", "def": "Skala wiarygodności pochodzenia; tu poziom Build L2 (automatyczne, podpisane), NIE L3."}, {"term": "SLSA Build L2", "def": "Poziom dojrzałości łańcucha dostaw, jaki taśma osiąga (L3 to wyższy, jeszcze nie)."}, {"term": "Smoke test", "def": "Szybkie sprawdzenie, czy wdrożona aplikacja w ogóle wstała (pukanie do /health)."}, {"term": "Terraform", "def": "Narzędzie 'infrastruktura jako kod' — opisuje i wprowadza zmiany na serwerach z plików tekstowych."}, {"term": "Terraform / HCL", "def": "Narzędzie i język do opisania infrastruktury chmurowej jako kod (pliki .tf)."}, {"term": "Tier BLOCKING", "def": "Poziom kontroli, której porażka zatrzymuje pipeline."}, {"term": "Tier EVIDENCE-ONLY", "def": "Poziom kontroli, która zapisuje zmierzoną liczbę, ale nigdy nie blokuje."}, {"term": "Trigger", "def": "Zdarzenie uruchamiające taśmę: PR, push do main, albo ręczne uruchomienie."}, {"term": "TSA", "def": "Time Stamping Authority — niezależny urząd, który wystawia znaczniki czasu (RFC-3161)."}, {"term": "UODO", "def": "Urząd Ochrony Danych Osobowych — polski organ egzekwujący RODO."}, {"term": "VEX", "def": "Vulnerability Exploitability eXchange — adnotacja mówiąca, które wykryte podatności realnie dotyczą produktu, a które go nie dotyczą."}, {"term": "Walidator", "def": "Skrypt sprawdzający, czy dokument spełnia regułę; wydaje PASS/FAIL/INDETERMINATE."}, {"term": "Warn", "def": "Bramka ostrzegająca — zapisuje uwagę, ale przepuszcza dalej (nie blokuje)."}, {"term": "Wdrożenie (deploy)", "def": "Umieszczenie gotowej aplikacji na serwerze, by mogli z niej korzystać prawdziwi użytkownicy."}, {"term": "WORM", "def": "Write Once, Read Many — magazyn, w którym po zapisaniu danych nie da się ich już nadpisać ani usunąć przez ustalony czas."}, {"term": "YAML", "def": "Czytelny format tekstowy oparty na wcięciach; tu opisuje kroki taśmy CI."}]};

/* ============ helpers ============ */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 8 wyrafinowanych, harmonijnych akcentów (ciepłe + przygaszone)
const PALETTE = [
  "#b5462e", // terakota
  "#9a6a1f", // ochra
  "#3f7d63", // szałwia
  "#2f6f8f", // morski stalowy
  "#6b4a86", // śliwka
  "#9c3556", // wino
  "#4a6b2f", // oliwka
  "#a85a2a", // miedź
];
const SOFT = [
  "#f6e7e1","#f6ecd9","#e3eee7","#dcebf1","#ece3f2","#f3dde4","#e6eedd","#f3e4d7"
];
// ciemniejsze warianty TEKSTOWE akcentów — czytelne na jasnym tle (WCAG AA, >=6:1)
const PALETTE_INK = [
  "#9e3a23", // terakota
  "#7d5413", // ochra
  "#326350", // szałwia
  "#285d77", // morski stalowy
  "#5b3f72", // śliwka
  "#872c49", // wino
  "#3c5726", // oliwka
  "#8a4920", // miedź
];
const accentFor = (i) => PALETTE[i % PALETTE.length];
const accentInkFor = (i) => PALETTE_INK[i % PALETTE_INK.length];
const softFor = (i) => SOFT[i % SOFT.length];
const pad2 = (n) => String(n).padStart(2,"0");
const slug = (s) => "ch-" + String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");

/* ============ SVG art (autorskie, cienkoliniowe) ============ */

// pełna taśma pipeline na okładce
function svgPipelineRibbon(){
  const stages = ["Kod","Build","Skan","Podpis","Dowody","Wydanie"];
  const w=1200, h=190, n=stages.length, gap=w/(n);
  let dots="", labels="";
  for(let i=0;i<n;i++){
    const x = gap*i + gap/2;
    dots += `<circle cx="${x}" cy="95" r="13" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.2"/>
             <circle cx="${x}" cy="95" r="4.5" fill="var(--accent)"/>`;
    labels += `<text x="${x}" y="138" text-anchor="middle" font-family="var(--sans)" font-size="17" fill="var(--ink-soft)" font-weight="600">${stages[i]}</text>
               <text x="${x}" y="64" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--accent)">0${i+1}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Taśma pipeline: ${stages.join(', ')}">
    <line x1="${gap/2}" y1="95" x2="${w-gap/2}" y2="95" stroke="var(--rule)" stroke-width="2"/>
    <line x1="${gap/2}" y1="95" x2="${w-gap/2}" y2="95" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 10" opacity=".7"/>
    ${dots}${labels}
  </svg>`;
}

// cienkie tło okładki — siatka linii + węzły
function svgCoverBg(){
  let lines="";
  for(let y=60;y<900;y+=60){ lines += `<line x1="0" y1="${y}" x2="1400" y2="${y}" stroke="var(--ink)" stroke-width="1" opacity=".03"/>`; }

  return `<svg class="cover-bg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${lines}</svg>`;
}

/* ============ render ============ */
function refsHTML(refs){
  if(!refs || !refs.length) return "";
  return `<div class="refs"><span class="rlabel">w repo</span>${refs.map(r=>`<code>${esc(r)}</code>`).join("")}</div>`;
}

// ikona pliku (inline SVG, bez bibliotek)
const FILE_ICO = '<svg class="fileico" viewBox="0 0 14 18" fill="none" aria-hidden="true"><path d="M2 1h6l4 4v11a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v4h4" stroke="currentColor" stroke-width="1.3"/></svg>';

// proza pod kodem -> akapity (puste linie dziela na osobne <p>)
function proseHTML(txt){
  return String(txt).split(/\n{2,}/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
}

// sekcja KODU — pokazuje sie TYLKO gdy codeExcerpt niepuste.
// Gdy puste: jesli jest howItWorks -> notka "Pojeciowe"; inaczej nic.
function codeSectionHTML(b){
  const hasCode = b && typeof b.codeExcerpt === "string" && b.codeExcerpt.trim() !== "";
  const how  = (b && b.howItWorks) ? String(b.howItWorks).trim() : "";
  const why  = (b && b.whyItWorks) ? String(b.whyItWorks).trim() : "";

  if(!hasCode){
    if(how){
      return `<div class="conceptnote">
        <div class="cnh">Pojęciowe</div>
        ${proseHTML(how)}
      </div>`;
    }
    return "";
  }

  const path  = (b.codePath ? String(b.codePath) : "").trim();
  const lang  = (b.codeLang ? String(b.codeLang) : "").trim();
  const start = Number.isFinite(+b.codeStart) && +b.codeStart > 0 ? Math.floor(+b.codeStart) : 1;

  // VERBATIM: zachowaj biale znaki, ESCAPE HTML, kazda linia w <span class="cl"> dla numeracji
  const lines = b.codeExcerpt.replace(/\n$/,"").split("\n");
  const codeLines = lines.map(l=>`<span class="cl">${esc(l) || "&#8203;"}</span>`).join("");

  const cap = `<div class="codecap">
    ${FILE_ICO}
    ${path ? `<span class="cpath">${esc(path)}</span>` : ""}
    <span class="cline">:${start}</span>
    ${lang ? `<span class="clang">${esc(lang)}</span>` : ""}
  </div>`;

  // counter-reset ustawiamy na start-1, by pierwsza linia = codeStart
  const panel = `<div class="codepanel">
    <span class="dots"><i></i><i></i><i></i></span>
    <pre><code style="counter-reset:cline ${start-1}">${codeLines}</code></pre>
  </div>`;

  const prose = (how || why) ? `<div class="codeprose">
    ${how ? `<div class="codenote"><p class="cnh"><span class="cnico">⚙️</span> Jak to działa</p>${proseHTML(how)}</div>` : ""}
    ${why ? `<div class="codenote"><p class="cnh"><span class="cnico">🎯</span> Dlaczego</p>${proseHTML(why)}</div>` : ""}
  </div>` : "";

  return `<div class="codeblock">${cap}${panel}${prose}</div>`;
}

// pojedyncza lekcja, wariant zalezny od indeksu
function lessonHTML(b, li, totalAcc){
  const num = `Lekcja ${pad2(li+1)}`;
  // cykl ukladow: 0 cols, 1 cols, 2 feature, 3 quote, potem powtorka
  const variant = li % 4;

  if(variant === 2){ // FEATURE
    const notes = [];
    if(b.why) notes.push(`<span class="chip"><b>Po co:</b> ${esc(b.why)}</span>`);
    if(b.inRepo) notes.push(`<span class="chip"><b>W repo:</b> ${esc(b.inRepo)}</span>`);
    if(b.analogy) notes.push(`<span class="chip"><b>Analogia:</b> ${esc(b.analogy)}</span>`);
    return `<article class="lesson feature reveal">
      <div class="fgrid">
        <div>
          <span class="lnum">${num}</span>
          <h3>${esc(b.title)}</h3>
          <p class="plain lead">${esc(b.plain)}</p>
          <div class="fnotes">${notes.join("")}</div>
          ${refsHTML(b.refs)}
        </div>
        <div class="fart">${chapterArt(totalAcc % 8)}</div>
      </div>
      ${codeSectionHTML(b)}
    </article>`;
  }

  if(variant === 3 && (b.plain)){ // PULL QUOTE
    return `<article class="lesson quote reveal">
      <span class="lnum">${num}</span>
      <div class="pullquote">
        <span class="qmark">&ldquo;</span>
        <blockquote>${esc(b.title)}</blockquote>
      </div>
      <div class="qmeta">
        <span class="qcite">${b.analogy ? "Pomyśl o tym tak" : "Sedno sprawy"}</span>
        <p class="qbody">${esc(b.analogy || b.plain)}</p>
        ${b.why ? `<p class="qbody"><b style="color:var(--ink)">Po co:</b> ${esc(b.why)}</p>` : ""}
        ${refsHTML(b.refs)}
      </div>
      ${codeSectionHTML(b)}
    </article>`;
  }

  // COLS (variant 0,1) — tekst + marginalia
  const notes = [];
  if(b.analogy) notes.push(`<div class="note analogy"><div class="nh">Analogia</div><div class="nb">${esc(b.analogy)}</div></div>`);
  if(b.why)     notes.push(`<div class="note"><div class="nh">Po co to</div><div class="nb">${esc(b.why)}</div></div>`);
  if(b.inRepo)  notes.push(`<div class="note"><div class="nh">Jak w repo</div><div class="nb">${esc(b.inRepo)}</div></div>`);
  return `<article class="lesson cols reveal">
    <span class="lnum">${num}</span>
    <h3>${esc(b.title)}</h3>
    <div class="lcontent">
      <div>
        <p class="plain lead">${esc(b.plain)}</p>
        ${refsHTML(b.refs)}
      </div>
      <aside class="marginalia">${notes.join("") || '<div class="note"><div class="nh">Notka</div><div class="nb">To pojęcie jest fundamentem kolejnych lekcji.</div></div>'}</aside>
    </div>
    ${codeSectionHTML(b)}
  </article>`;
}

function chapterHTML(area, ci){
  const acc = accentFor(ci), sft = softFor(ci), accInk = accentInkFor(ci);
  const id = slug(area.area);
  const intro = esc(area.intro || "");
  const dropCap = intro ? intro.charAt(0) : "•";
  const introRest = intro.slice(1);
  let liGlobal = 0;
  // globalny licznik dla doboru art w feature — uzyjmy indeksu rozdzialu
  const lessons = (area.blocks||[]).map((b,li)=>lessonHTML(b, li, ci)).join("");
  return `<section class="chapter" id="${id}" data-acc="${acc}" data-ink="${accInk}" data-soft="${sft}" data-idx="${ci}" data-title="${esc(area.area)}">
    <div class="chapter-open">
      <span class="bignum">${pad2(ci+1)}</span>
      <div class="wrap">
        <div class="open-grid">
          <div class="reveal">
            <div class="ch-kick"><span class="line"></span> Rozdział ${pad2(ci+1)}</div>
            <h2>${esc(area.area.replace(/^\s*\d+\s*[·.\-]\s*/,""))}</h2>
            <p class="chapter-intro"><span class="dropcap">${esc(dropCap)}</span>${esc(introRest)}</p>
          </div>
          <div class="open-art reveal">${chapterArt(ci)}</div>
        </div>
      </div>
    </div>
    <div class="wrap"><div class="lessons">${lessons}</div></div>
  </section>`;
}

function tocHTML(areas){
  const items = areas.map((a,i)=>`
    <a class="toc-item" href="#${slug(a.area)}" data-toc="${i}">
      <span class="tdash" style="background:${accentFor(i)}"></span>
      <span class="tnum" style="color:${accentInkFor(i)}">${pad2(i+1)}</span>
      <span class="ttxt">${esc(a.area.replace(/^\s*\d+\s*[·.\-]\s*/,""))}</span>
    </a>`).join("");
  return `<nav class="toc"><div class="wrap"><div class="toc-inner">
    <div class="toc-h">Spis treści — ${areas.length} rozdziałów</div>${items}
  </div></div></nav>`;
}

function coverHTML(areas, glossary){
  const blocks = areas.reduce((n,a)=>n+(a.blocks?a.blocks.length:0),0);
  return `<section class="cover" id="cover">
    ${svgCoverBg()}
    <div class="cover-inner wrap">
      <div class="reveal">
        <div class="kicker">CyberForge <span class="sep">/</span> Podręcznik dla zaczynających <span class="sep">/</span> ${new Date().getFullYear()}</div>
        <h1 class="title">Pipeline<br><em>DevSecOps</em><br>od zera</h1>
        <p class="subtitle">Wizualny przewodnik po taśmie, która buduje, sprawdza, podpisuje i wydaje oprogramowanie — opowiedziany prostym językiem, krok po kroku.</p>
        <div class="cover-meta">
          <div class="m"><div class="n">${areas.length}</div><div class="l">rozdziałów</div></div>
          <div class="m"><div class="n">${blocks}</div><div class="l">lekcji pojęć</div></div>
          <div class="m"><div class="n">${glossary.length}</div><div class="l">haseł w słowniczku</div></div>
          <div class="m"><div class="n">0</div><div class="l">wymaganej wiedzy</div></div>
        </div>
      </div>
      <div class="cover-svg-wrap reveal">${svgPipelineRibbon()}</div>
    </div>
    ${tocHTML(areas)}
  </section>`;
}

/* ---- glossary ---- */
function buildGlossary(glossary){
  // grupuj po pierwszej literze
  const groups = {};
  glossary.slice().sort((a,b)=>a.term.localeCompare(b.term,"pl")).forEach(g=>{
    const L = (g.term[0]||"#").toUpperCase();
    (groups[L] = groups[L] || []).push(g);
  });
  return groups;
}
function glossaryHTML(glossary){
  const groups = buildGlossary(glossary);
  const letters = Object.keys(groups).sort((a,b)=>a.localeCompare(b,"pl"));
  const sections = letters.map(L=>`
    <div class="gloss-letter" data-letter="${esc(L)}">
      <div class="gl">${esc(L)}</div>
      <dl class="gloss-grid">
        ${groups[L].map(g=>`<div class="gentry" data-term="${esc(g.term.toLowerCase())}" data-def="${esc(g.def.toLowerCase())}">
          <dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd></div>`).join("")}
      </dl>
    </div>`).join("");
  return `<section class="glossary" id="glossary">
    <div class="wrap">
      <div class="gloss-head">
        <div>
          <h2>Słowniczek</h2>
          <p>${glossary.length} pojęć ułożonych jak indeks na końcu książki.</p>
        </div>
        <div class="gsearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="gsearch" type="search" placeholder="Szukaj pojęcia…" autocomplete="off" aria-label="Szukaj w słowniczku">
        </div>
      </div>
      <div id="gloss-body">${sections}</div>
      <div class="gloss-empty" id="gloss-empty" style="display:none">Brak pojęć pasujących do zapytania.</div>
    </div>
  </section>`;
}

/* ============ mount ============ */
function render(){
  const areas = (DATA && DATA.areas) || [];
  const glossary = (DATA && DATA.glossary) || [];
  const app = document.getElementById("app");
  app.innerHTML =
    coverHTML(areas, glossary) +
    areas.map((a,i)=>chapterHTML(a,i)).join("") +
    glossaryHTML(glossary) +
    `<footer><div class="wrap"><div class="fbig">To koniec taśmy.</div>
      <div>CyberForge · materiał edukacyjny · działa offline (file://)</div></div></footer>`;
  initInteractions(areas);
}

/* ---- interactions ---- */
function setAccent(acc, soft, ink){
  document.documentElement.style.setProperty("--accent", acc);
  document.documentElement.style.setProperty("--accent-soft", soft);
  if(ink) document.documentElement.style.setProperty("--accent-ink", ink);
}

function initInteractions(areas){
  const progress = document.getElementById("progress");
  const topbar = document.getElementById("topbar");
  const crumb = document.getElementById("crumb");

  // progress bar + topbar solidify
  function onScroll(){
    const st = window.scrollY || document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (h>0 ? (st/h*100) : 0) + "%";
    topbar.classList.toggle("solid", st > 60);
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();

  // scrollspy + accent theming per chapter
  const chapters = Array.from(document.querySelectorAll(".chapter"));
  const tocItems = Array.from(document.querySelectorAll(".toc-item"));
  const spy = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const acc = e.target.dataset.acc, soft = e.target.dataset.soft, ink = e.target.dataset.ink;
        const idx = +e.target.dataset.idx;
        setAccent(acc, soft, ink);
        crumb.innerHTML = `Rozdział ${String(idx+1).padStart(2,"0")} · <b>${e.target.dataset.title.replace(/^\s*\d+\s*[·.\-]\s*/,"")}</b>`;
        tocItems.forEach((t,i)=> t.style.background = (i===idx) ? "var(--paper-2)" : "");
      }
    });
  }, {rootMargin:"-45% 0px -50% 0px", threshold:0});
  chapters.forEach(c=>spy.observe(c));

  // reset accent on cover/glossary
  const cover = document.getElementById("cover");
  const coverSpy = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ setAccent("#b5462e","#f6e7e1","#9e3a23"); crumb.innerHTML="Magazyn objaśniający · Pipeline DevSecOps"; }});
  }, {threshold:.4});
  if(cover) coverSpy.observe(cover);

  // reveal on scroll
  const revealer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); revealer.unobserve(e.target); }});
  }, {rootMargin:"0px 0px -8% 0px", threshold:.08});
  document.querySelectorAll(".reveal").forEach(el=>revealer.observe(el));

  // glossary search
  const input = document.getElementById("gsearch");
  const empty = document.getElementById("gloss-empty");
  if(input){
    input.addEventListener("input", ()=>{
      const q = input.value.trim().toLowerCase();
      let any = false;
      document.querySelectorAll(".gloss-letter").forEach(sec=>{
        let secVisible = false;
        sec.querySelectorAll(".gentry").forEach(en=>{
          const hit = !q || en.dataset.term.includes(q) || en.dataset.def.includes(q);
          en.style.display = hit ? "" : "none";
          if(hit){ secVisible = true; any = true; }
          // highlight
          const dt = en.querySelector("dt");
          const term = dt.textContent;
          if(q && hit && term.toLowerCase().includes(q)){
            const i = term.toLowerCase().indexOf(q);
            dt.innerHTML = esc(term.slice(0,i))+'<span class="gt-mark">'+esc(term.slice(i,i+q.length))+'</span>'+esc(term.slice(i+q.length));
          } else {
            dt.textContent = term;
          }
        });
        sec.style.display = secVisible ? "" : "none";
      });
      empty.style.display = any ? "none" : "";
    });
  }
}

render();
</script>
