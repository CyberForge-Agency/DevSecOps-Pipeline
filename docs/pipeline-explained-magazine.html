a być JEDNOCZEŚNIE rygorystycznym i uczciwym. Blokujemy tylko tam, gdzie pomiar jest pewny i bezpieczny od fałszywych alarmów (0 krytycznych CVE, podpis, retencja). Resztę mierzymy i zapisujemy jako fakt, ale nie wstrzymujemy przez to całej firmy. Co ważne: porażka EVIDENCE-ONLY jest świadomie obniżana do wyjścia nieblokującego.", "inRepo": "Klasy Status i Tier oraz mapowanie na kody wyjścia są w Pipeline/scripts/validators/libcompliance.py:84-118. Funkcja exit_code_for (171-184): PASS->0, FAIL->1, INDETERMINATE->2 dla BLOCKING; a EVIDENCE-ONLY zawsze zwraca 0 niezależnie od statusu. Komentarz w aggregate-compliance.py:31-43 potwierdza: tylko BLOCKING przewraca bramkę.", "refs": ["Pipeline/scripts/validators/libcompliance.py", "Pipeline/scripts/aggregate-compliance.py"], "codeExcerpt": "class Status:\n    \"\"\"Allowed ``status`` values for the envelope.\"\"\"\n\n    PASS = \"PASS\"\n    FAIL = \"FAIL\"\n    INDETERMINATE = \"INDETERMINATE\"\n    ALL = frozenset({PASS, FAIL, INDETERMINATE})\n\n\nclass Tier:\n    \"\"\"Allowed ``tier`` values for the envelope.\"\"\"\n\n    BLOCKING = \"BLOCKING\"\n    EVIDENCE_ONLY = \"EVIDENCE-ONLY\"\n    ALL = frozenset({BLOCKING, EVIDENCE_ONLY})\n\n\n# Canonical, ordered key set every envelope carries (used by tests + the gate).\nENVELOPE_KEYS = (\n# ... (pominięto klucze koperty) ...\n)\n\n# Mapping of status -> process exit code for a *BLOCKING* check.\n_STATUS_EXIT = {\n    Status.PASS: 0,\n    Status.FAIL: 1,\n    Status.INDETERMINATE: 2,\n}", "codePath": "Pipeline/scripts/validators/libcompliance.py", "codeLang": "python", "codeStart": 84, "howItWorks": "Dwa słowniki pojęć: klasa Status definiuje trzy dozwolone statusy (PASS, FAIL, INDETERMINATE), a klasa Tier dwa poziomy ważności (BLOCKING i EVIDENCE-ONLY). Słownik _STATUS_EXIT mapuje status na kod wyjścia procesu dla checku BLOCKING: PASS->0, FAIL->1, INDETERMINATE->2. Funkcja exit_code_for (niżej w pliku) używa tego mapowania, ale dla tier EVIDENCE-ONLY zawsze zwraca 0 — niezależnie od statusu. Tym samym tylko checki BLOCKING mogą przewrócić bramkę (kod != 0), co potwierdza też komentarz w aggregate-compliance.py.", "whyItWorks": "Trzeci status INDETERMINATE jest kluczowy: oddziela 'zmierzyłem i jest źle' (FAIL) od 'nie dało się zmierzyć' (INDETERMINATE), więc niczego nie udaje się zaliczyć przez przypadek pustego artefaktu. Podział na tier pozwala być surowym tam, gdzie błąd byłby groźny i fałszywie-dodatni-bezpieczny (0 CVE, podpis, retencja) — a jedynie ODNOTOWywać liczby tam, gdzie wynik to fakt do zaraportowania, nie warunek wdrożenia. Osobny kod wyjścia dla INDETERMINATE (2) daje też orkiestracji precyzyjną informację, czemu się zatrzymano."}, {"id": "compliance-matrix", "title": "Matryca zgodności — tabela wymóg -> dowód -> wynik", "plain": "Matryca zgodności to wielka tabela, w której każdy wiersz to jeden wymóg prawny (np. DORA Art.16.1.a), jego dowód (konkretny plik) i wynik (koperta z walidatora). Skrypt-orkiestrator przechodzi wiersz po wierszu, woła odpowiedni walidator, zbiera koperty i składa z nich jeden plik JSON pogrupowany po przepisach: DORA, NIS2, ISO 27001, SOC2, RODO i Governance.", "analogy": "To jak tabela kontrolna przy odbiorze mieszkania: każdy wiersz to jeden element (gniazdka, okna, instalacja), kolumna 'sprawdzone przez' i kolumna 'wynik'. Na końcu masz jeden arkusz, który pokazuje stan całości — i widać dokładnie, co kuleje.", "why": "Regulator nie pyta 'czy macie pipeline' — pyta 'pokażcie, gdzie spełniacie Artykuł X'. Matryca odpowiada wprost: ten wymóg, ten plik-dowód, ta zmierzona liczba. To zamienia abstrakcyjny przepis w sprawdzalny wiersz z dowodem.", "inRepo": "Buduje ją Pipeline/scripts/generate-compliance-matrix.sh — funkcja row() (linie 186-227) skleja opis wymogu z kopertą walidatora; wiersze grupowane w blokach DORA_ROWS, NIS2_ROWS, ISO_ROWS, SOC2_ROWS, RODO_ROWS, GOVERNANCE_ROWS (linie 328-377). Wynik to JSON o schemacie 'cyberforge-compliance-matrix/v2-content-validated' z polem blocking_failures.", "refs": ["Pipeline/scripts/generate-compliance-matrix.sh"], "codeExcerpt": "row = {\n    \"article\": os.environ[\"ARTICLE\"],\n    \"requirement\": os.environ[\"REQUIREMENT\"],\n    \"evidence\": os.environ[\"EVIDENCE_LABEL\"],\n    \"validator\": os.environ[\"VALIDATOR_ID\"],\n    \"status\": env.get(\"status\", \"INDETERMINATE\"),\n    \"tier\": env.get(\"tier\", \"BLOCKING\"),\n    \"measured\": env.get(\"measured\"),\n    \"threshold\": env.get(\"threshold\"),\n    \"detail\": env.get(\"detail\", \"\"),\n    \"tool_version\": env.get(\"tool_version\"),\n}\nsys.stdout.write(\"      \" + json.dumps(row))\nPY\n}", "codePath": "Pipeline/scripts/generate-compliance-matrix.sh", "codeLang": "bash", "codeStart": 213, "howItWorks": "Funkcja row() jest fabryką jednego wiersza matrycy. Dostaje opis wymogu (article, requirement, evidence) i identyfikator walidatora, uruchamia odpowiedni walidator, by dostać kopertę, a potem ten blok Pythona scala opis wymogu z polami koperty (status, tier, measured, threshold, detail, tool_version) w jeden obiekt JSON wiersza. Zwróć uwagę na bezpieczne domyślne: env.get('status', 'INDETERMINATE') i env.get('tier', 'BLOCKING') — gdyby walidator nic nie zwrócił, wiersz przyjmie najostrożniejszą wartość. Wiersze są dalej grupowane w blokach DORA_ROWS, NIS2_ROWS, ISO_ROWS, SOC2_ROWS, RODO_ROWS i GOVERNANCE_ROWS.", "whyItWorks": "Matryca to tabela wymóg -> dowód -> wynik, którą rozumie zarówno audytor, jak i maszyna. Sklejanie ludzkiego opisu z mierzonymi wartościami koperty daje dokument, który nie tylko mówi 'zgodne', ale pokazuje CO zmierzono i jakim progiem. Domyślne wartości INDETERMINATE/BLOCKING przy braku odpowiedzi to świadoma asekuracja: cisza walidatora nigdy nie zostanie odczytana jako PASS. Całość wychodzi jako JSON o schemacie 'cyberforge-compliance-matrix/v2-content-validated' z polem blocking_failures, które domyka decyzję bramki."}, {"id": "aggregator-verdict", "title": "Agregator — jeden podpisany werdykt całości", "plain": "Pojedyncze koperty to za dużo, żeby ktoś czytał je ręcznie. Agregator zbiera wszystkie werdykty kontroli organizacyjnych (A.1–A.10) plus dodatkowe z Części C/D, sprawdza czy żaden wymagany plik nie zaginął, dolicza wynik matrycy treści i zapisuje JEDEN plik compliance-status.json z ogólnym werdyktem PASS/FAIL/INDETERMINATE. Brakujący wymagany werdykt to z założenia FAIL — nie da się zaliczyć kontroli, której nigdy nie zmierzono.", "analogy": "To jak dyrektor szkoły, który zbiera świadectwa ze wszystkich klas i wystawia jedną decyzję: promocja albo nie. Jeśli czyjegoś świadectwa brakuje — nie udaje, że było piątkowe; traktuje brak jako problem do wyjaśnienia.", "why": "Decydent (zarząd, audytor, klient) potrzebuje JEDNEJ odpowiedzi, nie stu plików. Agregator daje tę jedną odpowiedź, ale w sposób uczciwy: liczy tylko porażki BLOCKING, zapisuje EVIDENCE-ONLY jako fakty bez blokowania, a brak wymaganego dowodu jest fail-closed. Wynik jest podpisywany kryptograficznie przez krok wywołujący, więc nie da się go po cichu podmienić.", "inRepo": "Cały plik Pipeline/scripts/aggregate-compliance.py. Logika werdyktu w _compute_overall (683-703): FAIL gdy brak wymaganego pliku LUB matryca ma blocking_failures>0 LUB jakiś wiersz BLOCKING ma FAIL; INDETERMINATE gdy BLOCKING nie dało się zmierzyć; inaczej PASS. Podpis cosign nakłada krok wywołujący — patrz docstring linie 77-80.", "refs": ["Pipeline/scripts/aggregate-compliance.py"], "codeExcerpt": "def _compute_overall(\n    rows: list[Row], missing_required: list[str], matrix_blocking: int,\n) -> str:\n    \"\"\"Overall verdict by BLOCKING tier only (EVIDENCE-ONLY never trips the gate).\n\n    FAIL          -> any required verdict missing, any BLOCKING row FAIL, or the\n                     content matrix reports blocking_failures > 0.\n    INDETERMINATE -> no outright FAIL, but a BLOCKING row could not be measured.\n    PASS          -> otherwise.\n    \"\"\"\n    if missing_required:\n        return FAIL\n    if matrix_blocking > 0:\n        return FAIL\n    blocking_fail = any(r.tier == BLOCKING and r.status == FAIL for r in rows)\n    if blocking_fail:\n        return FAIL\n    blocking_indet = any(r.tier == BLOCKING and r.status == INDETERMINATE for r in rows)\n    if blocking_indet:\n        return INDETERMINATE\n    return PASS", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 683, "howItWorks": "Funkcja _compute_overall liczy jeden werdykt całości z wielu wierszy. Kolejność reguł jest istotna: (1) jeśli brakuje któregoś WYMAGANEGO pliku werdyktu (missing_required) -> FAIL; (2) jeśli matryca treści zgłasza blocking_failures > 0 -> FAIL; (3) jeśli jakikolwiek wiersz tier BLOCKING ma status FAIL -> FAIL; (4) jeśli żaden nie FAILuje, ale jakiś BLOCKING jest INDETERMINATE (nie dało się zmierzyć) -> INDETERMINATE; (5) w przeciwnym razie PASS. Wiersze EVIDENCE-ONLY są celowo pomijane w tej logice — nigdy nie przewracają bramki. Podpis cosign nad wynikowym plikiem nakłada krok wywołujący (opisane w docstringu).", "whyItWorks": "To serce 'jednego podpisanego werdyktu': sprowadza dziesiątki sygnałów do jednej, deterministycznej odpowiedzi przy zachowaniu uczciwości. Brak pliku traktowany jak FAIL realizuje zasadę 'nie zaliczysz kontroli, której nigdy nie zmierzyłeś'. Oddzielenie FAIL od INDETERMINATE niesie różną informację (źle zmierzone vs niezmierzone), a ignorowanie EVIDENCE-ONLY pilnuje, by liczby-do-raportu nie blokowały wdrożenia. Podpisanie wyniku przez cosign czyni werdykt nieodwracalnym dowodem dla audytora — nie da się go po cichu podmienić."}, {"id": "honest-fail", "title": "Uczciwie: ogólny werdykt to dziś FAIL — i to jest poprawne", "plain": "Ogólny werdykt staje się FAIL, gdy choć jedna kontrola BLOCKING nie przechodzi. W tym repo część kontroli świeci na czerwono uczciwie, dopóki nie ma realnego dowodu: test odtworzenia z backupu (restore-test) i niezależny pentest (test penetracyjny) domyślnie FAILują, bo nikt ich jeszcze realnie nie wykonał. System tego NIE ukrywa — wystawia FAIL i wskazuje, co zrobić.", "analogy": "To jak przegląd techniczny auta, który nie wbije pieczątki, dopóki realnie nie sprawdzi hamulców. Nie 'zakłada, że działają' — wymaga dowodu. Brak testu = brak zaliczenia, nawet jeśli wszystko inne jest idealne. Czerwone światło tu znaczy 'jeszcze tego nie udowodniliśmy', a nie 'system jest zepsuty'.", "why": "To jest serce zasady projektu 'claims == reality' (deklaracje równe rzeczywistości). Łatwo byłoby zafałszować zielone światło i ładnie wyglądać. CyberForge wybiera odwrotnie: woli pokazać uczciwy FAIL z konkretną podpowiedzią naprawczą niż fałszywe PASS, które rozsypie się przy pierwszym poważnym audycie.", "inRepo": "W aggregate-compliance.py honest defaults są wprost opisane: C.9.PENTEST (G1) ma 'honest default of the seed is BLOCKING FAIL (no pen test on record)' (linie 386-397); A.10 restore-test wymaga realnego wpisu w docs/runbooks/restore-test-log.yaml (linie 224-232). Komentarz linie 40-43 potwierdza: 'this gate FAILs with it ... That is the correct behaviour'.", "refs": ["Pipeline/scripts/aggregate-compliance.py", "Pipeline/scripts/generate-compliance-matrix.sh"], "codeExcerpt": "    Control(\n        # C.9 / G1 — independent penetration testing. BLOCKING and REQUIRED:\n        # a missing pentest verdict is an unmeasured mandatory control -> FAIL.\n        # Honest default of the seed is BLOCKING FAIL (\"no pen test on record\").\n        id=\"C.9.PENTEST\", task=\"G1\",\n        label=\"Penetration testing (independent, >= annual, signed, findings retested)\",\n        out_name=\"pentest-report.json\", argv_template=[],\n        aggregate_only=True, required=True, default_tier=BLOCKING,\n        remediation=\"Commission an independent penetration test, record the signed \"\n                    \"report in docs/governance/pentest-report.yaml, and track \"\n                    \"Critical/High findings to retested closure.\",\n    ),", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 386, "howItWorks": "Ten wpis Control dla kontroli C.9.PENTEST (G1 — niezależny test penetracyjny) jest oznaczony required=True i default_tier=BLOCKING. Komentarz mówi wprost: skoro nie ma na koncie żadnego testu penetracyjnego, uczciwym domyślnym stanem jest BLOCKING FAIL ('no pen test on record'). Ponieważ to kontrola BLOCKING i wymagana, brak jej werdyktu przez logikę _compute_overall daje FAIL całości. Pole remediation podaje konkretną drogę wyjścia: zlecić test, zapisać podpisany raport w docs/governance/pentest-report.yaml i domknąć krytyczne/wysokie ustalenia. Analogicznie A.10 (restore-test) wymaga realnego wpisu w docs/runbooks/restore-test-log.yaml.", "whyItWorks": "To jest manifest uczciwości tej bramki: ogólny werdykt to dziś FAIL, bo niektóre realne kontrole (test penetracyjny, test odtworzenia z backupu) nie zostały jeszcze wykonane — i komentarz w pliku potwierdza 'this gate FAILs with it ... That is the correct behaviour'. Lepiej, by narzędzie pokazało prawdę (czerwone z konkretnym powodem i instrukcją naprawy), niż wymyśliło fałszywe PASS. Domyślny stan 'FAIL dopóki nie ma dowodu' chroni przed tym, by brak działania mylił się ze zgodnością, a remediation czyni każdy FAIL praktycznym krokiem, a nie martwym punktem."}]}, {"area": "5 · Krok po kroku — co dzieje się na taśmie", "intro": "Wyobraź sobie taśmę produkcyjną w fabryce: na jednym końcu wjeżdża surowy kod, na drugim wyjeżdża gotowy, sprawdzony i opieczętowany produkt z kompletem dokumentów. Ten rozdział przechodzi krok po kroku przez każdą stację tej taśmy — od momentu, gdy ktoś wrzuca zmianę kodu, aż po zapieczętowaną „teczkę dowodów\". Przy każdej stacji mówimy: co ją uruchamia (trigger), co robi prostymi słowami, i co po sobie zostawia (artefakt).", "blocks": [{"id": "trigger-orchestrator", "title": "Co w ogóle uruchamia taśmę (trigger) i kto nią dyryguje", "plain": "Cała taśma to jeden plik-dyrygent: pipeline.yml. Uruchamia się automatycznie w trzech sytuacjach: gdy ktoś otwiera 'pull request' (PR — prośbę o wmieszanie swoich zmian do głównej wersji kodu), gdy zmiana faktycznie trafia do gałęzi main (głównej, 'produkcyjnej' wersji), oraz ręcznie z menu (workflow_dispatch — przycisk 'uruchom teraz'). Dyrygent nie robi sam roboty — wywołuje po kolei kolejne pliki-pracowników (fazy 0-6) i pilnuje, żeby grały w odpowiedniej kolejności.", "analogy": "To jak dyrygent orkiestry: sam nie gra na żadnym instrumencie, ale macha batutą tak, żeby skrzypce weszły dopiero po wiolonczelach. Każda faza to jedna sekcja instrumentów.", "why": "Bez jednego dyrygenta każda kontrola żyłaby własnym życiem i nikt nie zagwarantowałby, że np. podpisywanie obrazu nastąpi PO udanym skanie bezpieczeństwa. Słówko 'needs' w pliku wymusza kolejność: faza nie ruszy, dopóki poprzednia nie skończy dobrze — czyli nie da się 'obejść' kontroli.", "inRepo": "Pipeline/.github/workflows/pipeline.yml — sekcja 'on:' (linie 3-16) definiuje triggery; bloki jobs od linii 41 (self-test) do 117 (evidence-pack) łańcuchują fazy przez 'needs'. Zauważ 'concurrency' (linie 29-31): jeśli wrzucisz nową wersję, stary przebieg dla tej samej gałęzi jest anulowany, żeby nie marnować maszyn.", "refs": ["Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "on:\n  pull_request:\n    branches: [main]\n  push:\n    branches: [main]\n  workflow_dispatch:\n    inputs:\n      deploy_environment:\n        description: \"Target environment\"\n        required: true\n        type: choice\n        options:\n          - staging\n          - production\n\n# ... (pominięto) ...\n\n# Cancel in-progress runs for the same PR/branch\nconcurrency:\n  group: pipeline-${{ github.head_ref || github.ref }}\n  cancel-in-progress: true", "codePath": "Pipeline/.github/workflows/pipeline.yml", "codeLang": "yaml", "codeStart": 3, "howItWorks": "Sekcja 'on:' definiuje trzy triggery uruchamiające całą taśmę: 'pull_request' (otwarcie/aktualizacja PR do main), 'push' (zmiana faktycznie ląduje w main) oraz 'workflow_dispatch' (ręczny przycisk z menu, z wyborem środowiska staging/production). Blok 'concurrency' grupuje przebiegi po gałęzi (github.head_ref dla PR, github.ref dla push) i z 'cancel-in-progress: true' anuluje poprzedni przebieg tej samej grupy, gdy wpłynie nowszy. Dalej w pliku (sekcja jobs) każda faza ma 'needs: [poprzednia]', co łączy je w łańcuch.", "whyItWorks": "Jeden plik-dyrygent gwarantuje, że kolejność i warunki kontroli są zdefiniowane w jednym miejscu, a nie rozproszone po wielu niezależnych workflowach. Trzy triggery pokrywają cały cykl życia zmiany: propozycja (PR), wejście do produkcji (push) i działanie ad-hoc (dispatch). 'concurrency' z anulowaniem oszczędza maszyny CI — nie ma sensu kończyć przebiegu dla wersji, która właśnie została zastąpiona nowszym commitem. To podstawa: jeden punkt wejścia, jedno miejsce ustalania reguł gry."}, {"id": "degrade-on-pr", "title": "Tryb 'degrade na PR' — kiedy taśma ostrzega, a kiedy blokuje", "plain": "To jedna z najważniejszych zasad całej taśmy, więc tłumaczymy ją od razu na początku, bo wraca w prawie każdej fazie. Gdy zmiana jest dopiero propozycją (pull request, czyli 'jeszcze nie weszło do produkcji'), wiele bramek tylko OSTRZEGA na żółto, zamiast blokować na czerwono. Gdy ta sama zmiana trafia do gałęzi main (czyli 'na poważnie'), te same bramki są bezwzględne — najmniejszy problem zatrzymuje taśmę. To właśnie 'degrade na PR': łagodniejszy tryb dla wersji roboczej, twardy tryb dla produkcji.", "analogy": "Jak nauczyciel, który przy szkicu wypracowania pisze na marginesie 'popraw to' (ostrzeżenie), ale przy oddaniu finalnej pracy te same błędy oznaczają niezaliczenie (blokada). Szkic ma się dać dokończyć, finał musi być bez zarzutu.", "why": "Niektóre dowody (np. wynik podpisu w sieci Sigstore, znacznik czasu z serwera) wymagają tajnych dostępów i połączeń, których przebieg PR celowo nie dostaje. Blokowanie PR za brak czegoś, czego PR fizycznie nie może zrobić, byłoby nieuczciwe i frustrujące. Dlatego: na PR — 'honest-pending' (uczciwie oznaczone jako 'jeszcze nie zrobione'), na main — fail-closed (brak dowodu = czerwone).", "inRepo": "Wzorzec widać w deploy.yml:255-258 (real apply odmawia działania na PR), deploy.yml:326-334 (assert-crypto blokuje na non-PR, ostrzega na PR) oraz w evidence-pack.yml:1558 (EVIDENCE_ALLOW_DEGRADE ustawiane na '1' tylko dla pull_request). Słowo-klucz w plikach to 'github.event_name == pull_request'.", "refs": ["Pipeline/.github/workflows/deploy.yml", "Pipeline/.github/workflows/evidence-pack.yml"], "codeExcerpt": "          python3 ../scripts/validators/assert-crypto.py /tmp/tfplan.json \\\n            --out /tmp/crypto-posture.json\n          rc=$?\n          set -e\n          echo \"assert-crypto exit code: ${rc} (0 PASS, 1 FAIL, 2 INDETERMINATE)\"\n          if [ \"${{ github.event_name }}\" != 'pull_request' ]; then\n            if [ \"${rc}\" -ne 0 ]; then\n              echo \"::error::assert-crypto did not PASS (exit ${rc}) on a real deploy — fail-closed\"\n              exit 1\n            fi\n            echo \"assert-crypto PASSED against the live tfplan.\"\n          elif [ \"${rc}\" -ne 0 ]; then\n            echo \"::warning::PR dry-run: assert-crypto exit ${rc} on local-state plan (NEEDS-CI for an authoritative plan; not enforced here)\"\n          fi", "codePath": "Pipeline/.github/workflows/deploy.yml", "codeLang": "yaml", "codeStart": 326, "howItWorks": "Po uruchomieniu walidatora kryptografii kod zapisuje jego kod wyjścia do zmiennej 'rc' (0=PASS, 1=FAIL, 2=INDETERMINATE). Potem rozgałęzia się po typie zdarzenia: gdy 'github.event_name != pull_request' (czyli to prawdziwy deploy z main) i rc jest niezerowe — '::error::' plus 'exit 1' twardo zatrzymuje przebieg (fail-closed). W przeciwnym wypadku, na pull_request, ten sam niezerowy rc daje tylko '::warning::' i taśma jedzie dalej. Identyczny wzorzec rządzi też zmienną EVIDENCE_ALLOW_DEGRADE w evidence-pack.yml, ustawianą na '1' tylko dla pull_request.", "whyItWorks": "To esencja 'degrade na PR'. Przebieg PR celowo działa na lokalnym stanie Terraform i nie ma dostępu do autorytatywnego planu ani sekretów — karanie go za brak czegoś, czego fizycznie nie może wyprodukować, byłoby nieuczciwe i blokowałoby pracę. Na main, gdzie plan jest prawdziwy, każda usterka kryptografii musi zatrzymać wdrożenie, bo to ostatnia chwila przed dotknięciem infrastruktury. Rozróżnienie po github.event_name to jeden, czytelny i powtarzalny przełącznik między trybem 'ostrzegaj' a 'blokuj'."}, {"id": "phase0-self-test", "title": "Faza 0 — Self-test: taśma najpierw sprawdza samą siebie", "plain": "Zanim cokolwiek się zbuduje czy podpisze, taśma testuje swoje WŁASNE narzędzia. Uruchamia cztery zestawy testów: (1) 'opa test' — czy reguły bramek (zapisane w języku Rego) działają poprawnie; (2) audyt 'przypięcia akcji' — czy każde zewnętrzne narzędzie jest przyklejone do konkretnej, niezmiennej wersji; (3) pytest — testy walidatorów napisanych w Pythonie, z wymaganym progiem pokrycia testami; (4) bats — testy skryptów powłoki. Jeśli choć jeden padnie, cała reszta taśmy się nie uruchamia.", "analogy": "Jak pilot, który przed startem przechodzi checklistę samolotu: zanim wpuści pasażerów, sprawdza, czy jego własne przyrządy nie kłamią. Bezsensownie byłoby ufać pomiarom z zepsutego wskaźnika.", "why": "Klasyczna pułapka: bramki bezpieczeństwa istnieją, ale nikt nie testuje samych bramek — więc 'świecą na zielono przez nieobecność' (green-by-absence). Zepsuty walidator przepuściłby wszystko, nie alarmując. Self-test zamyka tę dziurę: to 'strażnik strażników'. Pokrycie testami jest tu uczciwe — próg 70% jest ustawiony na realnie zmierzonym zakresie walidatorów, a nie na wymyślonym 80% całego drzewa.", "inRepo": "Pipeline/.github/workflows/self-test.yml — krok (a) 'opa test policies/' (linia 85), (b) check-action-pins.sh (linia 90), (c) pytest z '--cov-fail-under=70' (linie 106-110), (d) próg bats min. 12 testów (linie 118-140). Wywoływany jako pierwszy przez pipeline.yml:41-43.", "refs": ["Pipeline/.github/workflows/self-test.yml", "Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "      - name: opa test policies/\n        run: opa test policies/ -v\n\n      # (b) Action-pin audit (T-71) — BLOCKING: a re-introduced @v4/@main/short-SHA\n      #     ref (incl. in this very workflow) fails the gate. Audits .github/workflows/.\n      - name: Action-pin audit (T-71)\n        run: bash scripts/check-action-pins.sh\n\n# ... (pominięto) ...\n\n      - name: pytest tests/compliance (+ blocking coverage floor)\n        run: |\n          set -euo pipefail\n          python3 -m pytest tests/compliance -q \\\n            --cov=scripts/validators --cov-report=term-missing --cov-fail-under=70\n\n# ... (pominięto) ...\n\n      - name: bats tests/bats (T-81)\n        run: |\n          set -euo pipefail\n          bats tests/bats", "codePath": "Pipeline/.github/workflows/self-test.yml", "codeLang": "yaml", "codeStart": 83, "howItWorks": "Faza 0 odpala cztery zestawy testów własnych narzędzi taśmy. (a) 'opa test policies/ -v' sprawdza reguły bramek w Rego — jeśli któryś test_* pada, krok jest czerwony. (b) 'check-action-pins.sh' audytuje, czy każda zewnętrzna akcja jest przypięta do niezmiennego SHA (nie @v4/@main). (c) pytest z '--cov-fail-under=70' uruchamia testy walidatorów Pythona i SAM wymusza próg pokrycia — poniżej 70% pytest kończy się niezerowo, bez żadnego '|| true'. (d) 'bats tests/bats' uruchamia testy skryptów powłoki. Wszystkie z 'set -euo pipefail', więc żaden błąd nie jest po cichu połykany. Faza ta jest pierwsza w pipeline.yml i każda kolejna ma do niej 'needs'.", "whyItWorks": "To 'strażnik strażników' — zamyka pułapkę green-by-absence, gdzie zepsuta bramka przepuszcza wszystko, nie alarmując. Testując reguły OPA, walidatory Pythona i skrypty bash zanim cokolwiek się zbuduje, taśma upewnia się, że jej własne mierniki nie kłamią. Kluczowa jest tu uczciwość progu: 70% jest zakresowane do 'scripts/validators' (rzeczywistej logiki bramki) i faktycznie zmierzone na 74% — więc liczba CLAIMED równa się liczbie ENFORCED. Gating całego drzewa na fikcyjne 80% byłby bramką dekoracyjną; tu próg jest realnie egzekwowany."}, {"id": "phase1-security-gate", "title": "Faza 1 — Brama bezpieczeństwa: cztery kontrole na samym wejściu", "plain": "Zanim zaczniemy budować, taśma przeszukuje sam kod pod kątem czterech rzeczy. (1) TruffleHog — szuka sekretów (haseł, kluczy API) przypadkiem wklejonych do kodu, w trybie 'tylko zweryfikowane', żeby nie sypać fałszywymi alarmami. (2) Checkov — sprawdza 'infrastrukturę jako kod' (IaC, czyli opis serwerów w plikach tekstowych) pod kątem błędnych ustawień. (3) MegaLinter — sprawdza styl i poprawność kodu. (4) Skaner PII — szuka danych osobowych (PII — Personally Identifiable Information, np. PESEL, e-mail), które nie powinny leżeć w repozytorium.", "analogy": "Jak kontrola na lotnisku PRZED wejściem do hali odpraw: prześwietlają bagaż w poszukiwaniu rzeczy zabronionych (sekrety), sprawdzają, czy paczki są dobrze zapakowane (IaC), i czy nie wynosisz cudzych dokumentów (dane osobowe). Wszystko, zanim w ogóle wejdziesz dalej.", "why": "Sekret wrzucony do kodu jednego dnia zostaje w historii na zawsze — dlatego łapiemy go jak najwcześniej. Błędne ustawienie infrastruktury (np. otwarty na świat magazyn danych) to klasyczna przyczyna wycieków. Łapanie tego na wejściu jest setki razy tańsze niż naprawianie po wdrożeniu.", "inRepo": "Pipeline/.github/workflows/security-gate.yml — joby: secret-detection/TruffleHog (linie 32-87, konfiguracja '--only-verified'), iac-security/Checkov (od linii 89), linting/MegaLinter (od 202), commit-signing (od 273), pii-scanner (od 339). Wywoływana z pipeline.yml:48-56.", "refs": ["Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "      - name: TruffleHog Scan\n        id: trufflehog\n        uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39 # v3.82.13\n        with:\n          extra_args: --only-verified --results=verified\n          base: ${{ inputs.is_pull_request == 'true' && inputs.pr_base_sha || '' }}\n          head: ${{ inputs.ref || 'HEAD' }}\n\n      - name: Capture TruffleHog output\n        if: always()\n        run: |\n          mkdir -p /tmp/security-gate-logs\n          {\n            echo \"=== TruffleHog Secret Detection ===\"\n            echo \"Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n            echo \"Configuration: --only-verified --results=verified\"", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 44, "howItWorks": "Pierwszy job bramy bezpieczeństwa skanuje kod TruffleHogiem w poszukiwaniu sekretów. Akcja jest przypięta do pełnego SHA (# v3.82.13 to tylko komentarz). Kluczowy jest 'extra_args: --only-verified --results=verified' — TruffleHog zgłasza wyłącznie sekrety, które realnie zweryfikował (np. próbując ich użyć), zamiast wszystkiego, co WYGLĄDA jak klucz. 'base' i 'head' określają zakres skanu: na PR porównuje względem bazy commita (pr_base_sha), poza PR skanuje całą historię. Krok 'Capture' z 'if: always()' zapisuje log konfiguracji nawet przy porażce, by trafił do teczki dowodów. To jeden z czterech jobów (obok Checkov/IaC, MegaLinter, pii-scanner) tej fazy.", "whyItWorks": "Sekret raz wrzucony do repozytorium zostaje w historii git na zawsze — dlatego łapanie go na samym wejściu, przed buildem, jest setki razy tańsze niż reakcja po wdrożeniu. Tryb '--only-verified' to świadoma decyzja przeciw zmęczeniu alarmami: fałszywe trafienia podważają zaufanie do bramki i prowadzą do jej ignorowania. Przypięcie akcji do SHA chroni przed atakiem na łańcuch dostaw (podmiana taga @v3 na złośliwą wersję). Zachowanie logu przez 'always()' realizuje zasadę claims==reality — dowód powstaje niezależnie od wyniku."}, {"id": "phase2-build-scan", "title": "Faza 2 — Build & Scan: budowa obrazu i komplet skanów", "plain": "Tu powstaje właściwy produkt — obraz kontenera (image, czyli zapakowana aplikacja gotowa do uruchomienia gdziekolwiek) — i jest od razu prześwietlany. Kontrole: SCA (Trivy fs) sprawdza biblioteki, których używa aplikacja, pod kątem znanych dziur; SAST (CodeQL) analizuje sam napisany kod w poszukiwaniu błędów bezpieczeństwa; testy jednostkowe mierzą pokrycie kodu testami; Trivy image skanuje gotowy obraz; a Syft tworzy SBOM (Software Bill of Materials — spis składników oprogramowania, dokładnie jak skład na opakowaniu jedzenia: lista wszystkiego, co jest w środku).", "analogy": "Jak produkcja konserwy: najpierw gotujemy danie (build obrazu), potem laboratorium bada składniki na skażenia (skany), a na puszkę nakleja się etykietę ze składem (SBOM). Bez etykiety nikt nie wie, co je.", "why": "Te skany dostarczają TWARDYCH LICZB, których później używają bramki — np. ile jest luk o wadze CRITICAL i jakie jest pokrycie testami. Co ważne, te liczby są MIERZONE z prawdziwych wyników (parsowane z plików JSON), a nie wpisane na sztywno — żeby bramka decydowała na podstawie prawdy, nie życzeń. SBOM jest fundamentem późniejszego podpisu i 'paszportu' produktu.", "inRepo": "Pipeline/.github/workflows/build-and-scan.yml — joby: dependency-scan/Trivy SCA (od linii 53, walidacja .trivyignore w 71-79), SAST/CodeQL (od 194), unit-tests + coverage (od 476), docker-build + image scan + SBOM (od 597; Trivy image w 724, Syft SBOM w 796-801). Mierzone wyjścia critical_cves/coverage_pct zdefiniowane w liniach 23-40.", "refs": ["Pipeline/.github/workflows/build-and-scan.yml"], "codeExcerpt": "      - name: Trivy image scan\n        run: |\n          # pipefail is REQUIRED: without it the pipe's exit status is tee's\n          # (always 0), so Trivy's --exit-code 1 on HIGH/CRITICAL findings would\n          # be swallowed and the gate would silently pass. GitHub's default\n          # shell (bash -e) does NOT enable pipefail.\n          set -o pipefail\n          trivy image \"${{ steps.meta.outputs.image_uri }}\" \\\n            --format json \\\n            --output trivy-image-results.json \\\n            --severity CRITICAL,HIGH \\\n            --exit-code 1 \\\n            --ignorefile app/.trivyignore \\\n            2>&1 | tee /tmp/trivy-image-console.txt", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 724, "howItWorks": "Po zbudowaniu obrazu Trivy skanuje go ('trivy image') na luki o wadze CRITICAL i HIGH. '--format json --output trivy-image-results.json' zapisuje wyniki w pliku, z którego późniejsze bramki PARSUJĄ prawdziwe liczby (critical_cves). '--exit-code 1' sprawia, że samo znalezienie CRITICAL/HIGH zwraca błąd. '--ignorefile app/.trivyignore' pozwala świadomie wykluczyć udokumentowane wyjątki. Najważniejszy jest 'set -o pipefail': bez niego status potoku byłby statusem 'tee' (zawsze 0), więc błąd Trivy zostałby połknięty. Obok tego kroku Syft generuje SBOM w formacie cyclonedx-json — spis składników obrazu.", "whyItWorks": "Ta faza dostarcza TWARDYCH LICZB (critical_cves, coverage_pct), na których opierają się późniejsze bramki OPA — a liczby te są MIERZONE z prawdziwego JSON-a, nie wpisane na sztywno, więc decyzja zapada na podstawie prawdy, nie życzeń. Komentarz o pipefail to przykład świadomości pułapki shellowej: domyślny 'bash -e' GitHuba nie włącza pipefail, więc bez tej linii bramka 'świeciłaby zielono przez nieobecność błędu'. SBOM jest fundamentem późniejszego podpisu i paszportu produktu — bez listy składników nie da się zweryfikować, co naprawdę jest w obrazie."}, {"id": "phase3-sign-attest", "title": "Faza 3 — Sign & Attest: pieczęć i 'paszport' produktu (tylko na main)", "plain": "Gdy obraz jest zbudowany i czysty, taśma go PODPISUJE i dokleja do niego dokumenty pochodzenia. Robi to Cosign w trybie 'keyless' (bez kluczy) — zamiast trzymać tajny klucz, tożsamość przebiegu CI jest potwierdzana jednorazowo przez OIDC, a fakt podpisu trafia do publicznego, niezmiennego rejestru Rekor (część systemu Sigstore). Do obrazu doklejane są: podpis, SBOM jako podpisane poświadczenie, oraz provenance (prowenancja — udokumentowane pochodzenie: kto, gdzie i z czego to zbudował).", "analogy": "Jak notariusz, który nie tylko przybija pieczęć na dokumencie, ale wpisuje ten fakt do publicznego repertorium, którego nie da się później wymazać. Każdy może sprawdzić, że pieczęć jest prawdziwa, bez dzwonienia do notariusza.", "why": "Podpis pozwala później (przy wdrożeniu) udowodnić, że obraz to DOKŁADNIE ten zbudowany i przeskanowany — nikt go po drodze nie podmienił. To podstawa 'łańcucha dostaw oprogramowania'. Uczciwy stan: taśma osiąga poziom SLSA Build L2 (nie L3 — to wyższy poziom z izolacją buildu). W realnym przebiegu CI keyless cosign + Rekor działają naprawdę; w próbce offline są oznaczone jako honest-pending (uczciwie 'oczekujące'), bo offline nie da się połączyć z Sigstore.", "inRepo": "Pipeline/.github/workflows/sign-and-attest.yml — 'cosign sign --yes' keyless (linie 45-55), 'cosign attest' SBOM jako CycloneDX (63-70), provenance natywne GitHub z fallbackiem na własny skrypt (79-107). Uruchamiane tylko poza PR (pipeline.yml:74).", "refs": ["Pipeline/.github/workflows/sign-and-attest.yml", "Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "      - name: Sign image with Cosign (keyless OIDC)\n        run: |\n          set -o pipefail  # tee must not mask a cosign sign failure\n          cosign sign --yes \\\n            -a \"repo=${{ github.repository }}\" \\\n            -a \"workflow=${{ github.workflow }}\" \\\n            -a \"ref=${{ github.sha }}\" \\\n            -a \"run_id=${{ github.run_id }}\" \\\n            -a \"trigger=${{ github.event_name }}\" \\\n            \"${{ inputs.image_uri }}@${{ inputs.image_digest }}\" \\\n            2>&1 | tee /tmp/cosign-sign-output.txt\n\n# ... (pominięto) ...\n\n      - name: Attach SBOM as signed attestation\n        run: |\n          set -o pipefail  # tee must not mask a cosign attest failure\n          cosign attest --yes \\\n            --predicate ./evidence/sbom.cyclonedx.json \\\n            --type cyclonedx \\\n            \"${{ inputs.image_uri }}@${{ inputs.image_digest }}\" \\\n            2>&1 | tee /tmp/cosign-attest-output.txt", "codePath": "Pipeline/.github/workflows/sign-and-attest.yml", "codeLang": "yaml", "codeStart": 45, "howItWorks": "'cosign sign --yes' podpisuje obraz w trybie keyless — nie ma tu żadnego tajnego klucza; tożsamość przebiegu CI jest potwierdzana jednorazowo przez OIDC, a fakt podpisu trafia do publicznego rejestru Rekor. Flagi '-a' dopinają metadane (repo, workflow, ref, run_id, trigger) jako adnotacje podpisu. Podpis dotyczy 'image_uri@image_digest', czyli niezmiennego odcisku obrazu, nie ruchomego taga. Drugi krok, 'cosign attest', dokleja SBOM jako PODPISANE poświadczenie ('--predicate ... --type cyclonedx'). Cały job jest uruchamiany tylko poza PR (warunek 'if: github.event_name != pull_request' w pipeline.yml:74).", "whyItWorks": "Podpis pozwala później, przy wdrożeniu, udowodnić że obraz to DOKŁADNIE ten zbudowany i przeskanowany — nikt go po drodze nie podmienił. Keyless eliminuje najgroźniejszy problem klasycznego podpisywania: przechowywanie i rotację tajnego klucza, który może wyciec. Podpisywanie po digeście (nie tagu) jest kluczowe, bo tag można przepiąć na inny obraz, a digest jest kryptograficznie związany z zawartością. Robienie tego tylko na main jest uczciwe — przebieg PR offline nie połączy się z Sigstore, więc tam podpis byłby honest-pending, a nie udawanym sukcesem."}, {"id": "phase4-deploy-admission", "title": "Faza 4a — Wdrożenie, krok 1: bramka admisji (cosign + OPA) zanim cokolwiek ruszy", "plain": "Zanim taśma zmieni cokolwiek na serwerach Azure, musi przejść przez bramkę wpuszczającą. Najpierw Cosign WERYFIKUJE podpis obrazu i poświadczenie SBOM — i to weryfikacja przeciw odciskowi cyfrowemu (digest), nie nazwie, oraz przeciw konkretnej tożsamości (tylko podpis z workflow sign-and-attest na main lub tagu wydania przejdzie). Potem OPA (Open Policy Agent — silnik reguł) sprawdza zestaw warunków: obraz podpisany? SBOM doklejony? zero luk CRITICAL? testy zdane i pokrycie wystarczające? Reguły czytają MIERZONE liczby z poprzednich faz, nigdy wpisane na sztywno.", "analogy": "Jak bramka biletowa na koncert: ochroniarz najpierw sprawdza, czy bilet jest prawdziwy (weryfikacja podpisu), a potem czy spełniasz warunki wejścia — pełnoletność, brak zakazu (reguły OPA). Bez jednego i drugiego nie wchodzisz, choćbyś bardzo chciał.", "why": "To serce zasady 'admission control' — kontroli wpuszczania. Gdyby ktoś podmienił obraz na złośliwy po skanie, weryfikacja podpisu by to wykryła i zatrzymała. Bramka jest fail-closed: brak pomiaru jest traktowany jak problem (np. brak wyniku skanu = critical_cves ustawione na 1), więc 'brak dowodu' nigdy nie oznacza cichego przejścia.", "inRepo": "Pipeline/.github/workflows/deploy.yml — verify-signature przeciw digest i tożsamości (linie 72-100), verify-sbom (102-126), pobranie zmierzonych wyników (128-142), 'OPA deployment gate (blocking)' budujący wejście z prawdziwych liczb i odmawiający przy niepustym zbiorze deny (linie 161-216).", "refs": ["Pipeline/.github/workflows/deploy.yml"], "codeExcerpt": "      - name: Verify image signature before deploy\n        id: verify-signature\n        run: |\n          # pipefail REQUIRED: this is THE deploy admission gate. Without it, tee\n          # masks a failed cosign verify and an unsigned/tampered image deploys.\n          set -o pipefail\n          echo \"Verifying image signature...\"\n# ... (pominięto) ...\n          cosign verify \\\n            --certificate-identity-regexp=\"^https://github.com/${{ github.repository }}/.github/workflows/sign-and-attest.yml@refs/(heads/main|tags/.*)$\" \\\n            --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\\n            \"${{ inputs.image_uri }}@${{ inputs.image_digest }}\" \\\n            2>&1 | tee /tmp/cosign-deploy-verify.log\n          # MEASURED signal for the OPA gate: this line is reached ONLY when the\n          # cosign verify above exits 0 (set -e + pipefail), so image_signed=true\n          # is a real outcome, never a hardcoded literal.\n          echo \"image_signed=true\" >> \"$GITHUB_OUTPUT\"", "codePath": "Pipeline/.github/workflows/deploy.yml", "codeLang": "yaml", "codeStart": 72, "howItWorks": "Zanim cokolwiek ruszy na serwerach, 'cosign verify' weryfikuje podpis obrazu. Weryfikacja jest przeciw 'image_uri@image_digest' (odciskowi, nie nazwie) ORAZ przeciw konkretnej tożsamości: '--certificate-identity-regexp' z kotwicami ^...$ przepuszcza WYŁĄCZNIE podpis zrobiony przez workflow sign-and-attest.yml na main lub tagu wydania; podpis z dowolnego innego workflowa/gałęzi odpada. '--certificate-oidc-issuer' przypina wystawcę OIDC do GitHuba. Linia 'image_signed=true' jest osiągana TYLKO gdy verify wyszło 0 (dzięki set -e + pipefail) — to mierzony sygnał, nie literał. Dalej (linia 161) OPA buduje wejście z prawdziwych liczb i odmawia, gdy zbiór 'deny' jest niepusty.", "whyItWorks": "To serce admission control. Gdyby ktoś podmienił obraz na złośliwy PO skanie, weryfikacja podpisu wykryłaby to (digest by się nie zgadzał) i zatrzymała wdrożenie. Przypięcie do tożsamości regexpem zamyka lukę, gdzie atakujący podpisuje obraz innym, własnym workflowem w tym samym repo. Najistotniejsze jest, że 'image_signed=true' nie jest wpisane na sztywno — wynika z faktycznego sukcesu cosign, więc bramka OPA dostaje prawdę. Cała konstrukcja jest fail-closed: brak pomiaru (np. brak wyniku Trivy) ustawia critical_cves=1, więc 'brak dowodu' nigdy nie znaczy cichego przejścia."}, {"id": "phase4-deploy-terraform", "title": "Faza 4b — Wdrożenie, krok 2: Terraform na Azure + bramka retencji + test zdrowia", "plain": "Po przejściu bramki admisji taśma loguje się do Azure przez OIDC (bez żadnych zapisanych na stałe haseł — tożsamość potwierdzana jednorazowo) i używa Terraform (narzędzia 'infrastruktura jako kod') do zaplanowania i wprowadzenia zmian na serwerach. Ale jeszcze przed wprowadzeniem zmian uruchamia kolejne bramki na ŻYWYM planie: OPA sprawdza retencję (czy dowody będą trzymane min. 1825 dni = 5 lat, w trybie WORM = 'zapisz raz, nie zmieniaj'), oraz walidatory kryptografii i retencji. Na końcu wdraża obraz, pobiera adres URL aplikacji i robi 'smoke test' — pukanie do /health, aż odpowie HTTP 200.", "analogy": "Jak remont mieszkania: najpierw architekt rysuje plan (terraform plan), inspektor sprawdza, czy plan jest zgodny z przepisami (bramki OPA na żywym planie), dopiero potem ekipa burzy ściany (terraform apply), a na koniec sprawdzasz, czy światło się zapala (smoke test).", "why": "Sprawdzanie reguł na PRAWDZIWYM planie, a nie na założeniach, znaczy, że nie da się po cichu skrócić okresu przechowywania dowodów czy wyłączyć szyfrowania — regresja zostanie zatrzymana, ZANIM dotknie infrastruktury. Logowanie przez OIDC bez stałych sekretów eliminuje najczęstszy wektor wycieku. Smoke test gwarantuje, że nie ogłaszamy sukcesu, gdy aplikacja realnie nie wstała.", "inRepo": "Pipeline/.github/workflows/deploy.yml — Azure OIDC login (59-64), Terraform init/plan/apply (218-379) z fail-hard guardem na PR (255-258), OPA retention 1825 dni + WORM (280-301), assert-crypto T-28 (313-334), assert-retention T-48 (344-365), smoke test /health (443-463).", "refs": ["Pipeline/.github/workflows/deploy.yml"], "codeExcerpt": "      - name: OPA retention policy (blocking)\n        working-directory: infra/\n        run: |\n          set -euo pipefail\n          terraform show -json tfplan > /tmp/tfplan.json\n          python3 ../scripts/tfplan-to-retention-input.py /tmp/tfplan.json --opa-input > /tmp/ret-input.json\n          echo \"OPA retention-policy input:\"\n          cat /tmp/ret-input.json\n          DENY=\"$(opa eval -d ../policies/retention-policy.rego -i /tmp/ret-input.json 'data.compliance.retention.deny' --format raw)\"\n          echo \"deny set: ${DENY}\"\n          if [ \"$(echo \"${DENY}\" | jq 'length')\" -ne 0 ]; then\n            echo \"::error::OPA retention policy DENIED: ${DENY}\"\n            exit 1\n          fi\n          echo \"OPA retention policy passed: retention >= 1825 days, WORM enabled, deletion schedule present.\"", "codePath": "Pipeline/.github/workflows/deploy.yml", "codeLang": "yaml", "codeStart": 287, "howItWorks": "Ta bramka biegnie na ŻYWYM planie Terraform, nie na założeniach. 'terraform show -json tfplan' eksportuje faktyczny plan zmian do JSON, a 'tfplan-to-retention-input.py' wyciąga z niego skonfigurowany okres immutability WORM i harmonogram usuwania. Następnie 'opa eval' uruchamia regułę retention-policy.rego, która buduje zbiór 'deny', jeśli retencja < 1825 dni (5 lat), WORM jest wyłączony lub brak harmonogramu usuwania. Niepusty zbiór deny (sprawdzany przez 'jq length') daje '::error::' i 'exit 1' — zatrzymanie PRZED 'terraform apply'. Wcześniej job loguje się do Azure przez OIDC (bez stałych haseł), a po apply robi smoke test /health (linia 443) pukając do endpointu aż odpowie HTTP 200.", "whyItWorks": "Sprawdzanie reguł na PRAWDZIWYM planie, a nie na stałej, oznacza że nie da się po cichu skrócić okresu przechowywania dowodów czy wyłączyć WORM — regresja zostaje zatrzymana zanim dotknie infrastruktury i zanim WORM stanie się niemodyfikowalny (po jego włączeniu byłoby już za późno). To jedyna twarda liczba DORA (1825 dni) faktycznie egzekwowana przeciw infrastrukturze. Logowanie przez OIDC bez stałych sekretów eliminuje najczęstszy wektor wycieku. Smoke test gwarantuje, że taśma nie ogłosi sukcesu, gdy aplikacja realnie nie wstała."}, {"id": "phase5-dast", "title": "Faza 5 — DAST: kontrolowany atak na DZIAŁAJĄCĄ aplikację (tylko na main)", "plain": "Wcześniejsze skany czytały kod 'na sucho'. DAST (Dynamic Application Security Testing — dynamiczne testowanie bezpieczeństwa) robi coś innego: bierze już WDROŻONĄ, działającą aplikację i bezpiecznie ją 'atakuje' z zewnątrz narzędziem OWASP ZAP w trybie baseline (podstawowym). ZAP wysyła zapytania jak prawdziwy napastnik i raportuje, co znalazł, licząc znaleziska o wadze HIGH/CRITICAL (riskcode >= 3).", "analogy": "Różnica jak między czytaniem instrukcji zamka (analiza kodu) a próbą faktycznego otwarcia drzwi wytrychem (DAST). Dopiero szarpiąc za klamkę widzisz, czy zamek naprawdę trzyma.", "why": "Niektóre dziury widać dopiero, gdy aplikacja żyje — błędne nagłówki, ujawnianie informacji, błędy konfiguracji serwera. DAST łapie to, czego statyczna analiza nie widzi. W tej taśmie ZAP biegnie z 'fail_action: false', więc raportuje i liczy znaleziska, a wynik trafia do teczki dowodów (a nie automatycznie blokuje) — uczciwe odzwierciedlenie tego, że to skan baseline.", "inRepo": "Pipeline/.github/workflows/dast.yml — job zap-scan/OWASP ZAP Baseline (linie 16-31, target to URL z fazy deploy), zliczanie HIGH/CRITICAL (49-77), URL przepuszczany przez zmienną env jako ochrona przed wstrzyknięciem (81-87). Cel przekazywany z pipeline.yml:108.", "refs": ["Pipeline/.github/workflows/dast.yml"], "codeExcerpt": "      - name: OWASP ZAP Baseline Scan\n        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0\n        with:\n          target: ${{ inputs.target_url }}\n          cmd_options: \"-J report_json.json -r report_html.html\"\n          fail_action: false\n\n# ... (pominięto) ...\n\n                  for site in report.get(\"site\", []):\n                      alerts += site.get(\"alerts\", [])\n                  count = sum(1 for alert in alerts if int(alert.get(\"riskcode\", 0)) >= 3)", "codePath": "Pipeline/.github/workflows/dast.yml", "codeLang": "yaml", "codeStart": 26, "howItWorks": "Job DAST bierze już WDROŻONĄ aplikację (target to 'inputs.target_url' przekazany z fazy deploy) i atakuje ją z zewnątrz OWASP ZAP-em w trybie baseline. 'cmd_options' produkuje raporty JSON i HTML. Kluczowe 'fail_action: false' sprawia, że sam skan nie wywala automatycznie przebiegu. Dalszy krok parsuje 'report_json.json' i liczy znaleziska o wadze HIGH/CRITICAL filtrem 'riskcode >= 3', zapisując 'high_critical_count' do GITHUB_OUTPUT. Wynik trafia do teczki dowodów, a nie blokuje wdrożenia. Akcja przypięta do pełnego SHA, a URL celu przepuszczany przez zmienną env jako ochrona przed wstrzyknięciem.", "whyItWorks": "DAST łapie to, czego statyczna analiza nie widzi — błędne nagłówki, ujawnianie informacji, błędy konfiguracji serwera — bo widać je dopiero gdy aplikacja żyje (różnica między czytaniem instrukcji zamka a szarpaniem za klamkę). 'fail_action: false' to UCZCIWE odzwierciedlenie tego, że ZAP baseline jest skanem podstawowym, podatnym na fałszywe trafienia; automatyczne blokowanie wdrożenia na jego podstawie byłoby zbyt agresywne. Zamiast tego znaleziska są liczone (riskcode>=3) i archiwizowane w dowodach, więc nic nie jest ukryte — decyzja o reakcji jest świadoma, nie automatyczna."}, {"id": "phase6-evidence-collect", "title": "Faza 6a — Evidence Pack: zebranie wszystkich dowodów w jedno miejsce", "plain": "Ta faza biegnie ZAWSZE ('if: always()'), nawet jeśli coś wcześniej padło — bo nawet porażka jest dowodem wartym zarchiwizowania. Ściąga wszystkie artefakty z poprzednich faz (wyniki Trivy, CodeQL, Checkov, SBOM, logi weryfikacji cosign z dowodem wpisu do Rekor, provenance, raport ZAP, pokrycie testami) do jednego katalogu evidence/. Potem uruchamia walidatory zgodności A.1-A.10, agreguje je w jeden werdykt i podpisuje go.", "analogy": "Jak segregator audytowy: po zakończeniu projektu zbierasz wszystkie faktury, protokoły, zdjęcia i podpisy do jednej teczki, którą można podać audytorowi bez szukania po szufladach.", "why": "Zasada projektu brzmi 'claims == reality' (twierdzenia = rzeczywistość). Teczka dowodów to materialny zapis tego, co taśma FAKTYCZNIE zrobiła, do okazania audytorowi (np. pod kątem DORA czy NIS2). Bieg 'always' znaczy, że nie da się ukryć nieudanego przebiegu — dowód powstaje tak czy inaczej.", "inRepo": "Pipeline/.github/workflows/evidence-pack.yml — pobieranie artefaktów (linie 48-110, w tym logi Rekor SBOM-attestation T-51 w 76-86), bramka zgodności A.1-A.10 z agregacją i podpisem cosign sign-blob (264-366; block non-PR, warn PR — wzorzec degrade). Wywoływana z pipeline.yml:113-117.", "refs": ["Pipeline/.github/workflows/evidence-pack.yml", "Pipeline/.github/workflows/pipeline.yml"], "codeExcerpt": "      # The `cosign-verification` artifact (uploaded by sign-and-attest.yml) carries\n      # BOTH cosign-verification.log (image-signature verify) AND, per T-51,\n      # cosign-attestation-verification.log (the SBOM attestation Rekor-inclusion\n      # proof: `cosign verify-attestation --type cyclonedx --insecure-ignore-tlog=false`\n      # + a REKOR_SBOM_ATTESTATION_INCLUSION_VERIFIED marker). Both land in evidence/\n      # here — well before the manifest/Merkle step — so the Rekor attestation proof\n      # is leaf-hashed into manifest.json and sealed into the pack (spec §7.2/Part I.2).\n      - name: Download Cosign verification logs (image sig + SBOM attestation Rekor proof, T-51)\n        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1\n        with:\n          name: cosign-verification\n          path: evidence/\n        continue-on-error: true", "codePath": "Pipeline/.github/workflows/evidence-pack.yml", "codeLang": "yaml", "codeStart": 76, "howItWorks": "Faza 6a ściąga wszystkie artefakty z poprzednich faz do jednego katalogu 'evidence/' za pomocą serii kroków 'download-artifact' (Trivy SCA, image scan + SBOM, CodeQL, Checkov, provenance i — tu pokazany — logi weryfikacji cosign). Artefakt 'cosign-verification' niesie zarówno log weryfikacji podpisu obrazu, jak i (T-51) dowód włączenia poświadczenia SBOM do rejestru Rekor. 'continue-on-error: true' przy każdym pobraniu sprawia, że brak pojedynczego artefaktu (np. gdy faza była skipowana na PR) nie wywala zbierania. Pobranie odbywa się PRZED krokiem manifest/Merkle, więc dowód Rekor zostaje wliczony (leaf-hashed) do manifestu i zapieczętowany. Cały job evidence-pack jest wywoływany z 'if: always()' w pipeline.yml:113.", "whyItWorks": "Bieg 'always()' realizuje zasadę claims==reality: dowód powstaje niezależnie od tego, czy wcześniejsze fazy padły — nie da się ukryć nieudanego przebiegu, bo nawet porażka jest dowodem wartym archiwizacji. 'continue-on-error' jest tu poprawne, bo na PR część artefaktów (podpis, deploy) celowo nie istnieje; sztywne wymaganie ich obecności łamałoby tryb degrade. Pobranie dowodu Rekor PRZED manifestem jest kluczowe — tylko wtedy jego hash wejdzie do korzenia Merkle i będzie chroniony przed podmianą. Teczka w jednym miejscu to materialny zapis do okazania audytorowi (DORA/NIS2) bez szukania po szufladach."}, {"id": "phase6-honest-red", "title": "Faza 6b — Uczciwa czerwień: bramki, które ŚWIADOMIE świecą na czerwono", "plain": "Tu pojawia się najuczciwszy element całej taśmy. Niektóre dowody wymagają realnych ludzkich działań, których oprogramowanie nie może sfałszować: pentest (test penetracyjny przeprowadzony przez ludzi), restore-test (faktyczne odtworzenie danych z kopii zapasowej), czy przegląd dostępów. Dopóki nie ma PRAWDZIWEGO dowodu, że to się wydarzyło, te bramki świecą na czerwono — i tak ma być. Na main blokują pack (fail-closed), na PR tylko ostrzegają.", "analogy": "Jak rubryka 'badanie techniczne pojazdu' w dokumentach auta: dopóki mechanik fizycznie nie obejrzał samochodu i nie wpisał wyniku, pole jest puste — i żaden program nie ma prawa wstawić tam 'zaliczone'. Pusta rubryka to uczciwość, nie błąd.", "why": "Łatwo byłoby zrobić te bramki 'zielonymi na zawsze' i udawać 100% zgodności. Taśma świadomie tego NIE robi — fałszywy PASS w teczce audytowej to gorsze niż uczciwy FAIL, bo wprowadza audytora w błąd. Czerwone bramki to mapa drogowa: dokładnie pokazują, czego jeszcze brakuje, żeby firma była naprawdę zgodna.", "inRepo": "Pipeline/.github/workflows/evidence-pack.yml — generowanie dowodów Part-G (linie 388-418), pentest oznaczony jako BLOCKING FAIL 'no pen test on record' (linie 378-418); komentarze wprost zabraniają osłabiania ich do fałszywego PASS (385-386). Restore-test wspomniany jako analogiczny w 276 i 520.", "refs": ["Pipeline/.github/workflows/evidence-pack.yml"], "codeExcerpt": "      # The BLOCKING FAIL/INDETERMINATE rows are HONEST control gaps awaiting org-\n      # conducted evidence (identical to the A.10 restore-test) — do NOT weaken them\n      # to a fake PASS. On non-PR they fail the pack closed; on PR they warn so the\n      # dry-run pack still assembles.\n      - name: Generate Part-G governance/resilience evidence (C.9/E.1/E.2/E.4/A.7.7)\n# ... (pominięto) ...\n          # (1) C.9 — independent penetration testing (BLOCKING). Honest FAIL until a\n          #     fresh, independent, signed report with retested Critical/High findings.\n          gen_artifact \"Penetration testing (C.9)\" \"evidence/pentest-report.json\" \"BLOCKING\" \\\n            python3 scripts/validators/check_pentest.py docs/governance/pentest-report.yaml \\\n              --schema schemas/pentest-report.schema.json --out evidence/pentest-report.json", "codePath": "Pipeline/.github/workflows/evidence-pack.yml", "codeLang": "yaml", "codeStart": 384, "howItWorks": "Krok generuje dowody Part-G dla kontroli governance/resilience. Funkcja 'gen_artifact' uruchamia walidator (tu 'check_pentest.py'), odczytuje z jego JSON pole 'status' i 'tier'; jeśli tier to 'BLOCKING', a status nie jest 'PASS', ustawia 'BLOCKING_FAIL=1'. Pentest (C.9) jest świadomie oznaczony jako BLOCKING i pozostaje uczciwym FAIL ('no pen test on record'), dopóki nie pojawi się świeży, niezależny, podpisany raport z retestem znalezień Critical/High. Komentarz w kodzie wprost zakazuje osłabiania tych wierszy do fałszywego PASS. Na main niepusty BLOCKING_FAIL zatrzymuje pack (fail-closed); na PR tylko ostrzega, by dry-run się złożył. Restore-test (A.10) działa identycznie.", "whyItWorks": "To najuczciwszy element taśmy. Pentest, restore-test czy przegląd dostępów wymagają realnych działań ludzi, których oprogramowanie nie może sfałszować — więc dopóki nie ma PRAWDZIWEGO dowodu, bramka świeci na czerwono, i tak ma być. Łatwo byłoby ustawić te bramki na 'zielone na zawsze' i udawać 100% zgodności, ale fałszywy PASS w teczce audytowej jest GORSZY niż uczciwy FAIL — wprowadza audytora w błąd, co przy DORA/NIS2 może mieć skutki prawne. Czerwone bramki pełnią funkcję mapy drogowej: dokładnie pokazują, czego brakuje do realnej zgodności. Komentarz-zakaz osłabiania chroni tę uczciwość przed przyszłą pokusą 'naprawienia na zielono'."}, {"id": "phase6-seal", "title": "Faza 6c — Zapieczętowanie: Merkle, podpis i znacznik czasu na finalnej teczce", "plain": "Ostatni krok: zamknięcie teczki tak, by nikt nie mógł jej później podmienić. Najpierw powstaje manifest.json — spis wszystkich plików z ich odciskami (hashami SHA-256). Z tych odcisków budowany jest 'korzeń Merkle' (jeden hash reprezentujący CAŁĄ teczkę — zmiana dowolnego pliku zmienia korzeń). Korzeń jest podpisywany keyless przez Cosign i ostemplowany znacznikiem czasu RFC-3161 z serwera TSA (freetsa.org). Wszystko trafia do jednego PDF/A-3 z doklejonymi surowymi dowodami. Na koniec manifest jest przeliczany ponownie, by objął także zapieczętowany PDF.", "analogy": "Drzewo Merkle to jak spis treści, gdzie numer każdej strony zależy od numerów wszystkich poprzednich — wyrwij jedną kartkę, a spis przestaje się zgadzać. Znacznik czasu to jak pieczątka poczty z datą na liście poleconym: dowód, że dokument istniał w danym dniu i od tamtej pory się nie zmienił.", "why": "To daje teczce niezaprzeczalność: audytor może w każdej chwili przeliczyć hashe i potwierdzić, że nic nie ruszono. Uczciwy stan: znacznik czasu to standardowy RFC-3161 z darmowego, publicznego TSA — NIE jest to jeszcze kwalifikowany znacznik eIDAS (QTS). Podniesienie do kwalifikowanego dostawcy (np. KIR Szafir, Certum) jest przygotowane jako przełącznik konfiguracyjny, nie zmiana kodu. Na main brak podpisu Merkle to twardy błąd; na PR sealing degraduje się uczciwie.", "inRepo": "Pipeline/.github/workflows/evidence-pack.yml — pełny blok sealing (linie 1564-1624): generate-evidence-manifest + Merkle (1579-1582), render PDF/A-3 (1601-1608), 'seal-evidence.sh evidence ... (qpdf, veraPDF, cosign, RFC-3161 TSA, PAdES)' linia 1611, TSA_URL=freetsa.org w 1563, anti-regresja Merkle-bundle non-PR (1626-1638). Logika pieczęci w scripts/seal-evidence.sh:47-68 opisuje ścieżkę upgrade do QTS.", "refs": ["Pipeline/.github/workflows/evidence-pack.yml", "Pipeline/scripts/seal-evidence.sh", "Pipeline/README.md"], "codeExcerpt": "          # (1) Structured manifest + Merkle root (first pass, pre-PDF).\n          python3 scripts/generate-evidence-manifest.py evidence \\\n            --out evidence/manifest.json \\\n            --legacy-out evidence/manifest.sha256\n# ... (pominięto) ...\n          # (5) Render PDF/A-3b with embedded raw evidence attachments.\n          python3 scripts/render-evidence-pdf.py \\\n            --html evidence/audit-document.html \\\n            --evidence-dir evidence \\\n            --out evidence/evidence-report.pdf \\\n            --attach evidence/manifest.json \\\n            --attach evidence/oscal-assessment-results.json \\\n            --attach evidence/sbom.cyclonedx.json \\\n            --attach evidence/provenance.intoto.jsonl\n\n          # (6) Seal: qpdf normalize, veraPDF gate, cosign, RFC-3161 TSA, PAdES.\n          bash scripts/seal-evidence.sh evidence evidence/evidence-report.pdf evidence/manifest.json", "codePath": "Pipeline/.github/workflows/evidence-pack.yml", "codeLang": "yaml", "codeStart": 1579, "howItWorks": "Ostatni etap pieczętuje teczkę. (1) 'generate-evidence-manifest.py' tworzy manifest.json — spis wszystkich plików z ich hashami SHA-256 — i z tych hashy buduje korzeń Merkle (jeden hash reprezentujący CAŁĄ teczkę). (5) 'render-evidence-pdf.py' składa wszystko do jednego PDF/A-3b z doklejonymi ('--attach') surowymi dowodami: manifestem, OSCAL, SBOM-em, provenance. (6) 'seal-evidence.sh' wykonuje właściwą pieczęć: normalizuje PDF (qpdf), bramkuje zgodność PDF/A (veraPDF), podpisuje keyless (cosign), stempluje znacznikiem czasu RFC-3161 z TSA i wbija podpis PAdES. Po pieczęci manifest jest przeliczany ponownie, by objął także zapieczętowany PDF. W seal-evidence.sh:47-68 udokumentowano, że upgrade z freetsa.org do kwalifikowanego eIDAS QTS (KIR Szafir, Certum) to przełącznik konfiguracyjny (QTS_URL/QTS_PROVIDER), nie zmiana kodu.", "whyItWorks": "Korzeń Merkle daje niezaprzeczalność: zmiana dowolnego pliku zmienia jego hash, a przez to korzeń, więc audytor może w każdej chwili przeliczyć hashe i potwierdzić, że nic nie ruszono. Znacznik czasu RFC-3161 to dowód, że teczka istniała w danej chwili i od tej pory się nie zmieniła (jak pieczątka poczty na liście poleconym). Uczciwy stan jest jawny: freetsa.org to standardowy, ale NIE-kwalifikowany TSA — kod nie udaje eIDAS QTS, lecz przygotowuje ścieżkę upgrade'u jako parametry konfiguracyjne, co jest poprawne projektowo (separacja polityki od mechanizmu). Re-stamp manifestu po pieczęci zamyka pętlę: nawet finalny PDF jest objęty hashem."}]}, {"area": "6 · Zgodność — DORA, NIS2, RODO, ISO, eIDAS po ludzku", "intro": "\"Zgodność\" (compliance) to po prostu udowadnianie urzędom i klientom, że robisz rzeczy bezpiecznie — tak jak restauracja musi pokazać sanepidowi, że trzyma jedzenie w lodówce. W tym rozdziale tłumaczymy pięć dużych regulacji UE jednym zdaniem każda, pokazujemy którą część pipeline'u CyberForge to \"zalicza\", a potem przechodzimy przez dziesięć automatycznych kontroli (A.1–A.10). Uczciwie: jedna z nich (test odtworzenia) świeci na czerwono i tak ma być — bo nikt jeszcze nie zrobił prawdziwej próby.", "blocks": [{"id": "dora", "title": "DORA — odporność cyfrowa banków i firm finansowych", "plain": "DORA to unijne rozporządzenie, które wymaga, żeby instytucje finansowe (banki, ubezpieczyciele, fintech) potrafiły przetrwać awarie i ataki na swoje systemy IT. W jednym zdaniu: udowodnij, że Twoje IT się nie wywróci, a jak się wywróci — szybko wstanie. Cztery filary to: testowanie odporności, rejestr dostawców usług IT, zgłaszanie poważnych incydentów regulatorowi, oraz przechowywanie dowodów (zwykle 5 lat).", "analogy": "To jak wymóg, by linia lotnicza miała procedury awaryjne, listę wszystkich firm serwisujących samoloty i regularnie ćwiczyła ewakuację — nie wystarczy, że samolot lata, musisz pokazać, że jesteś gotowy na najgorsze.", "why": "Bez DORA jeden zhakowany dostawca chmury mógłby położyć bank i zablokować pieniądze milionów ludzi. W Polsce nadzoruje to KNF (Komisja Nadzoru Finansowego), a poważne incydenty zgłasza się przez jej system, gdzie wymagany jest kod LEI (Legal Entity Identifier — międzynarodowy numer identyfikujący firmę, jak NIP, ale globalny).", "inRepo": "Pipeline pokrywa techniczną część DORA: bramki bezpieczeństwa, podpisane artefakty (SBOM + provenance) jako dowód kontroli łańcucha dostaw, oraz pakiet dowodowy. Mapowanie pokazuje uczciwie, że zarządzanie, raportowanie do regulatora i plany ciągłości działania to NIE jest zadanie pipeline'u — to 'Phase F / Org Required'. Zob. tabela DORA w Pipeline/docs/compliance-matrix.md (sekcja 3, art. 5, 16, 17, 19, 24, 28-30).", "refs": ["Pipeline/docs/compliance-matrix.md", "Pipeline/docs/poland-appendix.md"], "codeExcerpt": "| Art. 5 (management body) | Leadership accountability and oversight for ICT risk | Pipeline provides technical evidence that management can review, but does not create governance itself | `pipeline-run.json`, governance docs | Evidence Pack metadata, governance records (outside pipeline) | Phase F / Org Required | Management oversight procedures, approval records, training, board reporting cadence |\n| ICT risk mgmt framework (DORA ICT risk chapters incl. Art.16 intent) | Identify, protect, detect, respond, recover for ICT risk | Pipeline acts as a preventive and detective control layer in software delivery | Phases 1-6 workflows, OPA policies, Terraform IaC | `security-report.json`, `pipeline-run.json`, `compliance-matrix.json` | Partial (Pipeline + Org) | Enterprise risk register, treatment plans, asset inventory, recovery procedures |\n| Art.16.1.a (risk mgmt support) | ICT risk controls should be implemented and evidenced | Enforce pre-merge and pre-deploy gates to reduce risky changes entering production | Phase 1 (TruffleHog, Checkov, lint), Phase 2 (SCA/SAST/tests), Phase 4 verify-before-deploy | `security-report.json`, `dependency-review.json`, `pipeline-run.json` | Direct (Pipeline) | Formal risk methodology and ownership outside CI/CD |", "codePath": "Pipeline/docs/compliance-matrix.md", "codeLang": "text", "codeStart": 120, "howItWorks": "To tabela mapowania DORA: każdy wiersz ma kolumnę 'Coverage type', która jawnie klasyfikuje pokrycie. Art. 5 (zarząd) jest oznaczony 'Phase F / Org Required' — pipeline tylko dostarcza dowody do przeglądu, nie tworzy ładu korporacyjnego. Art. 16 (ramy zarządzania ryzykiem ICT) to 'Partial (Pipeline + Org)' — pipeline jest warstwą kontroli prewencyjnej/detekcyjnej, ale potrzebny jest też rejestr ryzyka. Art. 16.1.a to 'Direct (Pipeline)', bo bramki pre-merge/pre-deploy realnie blokują ryzykowne zmiany. Kolumna 'What else must be added' za każdym razem mówi, czego brakuje poza pipeline'em.", "whyItWorks": "Cztery filary DORA wymagają testowania odporności, rejestru dostawców, raportowania incydentów i przechowywania dowodów — z czego pipeline pokrywa techniczny fragment. Jawne kolumny Coverage type/What-else są kluczowe, bo uczciwie oddzielają to, co maszyna naprawdę egzekwuje (Direct), od zadań zarządu, BC/DR i raportowania do regulatora (Phase F). Bez tego rozróżnienia łatwo byłoby przesadzić z deklaracją zgodności DORA."}, {"id": "nis2", "title": "NIS2 — cyberbezpieczeństwo firm kluczowych dla państwa", "plain": "NIS2 to unijna dyrektywa o cyberbezpieczeństwie podmiotów ważnych dla funkcjonowania państwa (energetyka, zdrowie, transport, cyfrowi dostawcy itd.). W jednym zdaniu: zarządzaj ryzykiem cyber, pilnuj łańcucha dostaw, używaj porządnej kryptografii i zgłaszaj incydenty. Artykuł 21 wymienia konkretne środki: analiza ryzyka, obsługa incydentów, ciągłość działania, bezpieczeństwo łańcucha dostaw, kryptografia, MFA.", "analogy": "To jak przepisy przeciwpożarowe dla budynków użyteczności publicznej — szpital ma więcej obowiązków niż mały sklepik, bo jak szpital stanie, ucierpi całe miasto.", "why": "Atak na elektrownię albo szpital to nie tylko strata firmy — to zagrożenie dla ludzi. W Polsce wdraża to nowelizacja Ustawy o krajowym systemie cyberbezpieczeństwa (KSC, Dz.U. 2026 poz. 252, wejście 3 kwietnia 2026); trzeba się zaklasyfikować jako 'podmiot kluczowy' lub 'ważny' i zarejestrować w wykazie.", "inRepo": "Pipeline mocno wspiera art. 21(2)(d) łańcuch dostaw (SBOM, skanowanie zależności, podpisane atestacje), (e) bezpieczne wytwarzanie (bramki SAST/SCA/DAST) i (h) kryptografię (podpisy keyless, OIDC zamiast stałych haseł). Obowiązki organizacyjne (zarząd, BC/DR, raportowanie do CSIRT) są oznaczone jako poza pipeline'em. Zob. Pipeline/docs/compliance-matrix.md sekcja 4.", "refs": ["Pipeline/docs/compliance-matrix.md", "Pipeline/docs/poland-appendix.md"], "codeExcerpt": "| Art.21.2(d) supply chain security | Manage third-party and supply-chain cyber risks | SBOM, SCA, signed attestations, provenance support software supply-chain controls | `build-and-scan.yml`, `sign-and-attest.yml`, `renovate.json` | `dependency-review.json`, `sbom.cyclonedx.json`, `provenance.intoto.jsonl` | Direct (Pipeline) for software supply chain / Partial overall | Supplier governance process, contractual controls, periodic assessments |\n| Art.21.2(e) secure development and vulnerability handling/disclosure | Secure acquisition, development, maintenance, and vuln handling | CI/CD gates, tests, scans, DAST, deployment verification implement SSDLC controls | Phases 1-5, OPA deployment gate policy | `security-report.json`, coverage, `zap-report.json`, `cosign-verification.log` | Partial (Pipeline + Org) | Vulnerability disclosure policy/process, remediation SLA governance |\n| Art.21.2(h) cryptography and encryption | Appropriate use of cryptography | Design uses OIDC, keyless signing, signature verification, and secure artifact attestations | `sign-and-attest.yml`, `deploy.yml`, Azure OIDC login | `cosign-verification.log`, provenance, `pipeline-run.json` | Direct (Pipeline) | Organization-wide crypto/key mgmt standards outside CI/CD |", "codePath": "Pipeline/docs/compliance-matrix.md", "codeLang": "text", "codeStart": 154, "howItWorks": "Tabela NIS2 art. 21 rozbija konkretne środki na osobne wiersze. (d) łańcuch dostaw → SBOM, SCA, podpisane atestacje i provenance, oznaczone 'Direct (Pipeline) for software supply chain'. (e) bezpieczne wytwarzanie → bramki CI/CD, testy, DAST i weryfikacja przy deployu. (h) kryptografia → OIDC, podpisy keyless, weryfikacja podpisu — też 'Direct (Pipeline)'. Każdy wiersz wskazuje pliki workflow (build-and-scan.yml, sign-and-attest.yml, deploy.yml) i dowody, które te środki produkują.", "whyItWorks": "Art. 21(2) NIS2 to lista technicznych środków zarządzania ryzykiem, a właśnie te (d/e/h) pipeline egzekwuje realnie kodem — dlatego dostają 'Direct'. Reszta art. 21 (np. obowiązki zarządu, BC/DR, raportowanie do CSIRT z art. 23) jest celowo oznaczona jako organizacyjna. Taki podział pozwala kupującemu zobaczyć dokładnie, które litery art. 21 dany pipeline domyka technicznie, a których nie tknie."}, {"id": "rodo", "title": "RODO/GDPR — ochrona danych osobowych", "plain": "RODO (po angielsku GDPR) chroni dane osobowe ludzi (imię, e-mail, PESEL, lokalizacja). W jednym zdaniu: zbieraj tylko tyle danych ile trzeba, trzymaj je tylko tak długo ile trzeba, i jak nastąpi wyciek — masz 72 godziny, żeby zgłosić to do UODO. Kluczowe dokumenty to RoPA (Records of Processing Activities — rejestr czynności przetwarzania, czyli spis 'jakie dane, po co i jak długo trzymamy') i DPIA (Data Protection Impact Assessment — ocena skutków dla ochrony danych, robiona przy ryzykownym przetwarzaniu).", "analogy": "To jak zasady w przychodni: lekarz może spytać o to, co potrzebne do leczenia, kartę trzyma w zamkniętej szafce przez określony czas, a jak ktoś włamie się do kartoteki — musi szybko powiadomić pacjentów i urząd.", "why": "Twoje dane to Twoja prywatność i bezpieczeństwo — RODO daje za nadużycia kary do dziesiątek milionów euro. W Polsce egzekwuje to UODO (Urząd Ochrony Danych Osobowych), z polską Ustawą o ochronie danych osobowych z 10 maja 2018 jako nakładką krajową.", "inRepo": "Pipeline dostarcza dowody wspierające: skanowanie PII (Personally Identifiable Information — dane osobowe), mapę przepływu danych, sprawdzanie umów powierzenia (DPA) i sprawdzanie retencji. RODO pozostaje głównie sprawą prawno-organizacyjną — pipeline to tylko techniczne 'kwity'. Zob. Pipeline/docs/compliance-matrix.md sekcja 7 (art. 5, 25, 28, 30, 32, 33/34).", "refs": ["Pipeline/docs/compliance-matrix.md", "Pipeline/docs/poland-appendix.md"], "codeExcerpt": "| Art.5(1)(c) Data minimization | Keep personal data limited to what is necessary | Evidence workflow sanitizes logs and reduces unnecessary PII in archived artifacts | `scripts/sanitize-logs.sh`, `evidence-pack.yml` | Sanitized logs, `dpa-compliance-check.json` | Partial (Pipeline + Org) | Data classification policy, retention/access procedures beyond CI/CD |\n| Art.5(1)(e) Storage limitation | Retain data only as long as necessary | Retention metadata checks and storage lifecycle/WORM design for audit evidence | `policies/retention-policy.rego`, storage Terraform module, `evidence-pack.yml` | Retention check outputs, storage config, `dpa-compliance-check.json` | Partial (Pipeline + Org) | Legal retention schedule validation, destruction procedures, exceptions governance |\n| Art.25 Data protection by design/default | Build privacy considerations into systems/processes | PII scanning and data-flow mapping support engineering privacy-by-design evidence | Phase 1 PII scanner, `scripts/generate-data-flow.sh`, docs | `data-flow-diagram.json`, PII scan outputs | Partial (Pipeline + Org) | DPIA methodology, privacy requirements process, product design reviews |\n| Art.28 Processor obligations | Ensure processor agreements and controls | DPA check script tracks status of key pipeline processors and services | `scripts/check-dpa.sh`, Phase 6 evidence generation | `dpa-compliance-check.json` | Partial (Pipeline + Org) | Formal processor inventory, DPA repository, contract/legal review process |", "codePath": "Pipeline/docs/compliance-matrix.md", "codeLang": "text", "codeStart": 257, "howItWorks": "Tabela RODO mapuje zasady na techniczne wsparcie pipeline'u. Art. 5(1)(c) minimalizacja → sanityzacja logów (sanitize-logs.sh) usuwa zbędne PII z archiwum. Art. 5(1)(e) ograniczenie przechowywania → sprawdzenia retencji (retention-policy.rego + moduł storage Terraform). Art. 25 privacy by design → skaner PII i mapa przepływu danych (generate-data-flow.sh → data-flow-diagram.json). Art. 28 → check-dpa.sh śledzi status umów powierzenia. Wszystkie cztery to 'Partial (Pipeline + Org)'.", "whyItWorks": "RODO jest głównie prawno-organizacyjne, więc żaden wiersz nie jest 'Direct' — pipeline dostarcza tylko techniczne 'kwity' (sanityzacja, mapa danych, status DPA, kontrola retencji). Kolumna 'What else must be added' przypomina, że klasyfikacja danych, DPIA, harmonogram retencji i procedura zgłaszania naruszeń w 72h zostają po stronie firmy/prawnika. To dokładnie oddaje rolę pipeline'u jako wsparcia dowodowego, a nie programu RODO."}, {"id": "iso-soc2", "title": "ISO 27001 (i SOC 2) — standardy zarządzania bezpieczeństwem", "plain": "ISO/IEC 27001 to międzynarodowy standard: nie sprawdza pojedynczego narzędzia, tylko czy firma ma cały SYSTEM zarządzania bezpieczeństwem informacji (ISMS — Information Security Management System). Sercem jest SoA (Statement of Applicability — Deklaracja Stosowania, czyli lista: 'które z ~93 kontroli z Załącznika A stosujemy i dlaczego'). SOC 2 to amerykański odpowiednik — atestacja, że Twoje kontrole działały przez dany okres czasu.", "analogy": "ISO 27001 to jak certyfikat jakości HACCP dla restauracji — nie ocenia jednej potrawy, tylko czy masz spisane procedury, kto za co odpowiada, i czy regularnie sprawdzasz, że ich przestrzegasz.", "why": "Certyfikat ISO to wspólny język zaufania — klient z drugiego końca świata wie, co oznacza, bez audytowania Cię od zera. UWAGA na pułapkę: sam certyfikat ISO NIE dowodzi zgodności z NIS2/DORA — to dowód wspierający, a nie zastępczy (to jeden z 'rejection triggers' w specyfikacji).", "inRepo": "Pipeline silnie wspiera techniczne kontrole z Załącznika A: A.8.25 bezpieczny cykl wytwarzania, A.8.28 bezpieczne kodowanie, A.8.32 zarządzanie zmianą, A.8.8 zarządzanie podatnościami. Same Klauzule 4-10 (system zarządzania, przywództwo, audyty) są organizacyjne ('Phase F'). Zob. Pipeline/docs/compliance-matrix.md sekcja 5; metodyka dojrzałości SoA w Pipeline/docs/soa-maturity-methodology.md.", "refs": ["Pipeline/docs/compliance-matrix.md", "Pipeline/docs/soa-maturity-methodology.md"], "codeExcerpt": "## 1. Why a computed score (the overclaim it removes)\n\nThe pack structure (struktura §13) previously printed a fixed headline:\n\n> \"Pakiet jest dostarczany na poziomie **L5 (state-of-the-art)**\" — *the pack is\n> delivered at level L5*.\n\nA self-declared L5 with no computed evidence is exactly the rejection trigger the spec\nwarns about (spec §8 #1 \"evidence assembled for the audit, not produced by the\npipeline\"; #9 \"provenance unsigned... can't prove\"). **T-122 replaces the hardcoded\nheadline with a level computed from the artifacts that actually exist in the pack**, so\nthe maturity claim is falsifiable by re-running the validator.\n\n**Rule:** the headline maturity level equals the **lowest** of the five scored\ndimensions (a chain is only as strong as its weakest link). It is never a literal `L5`.", "codePath": "Pipeline/docs/soa-maturity-methodology.md", "codeLang": "text", "codeStart": 27, "howItWorks": "Ten fragment opisuje, jak liczona jest dojrzałość SoA/ISMS dla ISO 27001. Wcześniej pakiet drukował sztywny nagłówek 'L5 (state-of-the-art)'. T-122 zastępuje to poziomem WYLICZONYM z artefaktów faktycznie obecnych w pakiecie (przez validator soa_maturity.py, który parsuje każdy wiersz Załącznika A z statement-of-applicability.md). Reguła: nagłówkowy poziom = NAJNIŻSZY z pięciu wymiarów ('łańcuch jest tak mocny jak najsłabsze ogniwo'), nigdy literalne L5.", "whyItWorks": "Sercem ISO 27001 jest SoA (Deklaracja Stosowania) i działający ISMS, a nie pojedyncze narzędzie. Samodeklarowane L5 bez dowodów to klasyczny powód odrzucenia audytu (spec §8 #1). Liczenie poziomu z realnych wierszy SoA czyni deklarację falsyfikowalną — wystarczy ponownie uruchomić validator. Branie minimum z wymiarów zapobiega zawyżaniu oceny przez jeden mocny obszar, co jest uczciwe wobec audytora ISO/SOC 2."}, {"id": "eidas", "title": "eIDAS — podpisy i znaczniki czasu, które są dowodem w sądzie", "plain": "eIDAS to unijne rozporządzenie o 'usługach zaufania': elektronicznych podpisach, pieczęciach i znacznikach czasu. Najważniejszy dla nas jest kwalifikowany znacznik czasu (QTS — Qualified Time Stamp). To pieczątka 'ten plik istniał DOKŁADNIE o tej godzinie i nikt go potem nie zmienił', ale wystawiona przez kwalifikowanego dostawcę — i wtedy ma w sądzie domniemanie prawdziwości (eIDAS art. 41), czyli to druga strona musi udowodnić, że jest inaczej.", "analogy": "Zwykły znacznik czasu to jak data napisana długopisem na kopercie — prawdopodobnie prawdziwa, ale ktoś mógł ją dopisać później. Kwalifikowany znacznik (QTS) to jak pieczęć notariusza na tej kopercie — sąd domyślnie jej wierzy.", "why": "Bez kwalifikowanego znacznika dowody (zatwierdzenia zarządu, raporty incydentów) są technicznie ważne, ale słabsze prawnie przed KNF, UODO czy sądem. Polscy kwalifikowani dostawcy QTS to m.in. KIR (Szafir), Certum (Asseco), EuroCert i CenCert.", "inRepo": "UCZCIWY STAN: pipeline znakuje czasem standardowym, NIEkwalifikowanym RFC-3161 (publiczny TSA, domyślnie freetsa.org) — nie jest to jeszcze kwalifikowany eIDAS QTS. Brak pojedynczego znacznika to warunek 'miękki' (status=unavailable), ale ZERO ważnych znaczników na wszystkich artefaktach to twardy błąd. Punkt podmiany na QTS jest opisany. Zob. scripts/seal-evidence.sh:75 (TSA_URL), funkcja rfc3161_stamp ~453-559, twardy fail przy zerze 586; README.md:48-51; Pipeline/docs/poland-appendix.md sekcja 6.5.", "refs": ["Pipeline/scripts/seal-evidence.sh", "Pipeline/README.md", "Pipeline/docs/poland-appendix.md"], "codeExcerpt": "rfc3161_stamp() {\n  # $1 = label, $2 = path-to-data-file\n  local label=\"$1\" data=\"$2\"\n  local tsq=\"${EVIDENCE_DIR}/${label}.tsq\"\n  local tsr=\"${EVIDENCE_DIR}/${label}.tsr\"\n  if openssl ts -query -data \"${data}\" -sha256 -cert -out \"${tsq}\" >/dev/null 2>&1; then\n    # Build the curl arg list. An optional TSA_AUTH header lets authenticated\n    # (paid) qualified-QTS endpoints work without changing this code; it is\n    # passed verbatim and only added when non-empty (freetsa needs no auth).\n    local -a curl_args=(-fsS -H \"Content-Type: application/timestamp-query\")\n    [ -n \"${TSA_AUTH}\" ] && curl_args+=(-H \"${TSA_AUTH}\")\n    curl_args+=(--data-binary \"@${tsq}\" \"${TSA_URL}\" -o \"${tsr}\")\n    if curl \"${curl_args[@]}\" 2>/dev/null; then\n      # Produced AND valid: only count a token the TSA actually granted. A 200\n      # response carrying a non-token body must NOT masquerade as a stamp.\n      if tsr_is_valid_token \"${tsr}\"; then\n        set_sig rfc3161 \"${label}_tsr=$(basename \"${tsr}\")\" \"${label}_status=stamped\"", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 474, "howItWorks": "Funkcja rfc3161_stamp robi znacznik czasu RFC-3161 nad podanym plikiem. Najpierw 'openssl ts -query' tworzy zapytanie (.tsq) z hashem SHA-256 danych. Potem curl POST-uje to do TSA_URL (domyślnie freetsa.org, ustawiane w linii 75) i zapisuje odpowiedź jako .tsr. Kluczowe: token liczy się tylko, gdy tsr_is_valid_token potwierdzi 'Status: Granted' — odpowiedź 200 z nie-tokenem (strona błędu HTML) NIE może udawać znacznika. Opcjonalny nagłówek TSA_AUTH pozwala wpiąć płatny, uwierzytelniany endpoint QTS bez zmiany kodu.", "whyItWorks": "eIDAS art. 41 daje domniemanie prawdziwości tylko KWALIFIKOWANEMU znacznikowi (QTS). Tutaj pipeline uczciwie używa standardowego, NIEkwalifikowanego freetsa.org — i kod jest tak napisany, by łatwo podmienić go na QTS (wystarczy ustawić TSA_URL/TSA_AUTH na kwalifikowany endpoint). Twarda walidacja 'granted' zapobiega zaliczeniu fałszywego tokenu, co byłoby gorsze niż brak znacznika. To wzorcowy 'punkt podmiany' z honest-state: technicznie poprawny stamp dziś, gotowa droga do legalnego QTS jutro."}, {"id": "podpis-i-slsa", "title": "Jak pipeline naprawdę podpisuje dowody (SLSA L2, nie L3)", "plain": "Każdy artefakt w pakiecie dowodowym jest podpisany kryptograficznie keyless Cosign (Sigstore) — to znaczy, że podpis powstaje bez stałego klucza prywatnego (tożsamość bierze się z OIDC), a fakt podpisania trafia do Rekor (publiczny, niezmienny dziennik 'kto co podpisał i kiedy'). Dodatkowo budowa generuje provenance — metrykę 'co dokładnie zbudowano, z czego i przez kogo' w formacie SLSA.", "analogy": "To jak pieczęć lakowa, której wzór jest publicznie zarejestrowany — każdy może sprawdzić, że to Ty zapieczętowałeś list, a wpis w rejestrze pieczęci dowodzi, że zrobiłeś to wtedy a nie później.", "why": "To odpowiada na 'rejection trigger' audytorów: dowody zebrane na audyt (bez podpisów, z podejrzanie jednakowymi datami) są odrzucane. Podpis w momencie produkcji = dowód, że nikt nie sfabrykował kwitów po fakcie.", "inRepo": "UCZCIWY STAN: pipeline osiąga SLSA Build L2 (cel L3 jeszcze nie osiągnięty — zob. Pipeline/docs/s
