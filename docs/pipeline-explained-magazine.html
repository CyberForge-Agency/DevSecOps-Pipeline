eckov runs — so a silenced control\n        # can never quietly green the IaC gate. Mirrors the .trivyignore VEX policy.\n        run: |\n          python3 scripts/validate-checkov-skips.py \\\n            --register docs/compliance/checkov-exceptions.md \\\n            --workflow .github/workflows/security-gate.yml\n\n      - name: Install Checkov\n        run: pip3 install checkov\n\n      - name: Run Checkov\n        run: |\n          # pipefail REQUIRED: tee would otherwise mask Checkov's non-zero exit\n          # on policy failures, silently passing the IaC security gate.\n          set -o pipefail\n          # CHECKOV_SKIP_CHECKS: each id below is justified (reason + compensating\n          # control + owner + expiry) in docs/compliance/checkov-exceptions.md and\n          # enforced by the \"Validate Checkov skip justifications\" step above. Do not\n          # edit this list without updating the register — the validator will fail CI.", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 100, "howItWorks": "To job skanu IaC narzędziem Checkov. Checkov czyta pliki Terraform z katalogu `infra/` i sprawdza setki reguł bezpieczeństwa chmury (np. czy magazyn nie jest publiczny, czy włączone jest szyfrowanie). Niektóre reguły są świadomie pomijane przez listę `CHECKOV_SKIP_CHECKS`. Ale ZANIM Checkov wystartuje, krok `Validate Checkov skip justifications` uruchamia walidator, który porównuje każdy pominięty identyfikator (np. CKV_AZURE_163) z rejestrem wyjątków w `docs/compliance/checkov-exceptions.md`. Jeśli jakiś skip nie ma uzasadnionego, niewygasłego wpisu w rejestrze — albo lista w workflow rozjechała się z rejestrem — job pada błędem przed skanem.", "whyItWorks": "To ten sam wzorzec, co przy `.trivyignore`: mechanizm pomijania kontroli jest potrzebny (nie wszystkie reguły pasują do każdego projektu), ale bez nadzoru staje się tylną furtką do wyciszania bezpieczeństwa. Wymóg, by każdy skip miał uzasadnienie, właściciela, kontrolę kompensującą i datę wygaśnięcia w wersjonowanym rejestrze, czyni decyzje audytowalnymi i odwracalnymi. Walidacja PRZED skanem oraz `set -o pipefail` (by `tee` nie zamaskował błędu Checkova) razem gwarantują, że żadnej kontroli IaC nie da się po cichu wyłączyć — co jest sednem zgodności (compliance) infrastruktury jako kodu."}, {"id": "skan-obrazu-trivy-image", "title": "Skan kontenera/obrazu — dziury w obrazie Dockera (Trivy image)", "plain": "Aplikacja jest pakowana w obraz Dockera (container image — \"gotowa paczka z aplikacją i całym jej środowiskiem: systemem, bibliotekami systemowymi, narzędziami\"). Ten skan, znowu Trivy ale w trybie `trivy image`, sprawdza CAŁĄ tę paczkę — nie tylko biblioteki aplikacji, ale też system operacyjny i pakiety systemowe wewnątrz obrazu — pod kątem znanych CVE.", "analogy": "SCA sprawdzało składniki Twojego przepisu. Skan obrazu sprawdza całą zapakowaną gotową potrawę razem z opakowaniem, sztućcami i pojemnikiem — bo dziura może siedzieć w starym systemie bazowym, nie w Twoim kodzie.", "why": "Możesz mieć idealny kod, ale jeśli obraz bazowy ma przestarzały, dziurawy pakiet systemowy, atakujący wejdzie przez niego. To jest też miejsce, gdzie powstaje SBOM (Software Bill of Materials — spis wszystkich składników obrazu, jak pełen skład na etykiecie).", "inRepo": "W jobie `docker-build` krok `Trivy image scan` (build-and-scan.yml:724-737) skanuje zbudowany obraz z progiem CRITICAL,HIGH i `--exit-code 1`. Zmierzone liczby krytycznych/wysokich CVE są przekazywane dalej do bramki OPA przy wdrożeniu, a SBOM generuje Syft w formacie CycloneDX (build-and-scan.yml:796-801).", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/app/Dockerfile"], "codeExcerpt": "      - name: Trivy image scan\n        run: |\n          # pipefail is REQUIRED: without it the pipe's exit status is tee's\n          # (always 0), so Trivy's --exit-code 1 on HIGH/CRITICAL findings would\n          # be swallowed and the gate would silently pass. GitHub's default\n          # shell (bash -e) does NOT enable pipefail.\n          set -o pipefail\n          trivy image \"${{ steps.meta.outputs.image_uri }}\" \\\n            --format json \\\n            --output trivy-image-results.json \\\n            --severity CRITICAL,HIGH \\\n            --exit-code 1 \\\n            --ignorefile app/.trivyignore \\\n            2>&1 | tee /tmp/trivy-image-console.txt", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 724, "howItWorks": "To skan całego obrazu Dockera, nie tylko bibliotek aplikacji. `trivy image` bierze zbudowany obraz (jego adres jest w `steps.meta.outputs.image_uri`) i przeszukuje WSZYSTKIE jego warstwy — system bazowy (tu Alpine z `node:20-alpine`), biblioteki systemowe i pakiety aplikacji — porównując je z bazą CVE. Próg `--severity CRITICAL,HIGH` i `--exit-code 1` blokują, gdy w paczce jest krytyczna/wysoka dziura, nawet jeśli pochodzi z systemu operacyjnego, a nie z kodu. `set -o pipefail` zapewnia, że kod błędu Trivy nie zginie w potoku do `tee`. Zmierzone liczby CVE krok dalej trafiają jako wyjście do bramki OPA przy wdrożeniu, a SBOM (spis składników) generuje Syft w formacie CycloneDX.", "whyItWorks": "Skan SCA (`trivy fs`) widzi tylko biblioteki aplikacji, ale wdrażamy CAŁĄ paczkę — łącznie z systemem operacyjnym obrazu, który też ma swoje podatności. Skan obrazu zamyka tę lukę: bez niego można by wdrożyć aplikację z czystym kodem, ale dziurawym systemem bazowym. Użycie tego samego progu i tego samego pliku wyjątków co przy SCA daje spójność, a przekazanie zmierzonych liczb do bramki OPA wiąże skan z faktyczną decyzją o wdrożeniu — wynik skanu nie jest tylko raportem do obejrzenia, lecz danymi, na których automat odmawia lub zezwala na deploy."}, {"id": "dast-zap", "title": "DAST — atakowanie działającej aplikacji z zewnątrz (OWASP ZAP)", "plain": "DAST (Dynamic Application Security Testing — \"dynamiczne testowanie bezpieczeństwa\") to przeciwieństwo SAST: zamiast czytać kod, uruchamia aplikację i atakuje ją z zewnątrz jak prawdziwy haker — wysyła zaczepne zapytania i patrzy, jak reaguje. Robi to OWASP ZAP w trybie baseline scan (skan podstawowy, bezpieczny, nieagresywny).", "analogy": "SAST to korektor czytający projekt zamka. DAST to wynajęty włamywacz, który przychodzi pod gotowy dom i naprawdę szarpie za klamki, puka w okna i próbuje sztuczek — bo niektóre dziury widać dopiero na żywym, uruchomionym obiekcie.", "why": "Część luk (błędne nagłówki bezpieczeństwa, ujawnianie informacji, błędy konfiguracji serwera) ujawnia się dopiero, gdy aplikacja działa. DAST łapie to, czego analiza kodu nie zobaczy. Tu znaleziska HIGH blokują i automatycznie zakładają zgłoszenie incydentu z terminami naprawy (SLA).", "inRepo": "Job `zap-scan` w dast.yml:16-31 skanuje wdrożony adres (target_url). Liczy znaleziska o riskcode>=3 (HIGH) i jeśli jest ich więcej niż 0 -> `exit 1` (dast.yml:140-144) plus automatyczny GitHub issue z SLA triage 4h / fix 48h (dast.yml:146-176). Uwaga uczciwa: w próbce offline DAST i pentest świecą honest-pending/czerwono, bo nie ma jeszcze realnego działającego celu do zaatakowania.", "refs": ["Pipeline/.github/workflows/dast.yml"], "codeExcerpt": "      - name: Fail on HIGH/CRITICAL findings\n        if: steps.zap-summary.outputs.high_critical_count != '0'\n        run: |\n          echo \"::error::OWASP ZAP found ${{ steps.zap-summary.outputs.high_critical_count }} HIGH/CRITICAL finding(s)\"\n          exit 1\n\n      - name: Create incident issue on HIGH/CRITICAL findings\n        if: always() && steps.zap-summary.outputs.high_critical_count != '0'\n        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0\n        env:\n          TARGET_URL: ${{ inputs.target_url }}\n        with:\n          script: |\n            const fs = require('fs');\n            let findings = 'Unable to parse ZAP report';\n            try {\n              const report = JSON.parse(fs.readFileSync('zap-report.json', 'utf8'));\n              const alerts = (report.site || []).flatMap(s => s.alerts || []);\n              const critical = alerts.filter(a => parseInt(a.riskcode) >= 3);", "codePath": "Pipeline/.github/workflows/dast.yml", "codeLang": "yaml", "codeStart": 138, "howItWorks": "To bramka DAST oparta na OWASP ZAP. Wcześniejszy krok policzył znaleziska o `riskcode>=3` (czyli HIGH/CRITICAL) i zapisał ich liczbę do `high_critical_count`. Krok `Fail on HIGH/CRITICAL findings` uruchamia się warunkiem `if: ... != '0'` — jeśli jest choć jedno wysokie ryzyko, robi `exit 1` i blokuje pipeline. Drugi krok, `Create incident issue`, przy tym samym warunku automatycznie tworzy zgłoszenie (GitHub issue) z listą znalezisk, linkiem do uruchomienia i wpisanym SLA (triage 4h, fix 48h). DAST różni się od SAST tym, że ZAP atakuje DZIAŁAJĄCĄ aplikację pod adresem `target_url`, wysyłając zaczepne zapytania jak prawdziwy napastnik.", "whyItWorks": "SAST czyta kod, ale niektóre dziury widać dopiero, gdy aplikacja działa — błędna konfiguracja serwera, brak nagłówków bezpieczeństwa, reakcja na złośliwe wejście. DAST domyka obraz, patrząc na system 'z zewnątrz', jak atakujący. Próg `riskcode>=3` skupia bramkę na realnie groźnych znaleziskach, a automatyczne tworzenie issue z SLA zamienia wykrycie w proces: ktoś dostaje zadanie z terminem, zamiast alertu, który zniknie w logach. Uczciwa uwaga z lekcji: w próbce offline DAST świeci honest-pending, bo nie ma jeszcze realnego celu do zaatakowania — bramka jest gotowa, ale wymaga działającego środowiska."}, {"id": "linting-megalinter", "title": "Linting — higiena i porządek w kodzie (MegaLinter)", "plain": "Linting (od \"linter\" — narzędzie zbierające \"kłaczki\", drobne usterki) sprawdza nie tyle bezpieczeństwo, co jakość i spójność kodu: literówki w składni, niebezpieczne konstrukcje języka, źle napisany Dockerfile, brzydkie formatowanie. W tym repo robi to MegaLinter, łączący wiele linterów w jeden przebieg.", "analogy": "Jak redaktor stylistyczny i sprawdzanie pisowni w edytorze tekstu: nie ocenia, czy treść jest prawdziwa, ale wyłapuje literówki, błędy gramatyczne i niespójny styl, żeby tekst był czytelny i profesjonalny.", "why": "Czysty, spójny kod jest mniej podatny na błędy i łatwiejszy do audytu. Część linterów (np. dla Dockerfile czy ryzykownych konstrukcji JS) realnie zapobiega błędom bezpieczeństwa, dlatego są blokujące.", "inRepo": "Job `linting` w security-gate.yml:202-255. Lintery błędów (JAVASCRIPT_ES, TYPESCRIPT_ES, DOCKERFILE_HADOLINT) są blokujące, a stylistyczne (MARKDOWN, YAML, JSON) tylko doradcze — wymienione w DISABLE_ERRORS_LINTERS. Dodatkowy krok \"Fail on lint errors\" z `always()` wymusza fail-closed, żeby bramka nie została po cichu pominięta (security-gate.yml:242-255).", "refs": ["Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "        uses: oxsecurity/megalinter/flavors/javascript@f90c800040e4f84800700b27b2394d3eecc1fdad # v8.4.0\n        env:\n          VALIDATE_ALL_CODEBASE: false\n          ENABLE_LINTERS: >-\n            JAVASCRIPT_ES,\n            TYPESCRIPT_ES,\n            DOCKERFILE_HADOLINT,\n            MARKDOWN_MARKDOWNLINT,\n            YAML_YAMLLINT,\n            JSON_JSONLINT\n          # Advisory tier: run but never block on style/format linters.\n          DISABLE_ERRORS_LINTERS: >-\n            MARKDOWN_MARKDOWNLINT,\n            YAML_YAMLLINT,\n            JSON_JSONLINT\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GITHUB_COMMENT_REPORTER: false", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 225, "howItWorks": "To konfiguracja MegaLintera — narzędzia łączącego wiele linterów w jeden krok. `ENABLE_LINTERS` włącza sześć linterów: dla JavaScriptu (JAVASCRIPT_ES), TypeScriptu (TYPESCRIPT_ES), Dockerfile (DOCKERFILE_HADOLINT) oraz dla Markdown/YAML/JSON. Najważniejszy jest podział na dwie warstwy: `DISABLE_ERRORS_LINTERS` wymienia trzy stylistyczne lintery (MARKDOWN, YAML, JSON) jako DORADCZE — one nadal działają i raportują, ale ich uwagi nigdy nie blokują pipeline. Pozostałe trzy (JS/TS/Dockerfile) są BLOKUJĄCE. Tuż za tym fragmentem dodatkowy krok 'Fail on lint errors' z warunkiem `always()` jeszcze raz wymusza fail, jeśli MegaLinter zgłosił błąd blokującego lintera.", "whyItWorks": "Nie każda uwaga lintera jest równa: literówka w formatowaniu Markdowna nie zagraża aplikacji, ale błąd w Dockerfile albo niebezpieczna konstrukcja JS już tak. Podział na warstwę blokującą i doradczą to dojrzała decyzja — egzekwujemy to, co ważne, a resztę zostawiamy jako sygnał bez paraliżowania zespołu drobiazgami. Krok 'Fail on lint errors' z `always()` jest kluczowy: bez `always()` GitHub po cichu pominąłby ten krok po wcześniejszym fail, więc bramka mogłaby zostać niezauważenie ominięta. Jawne, dwukrotne wymuszenie błędu czyni zachowanie bramki widocznym w YAML-u i odpornym na ciche przepuszczenie."}, {"id": "podpis-commita", "title": "Weryfikacja podpisu commitów (kto naprawdę napisał kod)", "plain": "Przy pull requeście pipeline sprawdza, czy każdy commit (zapis zmiany w kodzie) jest kryptograficznie podpisany i zweryfikowany przez GitHub. Niepodpisany commit blokuje scalenie. To nie skan dziur, ale element łańcucha zaufania — potwierdza tożsamość autora zmian.", "analogy": "Jak wymóg, by każdy wpis w księdze wieczystej był podpisany odręcznie i potwierdzony notarialnie — żeby nikt nie mógł podrobić, kto i co zmienił.", "why": "Bez podpisów ktoś może podszyć się pod innego programistę i wstrzyknąć złośliwą zmianę pod cudzym nazwiskiem. Podpisy commitów to fundament \"łańcucha dostaw\" oprogramowania i wymóg wielu standardów zgodności.", "inRepo": "Job `commit-signing` w security-gate.yml:273-316 (uruchamiany tylko dla PR) pyta API GitHuba o status weryfikacji każdego commita w PR; jeśli choć jeden jest niepodpisany -> `core.setFailed`. Łączy się to z keyless cosign + Rekor na późniejszym etapie podpisywania artefaktów (działa w realnym CI, w próbce offline jest honest-pending).", "refs": ["Pipeline/.github/workflows/security-gate.yml"], "codeExcerpt": "            let unsigned = 0;\n            for (const c of commits) {\n              const verified = c.commit.verification?.verified || false;\n              const reason = c.commit.verification?.reason || 'unknown';\n              if (!verified) {\n                core.warning(`Unsigned commit: ${c.sha} (reason: ${reason})`);\n                unsigned++;\n              }\n            }\n\n            core.setOutput('total', commits.length);\n            core.setOutput('unsigned', unsigned);\n\n            if (unsigned > 0) {\n              core.setFailed(`Found ${unsigned} unsigned commit(s). All commits must be signed.`);\n            } else {\n              core.info(`All ${commits.length} commits are signed and verified.`);\n            }", "codePath": "Pipeline/.github/workflows/security-gate.yml", "codeLang": "yaml", "codeStart": 299, "howItWorks": "To job weryfikacji podpisów commitów (uruchamiany tylko dla pull requestów). Skrypt pyta API GitHuba o listę wszystkich commitów w PR-ze, a następnie dla każdego sprawdza pole `c.commit.verification?.verified` — czy GitHub potwierdził kryptograficzny podpis autora. Operator `?.` (optional chaining) chroni przed błędem, gdy pole w ogóle nie istnieje, a `|| false` traktuje brak weryfikacji jako 'niepodpisany'. Każdy niezweryfikowany commit zwiększa licznik `unsigned`. Na końcu, jeśli `unsigned > 0`, wywołanie `core.setFailed(...)` blokuje cały job — czyli choćby jeden niepodpisany commit uniemożliwia scalenie PR-a.", "whyItWorks": "To nie skan dziur, lecz element łańcucha zaufania: podpis kryptograficzny commita potwierdza, KTO naprawdę napisał daną zmianę, i uniemożliwia podszycie się pod cudzą tożsamość w historii kodu. Domyślne potraktowanie braku pola weryfikacji jako 'niepodpisany' (`|| false`) to znów fail-closed — niejasny status nie jest traktowany jak zaufany. Wymóg podpisu na każdym commicie spina się z późniejszym keyless cosign + Rekor przy podpisywaniu artefaktów: od autora zmiany aż po gotowy artefakt każdy krok jest przypisany do zweryfikowanej tożsamości, co jest fundamentem bezpieczeństwa łańcucha dostaw oprogramowania."}]}, {"area": "3 · Łańcuch dostaw i integralność — skąd wiadomo, że nic nie podmieniono", "intro": "Gdy budujesz oprogramowanie, korzystasz z setek cudzych klocków (bibliotek, obrazów, narzędzi). \"Łańcuch dostaw\" to cała ta droga: od cudzego kodu, przez Twój build, aż po gotowy artefakt na serwerze. Ten rozdział pokazuje, jakimi prostymi, sprawdzalnymi środkami CyberForge udowadnia, że na żadnym etapie nikt niczego nie podmienił — i uczciwie zaznacza, co już działa naprawdę, a co jest ścieżką na przyszłość.", "blocks": [{"id": "sha256", "title": "Odcisk palca pliku — suma kontrolna SHA-256", "plain": "SHA-256 to funkcja, która z dowolnego pliku liczy krótki ciąg 64 znaków (tzw. hash, suma kontrolna). Ten sam plik zawsze daje ten sam ciąg, ale zmiana choćby jednego bajtu daje zupełnie inny ciąg. Dzięki temu hash działa jak cyfrowy odcisk palca: nie da się go podrobić ani cofnąć do oryginału.", "analogy": "To jak plomba na liczniku albo pieczęć lakowa na liście. Jeśli plomba pasuje — przesyłka nietknięta. Jeśli nie pasuje — ktoś zaglądał do środka.", "why": "To fundament całej integralności. Jeśli umiesz policzyć odcisk palca pliku dziś i jutro, to natychmiast wykryjesz każdą podmianę. Wszystkie pozostałe mechanizmy w tym rozdziale (Merkle, podpis, znacznik czasu) stoją na hashach SHA-256.", "inRepo": "W seal-evidence.sh funkcja sha256_of() liczy hash, preferując sha256sum, a gdy go brak — openssl dgst -sha256 (Pipeline/scripts/seal-evidence.sh:260). Hash gotowego PDF-a jest liczony i zapisywany jako pdf.sha256 (Pipeline/scripts/seal-evidence.sh:286).", "refs": ["Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "# sha256 of a file -> hex (portable: prefer sha256sum, fall back to openssl).\nsha256_of() {\n  if have sha256sum; then\n    sha256sum \"$1\" | awk '{print $1}'\n  else\n    openssl dgst -sha256 \"$1\" | awk '{print $NF}'\n  fi\n}\n\nlog \"sealing evidence: dir=${EVIDENCE_DIR} pdf=${PDF_PATH} manifest=${MANIFEST_JSON}\"", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 259, "howItWorks": "Funkcja sha256_of() bierze ścieżkę pliku ($1) i zwraca jego skrót SHA-256 w postaci heksadecymalnej. Najpierw sprawdza (have sha256sum), czy w systemie jest narzędzie sha256sum — jeśli tak, liczy nim hash i przez awk wycina samą wartość (pierwsze pole). Gdy sha256sum nie ma, używa zapasowo openssl dgst -sha256 i bierze ostatnie pole wyjścia ($NF), bo openssl formatuje wynik inaczej. Dalej w skrypcie ten sam hash PDF-a jest liczony (PDF_SHA256) i zapisywany do osobnego pliku pdf.sha256, który potem jest podpisywany.", "whyItWorks": "SHA-256 to jednostronny odcisk: każda, nawet jednobajtowa zmiana pliku daje zupełnie inny hash, więc zapisany hash jest dowodem nienaruszalności (tamper-evidence). Podwójna ścieżka (sha256sum z fallbackiem na openssl) czyni skrypt przenośnym — działa tak samo na runnerze CI, jak i na maszynie audytora, gdzie może brakować jednego z narzędzi. To fundament całej paczki dowodowej: na hashach plików buduje się potem korzeń Merkle i podpisy."}, {"id": "sbom", "title": "Spis składników — SBOM", "plain": "SBOM (Software Bill of Materials — spis składników oprogramowania) to lista wszystkich bibliotek i komponentów, z których zbudowano aplikację, razem z ich wersjami. CyberForge generuje go w formacie CycloneDX (jeden ze standardowych formatów SBOM) jako plik sbom.cyclonedx.json.", "analogy": "To jak skład na etykiecie produktu spożywczego. Kupując batonik widzisz dokładnie, co jest w środku. SBOM robi to samo dla oprogramowania: pokazuje cały skład, zamiast kazać Ci wierzyć na słowo.", "why": "Bez spisu składników nie wiesz, czy używasz biblioteki z groźną dziurą. Gdy świat dowiaduje się o nowej podatności w jakimś komponencie, dzięki SBOM w minutę sprawdzisz, czy ten komponent jest u Ciebie — zamiast ręcznie przekopywać cały projekt.", "inRepo": "SBOM CycloneDX powstaje w fazie budowania jako sbom.cyclonedx.json (Pipeline/.github/workflows/build-and-scan.yml:801). Później jest dowiązywany do obrazu jako podpisana atestacja (patrz blok o cosign). Opisany też w macierzy zgodności jako dowód na łańcuch dostaw (Pipeline/docs/compliance-matrix.md:278).", "refs": ["Pipeline/.github/workflows/build-and-scan.yml", "Pipeline/docs/compliance-matrix.md"], "codeExcerpt": "      - name: Generate SBOM with Syft\n        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0\n        with:\n          image: ${{ steps.meta.outputs.image_uri }}\n          format: cyclonedx-json\n          output-file: sbom.cyclonedx.json\n\n      - name: Upload image scan results\n        if: always()\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1\n        with:\n          name: image-scan-results\n          path: |\n            trivy-image-results.json\n            trivy-image-scan-metadata.json\n            sbom.cyclonedx.json", "codePath": "Pipeline/.github/workflows/build-and-scan.yml", "codeLang": "yaml", "codeStart": 795, "howItWorks": "Krok 'Generate SBOM with Syft' uruchamia akcję anchore/sbom-action (przypiętą do konkretnego SHA commita dla bezpieczeństwa). Wskazuje zbudowany obraz (image: image_uri ze wcześniejszego kroku meta), żąda formatu cyclonedx-json i zapisuje wynik do pliku sbom.cyclonedx.json. Syft skanuje warstwy obrazu i wypisuje wszystkie znalezione pakiety/biblioteki. Następny krok pakuje ten SBOM razem z wynikami Trivy do artefaktu image-scan-results, by przekazać go kolejnym fazom (m.in. podpisaniu cosign).", "whyItWorks": "SBOM (Software Bill of Materials) to maszynowo czytelny spis wszystkich komponentów obrazu. Jest niezbędny do zarządzania ryzykiem łańcucha dostaw: gdy wyjdzie nowe CVE, audytor lub zespół od razu sprawdza w SBOM, czy podatna biblioteka jest w produkcie. Wybór standardu CycloneDX i generowanie SBOM dla dokładnie tego obrazu (po digescie) sprawia, że spis jest weryfikowalny i powiązalny z wydaną wersją. Macierz zgodności mapuje sbom.cyclonedx.json na wymogi NIS2/DORA/SOC 2 dotyczące przejrzystości dostaw."}, {"id": "vex", "title": "Oświadczenie \"to nas nie dotyczy\" — VEX", "plain": "VEX (Vulnerability Exploitability eXchange — wymiana informacji o wykorzystywalności podatności) to dokument, w którym mówisz przy każdej znalezionej podatności: czy ona realnie Was dotyczy, czy nie — i dlaczego. Skaner znajduje setki ostrzeżeń (CVE — numerowane wpisy o podatnościach), ale często dany feralny fragment kodu w Waszej aplikacji nigdy się nie wykonuje. VEX to zapisuje.", "analogy": "To jak adnotacja lekarza przy wyniku badania: \"podwyższony wskaźnik, ale u tego pacjenta to norma, bo...\". Surowy wynik straszy; adnotacja eksperta nadaje mu sens.", "why": "Bez VEX każde CVE wygląda jak nieobsłużony pożar i audytor słusznie pyta \"czemu to ignorujecie?\". VEX zmienia chaos w świadome, uzasadnione decyzje — i jest wprost wymagany przez przepisy o cyberodporności (CRA).", "inRepo": "Skrypt generate-vex.py czyta wyniki skanera Trivy i do każdego CVE dokłada uzasadnienie z ręcznie prowadzonego pliku docs/governance/vex-justifications.yaml. Kluczowa uczciwość: jeśli analityk czegoś jeszcze nie ocenił, status to under_investigation, NIGDY po cichu not_affected (Pipeline/scripts/generate-vex.py:230). Każde \"nas nie dotyczy\" musi nieść jedną z 5 oficjalnych kategorii CISA (Pipeline/scripts/generate-vex.py:85). Wynik to vex.openvex.json w standardzie OpenVEX.", "refs": ["Pipeline/scripts/generate-vex.py"], "codeExcerpt": "    stmt: dict[str, Any] = {\n        \"vulnerability\": vuln,\n        \"products\": [prod],\n        \"timestamp\": timestamp,\n    }\n\n    if triage is None:\n        # Reported by Trivy but not triaged -> honest \"under_investigation\".\n        stmt[\"status\"] = STATUS_UNDER_INVESTIGATION\n        stmt[\"status_notes\"] = (\n            \"Reported by the scanner; not yet triaged in \"\n            \"docs/governance/vex-justifications.yaml.\"\n        )\n        return stmt\n\n    status = str(triage.get(\"status\", \"\")).strip()\n    stmt[\"status\"] = status", "codePath": "Pipeline/scripts/generate-vex.py", "codeLang": "python", "codeStart": 224, "howItWorks": "Dla każdego CVE skrypt buduje obiekt stmt (oświadczenie VEX) z polami vulnerability, products i timestamp. Kluczowa decyzja: jeśli triage is None — czyli analityk NIE wpisał jeszcze tego CVE do ręcznie prowadzonego pliku docs/governance/vex-justifications.yaml — status jest ustawiany na STATUS_UNDER_INVESTIGATION ('w trakcie analizy') z notatką wyjaśniającą, że skaner to zgłosił, ale nie oceniono. Dopiero gdy triage istnieje, skrypt bierze status zadeklarowany przez człowieka. Osobno (linia 85) lista CISA_JUSTIFICATIONS wymusza, że każde 'not_affected' niesie jedną z 5 oficjalnych kategorii uzasadnień CISA.", "whyItWorks": "VEX (Vulnerability Exploitability eXchange) mówi audytorowi/klientowi 'tego CVE nas to nie dotyczy i dlaczego'. Najgroźniejsza nieuczciwość to po cichu oznaczyć nieocenione CVE jako not_affected — to ukrywałoby realne ryzyko. Domyślne under_investigation jest fail-safe: bez świadomej, ludzkiej oceny system nigdy sam nie ogłasza bezpieczeństwa. Wymóg kategorii CISA do każdego not_affected sprawia, że 'nie dotyczy' nie jest gołosłowne — musi mieć uzasadnienie zgodne z uznanym standardem, więc jest sprawdzalne i obronne w audycie."}, {"id": "vex-bind", "title": "VEX przyklejony do konkretnej wersji obrazu", "plain": "VEX nie wisi w próżni — jest twardo związany z dokładnie tym obrazem (wersją aplikacji), którego dotyczy, poprzez jego digest, czyli SHA-256 całego obrazu. Skrypt wprost odmawia wystawienia VEX, jeśli nie poda mu się tego digestu.", "analogy": "To jak gwarancja przypisana do numeru seryjnego konkretnego urządzenia, a nie do \"jakiegoś tam modelu\". Nie da się jej przykleić do innej sztuki.", "why": "Gdyby VEX nie był przypięty do konkretnej wersji, ktoś mógłby twierdzić \"ta podatność nas nie dotyczy\", podsuwając ocenę zrobioną dla zupełnie innego, starszego buildu. Wiązanie po digescie sprawia, że oświadczenie pasuje tylko do tego jednego artefaktu.", "inRepo": "W generate-vex.py funkcja main() przerywa z kodem 2, gdy brakuje --image-digest w formacie sha256:... (Pipeline/scripts/generate-vex.py:357). Produkt w dokumencie OpenVEX jest budowany z digestem jako identyfikatorem i hashem (Pipeline/scripts/generate-vex.py:168).", "refs": ["Pipeline/scripts/generate-vex.py"], "codeExcerpt": "def _product(image_uri: str | None, image_digest: str) -> dict[str, Any]:\n    \"\"\"Build the OpenVEX product object bound to the released image BY DIGEST.\"\"\"\n    algo, _, value = image_digest.partition(\":\")\n    product: dict[str, Any] = {\"@id\": \"pkg:oci/cyberforge-app\", \"identifiers\": {}}\n    if image_uri:\n        # Package-URL-ish OCI identifier including the immutable digest.\n        repo = image_uri.split(\":\")[0]\n        product[\"@id\"] = f\"pkg:oci/{repo}@{image_digest}\"\n        product[\"identifiers\"][\"purl\"] = f\"pkg:oci/{repo}@{image_digest}\"\n    if algo and value:\n        product[\"hashes\"] = {algo: value}\n    return product", "codePath": "Pipeline/scripts/generate-vex.py", "codeLang": "python", "codeStart": 167, "howItWorks": "Funkcja _product() buduje obiekt 'product' dokumentu OpenVEX i wiąże oświadczenie z konkretnym obrazem po jego DIGEŚCIE, nie po tagu. Digest (np. 'sha256:abc...') jest dzielony przez partition(':') na algorytm (sha256) i wartość (abc...). Identyfikator @id i purl są budowane z repo + '@' + pełnego digestu, a w polu hashes zapisany jest sam algorytm i wartość. Wcześniej (linia 357) main() przerywa z kodem 2, jeśli --image-digest brakuje lub nie ma postaci 'sha256:<hex>' — odmawia wyemitowania VEX-a niezwiązanego z produktem.", "whyItWorks": "Tagi obrazów (np. :latest, :v1) są zmienne — ten sam tag może jutro wskazywać inny obraz. Digest sha256 jest niezmienny i jednoznacznie identyfikuje dokładnie te bajty obrazu. Wiążąc VEX po digescie, oświadczenie 'to nas nie dotyczy' jest na zawsze przypięte do tej konkretnej wersji, której dotyczyła analiza — nie można go pomylić ani przenieść na inny build. Twarde przerwanie (exit 2) przy braku digestu to fail-closed: lepiej nie wygenerować nic niż wygenerować dowód, który niczego pewnie nie identyfikuje."}, {"id": "provenance-slsa", "title": "Metryka \"jak dobrze udowodniono pochodzenie\" — provenance i SLSA", "plain": "Provenance (pochodzenie) to metryczka artefaktu: kto, gdzie, z jakiego kodu i jakim procesem go zbudował. SLSA (Supply-chain Levels for Software Artifacts) to skala poziomów (L1–L3+), która mówi, jak mocno to pochodzenie jest udowodnione. CyberForge osiąga SLSA Build Level 2 (L2), czyli: pochodzenie jest generowane automatycznie przez zarządzaną platformę budującą (GitHub Actions) i podpisane.", "analogy": "To jak metryczka i historia pojazdu: rocznik, fabryka, przebieg, czy bity. SLSA to ocena, jak wiarygodna jest ta historia — od \"spisana ręcznie przez sprzedawcę\" (niski poziom) po \"automatyczny, niezależny rejestr\" (wysoki).", "why": "Uczciwie: to L2, NIE L3. Różnica jest istotna — L3 wymaga w pełni izolowanego, niemodyfikowalnego (hardened) środowiska budującego, które gwarantuje, że nawet osoba z dostępem do pipeline'u nie podmieni artefaktu w trakcie. Pipeline jeszcze tego nie spełnia, więc honest claim to Build L2. Nadawanie sobie L3 byłoby przekłamaniem.", "inRepo": "Podstawą jest natywna atestacja GitHuba actions/attest-build-provenance (Pipeline/.github/workflows/sign-and-attest.yml:82). Jest też własny generator zapasowy generate-provenance.sh, tworzący dokument w formacie in-toto Statement z predykatem SLSA Provenance v1.0 (Pipeline/scripts/generate-provenance.sh:53), używany, gdy natywna atestacja jest niedostępna (np. prywatne repo na koncie osobistym).", "refs": ["Pipeline/scripts/generate-provenance.sh", "Pipeline/.github/workflows/sign-and-attest.yml"], "codeExcerpt": "  \"predicateType\": \"https://slsa.dev/provenance/v1\",\n  \"predicate\": {\n    \"buildDefinition\": {\n      \"buildType\": \"https://slsa.dev/container-based-build/v0.1\",\n      \"externalParameters\": {\n        \"workflow\": {\n          \"ref\": \"${GITHUB_REF:-unknown}\",\n          \"repository\": \"${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-unknown}\",\n          \"path\": \"${GITHUB_WORKFLOW_REF:-unknown}\"\n        },\n        \"inputs\": {\n          \"image_uri\": \"${IMAGE_URI}\",\n          \"image_digest\": \"${IMAGE_DIGEST}\"\n        }\n      },", "codePath": "Pipeline/scripts/generate-provenance.sh", "codeLang": "bash", "codeStart": 53, "howItWorks": "Ten fragment to szablon dokumentu provenance w formacie in-toto Statement z predykatem SLSA Provenance v1.0 (predicateType wskazuje slsa.dev/provenance/v1). W buildDefinition zapisane jest, JAK powstał artefakt: typ buildu, parametry zewnętrzne (workflow: ref, repozytorium, ścieżka pliku workflow) oraz wejścia (image_uri i image_digest budowanego obrazu). Zmienne ${GITHUB_*} są podstawiane ze środowiska runnera GitHub Actions. Generator zapasowy uruchamia się tylko, gdy natywna atestacja GitHuba zawiedzie (np. prywatne repo na koncie osobistym).", "whyItWorks": "Provenance odpowiada na pytanie 'skąd ten artefakt naprawdę pochodzi'. SLSA to uznany framework opisujący poziom pewności pochodzenia; format in-toto + SLSA v1 jest standardem, który potrafią weryfikować zewnętrzne narzędzia. Podstawą jest natywna atestacja GitHuba (actions/attest-build-provenance), bo jest podpisana po stronie platformy. Własny generator zapasowy gwarantuje, że nawet gdy natywna ścieżka jest niedostępna, paczka dowodowa wciąż zawiera kompletny, standardowy dokument pochodzenia — brak luki w łańcuchu dostaw."}, {"id": "builder-id", "title": "Tożsamość budowniczego — builder.id przypięty do workflow", "plain": "W dokumencie pochodzenia pole builder.id mówi, KTO zbudował artefakt. CyberForge wpisuje tam pełny, przypięty do gałęzi adres workflow (np. .../sign-and-attest.yml@refs/heads/main), a NIE samą ładną nazwę \"Phase 3: Sign & Attest\".", "analogy": "To różnica między podpisem \"Dział Produkcji\" a konkretnym, weryfikowalnym identyfikatorem pracownika z numerem zmiany. Tylko ten drugi da się jednoznacznie sprawdzić.", "why": "Sama nazwa wyświetlana ma spacje i nie wskazuje wersji — weryfikator nie da się jej przypiąć. Przypięty adres workflow można dopasować do tożsamości, którą widać w podpisie cosign (patrz następny blok). Dzięki temu ten, kto sprawdza, może powiedzieć: \"podpisał dokładnie ten workflow, nie podszywacz\".", "inRepo": "Komentarz i konstrukcja builder.id w generate-provenance.sh wprost tłumaczą ten wybór i składają adres z GITHUB_SERVER_URL + GITHUB_WORKFLOW_REF (Pipeline/scripts/generate-provenance.sh:19, :87). Ta sama tożsamość jest egzekwowana przy weryfikacji cosign w workflow (Pipeline/.github/workflows/sign-and-attest.yml:154).", "refs": ["Pipeline/scripts/generate-provenance.sh", "Pipeline/.github/workflows/sign-and-attest.yml"], "codeExcerpt": "# builder.id (SLSA v1 runDetails.builder.id) is the REF-PINNED workflow URI\n# \"${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}\", e.g.\n# https://github.com/<owner>/<repo>/.github/workflows/sign-and-attest.yml@refs/heads/main\n# — NOT the GITHUB_WORKFLOW display name (\"Phase 3: Sign & Attest\"), which has\n# spaces and no ref and therefore cannot be pinned by a verifier. This matches\n# the cosign keyless certificate subject used in CI, so a verifier pinning\n# builder identity can match the fallback provenance to the signed identity.", "codePath": "Pipeline/scripts/generate-provenance.sh", "codeLang": "bash", "codeStart": 18, "howItWorks": "Komentarz wprost dokumentuje konstrukcję pola builder.id (SLSA runDetails.builder.id). Tożsamość budowniczego to URI workflowa przypięty do referencji: GITHUB_SERVER_URL + GITHUB_WORKFLOW_REF, czyli np. https://github.com/owner/repo/.github/workflows/sign-and-attest.yml@refs/heads/main. Świadomie NIE użyto nazwy wyświetlanej GITHUB_WORKFLOW ('Phase 3: Sign & Attest'), bo ma spacje i nie zawiera referencji (gałęzi/tagu), więc weryfikator nie mógłby jej przypiąć. Ta sama tożsamość jest potem egzekwowana w cosign verify (sign-and-attest.yml:154) przez --certificate-identity-regexp.", "whyItWorks": "Tożsamość budowniczego musi być maszynowo dopasowywalna i jednoznaczna. Ref-pinned URI workflowa dokładnie wskazuje, który plik i z której gałęzi/tagu zbudował artefakt — można to porównać z podmiotem (subject) certyfikatu keyless cosign. Dzięki temu zapasowy dokument provenance i podpis cosign mówią o TEJ SAMEJ tożsamości, więc weryfikator pinujący builder.id potwierdzi spójność obu dowodów. Nazwa wyświetlana byłaby bezużyteczna do takiego pinowania — stąd celowy wybór URI z referencją."}, {"id": "cosign-sigstore", "title": "Podpis bez własnego klucza — cosign + Sigstore (Fulcio, Rekor)", "plain": "Podpisywanie cyfrowe to przyklejenie do pliku pieczęci, której nie da się podrobić bez tajnego klucza. Tradycyjnie musisz pilnować takiego klucza latami. Cosign w trybie keyless (bez klucza) działa inaczej: na chwilę podpisu Sigstore wydaje krótkotrwały certyfikat (przez urząd Fulcio) powiązany z Twoją tożsamością, a fakt podpisania trafia do publicznego, niezmienialnego rejestru Rekor. Klucz znika, a dowód zostaje.", "analogy": "To jak notarialne poświadczenie u notariusza, który od razu wpisuje akt do publicznego repertorium. Notariusz może iść do domu, ale wpis w rejestrze zostaje na zawsze — każdy może sprawdzić, że poświadczenie miało miejsce.", "why": "Uczciwie o stanie: keyless cosign + Rekor DZIAŁA naprawdę w prawdziwym przebiegu CI — obraz jest podpisywany, SBOM dowiązywany jako atestacja, a inkluzja w Rekor weryfikowana. Natomiast w próbce offline (gdy uruchamiasz fragment lokalnie bez sieci/OIDC) podpis jest honest-pending: skrypt zapisuje cosign_status=failed-soft i jedzie dalej, bo paczkę i tak chroni Merkle + znacznik czasu. Nic nie jest udawane na zielono.", "inRepo": "W CI: cosign sign --yes podpisuje obraz, cosign attest dokłada SBOM, a cosign verify-attestation potwierdza wpis w Rekor (Pipeline/.github/workflows/sign-and-attest.yml:48, :66, :172). W seal-evidence.sh keyless cosign podpisuje korzeń Merkle i hash PDF z 5-krotnym ponawianiem (Fulcio/Rekor potrzebują chwili na rozgrzanie), a przy trwałej porażce uczciwie degraduje miękko (Pipeline/scripts/seal-evidence.sh:366, :414).", "refs": ["Pipeline/scripts/seal-evidence.sh", "Pipeline/.github/workflows/sign-and-attest.yml"], "codeExcerpt": "      - name: Sign image with Cosign (keyless OIDC)\n        run: |\n          set -o pipefail  # tee must not mask a cosign sign failure\n          cosign sign --yes \\\n            -a \"repo=${{ github.repository }}\" \\\n            -a \"workflow=${{ github.workflow }}\" \\\n            -a \"ref=${{ github.sha }}\" \\\n            -a \"run_id=${{ github.run_id }}\" \\\n            -a \"trigger=${{ github.event_name }}\" \\\n            \"${{ inputs.image_uri }}@${{ inputs.image_digest }}\" \\\n            2>&1 | tee /tmp/cosign-sign-output.txt", "codePath": "Pipeline/.github/workflows/sign-and-attest.yml", "codeLang": "yaml", "codeStart": 45, "howItWorks": "Krok podpisuje obraz w trybie keyless OIDC: cosign sign --yes nie używa lokalnego klucza prywatnego — pobiera krótkożyciowy certyfikat z Fulcio na podstawie tożsamości OIDC runnera GitHub i rejestruje podpis w publicznym logu Rekor. Flagi -a dodają adnotacje (repo, workflow, ref, run_id, trigger), a obraz jest wskazany po digescie (image_uri@image_digest). set -o pipefail zapewnia, że błąd cosign nie zostanie zamaskowany przez tee. Dalej cosign attest dokłada SBOM jako podpisaną atestację, a cosign verify / verify-attestation potwierdzają podpis i wpis w Rekor.", "whyItWorks": "Klasyczne podpisywanie wymaga przechowywania i rotacji klucza prywatnego — ryzyko wycieku. Keyless (Sigstore: Fulcio wydaje efemeryczny certyfikat, Rekor zapisuje przejrzysty log) eliminuje długożyciowy sekret: tożsamość bierze się z OIDC runnera, a dowód 'kto, co, kiedy podpisał' przeżywa nawet zniszczenie klucza, bo jest w publicznym logu transparentności. Pinowanie obrazu po digescie gwarantuje, że podpisano dokładnie te bajty. set -o pipefail to uczciwość: porażka podpisu musi być widoczna, nie połknięta przez potok."}, {"id": "merkle", "title": "Jeden odcisk dla całej paczki — drzewo i korzeń Merkle", "plain": "Gdy masz dziesiątki plików dowodowych, nie chcesz podpisywać każdego z osobna. Drzewo Merkle łączy ich hashe parami, potem hashe par, i tak aż do jednego wspólnego hasha na samej górze — to korzeń Merkle (merkle root). Zmiana JAKIEGOKOLWIEK pliku zmienia korzeń.", "analogy": "To jak spis treści z jedną sumą kontrolną na końcu. Jeśli ktoś podmieni choć jedno zdanie na stronie 200, suma na okładce przestaje się zgadzać — i wiesz, że paczka jest naruszona, nie musząc czytać wszystkiego.", "why": "Dzięki temu wystarczy podpisać i ostemplować jeden ciąg (korzeń), żeby zabezpieczyć całą paczkę dowodów naraz. To tańsze i pewniejsze niż podpisywanie setek plików. Tu używany jest dokładnie standard RFC 6962 (ten sam, co w Certificate Transparency), z separacją domen i regułą \"największa potęga dwójki\" — bez bitcoinowego dublowania nieparzystego węzła.", "inRepo": "Korzeń liczy generate-evidence-manifest.py według RFC 6962 (leaf = SHA256(0x00||dane), node = SHA256(0x01||lewy||prawy)), sortując pliki po ścieżce; manifest.json i pliki sealowania są wykluczone, by korzeń był stabilny przed i po podpisie (Pipeline/scripts/generate-evidence-manifest.py:20, :63). seal-evidence.sh zapisuje go do merkle-root.txt i to ten plik podpisuje cosign (Pipeline/scripts/seal-evidence.sh:301).", "refs": ["Pipeline/scripts/generate-evidence-manifest.py", "Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "def leaf_hash(data: bytes) -> bytes:\n    \"\"\"RFC 6962 leaf hash: SHA256(0x00 || data).\"\"\"\n    return hashlib.sha256(LEAF_PREFIX + data).digest()\n\n\ndef node_hash(left: bytes, right: bytes) -> bytes:\n    \"\"\"RFC 6962 interior node hash: SHA256(0x01 || left || right).\"\"\"\n    return hashlib.sha256(NODE_PREFIX + left + right).digest()\n\n\ndef _largest_power_of_two_less_than(n: int) -> int:\n    \"\"\"Largest power of two k such that k < n (n >= 2). RFC 6962 split point.\"\"\"\n    k = 1\n    while k * 2 < n:\n        k *= 2\n    return k\n\n\ndef merkle_tree_hash(leaves_data: Sequence[bytes]) -> bytes:\n    n = len(leaves_data)\n    if n == 0:\n        return hashlib.sha256(b\"\").digest()\n    if n == 1:\n        return leaf_hash(leaves_data[0])\n    k = _largest_power_of_two_less_than(n)\n    left = merkle_tree_hash(leaves_data[:k])\n    right = merkle_tree_hash(leaves_data[k:])\n    return node_hash(left, right)", "codePath": "Pipeline/scripts/generate-evidence-manifest.py", "codeLang": "python", "codeStart": 90, "howItWorks": "To jest implementacja korzenia Merkle według RFC 6962. leaf_hash() liczy hash pojedynczego pliku z prefiksem 0x00 (SHA256(0x00||dane)), a node_hash() łączy dwa hashe potomne z prefiksem 0x01 (SHA256(0x01||lewy||prawy)). merkle_tree_hash() rekurencyjnie buduje drzewo: pusty zbiór -> SHA256(''), jeden liść -> leaf_hash, a dla wielu dzieli listę w punkcie k (największa potęga dwójki < n), liczy lewe i prawe poddrzewo i łączy je przez node_hash. Pliki są wcześniej sortowane po ścieżce, a artefakty sealowania (manifest.json, merkle-root.txt, pdf.sha256 itd.) są wykluczone z liści.", "whyItWorks": "Drzewo Merkle pozwala jednym 32-bajtowym korzeniem zobowiązać się do całej paczki: zmiana dowolnego bajtu w dowolnym pliku zmienia korzeń. To upraszcza pieczętowanie — podpisuje się i znakuje czasem tylko korzeń, a nie każdy plik osobno. Prefiksy domenowe (0x00/0x01) z RFC 6962 zapobiegają atakom kolizyjnym między liściem a węzłem. Sortowanie po ścieżce daje deterministyczny korzeń, a wykluczenie plików sealowania jest konieczne, bo podpis i timestamp powstają PO zbudowaniu manifestu — gdyby je wliczyć, korzeń po podpisie nigdy nie zgadzałby się z tym, co podpisano."}, {"id": "rfc3161", "title": "Cyfrowy stempel daty — znacznik czasu RFC-3161 (TSA)", "plain": "Znacznik czasu (timestamp) to zaufane poświadczenie \"ten plik istniał w takiej postaci nie później niż o tej godzinie\". Robi to niezależny urząd znaczników czasu (TSA — Time Stamping Authority) protokołem RFC-3161: bierze hash Twojego pliku, dokleja swój zaufany czas i podpisuje. CyberForge stempluje korzeń Merkle, manifest i PDF.", "analogy": "To jak stempel z datą na poczcie albo prezentata w kancelarii. Sam dokument nie powie, kiedy powstał; pieczęć urzędu z datą — owszem, i nie da się jej cofnąć.", "why": "Uczciwie o poziomie: tu jest STANDARDOWY TSA — domyślnie darmowy freetsa.org, który jest NIEkwalifikowany w rozumieniu eIDAS. Kwalifikowany znacznik czasu (eIDAS QTS, np. KIR Szafir, Asseco Certum) ma najmocniejszą moc prawną w UE i jest ścieżką na przyszłość. Pipeline jest na to GOTOWY: przejście na QTS to zmiana ustawień, nie kodu, a etykieta qualified domyślnie brzmi false, żeby paczka nigdy nie przeceniała swojego statusu.", "inRepo": "rfc3161_stamp() w seal-evidence.sh wysyła zapytanie openssl ts do TSA i sprawdza, że odpowiedź to prawdziwy, GRANTED token (Pipeline/scripts/seal-evidence.sh:474). Cała konfiguracja QTS (QTS_PROVIDER, QTS_URL, TSA_QUALIFIED) idzie przez zmienne środowiskowe, a domyślny freetsa jest jawnie oznaczony jako non-qualified (Pipeline/scripts/seal-evidence.sh:43, :75).", "refs": ["Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "rfc3161_stamp() {\n  # $1 = label, $2 = path-to-data-file\n  local label=\"$1\" data=\"$2\"\n  local tsq=\"${EVIDENCE_DIR}/${label}.tsq\"\n  local tsr=\"${EVIDENCE_DIR}/${label}.tsr\"\n  if openssl ts -query -data \"${data}\" -sha256 -cert -out \"${tsq}\" >/dev/null 2>&1; then\n    local -a curl_args=(-fsS -H \"Content-Type: application/timestamp-query\")\n    [ -n \"${TSA_AUTH}\" ] && curl_args+=(-H \"${TSA_AUTH}\")\n    curl_args+=(--data-binary \"@${tsq}\" \"${TSA_URL}\" -o \"${tsr}\")\n    if curl \"${curl_args[@]}\" 2>/dev/null; then\n      # Produced AND valid: only count a token the TSA actually granted.\n      if tsr_is_valid_token \"${tsr}\"; then\n        set_sig rfc3161 \"${label}_tsr=$(basename \"${tsr}\")\" \"${label}_status=stamped\"\n        log \"rfc3161: ${label} timestamped via ${TSA_URL} (token validated: granted, qualified=${TSA_QUALIFIED_LABEL})\"\n        return 0\n      fi", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 474, "howItWorks": "rfc3161_stamp() znakuje czasem jeden plik. Najpierw openssl ts -query buduje zapytanie czasowe (.tsq) z hasha SHA-256 danych. Potem składa argumenty curl (z opcjonalnym nagłówkiem TSA_AUTH dla płatnych QTS) i wysyła zapytanie binarnie do TSA pod TSA_URL, zapisując odpowiedź (.tsr). Kluczowe: po otrzymaniu odpowiedzi wywołuje tsr_is_valid_token(), która sprawdza przez 'openssl ts -reply ... Status: Granted', że to prawdziwy, PRZYZNANY token RFC-3161. Tylko wtedy zapisuje status 'stamped'. Cała konfiguracja (QTS_PROVIDER, QTS_URL, TSA_QUALIFIED) idzie przez zmienne środowiskowe, a domyślny freetsa jest jawnie oznaczony jako non-qualified.", "whyItWorks": "Znacznik czasu RFC-3161 to kryptograficzny dowód, że dane istniały w danym momencie — niezależny zewnętrzny urząd (TSA) podpisuje hash z datą. Sprawdzanie 'Status: Granted' jest istotne: serwer może odpowiedzieć HTTP 200 z treścią, która NIE jest tokenem — taki śmieć nie może udawać stempla, więc jest odrzucany (i plik usuwany). Konfiguracja przez zmienne środowiskowe pozwala przejść z darmowego freetsa na kwalifikowane eIDAS QTS bez zmiany kodu, a domyślne oznaczenie non-qualified zapobiega zawyżaniu statusu prawnego dowodu."}, {"id": "trusted-time-policy", "title": "Kiedy brak stempla to ostrzeżenie, a kiedy twardy błąd", "plain": "Stemplowanie czasem czasem zawodzi z błahych powodów (urząd na chwilę niedostępny). Pipeline rozróżnia awarię przejściową od strukturalnej: brak stempla na JEDNYM pliku to miękkie ostrzeżenie, ale ZERO ważnych stempli na WSZYSTKICH plikach w CI to twardy błąd, który zatrzymuje build.", "analogy": "To jak różnica między \"jedna paczka utknęła w sortowni\" (zdarza się, jedziemy dalej) a \"cała poczta nie działa\" (to już awaria, której nie wolno zignorować).", "why": "Bez tego rozróżnienia trwała awaria zaufanego czasu mogłaby w nieskończoność udawać chwilową usterkę i nikt by nie zauważył, że dowody nie mają już wiarygodnej daty. To celowa ochrona przed cichą degradacją do stanu \"wygląda na zielono, a nie jest\".", "inRepo": "Logika T-56 w seal-evidence.sh: jeśli TSA_ANY=0 (żaden artefakt nie dostał ważnego tokena) i nie jesteśmy w trybie degrade, skrypt kończy się błędem (die) z komunikatem o strukturalnie zepsutej ścieżce zaufanego czasu (Pipeline/scripts/seal-evidence.sh:569). Lokalnie z EVIDENCE_ALLOW_DEGRADE=1 zostaje miękkim ostrzeżeniem.", "refs": ["Pipeline/scripts/seal-evidence.sh"], "codeExcerpt": "  if [ \"${TSA_ANY}\" -eq 0 ]; then\n    set_sig rfc3161 \"status=unavailable\" \"reason=tsa-unreachable-or-no-curl\" \"tsa_url=${TSA_URL}\"\n    # ... (pominięto) ...\n    if is_degrade; then\n      warn \"rfc3161: TSA unreachable or curl absent — recorded rfc3161_unavailable (soft, degrade mode)\"\n    else\n      die \"rfc3161: NO valid RFC-3161 timestamp produced for any artifact (fail-closed; T-56: trusted-time path structurally broken, not flaky). Set EVIDENCE_ALLOW_DEGRADE=1 for local runs without a TSA.\"\n    fi\n  else", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 569, "howItWorks": "Zmienna TSA_ANY jest ustawiana na 1, jeśli choć jeden artefakt (merkle-root, manifest lub PDF) dostał ważny token czasowy. Ten blok sprawdza odwrotność: TSA_ANY == 0, czyli ŻADEN artefakt nie uzyskał ważnego stempla. Wtedy decyzja zależy od trybu: is_degrade (uruchomione z EVIDENCE_ALLOW_DEGRADE=1, typowo lokalnie) -> tylko warn (miękkie ostrzeżenie). W trybie CI (non-degrade) -> die, czyli skrypt kończy się błędem z komunikatem, że ścieżka zaufanego czasu jest strukturalnie zepsuta (T-56), a nie chwilowo niestabilna. Pojedyncze chybienia per-artefakt pozostają miękkie wyżej — to trafia tylko, gdy CAŁA ścieżka nic ważnego nie wyprodukowała.", "whyItWorks": "RFC-3161 z założenia degraduje miękko, by przejściowy timeout TSA na jednym pliku nie wywalił builda. Ale ZERO ważnych tokenów na WSZYSTKICH artefaktach w CI nie jest już 'flaky' — to znak, że TSA jest całkowicie nieosiągalne, zwraca nie-tokeny albo openssl nie działa, czyli stan strukturalny. Gdyby to też było ciche ostrzeżenie, trwała awaria mogłaby w nieskończoność udawać chwilową usterkę i dowody powstawałyby bez zaufanego czasu. Rozróżnienie tryb-lokalny (soft) vs CI (hard fail) godzi wygodę pracy lokalnej z rygorem produkcyjnego dowodu."}, {"id": "worm", "title": "Zapisz raz, nie zmieniaj nigdy — WORM", "plain": "WORM (Write Once Read Many — zapisz raz, czytaj wiele razy) to sposób przechowywania, w którym po zapisaniu pliku nikt — nawet administrator — nie może go już zmienić ani usunąć przez ustalony okres. Tylko odczyt.", "analogy": "To jak wrzucenie listu do urzędowej skrzynki podawczej albo wpis atramentem do księgi wieczystej. Po włożeniu nie wyjmiesz i nie poprawisz — co zapisane, to zapisane.", "why": "Podpisy i stemple udowadniają, że dokument jest oryginalny. WORM dokłada ostatni klocek: gwarancję, że oryginał fizycznie nie zniknie i nie zostanie nadpisany, gdy audytor po niego sięgnie za rok. Bez tego ktoś z dostępem mógłby po cichu skasować niewygodny dowód.", "inRepo": "Manifest niesie pole worm_state (domyślnie pending), które helper potrafi ustawić komendą set-worm (Pipeline/scripts/seal-evidence.sh:227 — definicja w osadzonym helperze; schemat pola w Pipeline/scripts/generate-evidence-manifest.py:17). Faktyczna niezmienialność realizowana jest po stronie magazynu (polityka retencji/WORM w infrastrukturze).", "refs": ["Pipeline/scripts/seal-evidence.sh", "Pipeline/scripts/generate-evidence-manifest.py"], "codeExcerpt": "        \"artifacts\": artifacts,\n        \"merkle_root\": merkle,\n        \"merkle_algorithm\": MERKLE_ALGORITHM,\n        \"tooling\": {},\n        \"worm_state\": \"pending\",\n        \"signatures\": {},\n    }\n    return manifest", "codePath": "Pipeline/scripts/generate-evidence-manifest.py", "codeLang": "python", "codeStart": 335, "howItWorks": "Manifest dowodowy zawiera pole worm_state, inicjalizowane domyślnie wartością 'pending' (oczekuje). To pole jest schematu manifestu (cyberforge-evidence-manifest/v1). W seal-evidence.sh osadzony helper Pythona obsługuje komendę 'set-worm', która podmienia worm_state na zadaną wartość (data['worm_state'] = argv[2]) i zapisuje manifest. Sam plik manifestu tylko DEKLARUJE stan WORM — faktyczna niezmienialność jest realizowana po stronie magazynu (polityka retencji/WORM w infrastrukturze, np. blob storage z immutability).", "whyItWorks": "WORM (Write Once, Read Many) oznacza: zapisz raz, potem nigdy nie zmieniaj — kluczowe dla dowodów audytowych, których nikt (nawet administrator) nie powinien móc po cichu podmienić. Domyślne 'pending' jest uczciwe: manifest nie twierdzi, że jest już nienaruszalny, dopóki magazyn faktycznie tego nie wymusi. Rozdzielenie deklaracji (pole w manifeście) od egzekucji (polityka magazynu) jest poprawne projektowo — plik nie może sam siebie uczynić niezmiennym, więc realną gwarancję daje warstwa infrastruktury, a pole służy do śledzenia i weryfikacji stanu."}, {"id": "honest-red", "title": "Uczciwa czerwień — bramki, które świecą na czerwono z premedytacją", "plain": "Zasada projektu brzmi: claims == reality (deklaracje równe rzeczywistości). Jeśli czegoś nie da się jeszcze udowodnić realnym dowodem, bramka świeci na CZERWONO — zamiast udawać sukces. Dotyczy to m.in. testu odtworzenia z backupu (restore-test) i testu penetracyjnego (pentest).", "analogy": "To jak kontrolka w aucie: lepiej, żeby uczciwie świeciła na czerwono \"sprawdź hamulce\", niż żeby ktoś ją zakleił taśmą i udawał, że wszystko gra.", "why": "Audytor i klient mogą zaufać tej paczce tylko wtedy, gdy zielone NAPRAWDĘ znaczy zielone. Świadome zostawienie czerwieni tam, gdzie brak dowodu, jest dowodem dojrzałości, a nie słabości — i chroni przed najgorszym: fałszywym poczuciem bezpieczeństwa.", "inRepo": "Ten sam wzorzec widać w całym łańcuchu sealowania: cosign offline → status=failed-soft (Pipeline/scripts/seal-evidence.sh:424), nieoceniony CVE → under_investigation (Pipeline/scripts/generate-vex.py:230), brak kwalifikowanego TSA → qualified=false (Pipeline/scripts/seal-evidence.sh:565). Żaden z tych stanów nie jest maskowany jako zaliczony.", "refs": ["Pipeline/scripts/seal-evidence.sh", "Pipeline/scripts/generate-vex.py"], "codeExcerpt": "  if [ \"${COSIGN_OK}\" -eq 0 ]; then\n    # cosign keyless signing is DEFENSE-IN-DEPTH attribution, layered on top of\n    # protections that already succeeded for this pack: the RFC-6962 Merkle root,\n    # the RFC-3161 trusted timestamp, and veraPDF PDF/A-3b conformance. Per the\n    # design-spec failure_policy, a signing-infra failure SOFT-degrades: we record\n    # cosign_status=failed honestly in the manifest (nothing hidden) and continue,\n    # rather than discarding an otherwise-complete, tamper-evident evidence pack.\n    # The real cosign error is printed above by cosign_sign_retry for diagnosis.\n    warn \"cosign signing failed — recording cosign_status=failed and continuing\"\n    warn \"(pack remains sealed by Merkle root + RFC-3161 timestamp + veraPDF PDF/A)\"\n    set_sig cosign \"status=failed-soft\" \"note=signing-infra-failure-see-log\"\n  fi", "codePath": "Pipeline/scripts/seal-evidence.sh", "codeLang": "bash", "codeStart": 414, "howItWorks": "Gdy podpisywanie cosign nie powiedzie się mimo 5 prób (COSIGN_OK == 0), skrypt NIE udaje sukcesu i NIE wyrzuca paczki. Zapisuje do manifestu prawdziwy stan: set_sig cosign 'status=failed-soft' z notatką, że to awaria infrastruktury podpisu (szczegóły w logu). Ten sam wzorzec uczciwego oznaczania porażki powraca w całym łańcuchu: nieoceniony CVE -> under_investigation (generate-vex.py:230), brak kwalifikowanego TSA -> qualified=false (seal-evidence.sh:565). Żaden z tych stanów nie jest maskowany jako zaliczony — każdy ląduje wprost w manifeście.", "whyItWorks": "To jest sedno 'uczciwej czerwieni': bramka świeci na czerwono (albo zapisuje stan poniżej ideału) z premedytacją, zamiast po cichu zaliczać. Cosign jest tu warstwą atrybucji 'defense-in-depth' nad już udanymi zabezpieczeniami (korzeń Merkle, timestamp RFC-3161, zgodność PDF/A), więc jego awaria degraduje miękko — paczka wciąż jest tamper-evident — ale fakt porażki jest jawnie zapisany. Dzięki temu audytor widzi prawdziwy stan dowodów, a nie wyretuszowany 'zielony' wynik; zaufanie do całej paczki opiera się właśnie na tym, że system nie kłamie o swoich słabościach."}]}, {"area": "4 · Polityki jako kod — automatyczne bramki i werdykty", "intro": "W tym rozdziale poznasz \"bramki\" — automatyczne sprawdziany, przez które kod musi przejść, zanim trafi do wdrożenia. Zamiast człowieka klikającego checklistę, robi to maszyna według reguł zapisanych jako kod. Najważniejsza zasada CyberForge: pusty albo brakujący dowód NIE może świecić na zielono — uczciwe \"nie wiem\" jest cenniejsze niż fałszywe \"zaliczone\".", "blocks": [{"id": "gate-basics", "title": "Co to jest bramka (gate)", "plain": "Bramka to automatyczny sprawdzian na drodze kodu do produkcji. Pipeline zatrzymuje się przy bramce i pyta: czy spełnione są warunki, żeby iść dalej? Jeśli tak — przepuszcza. Jeśli nie — zatrzymuje albo ostrzega. Każda bramka mierzy jakiś konkretny warunek (np. zero krytycznych podatności, podpisany obraz, pokrycie testami co najmniej 80%).", "analogy": "To jak bramki na lotnisku. Skaner sprawdza, czy nie masz przy sobie czegoś zakazanego. Nie przejdziesz dalej, dopóki nie spełnisz warunku. Różnica jest taka, że tu warunki sprawdza nie ochroniarz, tylko program według spisanych reguł.", "why": "Człowiek się zmęczy, zapomni, machnie ręką w piątek o 17:00. Bramka sprawdza KAŻDY raz tak samo, bez wyjątków i bez nastroju. To jest fundament tego, że firma może powiedzieć 'sprawdzamy to za każdym razem', a nie 'zwykle sprawdzamy'.", "inRepo": "Najprostsza bramka wdrożeniowa to Pipeline/policies/deployment-gate.rego — reguła 'allow' (linie 5-11) przepuszcza wdrożenie tylko gdy: obraz podpisany, SBOM dołączony, zero krytycznych CVE, testy przeszły i pokrycie >= 80%.", "refs": ["Pipeline/policies/deployment-gate.rego"], "codeExcerpt": "allow if {\n\tinput.image_signed == true\n\tinput.sbom_attached == true\n\tinput.critical_cves == 0\n\tinput.tests_passed == true\n\tinput.coverage_pct >= 80\n}\n\ndeny contains msg if {\n\tinput.image_signed != true\n\tmsg := \"Image must be signed with Cosign before deployment\"\n}\n\ndeny contains msg if {\n\tinput.sbom_attached != true\n\tmsg := \"SBOM must be attached as attestation before deployment\"\n}", "codePath": "Pipeline/policies/deployment-gate.rego", "codeLang": "text", "codeStart": 5, "howItWorks": "Regula 'allow' jest prawdziwa TYLKO wtedy, gdy wszystkie pięć warunków naraz jest spełnionych: obraz podpisany (image_signed), dołączony SBOM (sbom_attached), zero krytycznych podatności (critical_cves == 0), testy przeszły (tests_passed) oraz pokrycie kodu testami nie mniejsze niż 80% (coverage_pct >= 80). W Rego warunki w bloku łączą się logicznym AND, więc wystarczy, że jeden nie pasuje, by 'allow' nie powstało. Obok tego osobne reguły 'deny' produkują czytelny komunikat dla każdego niespełnionego wymogu (np. brak podpisu -> 'Image must be signed with Cosign...').", "whyItWorks": "To esencja bramki: pojedyncza, deklaratywna reguła streszcza, co musi być prawdą zanim cokolwiek pójdzie na produkcję. Rozdzielenie 'allow' (czy wolno) od 'deny' (dlaczego nie) daje jednocześnie maszynową decyzję i ludzkie wyjaśnienie. Wszystkie kryteria to twarde, deterministyczne fakty (podpis, liczba CVE, procent pokrycia), więc decyzja jest powtarzalna i niepodważalna — nie zależy od opinii człowieka ani od tego, kto wciska 'deploy'."}, {"id": "fail-closed-vs-warn", "title": "Fail-closed (czerwone blokuje) vs warn (tylko ostrzega)", "plain": "Bramki dzielą się na dwa rodzaje. Fail-closed (po polsku: domyślnie zamknięta) — gdy warunek nie jest spełniony, blokuje wszystko, nic nie przejdzie. Warn (ostrzegająca) — zapala żółte światło, zapisuje uwagę, ale przepuszcza dalej. Wybór, która bramka jest którego typu, to decyzja świadoma: blokujemy tylko tam, gdzie pewność jest stuprocentowa i nie ma ryzyka fałszywego alarmu.", "analogy": "Fail-closed to drzwi z zamkiem, który domyślnie jest zatrzaśnięty — żeby przejść, MUSISZ mieć klucz. Warn to czujnik dymu, który piszczy, ale nie zamyka ci drzwi — sam decydujesz, czy zareagować. Krytyczna podatność = zatrzaśnięty zamek. Drobna sugestia stylu = piszczący czujnik.", "why": "Gdyby WSZYSTKO blokowało, pipeline stałby w miejscu przy każdej drobnostce i ludzie zaczęliby go obchodzić. Gdyby NIC nie blokowało, 'bramka' byłaby tylko dekoracją. Sztuka polega na tym, żeby blokować rzeczy naprawdę groźne i tylko ostrzegać przy reszcie.", "inRepo": "W Pipeline/policies/retention-policy.rego widać oba typy obok siebie: 'deny' (linie 26-47) to fail-closed — np. retencja krótsza niż 1825 dni (5 lat DORA) blokuje. Natomiast 'warn' (linie 52-56) tylko ostrzega: WORM włączony, ale niezablokowany na stałe — to jest zapisane uczciwie, a nie blokowane, bo zatrzaśnięcie blokady na zawsze to świadoma jednokierunkowa decyzja właściciela.", "refs": ["Pipeline/policies/retention-policy.rego", "Pipeline/policies/deployment-gate.rego"], "codeExcerpt": "deny contains msg if {\n\tinput.retention_days < minimum_retention_days\n\tmsg := sprintf(\"Retention %d days is below DORA minimum of %d days\", [input.retention_days, minimum_retention_days])\n}\n\ndeny contains msg if {\n\tinput.worm_enabled != true\n\tmsg := \"WORM storage must be enabled for evidence packs\"\n}\n\n# ... (pominięto guard footgun lifecycle delete, linie 36-47) ...\n\n# Non-blocking warning: WORM is enabled but NOT locked, so the immutability is\n# reversible. This is recorded honestly (retention-by-policy, not enforced WORM)\n# rather than denied — the one-way lock is a deliberate owner decision (T-46).\nwarn contains msg if {\n\tinput.worm_enabled == true\n\tinput.worm_locked != true\n\tmsg := \"WORM immutability is enabled but NOT locked (reversible): retention-by-policy, not tamper-proof WORM. Lock is a one-way owner decision (T-46).\"\n}", "codePath": "Pipeline/policies/retention-policy.rego", "codeLang": "text", "codeStart": 26, "howItWorks": "Plik pokazuje dwa typy reguł obok siebie. 'deny' to fail-closed: gdy retencja jest krótsza niż minimum (1825 dni = 5 lat z DORA) albo WORM jest wyłączony, reguła wpisuje komunikat na listę odmów — a niepusta lista odmów blokuje. 'warn' to ostrzeżenie: gdy WORM jest włączony, ale niezablokowany na stałe (worm_locked != true), reguła dodaje komunikat na ODDZIELNĄ listę ostrzeżeń, która niczego nie blokuje — stan jest tylko jawnie odnotowany.", "whyItWorks": "Rozróżnienie jest celowe i uczciwe. Krótka retencja czy brak WORM to twarde naruszenia wymogów regulacyjnych — muszą zatrzymać proces (fail-closed). Natomiast zatrzaśnięcie blokady WORM na zawsze to nieodwracalna, jednokierunkowa decyzja właściciela; system nie ma prawa wymusić jej za użytkownika, więc zamiast blokować — ostrzega i zapisuje rzeczywisty stan ('retention-by-policy, nie prawdziwy tamper-proof WORM'). Tak unika się zarówno fałszywego 'zielono', jak i odebrania człowiekowi świadomej decyzji."}, {"id": "policy-as-code-opa-rego", "title": "Polityki jako kod — OPA i Rego", "plain": "Zamiast trzymać zasady w dokumencie Word, który nikt nie czyta, zapisujemy je jako kod, który maszyna sama wykonuje i sprawdza. OPA (Open Policy Agent — otwarty silnik reguł) to program, który czyta takie reguły i wydaje werdykt. Rego to język, w którym te reguły się pisze (pliki z rozszerzeniem .rego). Podajesz OPA fakty (np. 'krytyczne CVE: 3') i regułę — a OPA mówi: dozwolone czy nie.", "analogy": "Wyobraź sobie regulamin parkingu spisany tak precyzyjnie, że automat na bramie sam go czyta i decyduje, czy podnieść szlaban. Nie ma 'zapytaj kierownika' — regulamin JEST programem. Rego to język tego regulaminu, OPA to automat, który go wykonuje.", "why": "Reguła-jako-kod ma trzy zalety nad regułą-w-dokumencie: maszyna stosuje ją zawsze identycznie, można ją testować (jak każdy kod) i nie da się jej 'przypadkiem' pominąć. Audytor może przeczytać dokładnie te same reguły, które naprawdę działają w pipeline — bez rozjazdu między 'co piszemy' a 'co robimy'.", "inRepo": "Wszystkie trzy polityki to pliki .rego w Pipeline/policies/. Każda zaczyna się od 'package compliance.<nazwa>' i 'import rego.v1'. Reguła 'deny contains msg if {...}' oznacza: jeśli warunek w nawiasach jest prawdziwy, dodaj komunikat odmowy do listy. Pusta lista odmów = zgodne (patrz retention-policy.rego:12-14, 'compliant if count(deny) == 0').", "refs": ["Pipeline/policies/retention-policy.rego", "Pipeline/policies/deployment-gate.rego", "Pipeline/policies/evidence-completeness.rego"], "codeExcerpt": "package compliance.retention\n\nimport rego.v1\n\nminimum_retention_days := 1825 # 5 years (DORA)\n\n# Compliant when no deny fires: retention meets the DORA floor, WORM is enabled,\n# and no lifecycle delete would purge evidence before the immutability period\n# expires. An ABSENT lifecycle delete is fine — deletion is then governed solely\n# by the WORM / legal-hold window (the recommended posture; the storage module\n# leaves lifecycle delete off by default, T-105/T-52).\ncompliant if {\n\tcount(deny) == 0\n}", "codePath": "Pipeline/policies/retention-policy.rego", "codeLang": "text", "codeStart": 1, "howItWorks": "Każda polityka to plik .rego zaczynający się od deklaracji pakietu ('package compliance.retention') i 'import rego.v1' (nowa składnia języka Rego silnika OPA). Stałe definiuje się przez ':=' (np. minimum_retention_days := 1825). Kluczowy idiom: reguły 'deny contains msg if {...}' dokładają komunikat do zbioru za każdym razem, gdy warunek jest prawdziwy. Ostateczny werdykt to prosta agregacja — 'compliant if count(deny) == 0', czyli zgodne jest tylko wtedy, gdy żadna reguła odmowy nie zadziałała.", "whyItWorks": "Polityka jako kod oznacza, że reguły zgodności są wersjonowane w repo, testowalne i wykonywane przez ten sam silnik (OPA) niezależnie od człowieka. Wzorzec 'zbieraj powody odmowy, a zgodne = brak powodów' jest czytelny i bezpieczny: domyślnie nic nie jest 'compliant', dopóki nie udowodni się, że żadna reguła nie protestuje (fail-closed). Stała 1825 z komentarzem '5 years (DORA)' wprost wiąże kod z konkretnym wymogiem prawnym, dzięki czemu audytor widzi źródło liczby."}, {"id": "three-policies", "title": "Trzy polityki w repo: bramka wdrożenia, kompletność dowodów, retencja", "plain": "W repo żyją trzy polityki Rego, każda pilnuje czegoś innego. (1) deployment-gate — czy wolno w ogóle wdrożyć ten obraz. (2) evidence-completeness — czy w paczce dowodów są wszystkie wymagane pliki. (3) retention-policy — czy dowody będą przechowywane wystarczająco długo i bezpiecznie.", "analogy": "To jak trzy różne kontrole przy wypuszczaniu produktu z fabryki: kontrola jakości samego produktu (deployment-gate), sprawdzenie czy w pudełku jest komplet dokumentów gwarancyjnych (evidence-completeness) i reguła jak długo musimy te dokumenty archiwizować w razie reklamacji (retention-policy).", "why": "Każda z trzech odpowiada na inne pytanie regulatora. Bramka wdrożenia = 'czy to bezpieczne wypuścić'. Kompletność = 'czy macie dowód, że sprawdziliście'. Retencja = 'czy ten dowód przetrwa, gdy za 3 lata przyjdzie kontrola'. Razem tworzą łańcuch: zbuduj bezpiecznie, udowodnij to, zachowaj dowód.", "inRepo": "deployment-gate.rego (pakiet compliance.deployment) wymaga podpisu+SBOM+0 CVE+testy+pokrycie. evidence-completeness.rego (compliance.evidence, linie 5-17) trzyma sztywną listę 11 wymaganych plików, np. security-report.json, sbom.cyclonedx.json, manifest.sha256 — i 'deny' za każdy brakujący (linie 25-28). retention-policy.rego (compliance.retention) pilnuje minimum 1825 dni i WORM.", "refs": ["Pipeline/policies/deployment-gate.rego", "Pipeline/policies/evidence-completeness.rego", "Pipeline/policies/retention-policy.rego"], "codeExcerpt": "required_files := {\n\t\"security-report.json\",\n\t\"sbom.cyclonedx.json\",\n\t\"provenance.intoto.jsonl\",\n\t\"cosign-verification.log\",\n\t\"pipeline-run.json\",\n\t\"dependency-review.json\",\n\t\"zap-report.json\",\n\t\"dpa-compliance-check.json\",\n\t\"data-flow-diagram.json\",\n\t\"compliance-matrix.json\",\n\t\"manifest.sha256\",\n}\n\npresent_files := {f | some f in input.files}\n\nmissing := required_files - present_files\n\ncomplete if count(missing) == 0\n\ndeny contains msg if {\n\tsome f in missing\n\tmsg := sprintf(\"Missing required evidence file: %s\", [f])\n}", "codePath": "Pipeline/policies/evidence-completeness.rego", "codeLang": "text", "codeStart": 5, "howItWorks": "To druga z trzech polityk — completeness dowodów. 'required_files' to sztywny zbiór 11 plików, które MUSZĄ znaleźć się w paczce dowodów (m.in. security-report.json, sbom.cyclonedx.json, manifest.sha256). 'present_files' buduje zbiór z tego, co faktycznie dostarczono (input.files). Operacja na zbiorach 'missing := required_files - present_files' wylicza różnicę. 'complete if count(missing) == 0' — kompletne tylko gdy nic nie brakuje, a 'deny' generuje osobny komunikat za KAŻDY brakujący plik. Razem trzy polityki to: deployment-gate (podpis+SBOM+0 CVE+testy+pokrycie), evidence-completeness (ta lista 11 plików) i retention-policy (1825 dni + WORM).", "whyItWorks": "Trzy polityki pokrywają trzy różne momenty cyklu: czy wolno wdrożyć, czy paczka dowodów jest kompletna i czy dowody będą przechowane wystarczająco długo i nienaruszalnie. Operacje na zbiorach to idealne narzędzie do 'czego brakuje' — różnica zbiorów jest deklaratywna i niepodatna na pomyłki pętli. Sztywna lista wymaganych plików sprawia, że nie da się 'zapomnieć' żadnego artefaktu dowodowego: brak choćby jednego = niekompletne = blokada."}, {"id": "compliance-as-code", "title": "Compliance-as-code — zgodność sprawdzana automatem", "plain": "Compliance (zgodność z przepisami, np. DORA, NIS2, RODO) zwykle kojarzy się z grubym segregatorem i prawnikiem. Tu zgodność jest sprawdzana programem: dla każdego wymogu prawnego istnieje mały skrypt (walidator), który czyta konkretny plik-dowód i sprawdza, czy wymóg jest spełniony. Wynik to twardy fakt z liczbą, a nie 'wydaje nam się, że jesteśmy zgodni'.", "analogy": "To jak różnica między 'czuję, że zdrowo się odżywiam' a appką, która liczy każdą kalorię z paragonu i mówi: 583 kcal, przekroczyłeś próg. Compliance-as-code zamienia opinię w zmierzoną liczbę porównaną z progiem zapisanym w przepisie.", "why": "Klient techniczny potrafi w 60 sekund obalić każde puste 'sprawdzamy DORA/NIS2', jeśli za tym nie stoi realny pomiar. Compliance-as-code daje liczby, które można pokazać audytorowi: 'CRITICAL CVE: 0', 'retencja: 1825 dni'. To jest dowód, a nie deklaracja.", "inRepo": "Każdemu wymogowi odpowiada walidator i plik werdyktu — patrz lista CONTROLS w Pipeline/scripts/aggregate-compliance.py:157-233. Np. A.1 (DORA Art.28(3), Rejestr Informacji) -> validate-roi.py -> roi-validation.json; A.10 (DORA Art.11-12, test odtworzenia z backupu) -> check-restore-test.py -> restore-test.json. Komentarz w pliku wprost mówi: gate 'is honest — it does not invent PASSes' (linie 40-43).", "refs": ["Pipeline/scripts/aggregate-compliance.py", "Pipeline/scripts/generate-compliance-matrix.sh"], "codeExcerpt": "CONTROLS: list[Control] = [\n    Control(\n        id=\"A.1\", task=\"T-20\", label=\"Register of Information (DORA Art.28(3))\",\n        out_name=\"roi-validation.json\",\n        argv_template=[\n            \"{py}\", \"{validators}/validate-roi.py\",\n            \"{governance}/register-of-information.yaml\", \"{schemas}/roi.schema.json\",\n            \"--out\", \"{out}\",\n        ],\n        remediation=\"Fix RoI schema/LEI violations in docs/governance/register-of-information.yaml.\",\n    ),\n# ... (pominięto A.2-A.9) ...\n    Control(\n        id=\"A.10\", task=\"T-29\", label=\"Restore-test proof + freshness (DORA Art.11-12)\",\n        out_name=\"restore-test.json\",\n        argv_template=[\n            \"{py}\", \"{validators}/check-restore-test.py\",\n            \"{runbooks}/restore-test-log.yaml\", \"--out\", \"{out}\",\n        ],\n        remediation=\"Conduct a successful restore test and record it in docs/runbooks/restore-test-log.yaml.\",\n    ),\n]", "codePath": "Pipeline/scripts/aggregate-compliance.py", "codeLang": "python", "codeStart": 157, "howItWorks": "Lista CONTROLS to rejestr, w którym KAŻDEMU wymogowi regulacyjnemu odpowiada jeden obiekt Control z: identyfikatorem (A.1 = DORA Art.28(3), Rejestr Informacji; A.10 = DORA Art.11-12, test odtworzenia z backupu), nazwą pliku werdyktu (out_name, np. roi-validation.json / restore-test.json), szablonem komendy uruchamiającej konkretny walidator (argv_template, np. validate-roi.py / check-restore-test.py) oraz instrukcją naprawczą (remediation). Agregator iteruje tę listę, uruchamia walidatory i zbiera ich werdykty. Komentarz w nagłówku pliku wprost mówi, że bramka 'is honest — it does not invent PASSes'.", "whyItWorks": "To jest istota compliance-as-code: zgodność nie jest deklaracją w dokumencie, lecz wykonywalnym mapowaniem wymóg -> walidator -> plik dowodu. Trzymanie tego w jednej strukturze danych czyni zakres audytowalnym (widać dokładnie, które artykuły są pokryte i czym) i rozszerzalnym (nowy wymóg = nowy wpis). Pole remediation zamyka pętlę — gdy coś nie przejdzie, narzędzie samo wskazuje konkretny plik do poprawienia, więc 'niezgodny' nie jest ślepą uliczką."}, {"id": "validator-vs-presence", "title": "Walidator treści vs 'czy plik istnieje' — dlaczego puste {} to NIE zalicz", "plain": "Stara, słaba metoda: sprawdź czy plik z wynikiem skanu istnieje — jeśli tak, zalicz. Problem: pusty plik {} albo plik z 500 krytycznymi podatnościami też 'istnieje', więc fałszywie dostawał zielone światło. Nowa metoda: walidator OTWIERA plik, PARSUJE jego treść i sprawdza prawdziwy próg. Pusty albo niezrozumiały plik daje INDETERMINATE ('nie dało się zmierzyć'), nigdy ciche PASS.", "analogy": "To różnica między celnikiem, który widzi że masz teczkę z dokumentami i macha ręką — a takim, który ją OTWIERA i czyta. Pusta teczka to nie 'wszystko w porządku', to 'nie wiadomo, sprawdź ponownie'. Brak dowodu to nie dowód, że jest dobrze.", "why": "To jest pojedynczy fakt, którym kupujący-technik obala wszystkie marketingowe obietnice. Jeśli pusty plik przechodzi, cała 'zgodność' jest teatrem. Reguła 'pusty {} = INDETERMINATE, nie PASS' zamyka tę dziurę u samego źródła i jest sednem uczciwości całego systemu.", "inRepo": "Funkcja load_json w Pipeline/scripts/validators/libcompliance.py:423-443 wprost traktuje '{}' i '[]' jako brak mierzalnych danych i zwraca błąd, żeby walidator wystawił INDETERMINATE. Komentarz: 'this is what closes the {} passes hole at source'. Stara metoda file-presence jest wyśmiana w komentarzu generate-compliance-matrix.sh:7-16.", "refs": ["Pipeline/scripts/validators/libcompliance.py", "Pipeline/scripts/generate-compliance-matrix.sh"], "codeExcerpt": "def load_json(path: str | Path) -> tuple[Any, str | None]:\n    \"\"\"Load a JSON artifact, returning ``(data, error)``.\n\n    On success returns ``(data, None)``. On any problem (missing, empty, malformed,\n    or the JSON literal ``{}`` / ``[]``) returns ``(None, reason)`` so the caller can\n    emit INDETERMINATE. An empty object/array is treated as \"no measurable content\"\n    — this is what closes the \"an empty ``{}`` artifact yields PASS\" hole at source.\n    \"\"\"\n    p = Path(path)\n    if not p.is_file():\n        return None, f\"{path}: file not found\"\n    raw = p.read_text(encoding=\"utf-8\").strip()\n    if not raw:\n        return None, f\"{path}: file is empty\"\n    try:\n        data = json.loads(raw)\n    except json.JSONDecodeError as exc:\n        return None, f\"{path}: invalid JSON ({exc})\"\n    if data == {} or data == []:\n        return None, f\"{path}: empty JSON content (no measurable data)\"\n    return data, None", "codePath": "Pipeline/scripts/validators/libcompliance.py", "codeLang": "python", "codeStart": 423, "howItWorks": "Funkcja load_json wczytuje artefakt i zwraca parę (dane, błąd). Kolejno sprawdza: czy plik istnieje, czy nie jest pusty, czy jest poprawnym JSON-em — a na końcu, kluczowy warunek 'if data == {} or data == []', który traktuje pusty obiekt lub pustą tablicę jako BRAK mierzalnych danych i zwraca błąd zamiast danych. Dzięki temu walidator wywołujący tę funkcję wystawia status INDETERMINATE, a nie PASS. Komentarz wprost: 'this is what closes the {} passes hole at source'.", "whyItWorks": "Stara metoda sprawdzała tylko 'czy plik istnieje' — więc pusty '{}' przechodził jako PASS, co pozwalało sfałszować zgodność w 60 sekund (puste security-report.json = 'zero CVE' = zielono). Tu mierzy się TREŚĆ: jeśli nie ma czego zmierzyć, wynik nie może brzmieć 'zaliczone'. Załatwienie tego w jednej współdzielonej funkcji (a nie w każdym walidatorze osobno) gwarantuje, że dziura jest zamknięta 'u źródła' i żaden walidator przez nieuwagę jej nie otworzy."}, {"id": "envelope-t33", "title": "Koperta T-33 — wspólny format każdego werdyktu", "plain": "Żeby wszystkie walidatory mówiły jednym językiem, każdy zwraca tę samą 'kopertę' — mały kawałek JSON o stałym kształcie: status, tier, measured (zmierzona wartość), threshold (próg), detail (opis po ludzku), plus znacznik czasu i nazwa walidatora. Dzięki temu agregator może połączyć dziesiątki wyników bez zgadywania, co który oznacza.", "analogy": "To jak ujednolicona etykieta na każdym produkcie w sklepie: zawsze nazwa, cena, waga, data ważności — w tym samym miejscu. Nieważne czy to mleko czy śrubki — etykietę czytasz tak samo. Koperta T-33 to taka etykieta dla wyniku sprawdzenia.", "why": "Bez wspólnego formatu każdy walidator byłby osobnym dialektem i sklejenie wyników byłoby koszmarem pełnym błędów. Jednolita koperta sprawia, że dodanie nowej kontroli jest tanie, a audytor czyta ZMIERZONĄ LICZBĘ (measured), a nie samo słowo 'PASS'.", "inRepo": "Dokładny kształt opisuje docstring w Pipeline/scripts/validators/libcompliance.py:14-26, a stałą listę kluczy definiuje ENVELOPE_KEYS (linie 102-111): status, tier, measured, threshold, detail, tool_version, validator, checked_at. Funkcje envelope() (134) i emit() (187) budują i wypisują tę kopertę.", "refs": ["Pipeline/scripts/validators/libcompliance.py"], "codeExcerpt": "def envelope(\n    status: str,\n    tier: str,\n    measured: Any = None,\n    threshold: Any = None,\n    detail: str = \"\",\n    tool_version: str | None = None,\n    validator: str | None = None,\n) -> dict[str, Any]:\n    \"\"\"Build (but do NOT print or exit) a validated envelope dict.\n# ... (pominięto docstring) ...\n    \"\"\"\n    if status not in Status.ALL:\n        raise ValidatorError(\n            f\"invalid status {status!r}; expected one of {sorted(Status.ALL)}\"\n        )\n    if tier not in Tier.ALL:\n        raise ValidatorError(\n            f\"invalid tier {tier!r}; expected one of {sorted(Tier.ALL)}\"\n        )\n    return {\n        \"status\": status,\n        \"tier\": tier,\n        \"measured\": measured,\n        \"threshold\": threshold,\n        \"detail\": detail,\n        \"tool_version\": tool_version,\n        \"validator\": validator if validator is not None else _caller_module(),\n        \"checked_at\": datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"),\n    }", "codePath": "Pipeline/scripts/validators/libcompliance.py", "codeLang": "python", "codeStart": 134, "howItWorks": "Funkcja envelope() buduje wspólny dla wszystkich walidatorów słownik-kopertę o stałych kluczach (zdefiniowanych w ENVELOPE_KEYS): status, tier, measured (zmierzona wartość), threshold (próg), detail (opis dla człowieka), tool_version, validator i checked_at. Najpierw waliduje, że status i tier należą do dozwolonego słownika — w przeciwnym razie rzuca ValidatorError. Następnie zwraca słownik, sam dokładając pole 'validator' (kto sprawdzał, wykryte automatem) i 'checked_at' (znacznik czasu UTC, świeżość). Funkcja jest czysta — nie drukuje i nie kończy procesu; to robi emit().", "whyItWorks": "Jeden, wymuszony schemat każdego werdyktu sprawia, że agregator i matryca mogą przetwarzać wyniki jednolicie i nieść MIERZONĄ wartość, a nie samo PASS/MISSING. Walidacja status/tier 'u wejścia' uniemożliwia powstanie nielegalnej koperty (np. literówka w statusie, która mogłaby zostać zinterpretowana jako zaliczenie). Automatyczne pola validator i checked_at dają śledzalność (kto i kiedy) potrzebną przy audycie świeżości dowodów."}, {"id": "statuses-tiers", "title": "Statusy PASS/FAIL/INDETERMINATE i tier BLOCKING/EVIDENCE-ONLY", "plain": "W kopercie są dwa kluczowe pola. Status to wynik pomiaru: PASS (zaliczone), FAIL (nie zaliczone) albo INDETERMINATE (nie dało się zmierzyć — np. pusty plik). Tier (poziom) to waga kontroli: BLOCKING (blokująca — porażka zatrzymuje pipeline) albo EVIDENCE-ONLY (tylko dla dowodu — zapisuje liczbę, ale nigdy nie blokuje). To dwie niezależne osie: CO zmierzyliśmy i JAK BARDZO to nas wiąże.", "analogy": "Status to ocena z testu (zdał / nie zdał / nie przyszedł). Tier to czy ten test jest na maturze (blokuje promocję) czy to tylko kartkówka do dziennika (zapisana, ale sama w sobie nie zatrzymuje). Możesz mieć 'nie zdał' z kartkówki — zostanie zanotowane, ale nie wylecisz ze szkoły.", "why": "To rozróżnienie pozwal
