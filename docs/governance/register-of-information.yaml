# =============================================================================
# Register of Information (RoI) — DORA Art.28(3) / Commission Implementing
# Regulation (EU) 2024/2956 (ITS on the register of information)
# =============================================================================
#
# This is the machine-readable Register of Information mandated by DORA Art.28(3)
# and the ITS 2024/2956. It is the single strongest compliance differentiator and
# the seed of the Tier-2 Operated-Register product (blueprint/04 §6.3). KNF form
# SPR-PF-18 maps onto the same dataset (blueprint/02:12).
#
# Provenance: seeded from docs/governance/vendor-risk-register.md (## Vendor
# Inventory + ## Exit Plan References). Each vendor row there becomes one
# ict_third_party entry here, enriched with the EBA template fields that the
# Markdown register does not carry (LEI, contract dates, ICT service taxonomy,
# function identifier, sub-outsourcing, notice period).
#
# Field-to-EBA-template mapping (ITS 2024/2956 relational model; the ITS uses the
# B_xx.yy naming, struktura §6 A.1 references the RT.01/RT.05 working names):
#   maintaining_entity.lei .......... B_01.01  Financial entity LEI
#   ict_third_party[].lei ........... B_01.02 / B_05.01  ICT provider LEI
#   ict_third_party[].function ...... B_06.01  Function identifier / supported function
#   ict_third_party[].ict_service ... B_02.02 / B_05.01  ICT service (taxonomy)
#   ict_third_party[].criticality ... B_05.01  Critical/Important Function (CIF) flag
#   ict_third_party[].data_location . B_05.01  Storage / processing location
#   ict_third_party[].substitutability . B_05.01  Substitutability of the provider
#   ict_third_party[].exit_plan_ref . B_05.01  Exit plan availability / reference
#   ict_third_party[].sub_outsourcing  B_05.02  Sub-outsourcing / supply chain flag
#   ict_third_party[].notice_period_days  B_05.01  Termination notice period
#   ict_third_party[].last_audit_date  B_05.01  Date of last audit
#
# HONESTY NOTE (validator tiering — see scripts/validators/validate-roi.py):
#   * BLOCKING      — schema validity, LEI *format* (ISO 17442), and presence of
#     exit_plan_ref + substitutability for every Critical/High vendor are
#     deterministically checkable in the pipeline and therefore block.
#   * EVIDENCE-ONLY — LEI *registration truth* (is this LEI actually issued and
#     ACTIVE in the GLEIF database?) is NOT verifiable from inside the pipeline
#     without a live GLEIF lookup, so it is recorded as a measured count, never a
#     blocking PASS. CyberForge has not yet been issued its own LEI, so the
#     maintaining-entity LEI is a documented PENDING placeholder (open question in
#     struktura §6 A.1) and is reported EVIDENCE-ONLY.
# =============================================================================

schema_version: "1.0"
regulation:
  framework: DORA
  article: "Art.28(3)"
  its: "Commission Implementing Regulation (EU) 2024/2956"
  knf_form: "SPR-PF-18"

# ---------------------------------------------------------------------------
# Maintaining (financial) entity — EBA template B_01.01
# ---------------------------------------------------------------------------
# CyberForge has NOT yet been issued an LEI. Per struktura §6 A.1 open question,
# the LEI is a documented PENDING placeholder; the validator reports the
# maintaining-entity LEI as EVIDENCE-ONLY (it cannot block on a format check of a
# value that is legitimately not-yet-issued, but it MUST surface the gap).
maintaining_entity:
  name: "CyberForge"
  lei: "PENDING-NOT-YET-ISSUED"   # EVIDENCE-ONLY: no LEI issued; flagged as gap
  country: "PL"
  competent_authority: "KNF"
  last_updated: "2026-03-15"       # freshness anchor (BLOCKING vs review cadence)
  review_cadence_days: 365         # ITS expects at least annual maintenance

