# Records of Processing Activities (RoPA) + DPIA determination
# ---------------------------------------------------------------------------
# RODO/GDPR Art.30 record for the CyberForge DevSecOps Pipeline.
#
# Scope note (struktura §12, blueprint/04): the DEMO APPLICATION deployed by this
# pipeline processes NO personal data (see scripts/generate-data-flow.sh:43). The
# pipeline ITSELF, however, processes developer personal data as part of the audit
# trail it produces — git commit metadata (developer name + email) and developer
# names that appear in pipeline logs and the WORM evidence pack. Art.30 therefore
# applies to the pipeline operator as a controller for these activities, plus a
# processor record for the demo-app deployment carried out on behalf of clients.
#
# This file is validated by scripts/validators/validate-ropa.py against
# schemas/ropa.schema.json (task T-22). The validator checks COMPLETENESS and the
# DPIA-determination logic; the truth of the recorded facts is EVIDENCE-ONLY.

meta:
  document_id: CF-ROPA-001
  version: "1.0"
  owner: Data Controller (CyberForge sp. z o.o.) — no DPO appointed; see dpia_determination.reason
  last_reviewed: "2026-06-15"

controller:
  name: CyberForge sp. z o.o.
  contact: privacy@cyberforge.dev
  joint_controllers: []

# No DPO appointed (Art.37 threshold not met — see dpia_determination.reason).
# representative omitted: controller is established in the EU (Poland).

dpia_determination:
  status: not-required
  reason: >-
    No recorded processing activity meets an Art.35(3) high-risk criterion: there is
    no large-scale processing of special categories of data (Art.9), no systematic and
    extensive evaluation/profiling producing legal effects, and no systematic
    large-scale monitoring of a publicly accessible area. The personal data processed
    is limited to developer git-metadata and names in audit logs, processed for a
    legitimate audit-trail purpose with strict access control and minimisation.
    This determination is reviewed at each RoPA review (meta.last_reviewed).
  determined_by: Data Controller (CyberForge sp. z o.o.)
  determined_on: "2026-06-15"
  dpia_refs: []

activities:
  - id: PA-001
    name: CI/CD audit trail — git commit metadata
    role: controller
    purposes:
      - Maintain a tamper-evident audit trail of who changed what (ISO 27001 A.8.4)
      - Attribute build provenance and security-gate decisions to a commit author
    lawful_basis: >-
      Art.6(1)(f) legitimate interest — securing the software supply chain and meeting
      DORA/NIS2 audit-trail obligations; balanced against developer expectations as the
      data is already inherent to version control.
    data_subject_categories:
      - Developers and contributors with commit access
    personal_data_categories:
      - Developer name (git author/committer)
      - Developer email address (git author/committer)
      - Commit timestamps
    special_categories: []
    recipients:
      - Internal compliance team (audit review)
      - External auditors (under engagement, read-only)
    third_country_transfers:
      occurs: false
      destinations: []
    retention: >-
      Retained for the life of the repository history; archived copies in the WORM
      evidence pack retained 5 years (1825 days) per DORA Art.12.
    security_measures:
      - Repository access restricted via GitHub RBAC + branch protection
      - Evidence pack stored in Azure Blob WORM (immutable, Poland Central)
      - Access limited to compliance-team + auditor roles
    high_risk: false
    dpia_not_required_reason: >-
      Small-scale processing of routine identification data already inherent to version
      control; no special categories, no profiling, no monitoring. Art.35 threshold not met.

  - id: PA-002
    name: Pipeline & deployment logs — developer names
    role: controller
    purposes:
      - Operational troubleshooting and security monitoring of the pipeline
      - Evidence of pipeline runs for the compliance evidence pack
    lawful_basis: >-
      Art.6(1)(f) legitimate interest — operating and securing the pipeline and producing
      auditable evidence.
    data_subject_categories:
      - Developers and contributors who trigger pipeline runs
    personal_data_categories:
      - Developer name (in pipeline/deployment logs)
    special_categories: []
    recipients:
      - Internal compliance team
      - External auditors (under engagement, read-only)
    third_country_transfers:
      occurs: false
      destinations: []
    retention: >-
      Logs sanitised to the minimum (scripts/sanitize-logs.sh); evidence-pack copies
      retained 5 years (1825 days) per DORA Art.12.
    security_measures:
      - Log sanitisation to minimum necessary
      - WORM storage with role-restricted access
      - Encryption in transit and at rest (Azure)
    high_risk: false
    dpia_not_required_reason: >-
      Minimal identification data (names only) processed for legitimate operational and
      audit purposes; sanitised and access-restricted. No Art.35(3) criterion is met.

  - id: PA-003
    name: Demo application deployment on behalf of clients
    role: processor
    controllers_acted_for:
      - name: Client organisation (per deployment engagement)
        contact: Defined in the applicable Data Processing Agreement (see check-dpa.sh)
    purposes:
      - Build, scan and deploy the client-supplied application image
    lawful_basis: >-
      Art.28 processing on documented instructions of the controller (the client), under
      a Data Processing Agreement.
    data_subject_categories:
      - End users of the deployed application (as defined by each client controller)
    personal_data_categories:
      - None processed by the CyberForge demo application itself (see data-flow-diagram.json);
        any client-application personal data is the client controller's responsibility
    special_categories: []
    recipients: []
    third_country_transfers:
      occurs: false
      destinations: []
    retention: >-
      No client end-user personal data is stored by the demo app; container images and
      logs follow the 5-year evidence retention.
    security_measures:
      - Processing only on documented client instructions (Art.28)
      - Image signing + provenance attestation (supply-chain integrity)
      - Network isolation of deployment environment (Azure Container Apps)
    high_risk: false
    dpia_not_required_reason: >-
      The demo application processes no personal data of its own; the processor role is
      limited to build/deploy on documented instructions. Any high-risk assessment of the
      client application is the client controller's obligation under the DPA.
